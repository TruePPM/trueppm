[package]
name = "trueppm-wasm-scheduler"
version = "0.4.0-beta.1"
edition = "2021"
license = "Apache-2.0"
description = "CPM scheduling engine compiled to WebAssembly for TruePPM"
repository = "https://gitlab.com/trueppm/trueppm"
# Apache 2.0 §4(a) requires recipients of a distribution to receive the License.
# `license = "Apache-2.0"` is only metadata — without this the packaged crate and a
# crates.io sdist would carry the SPDX id and no license text (#2632). The root
# LICENSE does not travel with a separately-published crate.
include = ["src/**/*", "LICENSE", "Cargo.toml"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
petgraph = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
