[package]
name = "trueppm-wasm-scheduler"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "CPM scheduling engine compiled to WebAssembly for TruePPM"
repository = "https://gitlab.com/trueppm/trueppm"
# Apache 2.0 §4(a) requires recipients of a distribution to receive the License.
# `license = "Apache-2.0"` is only metadata — without this the packaged crate and a
# crates.io sdist would carry the SPDX id and no license text (#2632). The root
# LICENSE does not travel with a separately-published crate.
include = ["src/**/*", "LICENSE", "NOTICE", "Cargo.toml"]
# Not published until the npm/crates decision (#948, #2634) is made: `include`
# above prepares a package, and nothing else stops an accidental `cargo publish`
# from freezing today's API as a release (#4474).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
petgraph = "0.7"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's default float parser is not correctly rounded and
# can land 1 ULP off the nearest double (`99.99999999999999` read as `100.0`), so the
# same JSON scheduled differently here and in Python, whose parser is exact (#5015).
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
# Release (and therefore the wasm-pack --release artifact) wraps integer overflow
# silently by default. A future regression in the validate caps should panic, not
# wrap in the browser (#4731).
overflow-checks = true
