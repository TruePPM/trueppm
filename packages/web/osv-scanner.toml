# OSV-Scanner suppressions for the web app's locked dependency set
# (packages/web/package-lock.json), auto-discovered by the security:osv CI job.
#
# Same accepted-risk contract as packages/api/osv-scanner.toml and
# packages/scheduler/osv-scanner.toml: every entry carries a `reason` and an
# expiry, so a suppression stays documented and rots on its own instead of
# silently masking a future advisory.
#
# These are `[[PackageOverrides]]` rather than `[[IgnoredVulns]]` on purpose.
# An `IgnoredVulns` entry suppresses an advisory ID across *every* version of
# every package, which here would also mask the `brace-expansion` 5.x line that
# we do keep patched. Pinning `name` + `version` keeps the suppression scoped to
# the exact unfixable resolutions, so a future advisory against the version we
# actually upgrade still blocks the pipeline.

# Two entries suppressing GHSA-mh99-v99m-4gvg (brace-expansion 1.1.16 and
# 2.1.2) were removed on 2026-10-17 (#4476) once the scanner began reporting
# them as unused — meaning the locked versions had moved out of the advisory's
# affected range, so the entries were no longer suppressing anything. #4235
# (2026-09-30) bumped the transitive brace-expansion resolutions under
# minimatch / @redocly/openapi-core to clear an unrelated ReDoS advisory, and
# that bump happened to land past GHSA-mh99-v99m-4gvg's fix threshold too
# (1.1.17 for the 1.x line, 2.1.3 for the 2.x line) without the commit touching
# this file. Same pattern as #2786's cleanup of two stale entries in
# packages/api/osv-scanner.toml.

# GHSA-vfj7-8cjw-p6xm — braces (the micromatch glob dependency, distinct from
# brace-expansion above) stack-exhaustion DoS via deeply nested patterns (HIGH,
# CVSS 8.7, CWE-674). The recursive AST walkers in parse/compile/expand have no
# depth guard, so a pattern under the character limit but deeply nested blows
# the call stack and kills the Node process with an uncaught RangeError.
#
# `first_patched_version: null` on the advisory, and npm's `latest` tag for
# braces IS 3.0.3 — the flagged version. There is no newer release in any line
# to bump to; confirmed directly against the npm registry and the GHSA API, not
# just the advisory text.
#
# Reaches the tree on exactly one path, devDependency-only:
#
#   3.0.3 <- chokidar@~3.0.2 / micromatch@^3.0.3 <- tailwindcss
#
# tailwindcss is a devDependency; braces runs only as part of the build-time
# file watcher and content-glob matcher. Not in `dependencies`, not bundled
# into the shipped SPA. The brace patterns reaching parse/compile/expand come
# from tailwind's own content-glob config, never from user or network input.
#
# The real fix is dropping tailwindcss@3 (and with it chokidar/micromatch@3)
# entirely via the v3->v4 migration tracked on #4261 (milestone 0.5) — not
# something to pull forward just to clear this gate. Re-evaluate when braces
# ships any release past 3.0.3, or when #4261 lands. Tracked in #4262.

[[PackageOverrides]]
name = "braces"
version = "3.0.3"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-12-31
reason = "GHSA-vfj7-8cjw-p6xm: no patched release exists in any line — npm `latest` is 3.0.3, the flagged version itself, confirmed against both the npm registry and the GHSA API. Dev-only, via chokidar/micromatch under tailwindcss (devDependency). Not bundled into the shipped app; brace patterns reaching parse/compile/expand come from tailwind's own content-glob config, not from user input. Clears when tailwindcss v3->v4 migration (#4261) removes this chain, or when braces ships a fix."
