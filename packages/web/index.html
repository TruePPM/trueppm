<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable PWA (ADR-1523 §3). iOS ignores an SVG apple-touch-icon, so this is a
         180x180 opaque PNG (scripts/generate-pwa-icons.mjs). The manifest link is
         injected by vite-plugin-pwa at build time. Status bar `default`: a translucent
         bar would draw the page under it and need safe-area padding in the chrome. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruePPM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TruePPM — Project, Program, and Portfolio Management" />
    <meta name="theme-color" content="#1B2A4A" />
    <!-- Space Grotesk = display/wordmark (brand v1.0); Inter = UI/body; JetBrains Mono = data.
         Self-hosted from /fonts (#2419) — declared in src/styles/fonts.css, never from a
         font CDN. A self-hosted, air-gapped-capable product does not get to phone home,
         and a network-restricted install must not silently fall back to substitute
         typography. Preload the two faces above the fold (UI body text and the wordmark's
         Latin slice) so the swap-in is imperceptible now that no `preconnect` is warming
         a remote host. Enforced by e2e/self-hosted-fonts.spec.ts. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>TruePPM</title>
    <!-- Blocking theme init — apply .dark before first paint to prevent flash.
         External file (not inline) so a strict script-src 'self' CSP permits it
         without an inline hash or 'unsafe-inline' (#897). Served from /public,
         so it loads same-origin. -->
    <script src="/theme-init.js"></script>
    <!-- Boot guard (#4408) — must run before the module entry below. During a web
         rollout the entry script can 404 from a pod still on the previous release;
         the in-app recovery lives inside that entry, so only a script outside the
         bundle can reload the page or explain the failure. External for the same
         CSP reason as theme-init.js. -->
    <script src="/boot-guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
