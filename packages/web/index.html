<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TruePPM — Project, Program, and Portfolio Management" />
    <meta name="theme-color" content="#1B2A4A" />
    <!-- Space Grotesk = display/wordmark (brand v1.0); Inter = UI/body; JetBrains Mono = data.
         Self-hosted from /fonts (#2419) — declared in src/styles/fonts.css, never from a
         font CDN. A self-hosted, air-gapped-capable product does not get to phone home,
         and a network-restricted install must not silently fall back to substitute
         typography. Preload the two faces above the fold (UI body text and the wordmark's
         Latin slice) so the swap-in is imperceptible now that no `preconnect` is warming
         a remote host. Enforced by e2e/self-hosted-fonts.spec.ts. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>TruePPM</title>
    <!-- Blocking theme init — apply .dark before first paint to prevent flash.
         External file (not inline) so a strict script-src 'self' CSP permits it
         without an inline hash or 'unsafe-inline' (#897). Served from /public,
         so it loads same-origin. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
