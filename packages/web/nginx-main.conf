# Main-context nginx config for the UBI web image (#4336, ADR-1466).
#
# Replaces the base image's /etc/nginx/nginx.conf, which is s2i-shaped: it
# declares its own `server { listen 8080 default_server; root /opt/app-root/src; }`
# and includes /opt/app-root/etc/nginx.d/*.conf instead of /etc/nginx/conf.d/*.conf.
# This project's server block (nginx.conf, mounted/COPYed as conf.d/default.conf
# — the chart's ConfigMap mount and docker-compose.prod.yml both target that
# path) would collide with the built-in default_server, so the vendor file is not
# patched in place: a project-owned file keeps the path contract explicit.
#
# Writable paths are /var/cache/nginx and /var/run on purpose — the two (plus
# /tmp) the Helm chart and docker-compose.prod.yml already mount writable under
# a read-only root filesystem. Do not move them without moving those mounts.

# Bounds the graceful-shutdown drain of live /ws/ proxy connections (#4359): a
# MAIN-context directive, so it cannot live in conf.d/default.conf.
worker_shutdown_timeout 20s;

worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # No version in the Server header or error pages.
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
