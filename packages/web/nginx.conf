# Default nginx server config baked into the published `web` image.
#
# EVERY documented deployment mounts its own config over this file — Helm mounts
# templates/web/configmap.yaml at /etc/nginx/conf.d/default.conf, and both
# compose stacks serve the SPA from a separate top-level nginx service using
# nginx/*.conf.template. So this file is what an operator gets when they run the
# published image DIRECTLY (`docker run -p 80:8080 ghcr.io/trueppm/web`), which
# is a plausible reading of "here is our web image" and is exactly the path that
# #2569's /admin/ hardening never reached (#2849).
#
# Two consequences for anything edited here: it must be safe with no operator
# input of any kind (there are no values to configure), and it must not drift
# from its four siblings — scripts/check-nginx-security-headers.sh compares all
# five against one baseline.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers, matching nginx/app-http.conf.template (#2849).
    #
    # Django's XFrameOptionsMiddleware, SECURE_CONTENT_TYPE_NOSNIFF and
    # core.csp.ContentSecurityPolicyMiddleware only decorate responses DJANGO
    # produces. index.html and every JS bundle are served off disk from here and
    # never touch Django, so these directives are the only protection the
    # document that runs the whole application ever carries.
    #
    # No Strict-Transport-Security: this listener is plain HTTP by construction
    # (:8080, unprivileged), so HSTS would be ignored by browsers anyway
    # (RFC 6797 §8.1). Whatever terminates TLS in front of the image owns it.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'" always;

    # Proxy API calls to the Django backend.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect off;
    }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Django admin — NOT published from the image default (#2849).
    #
    # This block used to proxy /admin/ with no allow/deny and no limit_req, the
    # shape #2569 removed from the Helm ConfigMap and both compose templates
    # while leaving the image untouched. Django admin is a plain Django view, so
    # none of the DRF `login` throttle scopes apply to it and there is no lockout
    # backend; combined with a bootstrap step that guarantees a superuser exists,
    # publishing it unrestricted turns `docker run ghcr.io/trueppm/web` into an
    # unthrottled credential-guessing surface against a known-present privileged
    # account.
    #
    # It fails CLOSED with a flat 404 rather than the compose templates'
    # `allow 127.0.0.1; deny all;`, because a loopback allowlist is meaningless
    # here: nginx matches $remote_addr, which for a container reached through a
    # published port is the Docker bridge gateway, never the operator's address.
    # A 404 is unambiguous — the same reasoning the chart's demo branch uses.
    #
    # Every real deployment opts back in through its OWN config: Helm via
    # web.adminAccess.allowCIDRs, compose via nginx/app*.conf.template. To reach
    # admin against a directly-run image, go at the API container instead:
    #   docker run -p 8000:8000 … ghcr.io/trueppm/api   → http://localhost:8000/admin/
    # (bind it to 127.0.0.1 and SSH-tunnel; do not publish it).
    location /admin/ {
        return 404;
    }

    # Django static files (admin CSS/JS, collectstatic output).
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # SPA fallback — all unmatched routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
