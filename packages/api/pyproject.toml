[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trueppm-api"
version = "0.4.0-beta.6"
description = "TruePPM Django REST API — projects, tasks, scheduling, real-time collaboration"
readme = "README.md"
license = "Apache-2.0"
# `trueppm-api` also publishes to PyPI (api:publish:pypi, v* tags) as a
# separate artifact from the Docker image — that wheel/sdist previously
# carried no license or copyright text at all (#4177). LICENSE and NOTICE are
# kept byte-identical to the repo-root copies via
# scripts/check-package-licenses.sh.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Kelly Hair" },
]
# Runtime deps carry an explicit upper bound on the next major. A bare `>=`
# floor lets `pip install` resolve to the latest major at install time, with no
# protection against a breaking release — that is how the local venv silently
# drifted to Django 6.0 (which needs Python 3.12+, so CI on 3.11 was unaffected
# and the skew went unnoticed). Bounds are capped one major above the version CI
# currently resolves; patch/minor security fixes within the current major are
# still allowed.
dependencies = [
    "trueppm-scheduler>=0.4.0b5,<0.5",
    "django>=5.2.17,<6.0",
    # Floor is 3.17.2, not 3.15: every earlier release is affected by
    # GHSA-g47c-3xmw-q6m2 (AdminRenderer leaks GET-protected data) and
    # GHSA-2m8g-3cmr-wg3w (request.data bypasses DATA_UPLOAD_MAX_MEMORY_SIZE).
    # Pinning the lock alone would leave a fresh resolve free to pick an
    # affected version.
    #
    # Ceiling is <3.18 because 3.18.0 changes `many=True` serializer errors to
    # dict format and narrows `set_rollback` to initialized connections only —
    # both need verifying against our error contract and our ATOMIC_REQUESTS
    # refusal paths before we take them. uv resolves to 3.18.0 without this.
    # Tracked in #3323; lift the ceiling there, not here.
    "djangorestframework>=3.17.2,<3.18",
    "djangorestframework-simplejwt>=5.3.1,<6.0",
    # [socialaccount] is what declares requests/oauthlib/pyjwt, which the
    # openid_connect provider imports at django.setup(). Without it requests
    # arrives only transitively (via the OTLP HTTP exporter, which dropped it in 1.45).
    "django-allauth[socialaccount]>=65.18.0,<66.0",
    "defusedxml>=0.7,<0.8",
    "channels>=4.0,<5.0",
    "channels-redis>=4.0,<5.0",
    # Transitive via channels-redis (channel-layer serializer). Floored to the
    # fix release for GHSA-6v7p-g79w-8964: a reused Unpacker after an error can
    # SEGV — a DoS vector when unpacking untrusted input. Pin the floor here so
    # resolution can't drift back below 1.2.1.
    "msgpack>=1.2.1,<2.0",
    # 5.4/5.5 are no longer security-maintained upstream; track the supported
    # line (5.6+ requires Python >=3.9, satisfied by our >=3.11 floor).
    "celery>=5.6,<6.0",
    # Ceiling is kombu 5.6.2's own declared support window, NOT ours:
    # `Requires-Dist: redis!=4.5.5,!=5.0.2,<6.5,>=4.5.2; extra == "redis"`.
    # 7.0-7.4.1 silently break the pidbox control-plane (celery inspect
    # ping/reply, i.e. the Helm chart's control-plane drill, #3236) — pip/uv
    # never caught this because this project's top-level `redis` requirement
    # is what resolution actually uses; kombu's own `redis` extra (and its
    # ceiling) is only enforced if something requests `kombu[redis]`, which
    # nothing here does. Tracked upstream: redis/redis-py#4061. 6.4.0 is the
    # newest release inside kombu's window (checked clean via OSV at the time
    # of the #3236 fix). Do not raise this past <6.5 until kombu ships a
    # release that raises its own ceiling.
    "redis>=6.4,<6.5",
    # PostgreSQL driver. LGPL-3.0-only: a dynamically-imported runtime dep in an
    # application (not a library) — Apache 2.0 compatible per CLAUDE.md §Licenses
    # and the LICENSE/NOTICES files. The *implementation* (precompiled wheel vs.
    # C extension linked to the system libpq) is chosen per environment via the
    # `c` / `binary` extras below, NOT pinned here — the base requirement is the
    # pure-Python core so a bare install never forces a compiler. Production
    # installs `[c]` (links the system libpq so OS security upgrades reach the
    # driver); local dev installs `[binary]` (precompiled wheel, no compiler or
    # system libpq needed). The LGPL §4 relink obligation is over psycopg itself
    # and is met by either extra — both are replaceable wheels. See NOTICES.
    "psycopg>=3.1.8,<4.0",
    "django-environ>=0.11,<1.0",
    # BSD-3-Clause (verified against dist-info Classifier for v3.11.0). No copyleft obligation.
    "django-simple-history>=3.7,<4.0",
    # [sidecar] (BSD) bundles the Swagger UI / ReDoc static assets so the
    # interactive docs pages load from our own origin ('self') instead of a CDN —
    # required under the strict CSP (script-src 'self') and works offline.
    #
    # Pinned exact: drf-spectacular's generated schema output is version-sensitive
    # (e.g. the 0.29->0.30 change that renders an allow_blank field as
    # oneOf:[{uri}, {""}]), so docs/api/openapi.json is only reproducible against
    # one version. A loose range let a drifted ci-api image regenerate a
    # different schema and break api:schema-drift fleet-wide (#2260). Because the
    # api CI jobs run `pip install -e packages/api[dev]` at job start, pinning
    # here makes that runtime install enforce the version regardless of what the
    # baked image contains. Bumping is deliberate: change this pin,
    # `uv lock --upgrade-package drf-spectacular`, and regenerate the schema
    # (scripts/export-openapi.sh) in one MR.
    "drf-spectacular[sidecar]==0.30.0",
    "jsonschema>=4.21,<5.0",
    # Apache-2.0 OR BSD-2-Clause, PyPA. Already resolved transitively (kombu,
    # opentelemetry); declared because settings normalizes the package version
    # with it, which the published OpenAPI schema depends on.
    "packaging>=24.0",
    # MIT (sole transitive dep et-xmlfile is also MIT, zero deps, pure Python).
    # Reads .xlsx uploads for spreadsheet import (#743, ADR-0632). Its two
    # historical XXE CVEs were fixed in 2.4.2 (2017); since then it auto-enables
    # defusedxml hardening whenever defusedxml is importable, which it is --
    # already a direct dependency above. lxml is deliberately absent, so parsing
    # runs on stdlib ElementTree under defusedxml. Note defusedxml does NOT bound
    # decompression: the zip-bomb guard is ours, in csvimport/parser.py.
    "openpyxl>=3.1,<4.0",
    # ISC (permissive, Apache-2.0 compatible). Pure-Python, no runtime transitive
    # deps. Live SPF/DKIM/DMARC TXT lookups for writable SMTP config (#712). Floor
    # at 2.8.0: 2.6.0+ fixes CVE-2023-29483 (stub-resolver forged-UDP DoS); 2.8.0
    # adopts the full recommended mitigation, relevant to untrusted-domain lookups.
    "dnspython>=2.8.0,<3.0",
    # BSD-3-Clause. Object-storage backend for TaskAttachment files. This is a
    # correctness dependency, not a convenience one: settings/prod.py refuses to
    # boot on the ephemeral FileSystemStorage default (#775), and every
    # operator-facing surface — the configuration reference, the Helm README, and a
    # shipped values.yaml comment — tells operators to set
    # TRUEPPM_DEFAULT_FILE_STORAGE=storages.backends.s3.S3Storage. Without the
    # package in the image, the only documented durable path died on
    # ModuleNotFoundError, so the boot guard pushed operators at the one value the
    # image could not import (#2559).
    #
    # 1.14.6 predates the repo's "Add support for Django 5.2" commit, which is a CI
    # matrix + classifier change; verified working against Django 5.2 (see
    # tests/test_s3_storage_options.py).
    "django-storages>=1.14.6,<2.0",
    # Apache-2.0. S3 transport for django-storages. Listed DIRECTLY rather than
    # pulled in via `django-storages[s3]` because that extra declares a bare
    # `boto3>=1.4.4` with no upper bound, which would defeat the next-major cap
    # every other runtime dep here carries.
    "boto3>=1.35,<2.0",
    "uvicorn[standard]>=0.29,<1.0",
    # MIT, no required transitive deps. Serves collected static files directly from
    # the ASGI app (#1603) — we run uvicorn, not `runserver`, and ship no nginx/CDN,
    # so without WhiteNoise every /static/ request (admin CSS, Swagger UI / ReDoc
    # bundles) 404s. Wired as the second middleware; see settings/base.py MIDDLEWARE.
    "whitenoise>=6.0,<7.0",
    # Floor raised to 50.0.0 to clear GHSA-jwv3-5hgf-82ww (49.0.0), GHSA-m2h6-j472-rp4c
    # (49.0.0), and GHSA-g6cj-pr64-35w5 (50.0.0, PKCS#7 Bleichenbacher oracle).
    "cryptography>=50.0.0,<51",
    # OIDC ID-token signature verification (ADR-0187, basic SSO). Already present
    # transitively via djangorestframework-simplejwt; promoted to a direct dep with
    # the [crypto] extra so the SSO relying party can verify RS256/ES256 ID tokens
    # against the IdP's JWKS (PyJWKSet/PyJWK; the JWKS is fetched through the
    # SSRF-guarded egress, not PyJWKClient's own socket). The [crypto] extra pulls
    # cryptography, which is already pinned directly above — no new transitive surface.
    # Floor raised to 2.14.0 to clear GHSA-ffc3-869f-jxw9 (CRITICAL, CVSS 9.1 —
    # asymmetric-PEM detection bypass) and five HIGH PyJWK/validation advisories
    # (GHSA-9j54-fg26-wv3r, GHSA-9v7f-9g4p-ffgj, GHSA-p4g4-x82p-q773,
    # GHSA-r6x4-923q-g947, GHSA-w2cx-738m-mc7w), all fixed in 2.14.0 (#4235). This
    # package is published as trueppm-api on PyPI, so the declared floor — not just
    # the resolved lock — is a downstream consumer's security surface.
    "pyjwt[crypto]>=2.14,<3.0",
    # OpenTelemetry observability foundation (ADR-0223, #708). Apache-2.0, as is the
    # full transitive closure (opentelemetry-api/-proto/-semantic-conventions,
    # googleapis-common-protos, grpcio, protobuf) — no copyleft, so license:check:py
    # stays green. OPT-IN: the provider is a strict no-op unless an OTLP endpoint is
    # configured (no default endpoint), so a bare install pays no runtime cost.
    # -sdk gives the TracerProvider/MeterProvider + batch processors; -exporter-otlp
    # is the OTLP exporter meta-package (gRPC + HTTP). Capped one major up per the
    # bounding convention above.
    "opentelemetry-sdk>=1.43,<2",
    "opentelemetry-exporter-otlp>=1.43,<2",
    # OpenTelemetry auto-instrumentation (ADR-0223 Phase 1, #709). Apache-2.0, as is
    # the full added closure (-instrumentation base, -semantic-conventions, -util-http,
    # -wsgi, -dbapi; wrapt is BSD-2, asgiref BSD-3) — no copyleft, license:check:py
    # stays green. These are the b-series (0.64b0) that pairs with the 1.43 core pins
    # above; instrumentation versions independently of the stable packages, so they
    # carry their own floor. -django and -celery instrument the request/task paths,
    # -psycopg the DB driver (psycopg v3 — NOT psycopg2), -asgi the Channels/ASGI
    # stack. Still OPT-IN: no spans are emitted unless an OTLP endpoint is configured.
    "opentelemetry-instrumentation-django>=0.64b0,<1",
    "opentelemetry-instrumentation-celery>=0.64b0,<1",
    "opentelemetry-instrumentation-psycopg>=0.64b0,<1",
    "opentelemetry-instrumentation-asgi>=0.64b0,<1",
    # Structured JSON log formatter (#1899). MIT — permissive, Apache-2.0 compatible,
    # so license:check:py stays green. Pure-Python, no runtime transitive deps. Emits
    # single-line JSON so log records carry the OTel trace_id/span_id/request_id as
    # first-class fields a collector can index (ADR-0223 correlation; OTLP log *export*
    # is deferred to #711). Pinned to the 2.x line where `pythonjsonlogger.jsonlogger`
    # is the canonical, non-deprecated formatter path referenced in settings LOGGING.
    "python-json-logger>=2.0,<3.0",
]

[project.optional-dependencies]
# Production psycopg implementation: compile the C speedups against the *system*
# libpq (the API Docker image installs libpq-dev at build, libpq5 at runtime) so
# OS-level libpq/OpenSSL security upgrades flow through to the driver — the
# psycopg authors' recommended production posture. This is a security choice, not
# an LGPL lever: the §4 relink obligation is over psycopg (a replaceable wheel
# under either extra), while libpq is permissively licensed. The Dockerfile
# installs the api package as `[c]`.
c = ["psycopg[c]>=3.1.8,<4.0"]
# Local-dev / quick-start psycopg implementation: a precompiled wheel that
# bundles its own libpq — no compiler or system libpq needed. NOT for production:
# the bundled libpq does not receive OS security updates. The `dev` extra pulls
# this so a plain `pip install -e .[dev]` works on any laptop.
binary = ["psycopg[binary]>=3.1.8,<4.0"]
# Dev/toolchain deps are capped on the next major too — an unpinned `ruff` or
# `mypy` that drifts a major between a local run and CI produces format/type
# failures that only surface in the pipeline.
#
# The mypy toolchain (mypy + both stubs) is pinned EXACT rather than capped
# (#3275). A cap is not enough here because the ci-api image is built with
# `pip install -e ./api[dev]`, which never consults uv.lock — so a range
# re-resolves against PyPI on every image rebuild, and a stubs release that
# narrows a type changes the verdict of `api:type-check` with no commit and no
# lockfile change. That is what happened: djangorestframework-stubs began typing
# `Request.data` as `dict[str, Any] | list[Any]`, and 41 `request.data.get(...)`
# call sites became errors on code nobody had touched.
#
# Those 41 are resolved as of #3278 and the pins moved forward with them, which
# is the shape any future bump takes: a deliberate MR that raises these three
# lines and fixes what the new stubs flag — never a range that lets a PyPI
# release decide the gate.
#
# These three must match packages/api/uv.lock. Same reasoning as the exact
# `drf-spectacular[sidecar]==0.30.0` pin (#2260).
dev = [
    "psycopg[binary]>=3.1.8,<4.0",
    "pytest>=8.0,<10.0",
    "pytest-django>=4.8,<5.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=4.0,<8.0",
    "pytest-xdist>=3.6,<4.0",
    "pytest-split>=0.9,<1.0",
    "pytest-timeout>=2.4,<3.0",
    "pytest-socket>=0.8,<1.0",
    "diff-cover>=9.0,<10.0",
    "mypy==1.20.2",
    "django-stubs[compatible-mypy]==6.1.0",
    "djangorestframework-stubs[compatible-mypy]==3.18.1",
    "ruff>=0.8,<1.0",
    "testcontainers[postgres]>=4.7,<5.0",
    # Mutation testing (#4266) — the API-side beachhead for the same gap
    # `packages/scheduler`'s mutmut config closes there: coverage proves a line
    # ran under test, mutation testing proves the suite would FAIL if that line
    # were wrong. Dev/CI-only — never shipped in the image.
    #
    # EXACT pin, matching packages/scheduler/pyproject.toml's rationale verbatim:
    # mutmut is the measuring instrument behind a future gating floor, and a
    # minor release can change WHAT gets measured (3.8.0 itself started
    # mutating @dataclass methods and ternary conditions, moving the scheduler's
    # denominator with no commit on our side, #3720). Bump it in its own MR.
    "mutmut==3.8.0",
]
# Nightly OpenAPI fuzzing only (the schedule-gated `api:fuzz` CI job, #2121).
# Deliberately a separate extra rather than part of `dev`: Schemathesis 4.x
# requires `pytest>=9`, and we do not want that constraint resolving into the
# `dev` environment that `api:test` runs under (which pins pytest 8..10 and is
# lockfile-reproduced). The fuzz job installs `api[binary,fuzz]` in its own
# ephemeral CI env, so its pytest bump never touches the unit-test suite.
fuzz = ["schemathesis>=4.0,<5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/trueppm_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --timeout=180: a per-test wall-clock ceiling so a wedged test fails with its
# own name and stack instead of stalling the run until the CI job timeout, which
# names nothing (#3390). The ceiling is deliberately far outside normal
# variance. Two measurements bound it: the slowest genuine test is 8.14s in a
# freshly generated duration baseline (the 10.43s max in the older committed
# baseline is the same session-setup artifact described on the
# api:test-durations job, not a slow test), and the longest deliberate sleep in
# the suite is 3s. The timer wraps setup+call+teardown, so a session fixture is
# charged to the first test — measured worst case is a cold --create-db
# replaying all 315 migrations at 19.9s, still 9x under the ceiling. The
# testcontainers Postgres boot happens in pytest_configure, outside the timer
# entirely.
#
# `thread` method (not `signal`) because it works on every platform and under
# pytest-xdist workers, and it dumps the stack of the stuck thread — that stack
# is the whole point, and it prints frames without locals, so it cannot spill
# secrets into a CI log. Caveat worth knowing: on a fire it calls os._exit(1),
# which kills the xdist worker without pytest-cov's finish handshake, so that
# worker's coverage (~1/4 of the shard) is lost and the coverage gate may fail
# with a number that does not point back at the timeout. Only reachable on a
# real hang, which is currently unbounded, so it is still strictly better.
#
# pytest-timeout cancels itself when a debugger attaches, so local pdb sessions
# are unaffected.
addopts = "--strict-markers --tb=short -q --timeout=180 --timeout-method=thread"
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "trueppm_api.settings.dev"

# Mutation testing (#4266). Same missing third leg as packages/scheduler closes
# with its own [tool.mutmut] (#2282): coverage proves a line ran under test,
# mutation testing proves the tests would FAIL if that line were wrong. Runs
# nightly and (for MRs touching the beachhead module) per-rule allow_failure via
# the `api:mutation` CI job — never on the critical path for an ordinary API
# change. See that job's comments in .gitlab-ci.yml for the gating posture.
#
# BEACHHEAD SCOPE, chosen per #4266's acceptance criteria over the 5-role RBAC
# permission matrix: apps/projects/utilization.py. It is the module memory
# already flags as a repeat-offender shape — capacity/utilization computation
# has shipped wrong on green suites twice (capacity silently reading the ZERO
# load of a bare Task.assignee instead of TaskResource.units; progress on an
# in-progress task shrinking early_start toward early_finish and reading as lost
# allocation, #2621/#2623) — exactly the "weak assertion, not a missing line"
# shape mutation testing is built to catch, and it is close to pure computation
# (dict/Decimal/date arithmetic) rather than ORM-querying, which keeps the
# per-mutant pytest-django cost down.
[tool.mutmut]
source_paths = ["src/trueppm_api"]
only_mutate = [
    "*/apps/projects/utilization.py",
]
# Scopes BOTH the stats-collection pass and every per-mutant run to the test
# files that exercise the beachhead — not the ~3,500-test API suite mutmut's
# `also_copy` default (tests/, pyproject.toml, lock files) brings into the
# `mutants/` sandbox regardless. Without this, mutmut's single pre-mutation
# stats run would boot and migrate the Postgres test DB against the whole
# suite before mutating a single line — pytest-django under mutmut pays that
# cost PER MUTANT, which is the runtime risk the issue calls out measuring
# before committing to module size.
#
# TWO files, not one: test_utilization.py exercises every function in the
# module EXCEPT compute_team_utilization, whose own direct coverage lives in
# test_overview.py's TestTeamUtilization class (it backs the Overview KPI
# card's team-utilization endpoint, not the resource heat map). The first
# local baseline run with only test_utilization.py selected scored every one
# of compute_team_utilization's 94 mutants `no_tests` — not a real coverage
# gap, just the wrong test file for that one function. Scoped to the class via
# `::TestTeamUtilization`, not the whole 1,172-line test_overview.py module.
pytest_add_cli_args_test_selection = [
    "tests/apps/projects/test_utilization.py",
    "tests/apps/projects/test_overview.py::TestTeamUtilization",
]
# --reuse-db: the stats pass creates+migrates the test DB once; every
# subsequent mutant run (a fresh fork of mutmut's main process) reuses it
# rather than paying a full migration replay again. Paired with running the CI
# job at --max-children=1 (see api:mutation in .gitlab-ci.yml) — multiple
# mutmut workers forked concurrently would share this ONE reused database by
# name, and pytest-django's per-test transaction rollback gives no isolation
# across separate OS processes hitting the same tables at once. Serial
# execution trades worker parallelism for a score that is not corrupted by
# cross-process DB contention; the beachhead module's ~50 fast tests keep the
# serial wall time inside the nightly budget regardless (measured baseline in
# the #4266 MR description).
pytest_add_cli_args = [
    "--reuse-db",
]
# mutmut's own default `also_copy` (tests/, pyproject.toml, lock files) does
# NOT include a root-level conftest.py — only test_utilization.py's module
# itself is scoped into mutants/ by pytest_add_cli_args_test_selection above,
# but pytest-django's Postgres bootstrap lives in the ROOT conftest.py (not
# tests/conftest.py) specifically so it runs before pytest-django reads
# DJANGO_SETTINGS_MODULE — see that file's own docstring. Mutmut executes
# pytest with its cwd changed to `mutants/`, so without this entry the mutated
# sandbox has no root conftest.py and every mutant run fails before a single
# test imports Django.
also_copy = ["conftest.py"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"

# Third-party packages that ship without type stubs and have no community stubs.
# celery, django-environ, and channels are all well-maintained but not yet
# fully typed; ignoring missing imports keeps strict mode usable without
# forking stubs for each.
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "defusedxml.*",
    "environ",
    "jsonschema.*",
    "channels.*",
    "simple_history.*",
    # django-allauth ships without a py.typed marker; socialaccount is used as a
    # library behind our own hardened SSO views (ADR-0517).
    "allauth.*",
    # dnspython ships inline types but mypy's stub search misses its namespace
    # package in the shared-venv worktree layout (#712 deliverability check).
    "dns",
    "dns.*",
    # openpyxl ships no py.typed marker (#743). Used only inside
    # csvimport/parser.py behind a narrow read-only surface: load_workbook +
    # iter_rows, whose values we immediately coerce to str.
    "openpyxl",
    "openpyxl.*",
    "trueppm_api.apps.scheduling.*",
    "trueppm_api.apps.sync.*",
]
ignore_missing_imports = true

[mypy.plugins.django-stubs]
django_settings_module = "trueppm_api.settings.dev"

[tool.django-stubs]
django_settings_module = "trueppm_api.settings.dev"

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DJ", "C901"]
# RUF012 false-positives on Django migration classes and model Meta; RUF002/003
# flags en-dashes in docstrings — acceptable in project names and descriptions.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
# Complexity ceiling (#2488, carved out of #1307). Set at 15 because the tree
# passes there today, immediately after #2081 cleared every function at or above
# cognitive complexity 30 — pinning it now costs nothing, and every week it waits
# the ceiling has to be set higher.
#
# This is CYCLOMATIC complexity (McCabe), which is not the cognitive-complexity
# figure SonarCloud reports; the two disagree, and a function can pass one and
# fail the other. This gate is the local, fast backstop that keeps a regression
# out of `main`; SonarCloud stays the authority on its own metric.
#
# Ratchet down rather than up: if a change genuinely needs more than 15 branches,
# decompose it — do not raise this number.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# RUF012: Django/DRF Meta class attributes and ViewSet class attributes are
# mutable by convention — suppressing globally for Django source files.
# E501: squashed/regenerated migrations serialize long `replaces` lists and
# help_text/choices into single string literals that `ruff format` cannot wrap;
# hand-wrapping generated code defeats clean regeneration.
"*/migrations/*.py" = ["RUF012", "E501"]
"*/models.py" = ["RUF012"]
"*/serializers.py" = ["RUF012"]
"*/views.py" = ["RUF012"]
# `program_views.py` and `program_label_views.py` are DRF viewset modules too —
# the `*/views.py` glob misses them by filename, so the same ViewSet-attribute
# exemption is declared explicitly.
#
# A `*_views.py` suffix glob would cover the whole family and stop this list
# growing, but the other per-domain view modules already carry inline
# `# noqa: RUF012` directives; broadening the glob turns all 26 of them into
# RUF100 "unused noqa" errors. That cleanup is worth doing on its own branch,
# not smuggled into a feature.
"*/program_views.py" = ["RUF012"]
"*/program_label_views.py" = ["RUF012"]

[tool.coverage.run]
# CI runs api:test as 4 parallel shards (each writes .coverage.<n>) and stitches
# them together in a separate api:coverage job. Those jobs can land on runners
# with different builds_dir (e.g. /tmp/builds vs /mnt/nvme1/gitlab-runner/builds),
# so the absolute source paths baked into the shard data files don't resolve on
# the combine runner — `coverage xml` then emits "No source for code" and produces
# no coverage.xml, failing the job (and turning main red, issue 1348).
# relative_files records paths relative to this config's directory, so combine +
# xml are builds_dir-independent. Verified locally that it leaves diff-cover path
# matching (api:diff-coverage) unchanged.
relative_files = true

[tool.coverage.paths]
# Belt-and-suspenders for the same cross-runner combine: any data path still
# recorded as absolute (e.g. measured outside the package tree) is remapped onto
# the canonical src/ location during `coverage combine`, collapsing the
# /tmp/builds and /mnt/... prefixes to a single entry.
source = ["src/", "*/packages/api/src/"]
