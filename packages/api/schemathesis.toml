# Schemathesis configuration for the nightly `api:fuzz` job (#2364, #2768).
#
# `suppress-health-check` is ALSO passed as a CLI flag in .gitlab-ci.yml. That is
# deliberate redundancy, not an oversight — the two resolve through different
# paths (`SchemathesisConfig.discover()` vs the CLI override) and this operation
# has a history of the suppression not taking effect.
#
# ── Why "all" and not "filter_too_much" ────────────────────────────────────────
#
# It was `["filter_too_much"]` from #2364 until #2768, and that was measurably
# not enough: `POST /projects/{id}/tasks/bulk/` errored on the 2026-08-19 and
# 2026-08-20 nightlies *with this file in place*, reporting a health check and
# recommending the exact flag the job already passed in two places. A second
# operation, `POST /projects/{project_pk}/tasks/{task_pk}/comments/{id}/acknowledge/`,
# hit the identical error on 08-19 — so it is a class, not one endpoint.
#
# The name in that report is not authoritative. Schemathesis derives the reason
# from the exception's **message text**, not from the HealthCheck member
# Hypothesis actually raised (`generation/hypothesis/reporting.py`,
# `_extract_health_check_reason`: `"filtered out" in message -> filter_too_much`).
# And the measured trigger here is a **buffer overrun** on the combined
# `operations` + `dependencies` draw — which is what `data_too_large` guards,
# while Hypothesis counts an overrun toward the *filtered* ratio, producing a
# message that says "filtered out". So a run can trip `data_too_large` and be
# reported as `filter_too_much`, and suppressing only the latter does nothing.
#
# That also explains why it reproduces in CI and not locally: an overrun depends
# on the generation budget, which is tighter on a loaded shared runner. Every
# hypothesis about the schema, the flag, the schema source, the example database
# and the run scale was eliminated by measurement in #2768 without finding it.
#
# `all` removes the dependence on identifying which member fires in an
# environment we cannot observe. That is the point: it is a superset, not a
# better guess.
#
# ── Why suppressing costs no coverage ─────────────────────────────────────────
#
# A health check **aborts generation for an operation** — it never degrades it to
# fewer examples. So a firing check means that operation gets zero
# `not_a_server_error` and zero `response_schema_conformance` coverage, which is
# strictly worse than not checking. With suppression the same body generates the
# full 30/30 examples per seed; the operation is entirely fuzzable and was simply
# never being fuzzed.
#
# Nothing is lost by not being warned, because the warning is not what tells us
# an operation went untested — `scripts/check_fuzz_coverage.py` does, by asserting
# against the committed OpenAPI schema that every documented operation produced a
# testcase and that none errored. That is a direct measurement of the outcome the
# health check could only hint at. `too_slow` is included in `all` and is not a
# loss either: endpoint latency is measured by `perf:load`, not here.
suppress-health-check = ["all"]
