# OSV-Scanner suppressions for the website's locked dependency set
# (packages/website/package-lock.json), auto-discovered by the security:osv CI
# job.
#
# Same accepted-risk contract as packages/api/osv-scanner.toml,
# packages/scheduler/osv-scanner.toml, packages/web/osv-scanner.toml and
# packages/mobile/osv-scanner.toml: every entry carries a `reason` and an
# expiry, so a suppression stays documented and rots on its own instead of
# silently masking a future advisory.
#
# `[[PackageOverrides]]` rather than `[[IgnoredVulns]]` on purpose, matching
# the web/mobile files: pinning `name` + `version` keeps the suppression
# scoped to the exact unfixable resolution, so a future advisory against a
# version we do upgrade to still blocks the pipeline.

# The entry suppressing GHSA-ch52-4w7c-c8xp (http-cache-semantics 4.2.0,
# the astro build-time remote-image fetcher's cache-validation flaw) was
# removed on 2026-10-17 (#4490). Its #4262 "no patched release exists in any
# line" premise held when #4262 closed but is no longer true: npm published
# http-cache-semantics@4.3.0 on 2026-10-04, past the advisory's vulnerable
# range (`<= 4.2.0`), and packages/website/package-lock.json now resolves
# 4.3.0 (astro's own `^4.2.0` dependency range already permitted it — no
# astro bump was needed). Same pattern as #4476's brace-expansion cleanup.
