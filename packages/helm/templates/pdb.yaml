{{- if .Values.podDisruptionBudget.enabled }}
{{- /*
PodDisruptionBudgets for the API, Celery worker, and web tiers (#1904, #3188).
All express the budget as maxUnavailable so a single-replica install stays
drain-able (a minAvailable PDB would wedge node drains when replicaCount is 1);
the protection only becomes meaningful once replicaCount >= 2, which is the
production posture (values-prod sets replicaCount: 2). Off by default — enable
alongside a multi-replica deployment. Beat is deliberately excluded: it is a
pinned singleton, so any PDB on it would only block voluntary node drains.

The web tier was missing until #3188 — the only tier a browser actually loads
had no budget, while the two it never talks to directly did. Combined with
web.replicaCount (now replicas.web) shipping as a truthy `1` (so its documented
fallback to the top-level replicaCount could never fire), a values-prod deploy
rendered api=2, worker=2, web=1, PDBs=0: an unprotected singleton in front of a
redundant backend.

A PDB alone is still not redundancy. Without topologySpreadConstraints (see
values.yaml) both replicas can land on one node, and a node failure takes the
whole tier without the budget ever being consulted.

maxUnavailable uses a presence guard instead of `| default 1` (#4351): Sprig's
`default` treats 0 as unset too, which clobbered an explicit `maxUnavailable: 0`
(the same posture the bundled postgresql/valkey subcharts use) back up to 1. A
bare `| default`-less dot-access would reopen a DIFFERENT hole — the documented
null-to-delete override idiom (an operator setting `maxUnavailable: null` to
drop the key, per
packages/website/src/content/docs/administration/openshift.md) deletes it
from the merged map entirely, and dot-accessing a deleted key renders nothing
(`maxUnavailable: `), not the chart's documented default of 1. The guard
treats three inputs as "not set" — `kindIs "invalid"` (absent or explicit
null) AND an empty string (this chart's OTHER unset sentinel, the same one
`replicas.web` ships as its own default in values.yaml) — and renders the
explicit value otherwise, including 0. This matches the `actorAttributes`
pattern already used elsewhere in this chart, extended with the same
empty-string check `replicas.web`'s own guard uses.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trueppm.fullname" . }}-api
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- $apiMaxUnavailable := 1 }}
  {{- $apiMaxUnavailableSet := .Values.podDisruptionBudget.api.maxUnavailable }}
  {{- if not (or (kindIs "invalid" $apiMaxUnavailableSet) (and (kindIs "string" $apiMaxUnavailableSet) (eq $apiMaxUnavailableSet ""))) }}
  {{- $apiMaxUnavailable = $apiMaxUnavailableSet }}
  {{- end }}
  maxUnavailable: {{ $apiMaxUnavailable }}
  selector:
    matchLabels:
      {{- include "trueppm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trueppm.fullname" . }}-celery-worker
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  {{- $workerMaxUnavailable := 1 }}
  {{- $workerMaxUnavailableSet := .Values.podDisruptionBudget.worker.maxUnavailable }}
  {{- if not (or (kindIs "invalid" $workerMaxUnavailableSet) (and (kindIs "string" $workerMaxUnavailableSet) (eq $workerMaxUnavailableSet ""))) }}
  {{- $workerMaxUnavailable = $workerMaxUnavailableSet }}
  {{- end }}
  maxUnavailable: {{ $workerMaxUnavailable }}
  selector:
    matchLabels:
      {{- include "trueppm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
{{- if .Values.web.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trueppm.fullname" . }}-web
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- $webMaxUnavailable := 1 }}
  {{- $webMaxUnavailableSet := .Values.podDisruptionBudget.web.maxUnavailable }}
  {{- if not (or (kindIs "invalid" $webMaxUnavailableSet) (and (kindIs "string" $webMaxUnavailableSet) (eq $webMaxUnavailableSet ""))) }}
  {{- $webMaxUnavailable = $webMaxUnavailableSet }}
  {{- end }}
  maxUnavailable: {{ $webMaxUnavailable }}
  selector:
    matchLabels:
      {{- include "trueppm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
{{- end }}
