{{- /*
Default (light) worker. Consumes the "celery" queue — and, until
heavyWorker.enabled splits it out, the "heavy" queue too, so a stock install
still runs every task on one worker (#2276). The body lives in _worker.tpl.
*/ -}}
{{- $replicas := $.Values.replicaCount -}}
{{- if and .Values.autoscaling.enabled .Values.autoscaling.worker.enabled -}}
  {{- /* Same HPA interaction as the api tier — see #3188. */ -}}
  {{- $replicas = "" -}}
{{- end -}}
{{- include "trueppm.celeryWorkerDeployment" (dict
      "root" .
      "suffix" ""
      "label" "processes.worker"
      "cfg" .Values.processes.worker
      "resources" .Values.resources.worker
      "queues" (ternary "celery" "celery,heavy" .Values.heavyWorker.enabled)
      "replicas" $replicas) }}
