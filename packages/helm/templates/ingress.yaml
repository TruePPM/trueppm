{{- if .Values.ingress.enabled }}
{{- /*
  Demo-mode guard (#3908, ADR-0658 D7a). The demo's read-only allowlist lives ONLY
  in the web tier's nginx ConfigMap, so anything that routes to the API Service
  directly bypasses it. The default ingress.hosts does exactly that for /api and
  /ws, which with demo.enabled would publish the whole authenticated API and the
  websocket to the internet. Refuse to render unless every path targets the web
  tier — and the web tier is actually on, because a `service: web` path silently
  falls back to the API Service when web.enabled is false (see the path loop
  below). Comparing `| default "api"` mirrors that loop exactly so the guard and
  the router cannot disagree about what a path with no `service:` means.
*/ -}}
{{- if .Values.demo.enabled }}
{{- range $h := .Values.ingress.hosts }}
{{- range $p := $h.paths }}
{{- if or (ne ($p.service | default "api") "web") (not $.Values.web.enabled) }}
{{- fail (printf "demo.enabled and ingress.enabled are both true, but ingress path %q on host %q reaches the API Service directly (service: %s, web.enabled: %v). Demo mode's read-only allowlist lives only in the web tier's nginx, so an Ingress that bypasses it exposes the full authenticated API and /ws/. Either set ingress.hosts so EVERY path uses `service: web` (with web.enabled=true), or leave ingress.enabled=false and expose the web Service through a tunnel such as Cloudflare Tunnel (ADR-0658 D9)." $p.path ($h.host | default "") ($p.service | default "api") $.Values.web.enabled) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{/*
Chart-managed Ingress and the TLS termination point for the release (#1714).

Off by default (values.yaml) because the correct ingress class, hostname, and
certificate source are cluster-specific — a chart that guessed them would render
a broken object on first install. Turn it on and supply hosts/tls to expose the
API over HTTPS at the edge. The Service stays ClusterIP; this Ingress is the only
object that fronts it externally.

TLS: list one or more entries under `ingress.tls`, each naming a Kubernetes TLS
Secret (`secretName`) and the host(s) it covers. With cert-manager, add the
issuer annotation under `ingress.annotations` and cert-manager provisions the
named Secret automatically. Leaving `ingress.tls` empty renders an HTTP-only
Ingress — acceptable only for a dev/demo cluster, never production.

Note the app-side companion to edge TLS: settings.prod sets
SECURE_PROXY_SSL_HEADER and honors X-Forwarded-Proto, and the k8s probe paths
(/api/v1/health/, /api/v1/edition/) are exempt from the optional HTTP→HTTPS
redirect so liveness/readiness keep working over the in-cluster plain-HTTP hop.

Required header contract for whatever fronts this release (#3515). The app takes
the SCHEME from the proxy and the HOST from the request, so:

  - X-Forwarded-Proto MUST be set to the scheme the client used. ingress-nginx
    and the cloud LBs do this themselves; a hand-rolled proxy must be told to.
  - The original Host MUST be preserved end to end. settings.prod pins
    USE_X_FORWARDED_HOST = False, so X-Forwarded-Host is IGNORED — an edge that
    rewrites Host to an internal name yields unusable absolute URLs (the OIDC
    redirect_uri and the Git-webhook URL) with no error anywhere. If yours
    rewrites Host and cannot be changed, set env.TRUEPPM_PUBLIC_API_BASE_URL
    rather than looking for a header-trust switch; there is deliberately none.

Whatever Host does arrive must be listed in ALLOWED_HOSTS, and a bare "*" there
now refuses to boot (TRUEPPM_ALLOW_WILDCARD_HOSTS acknowledges it).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trueppm.fullname" . }}
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- /*
            Each path routes to either the web SPA or the API. `service: web`
            targets the nginx web tier (the SPA + its own /api,/ws reverse proxy
            fallback); `service: api` (the default) targets the Django API Service
            directly. List /api and /ws before / so the API routes win the
            longest-prefix match on controllers that honor path order. When the web
            tier is disabled, a `service: web` path falls back to the API Service so
            the Ingress never references a Service that was not rendered.
          */}}
          {{- $svc := .service | default "api" }}
          {{- if and (eq $svc "web") $.Values.web.enabled }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "trueppm.fullname" $ }}-web
                port:
                  number: {{ $.Values.service.web.port }}
          {{- else }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "trueppm.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- /*
  Webhook body ceiling (#2932). ingress.annotations carries proxy-body-size 2m
  (#5124), and ingress-nginx applies an annotation to every path of its Ingress —
  so without a second object an anonymous caller could push
  2 MB at the Git-event receiver (the app's own 1 MB cap runs only after ASGI
  has already read and spooled the whole body). A separate Ingress is the only
  way to scope proxy-body-size to one path. It is emitted only for hosts that
  route something straight to the API Service; a host whose paths all use
  `service: web` is covered by the web tier's own nginx location instead.

  The path needs a regex for the project UUID segment, so this Ingress sets
  use-regex. ingress-nginx then treats every path of that HOST as a regex,
  including the plain prefixes on the main Ingress; those still match as
  anchored prefixes, so routing is unchanged. No tls block here: TLS is per host
  and is already provided by the main Ingress, and repeating it would make
  cert-manager mint a duplicate Certificate.
*/ -}}
{{- if and .Values.ingress.webhookBodyLimit.enabled (not .Values.demo.enabled) }}
{{- $apiHosts := list }}
{{- range $h := .Values.ingress.hosts }}
{{- $direct := false }}
{{- range $p := $h.paths }}
{{- if or (eq ($p.service | default "api") "api") (not $.Values.web.enabled) }}
{{- $direct = true }}
{{- end }}
{{- end }}
{{- if $direct }}
{{- $apiHosts = append $apiHosts $h.host }}
{{- end }}
{{- end }}
{{- if $apiHosts }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trueppm.fullname" . }}-git-webhook
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{- if ne $k "nginx.ingress.kubernetes.io/proxy-body-size" }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.webhookBodyLimit.size | quote }}
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range $apiHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api/v1/integrations/projects/[^/]+/git-webhook/
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "trueppm.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- /*
  Large-body routes (#5124). ingress.annotations carries a TIGHT proxy-body-size
  (2m), so every route, anonymous ones included, is bounded at the edge before
  ASGI spools the body. Only the routes that take more are raised, each on an
  Ingress sized to its own tier: <release>-large-body (ingress.largeBody.size,
  110m) for attachments and file imports, <release>-bulk-body
  (ingress.largeBody.bulkSize, 10m) for logo, seed import, bulk, sync and inbound
  task push. The bulk routes must not inherit 110m: the app caps them at 10 MiB
  but only after ASGI has spooled the body, and task-sync is reached before its
  token is checked. The lists mirror LARGE_BODY_ROUTES in
  packages/api/src/trueppm_api/core/request_body_limits.py, pattern for pattern;
  tests/core/test_request_body_limits.py fails if a route, its tier or its size
  drifts. Every path ends in `$`: with use-regex ingress-nginx renders
  `location ~* "^<path>"`, so an unanchored path would also raise every route
  beneath it. Same use-regex and no-tls reasoning as the webhook Ingress above.
  Unlike that one these are rendered for web-tier hosts too, because the main
  Ingress's 2m would cap an upload before it reached the web tier's own
  per-route limits. Each host sends these paths to the same Service as its
  longest path covering /api/v1/.
*/ -}}
{{- $large := .Values.ingress.largeBody | default dict }}
{{- if and $large.enabled (not .Values.demo.enabled) }}
{{- $uploadPaths := list
  "/api/v1/projects/[^/]+/tasks/[^/]+/attachments/$"
  "/api/v1/projects/[^/]+/import/msproject/$"
  "/api/v1/projects/import/msproject/$"
  "/api/v1/projects/[^/]+/import/jira/$"
  "/api/v1/projects/[^/]+/import/csv/$"
  "/api/v1/projects/[^/]+/import/csv/preview/$"
  "/api/v1/projects/[^/]+/risks/import/$" }}
{{- $bulkPaths := list
  "/api/v1/workspace/logo/$"
  "/api/v1/programs/import/$"
  "/api/v1/programs/import/validate/$"
  "/api/v1/projects/[^/]+/tasks/bulk/$"
  "/api/v1/projects/[^/]+/sync/$"
  "/api/v1/projects/[^/]+/task-sync/$" }}
{{- $tiers := list
  (dict "name" "large-body" "size" $large.size "paths" $uploadPaths)
  (dict "name" "bulk-body" "size" ($large.bulkSize | default "10m") "paths" $bulkPaths) }}
{{- $targets := list }}
{{- range $h := .Values.ingress.hosts }}
{{- $best := "" }}
{{- $svc := "" }}
{{- range $p := $h.paths }}
{{- if and (hasPrefix $p.path "/api/v1/") (gt (len $p.path) (len $best)) }}
{{- $best = $p.path }}
{{- $svc = $p.service | default "api" }}
{{- end }}
{{- end }}
{{- if $svc }}
{{- $targets = append $targets (dict "host" $h.host "web" (and (eq $svc "web") $.Values.web.enabled)) }}
{{- end }}
{{- end }}
{{- if $targets }}
{{- range $tier := $tiers }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trueppm.fullname" $ }}-{{ $tier.name }}
  labels:
    {{- include "trueppm.labels" $ | nindent 4 }}
  annotations:
    {{- range $k, $v := $.Values.ingress.annotations }}
    {{- if ne $k "nginx.ingress.kubernetes.io/proxy-body-size" }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $tier.size | quote }}
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  rules:
    {{- range $t := $targets }}
    - host: {{ $t.host | quote }}
      http:
        paths:
          {{- range $tier.paths }}
          - path: {{ . }}
            pathType: ImplementationSpecific
            backend:
              service:
                {{- if $t.web }}
                name: {{ include "trueppm.fullname" $ }}-web
                port:
                  number: {{ $.Values.service.web.port }}
                {{- else }}
                name: {{ include "trueppm.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
