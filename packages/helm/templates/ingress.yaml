{{- if .Values.ingress.enabled }}
{{- /*
  Demo-mode guard (#3908, ADR-0658 D6). The demo's read-only allowlist lives ONLY
  in the web tier's nginx ConfigMap, so anything that routes to the API Service
  directly bypasses it. The default ingress.hosts does exactly that for /api and
  /ws, which with demo.enabled would publish the whole authenticated API and the
  websocket to the internet. Refuse to render unless every path targets the web
  tier — and the web tier is actually on, because a `service: web` path silently
  falls back to the API Service when web.enabled is false (see the path loop
  below). Comparing `| default "api"` mirrors that loop exactly so the guard and
  the router cannot disagree about what a path with no `service:` means.
*/ -}}
{{- if .Values.demo.enabled }}
{{- range $h := .Values.ingress.hosts }}
{{- range $p := $h.paths }}
{{- if or (ne ($p.service | default "api") "web") (not $.Values.web.enabled) }}
{{- fail (printf "demo.enabled and ingress.enabled are both true, but ingress path %q on host %q reaches the API Service directly (service: %s, web.enabled: %v). Demo mode's read-only allowlist lives only in the web tier's nginx, so an Ingress that bypasses it exposes the full authenticated API and /ws/. Either set ingress.hosts so EVERY path uses `service: web` (with web.enabled=true), or leave ingress.enabled=false and expose the web Service through a tunnel such as Cloudflare Tunnel (ADR-0658 D9)." $p.path ($h.host | default "") ($p.service | default "api") $.Values.web.enabled) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{/*
Chart-managed Ingress and the TLS termination point for the release (#1714).

Off by default (values.yaml) because the correct ingress class, hostname, and
certificate source are cluster-specific — a chart that guessed them would render
a broken object on first install. Turn it on and supply hosts/tls to expose the
API over HTTPS at the edge. The Service stays ClusterIP; this Ingress is the only
object that fronts it externally.

TLS: list one or more entries under `ingress.tls`, each naming a Kubernetes TLS
Secret (`secretName`) and the host(s) it covers. With cert-manager, add the
issuer annotation under `ingress.annotations` and cert-manager provisions the
named Secret automatically. Leaving `ingress.tls` empty renders an HTTP-only
Ingress — acceptable only for a dev/demo cluster, never production.

Note the app-side companion to edge TLS: settings.prod sets
SECURE_PROXY_SSL_HEADER and honors X-Forwarded-Proto, and the k8s probe paths
(/api/v1/health/, /api/v1/edition/) are exempt from the optional HTTP→HTTPS
redirect so liveness/readiness keep working over the in-cluster plain-HTTP hop.

Required header contract for whatever fronts this release (#3515). The app takes
the SCHEME from the proxy and the HOST from the request, so:

  - X-Forwarded-Proto MUST be set to the scheme the client used. ingress-nginx
    and the cloud LBs do this themselves; a hand-rolled proxy must be told to.
  - The original Host MUST be preserved end to end. settings.prod pins
    USE_X_FORWARDED_HOST = False, so X-Forwarded-Host is IGNORED — an edge that
    rewrites Host to an internal name yields unusable absolute URLs (the OIDC
    redirect_uri and the Git-webhook URL) with no error anywhere. If yours
    rewrites Host and cannot be changed, set env.TRUEPPM_PUBLIC_API_BASE_URL
    rather than looking for a header-trust switch; there is deliberately none.

Whatever Host does arrive must be listed in ALLOWED_HOSTS, and a bare "*" there
now refuses to boot (TRUEPPM_ALLOW_WILDCARD_HOSTS acknowledges it).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trueppm.fullname" . }}
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- /*
            Each path routes to either the web SPA or the API. `service: web`
            targets the nginx web tier (the SPA + its own /api,/ws reverse proxy
            fallback); `service: api` (the default) targets the Django API Service
            directly. List /api and /ws before / so the API routes win the
            longest-prefix match on controllers that honor path order. When the web
            tier is disabled, a `service: web` path falls back to the API Service so
            the Ingress never references a Service that was not rendered.
          */}}
          {{- $svc := .service | default "api" }}
          {{- if and (eq $svc "web") $.Values.web.enabled }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "trueppm.fullname" $ }}-web
                port:
                  number: {{ $.Values.web.service.port }}
          {{- else }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "trueppm.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
