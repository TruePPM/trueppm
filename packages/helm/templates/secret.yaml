{{/*
Chart-owned connection Secret — the single source of truth for every credential
the release uses. It holds:
  - DATABASE_URL / REDIS_URL: full connection strings the API and Celery worker
    consume via `secretKeyRef` (the app reads whole URLs, not discrete fields).
  - POSTGRES_PASSWORD / valkey-password: the raw passwords the bundled subcharts
    consume, so the database server and the URL string can never drift apart.

A URL the operator supplied as a reference to their OWN Secret (the
`env.DATABASE_URL: {secretKeyRef: …}` map form) is omitted here — the chart never
holds a second copy of a credential it was only asked to point at, and
`trueppm.connectionEnv` wires the containers straight to the operator's Secret
instead (#2810). `stringData` therefore has to tolerate being empty, which is why
it renders through `toYaml` over a built dict rather than as literal keys: a bare
`stringData:` with every key suppressed is YAML null, which kubeconform rejects.

`helm.sh/resource-policy: keep` ensures a `helm uninstall` does NOT delete this
Secret, so an accidental uninstall/reinstall cannot silently mint a new password
and orphan the existing database PVC.

The passwords are generate-if-unset (see trueppm.postgresqlPassword /
trueppm.valkeyPassword). Those helpers read an existing password back with
`lookup`, so `helm install` and `helm upgrade` are idempotent — they reach the
cluster, find this Secret, and reuse its value.

That guarantee is scoped to a LIVE CLUSTER CONNECTION and does not extend to
render-only paths (#3226). `lookup` returns empty during `helm template`,
`--dry-run`, and `helm diff`, and the helpers then fall through to
`randAlphaNum 32` — so three `helm template` runs of the same chart with the same
values emit three different passwords. The consequence is not cosmetic for anyone
deploying through a renderer: Argo CD applies the output of `helm template`, so
with a bundled datastore and an empty password every sync overwrites this Secret
while the datastore's PVC keeps the old credential.

The fix is not in this template — it is to not generate in that topology. Set
`postgresql.auth.password` / `valkey.auth.password` explicitly from a secret
manager, or (the production posture, and what values-prod.yaml already does)
disable the bundled subcharts entirely so nothing is generated. Both are
documented under "Chart-generated passwords and GitOps" in
/administration/deployment/.
*/}}
{{- $data := dict -}}
{{- if not (include "trueppm.databaseUrlIsExternalRef" .) -}}
{{- $_ := set $data "DATABASE_URL" (include "trueppm.databaseUrl" .) -}}
{{- end -}}
{{- if not (include "trueppm.redisUrlIsExternalRef" .) -}}
{{- $_ := set $data "REDIS_URL" (include "trueppm.redisUrl" .) -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- $_ := set $data "POSTGRES_PASSWORD" (include "trueppm.postgresqlPassword" .) -}}
{{- end -}}
{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled -}}
{{- $_ := set $data "valkey-password" (include "trueppm.valkeyPassword" .) -}}
{{- end -}}
{{- if (include "trueppm.valkeySentinelEnabled" .) -}}
{{- if .Values.valkey.sentinel.password -}}
{{- $_ := set $data "TRUEPPM_VALKEY_PASSWORD" .Values.valkey.sentinel.password -}}
{{- end -}}
{{- if .Values.valkey.sentinel.sentinelPassword -}}
{{- $_ := set $data "TRUEPPM_VALKEY_SENTINEL_PASSWORD" .Values.valkey.sentinel.sentinelPassword -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trueppm.urlSecretName" . }}
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:{{ if $data }}{{ toYaml $data | nindent 2 }}{{ else }} {}{{ end }}
