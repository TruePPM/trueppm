{{/*
Shared pieces of the backup job, defined here rather than in _helpers.tpl
because nothing outside this file uses them. They sit above the
backup.enabled guard because a define may not be nested inside a control
structure.

The job has two shapes:

  s3.enabled: false  one container — dump to the local volume, prune, done.
  s3.enabled: true   an initContainer dumps (it needs pg_dump, so it runs the
                     PostgreSQL image) and the main container uploads (it needs
                     an S3 client, so it runs the uploader image).

The split exists because no single stock image carries both pg_dump and an
object-storage client: postgres:16-alpine ships pg_dump/pg_isready/psql and
neither `aws` nor `mc`, which is why the previous single-container job could
only ever print a note about the bucket instead of writing to it (#2611).
*/}}

{{- define "trueppm.backup.dumpEnv" -}}
# DATABASE_URL resolved by the shared helper — the same single credential source
# of truth the API and worker use, so the backup never carries a second copy of
# the password and never disagrees with them about where it lives (the chart-owned
# connection Secret, or the operator's own Secret on the managed-DB path).
{{ include "trueppm.databaseUrlEnv" . }}
- name: OUTPUT_DIR
  value: {{ .Values.backup.outputDir | quote }}
- name: KEEP_DAILY
  value: {{ .Values.backup.keepDaily | quote }}
{{- if .Values.backup.mediaDir }}
- name: MEDIA_DIR
  value: {{ .Values.backup.mediaDir | quote }}
{{- end }}
# Named in the MANIFEST as the INTENDED destination, exactly as scripts/backup.sh
# records it (#3185). The manifest is sealed inside the tarball before the upload
# container can run, so this is a statement of intent — but a failed upload fails
# the Job, so a bucket named here on an artifact you downloaded did receive it.
- name: S3_BUCKET
  value: {{ .Values.backup.s3.bucket | quote }}
{{- end -}}

{{- define "trueppm.backup.s3Env" -}}
- name: OUTPUT_DIR
  value: {{ .Values.backup.outputDir | quote }}
- name: S3_BUCKET
  value: {{ .Values.backup.s3.bucket | quote }}
- name: S3_ENDPOINT
  value: {{ .Values.backup.s3.endpoint | quote }}
- name: S3_PREFIX
  value: {{ .Values.backup.s3.prefix | quote }}
- name: TRUEPPM_S3_ALLOW_PLAINTEXT
  value: {{ .Values.backup.s3.allowPlaintext | quote }}
- name: AWS_DEFAULT_REGION
  value: {{ .Values.backup.s3.region | quote }}
# The AWS CLI writes nothing under a normal `s3 cp`, but it does resolve $HOME
# to look for ~/.aws. readOnlyRootFilesystem is on and there is no home
# directory for the non-root UID, so point HOME at the writable scratch mount
# rather than letting it fall back to "/" and fail on a permission error.
- name: HOME
  value: /tmp
{{- if .Values.backup.s3.existingSecret }}
- name: AWS_ACCESS_KEY_ID
  valueFrom:
    secretKeyRef:
      name: {{ .Values.backup.s3.existingSecret }}
      key: AWS_ACCESS_KEY_ID
- name: AWS_SECRET_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.backup.s3.existingSecret }}
      key: AWS_SECRET_ACCESS_KEY
{{- end }}
{{- end -}}

{{- define "trueppm.backup.volumeMounts" -}}
- name: tmp
  mountPath: /tmp
- name: backups
  mountPath: {{ .Values.backup.outputDir | quote }}
{{- if .Values.backup.mediaDir }}
{{- with .Values.backup.extraVolumeMounts }}
{{- toYaml . }}
{{- end }}
{{- end }}
{{- end -}}

{{/*
The dump step. Mirrors scripts/backup.sh (same pg_dump --format=custom, same
timestamped artifact, same local prune). Kept inline rather than mounting the
repo-root script because Helm .Files.Get cannot read across the chart boundary
and the lean application image carries no pg_dump.

It records the artifact path in .last-artifact so the upload container knows
exactly which file this run produced, rather than re-deriving "newest" and
racing a concurrent write.
*/}}
{{- define "trueppm.backup.dumpCommand" -}}
- /bin/sh
- -ec
- |
  set -eu
  TS="$(date -u +%Y%m%dT%H%M%SZ)"
  ART="${OUTPUT_DIR}/trueppm-backup-${TS}.tar.gz"
  STAGE="$(mktemp -d /tmp/trueppm-backup.XXXXXX)"
  trap 'rm -rf "$STAGE"' EXIT
  mkdir -p "$OUTPUT_DIR"
  echo "waiting for PostgreSQL..."
  i=0; until pg_isready -d "$DATABASE_URL" >/dev/null 2>&1; do
    i=$((i+1)); [ "$i" -ge 30 ] && { echo "postgres not ready"; exit 1; }; sleep 1
  done
  echo "dumping database..."
  pg_dump --format=custom --no-owner --no-privileges \
    -d "$DATABASE_URL" -f "$STAGE/db.dump"
  # Media, mirroring scripts/backup.sh's four cases so the manifest can state
  # which one happened (#3185). No `|| true` here: the script has none either,
  # and swallowing a tar failure produces an artifact that claims to carry media
  # and does not — the one error a restorer cannot detect until they need it.
  if [ -n "${MEDIA_DIR:-}" ] && [ -d "${MEDIA_DIR}" ]; then
    if find "$MEDIA_DIR" -mindepth 1 -print -quit | grep -q .; then
      echo "archiving media ${MEDIA_DIR}..."
      tar -czf "$STAGE/media.tar.gz" -C "$MEDIA_DIR" .
      MEDIA_INCLUDED="yes (${MEDIA_DIR})"
    else
      echo "media directory ${MEDIA_DIR} is empty — skipping"
      MEDIA_INCLUDED="no (empty)"
    fi
  elif [ -n "${MEDIA_DIR:-}" ]; then
    echo "media directory ${MEDIA_DIR} does not exist — skipping"
    MEDIA_INCLUDED="no (absent)"
  else
    echo "no media directory configured (object-storage backend?) — skipping media"
    MEDIA_INCLUDED="no (not configured)"
  fi
  # Same field set as scripts/backup.sh's manifest. A restorer reads this to
  # answer "is media inside this artifact?" — with only created_utc and
  # pg_dump_version they could not, and the two producers disagreeing about
  # the format is the same problem one step later.
  {
    echo "TruePPM backup manifest"
    echo "created_utc: $TS"
    echo "run_context: helm-cronjob"
    echo "pg_dump_version: $(pg_dump --version | head -n1)"
    echo "db_included: yes"
    echo "media_included: ${MEDIA_INCLUDED}"
    # The CronJob has no redis-cli and no route to the Valkey RDB file; a
    # Redis snapshot is a scripts/backup.sh --redis affordance only. Stated
    # rather than omitted so the absence is a fact in the artifact.
    echo "redis_included: no (not supported by the CronJob)"
    echo "s3_destination: ${S3_BUCKET:-none}"
  } > "$STAGE/MANIFEST"
  tar -czf "$ART" -C "$STAGE" .
  echo "backup written: $ART"
  # Hand the exact artifact path to the upload container (no-op when there
  # isn't one). Written last so its presence implies a complete artifact.
  printf '%s' "$ART" > "${OUTPUT_DIR}/.last-artifact"
  # Retention: keep the KEEP_DAILY newest LOCAL artifacts (names sort
  # chronologically). No-op when KEEP_DAILY is empty/0. This never touches the
  # bucket — remote retention is the object store's lifecycle policy.
  if [ -n "${KEEP_DAILY:-}" ] && [ "${KEEP_DAILY}" -gt 0 ] 2>/dev/null; then
    ls -1 "$OUTPUT_DIR"/trueppm-backup-*.tar.gz 2>/dev/null | sort -r \
      | tail -n "+$((KEEP_DAILY + 1))" \
      | while IFS= read -r f; do echo "pruning $f"; rm -f "$f"; done
  fi
{{- end -}}

{{/*
The upload step. Runs only when backup.s3.enabled, in an image that carries the
AWS CLI. Path-style addressing is forced whenever a custom endpoint is set,
because a self-hosted MinIO is normally reached by IP or by a single hostname
with no wildcard DNS, so virtual-hosted-style requests resolve to nothing.

Credentials are passed as AWS_* environment variables and never assembled into
a URL: a real 40-char secret key routinely contains "/", "+", and ":", which
corrupts URL-based credential forms. Same rationale as scripts/lib/s3.sh.

The plaintext-endpoint check below duplicates
_s3_warn_if_remote_plaintext/_s3_endpoint_looks_incluster from scripts/lib/s3.sh
rather than reusing it, because this job never sources that file — a Helm
template can't reach outside the chart, and this container doesn't mount the
repo. Keep the two heuristics in sync if either changes (#2650).
*/}}
{{- define "trueppm.backup.uploadCommand" -}}
- /bin/sh
- -ec
- |
  set -eu
  # backup.s3.region is optional in values; the CLI still requires a region to
  # sign with. us-east-1 is what MinIO reports unless reconfigured, and it is
  # the correct signing region for a bucket whose location is unset.
  AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
  export AWS_DEFAULT_REGION
  # Warn — never block — when S3_ENDPOINT is unencrypted (http://) and does
  # not look in-cluster / private-network. The artifact is a full PostgreSQL
  # dump; see scripts/lib/s3.sh for the full heuristic rationale and limits.
  #
  # The warning text below tracks the one in scripts/lib/s3.sh (they differ
  # only in which opt-out they name — the Helm value here, the env var there),
  # and it deliberately does NOT spell out the "http" + "://" literal:
  # shell:S5332 matched that sequence in the library's copy and raised the
  # plaintext warning itself as a clear-text-protocol vulnerability (#2712).
  # The YAML analyzer never reads this embedded script, so Sonar would not
  # report a reintroduction here — scripts/tests/backup-s3.test.sh greps this
  # template for it instead.
  case "${S3_ENDPOINT:-}" in
    http://*)
      if [ "${TRUEPPM_S3_ALLOW_PLAINTEXT:-}" != "1" ] && [ "${TRUEPPM_S3_ALLOW_PLAINTEXT:-}" != "true" ]; then
        _host="${S3_ENDPOINT#http://}"
        _host="${_host%%/*}"
        _host="${_host%%:*}"
        case "$_host" in
          # Recognized as in-cluster/private: a bare dot-free short name (a
          # Kubernetes Service DNS short name, matched by the final "no dot"
          # arm below), *.local (also covers *.svc.cluster.local and
          # *.cluster.local), *.svc, localhost/::1, and RFC1918/loopback.
          localhost | ::1 | *.local | *.svc) ;;
          127.*.*.* | 10.*.*.* | 192.168.*.*) ;;
          172.1[6-9].*.* | 172.2[0-9].*.* | 172.3[01].*.*) ;;
          *.*)
            echo "WARNING: S3_ENDPOINT (${S3_ENDPOINT}) is unencrypted and does not look like an in-cluster or private-network address — the backup artifact (a full database dump) will cross the network unencrypted. Use https:// for any off-cluster endpoint, or set backup.s3.allowPlaintext=true if this path is known-trusted."
            ;;
          *) ;; # no dot at all → bare short name → treat as in-cluster
        esac
      fi
      ;;
  esac
  MARKER="${OUTPUT_DIR}/.last-artifact"
  [ -f "$MARKER" ] || { echo "no .last-artifact marker — the dump step did not complete"; exit 1; }
  ART="$(cat "$MARKER")"
  [ -f "$ART" ] || { echo "artifact named by marker is missing: $ART"; exit 1; }
  KEY="$(basename "$ART")"
  if [ -n "${S3_PREFIX:-}" ]; then
    KEY="$(printf '%s' "$S3_PREFIX" | sed 's#^/*##; s#/*$##')/$KEY"
  fi
  if [ -n "${S3_ENDPOINT:-}" ]; then
    AWS_S3_ADDRESSING_STYLE=path
    export AWS_S3_ADDRESSING_STYLE
    set -- --endpoint-url "$S3_ENDPOINT"
  else
    set --
  fi
  echo "uploading to s3://${S3_BUCKET}/${KEY} ..."
  aws "$@" s3 cp "$ART" "s3://${S3_BUCKET}/${KEY}"
  echo "uploaded: s3://${S3_BUCKET}/${KEY}"
{{- end -}}

{{- if .Values.backup.enabled }}

{{/*
A backup with nowhere durable to write is worse than no backup: the `backups`
volume falls back to an emptyDir, the job dumps, exits 0, the artifact dies with
the pod, and the CronJob reports success forever (#3185). The only previous
guard was a comment in values.yaml, and a comment cannot fail a render.

Four destinations count, and they compose:
  persistence.enabled     a chart-managed PVC
  persistence.existingClaim  a claim the operator manages
  s3.enabled              an off-cluster bucket (the local copy is staging)
  extraVolumes            the operator's own volume — but ONLY when mediaDir is
                          set, because that is the sole condition under which
                          the template actually renders them
That last condition is why `extraVolumes` alone is not accepted here: without
mediaDir the entry is silently dropped and the emptyDir comes back.
*/}}
{{- $hasClaim := or .Values.backup.persistence.enabled .Values.backup.persistence.existingClaim -}}
{{- $hasOwnVolume := and .Values.backup.mediaDir .Values.backup.extraVolumes -}}
{{- if not (or $hasClaim .Values.backup.s3.enabled $hasOwnVolume) -}}
{{- fail "backup.enabled is true but no destination is configured, so the artifact would be written to an emptyDir and discarded when the Job pod exits — while the CronJob reports success. Set one of: backup.persistence.enabled=true (chart-managed PVC), backup.persistence.existingClaim (your own claim), backup.s3.enabled=true (off-cluster bucket), or backup.extraVolumes together with backup.mediaDir (your own volume; extraVolumes is ignored unless mediaDir is set)." -}}
{{- end }}

{{- if .Values.backup.persistence.enabled }}
{{- if not .Values.backup.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trueppm.fullname" . }}-backup
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - {{ .Values.backup.persistence.accessMode | quote }}
  {{- if .Values.backup.persistence.storageClass }}
  storageClassName: {{ .Values.backup.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size | quote }}
---
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "trueppm.fullname" . }}-backup
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  # Never overlap a slow backup with the next scheduled run — a second pg_dump
  # against the same database while the first is still streaming just doubles I/O
  # for no benefit.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # A backup either completes or it doesn't; retry a couple of times on a
      # transient DB blip, then surface the failure (it becomes a failed Job the
      # operator can alert on).
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "trueppm.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          volumes:
            # Scratch space for the dump/tar staging (readOnlyRootFilesystem is on).
            - name: tmp
              emptyDir: {}
            - name: backups
              {{- if .Values.backup.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.existingClaim | default (printf "%s-backup" (include "trueppm.fullname" .)) }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- if .Values.backup.mediaDir }}
            {{- with .Values.backup.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- if .Values.backup.s3.enabled }}
          # Two-phase: dump in an image that has pg_dump, upload in one that has
          # an S3 client. An initContainer (rather than a second container) so
          # the upload cannot start before the artifact exists.
          initContainers:
            - name: dump
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                {{- include "trueppm.backup.dumpEnv" . | nindent 16 }}
              command:
                {{- include "trueppm.backup.dumpCommand" . | nindent 16 }}
              volumeMounts:
                {{- include "trueppm.backup.volumeMounts" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          containers:
            - name: upload
              image: "{{ .Values.backup.s3.image.repository }}:{{ .Values.backup.s3.image.tag }}"
              imagePullPolicy: {{ .Values.backup.s3.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                {{- include "trueppm.backup.s3Env" . | nindent 16 }}
              command:
                {{- include "trueppm.backup.uploadCommand" . | nindent 16 }}
              volumeMounts:
                {{- include "trueppm.backup.volumeMounts" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          {{- else }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                {{- include "trueppm.backup.dumpEnv" . | nindent 16 }}
              command:
                {{- include "trueppm.backup.dumpCommand" . | nindent 16 }}
              volumeMounts:
                {{- include "trueppm.backup.volumeMounts" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          {{- end }}
{{- end }}
