apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trueppm.fullname" . }}-api
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trueppm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "trueppm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # The pods make no in-cluster Kubernetes API calls, so the default
      # ServiceAccount token is never needed and is left unmounted to shrink
      # the blast radius of a compromised container.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # admin-password is an emptyDir volume shared between the bootstrap init
        # container and the main api container.  The init container writes the
        # one-time admin password to /run/trueppm/admin_password (0o600) and the
        # volume keeps it accessible to the running pod so operators can retrieve
        # it with: kubectl exec <pod> -- cat /run/trueppm/admin_password
        - name: admin-password
          emptyDir: {}
        # readOnlyRootFilesystem is on, so every path the app writes to needs an
        # explicit writable mount:
        #   /tmp           — tempfile (MS Project parse, workspace export) and
        #                    Django's upload buffering for >2.5 MB request bodies
        #   /app/staticfiles — collectstatic target (StaticFilesStorage)
        - name: tmp
          emptyDir: {}
        - name: staticfiles
          emptyDir: {}
        # The attachment/media claim, when local attachment storage is in use.
        # Mounted on the init containers too: they import settings.prod, whose
        # boot guard now probes MEDIA_ROOT for writability (#3184), so an
        # unmounted migrate container would crash-loop the pod.
        {{- with (include "trueppm.mediaVolume" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.envFrom }}
          # Bulk-injected Secret/ConfigMap env (SECRET_KEY, ALLOWED_HOSTS,
          # INTEGRATION_ENCRYPTION_KEY, …). Required on the init containers too:
          # `migrate` imports settings.prod, whose import-time boot guards (#1002,
          # #775) crash-loop the pod before the api container ever starts.
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.envVars" . | nindent 12 }}
            {{- include "trueppm.connectionEnv" . | nindent 12 }}
            {{- include "trueppm.datastoreSecurityEnv" . | nindent 12 }}
            {{- include "trueppm.mediaEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "create_admin"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.envVars" . | nindent 12 }}
            {{- include "trueppm.connectionEnv" . | nindent 12 }}
            {{- include "trueppm.datastoreSecurityEnv" . | nindent 12 }}
            {{- include "trueppm.mediaEnv" . | nindent 12 }}
            - name: TRUEPPM_ADMIN_PASSWORD_FILE
              value: {{ .Values.admin.passwordFile | quote }}
            {{- if .Values.admin.email }}
            - name: DJANGO_SUPERUSER_EMAIL
              value: {{ .Values.admin.email | quote }}
            {{- end }}
          volumeMounts:
            - name: admin-password
              mountPath: /run/trueppm
            - name: tmp
              mountPath: /tmp
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
        # collectstatic populates the /app/staticfiles emptyDir the api container
        # serves through WhiteNoise (#3183). The image deliberately does NOT bake
        # the output — packages/api/Dockerfile:103 says it "writes here at
        # startup" — and the chart never ran it, so `/static/` 404'd on every Helm
        # install: unstyled Django admin (the surface web.adminAccess exists to
        # expose) and a blank Swagger UI. STATIC_ROOT must be set explicitly
        # because the default resolves to BASE_DIR, which is inside the read-only
        # venv when the app is pip-installed (settings/base.py:891-894). The
        # compose path has always done both (docker-compose.prod.yml:104,115).
        - name: collectstatic
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.envVars" . | nindent 12 }}
            {{- include "trueppm.connectionEnv" . | nindent 12 }}
            {{- include "trueppm.datastoreSecurityEnv" . | nindent 12 }}
            {{- include "trueppm.mediaEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: staticfiles
              mountPath: /app/staticfiles
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.appEnv" . | nindent 12 }}
            - name: TRUEPPM_ADMIN_PASSWORD_FILE
              value: {{ .Values.admin.passwordFile | quote }}
          volumeMounts:
            - name: admin-password
              mountPath: /run/trueppm
            - name: tmp
              mountPath: /tmp
            - name: staticfiles
              mountPath: /app/staticfiles
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          # Readiness points at /readyz (#1894, #2217) — a deep check that verifies
          # the database/cache dependencies are reachable AND that no migrations are
          # unapplied/in-flight for this image, so a pod is only added to the Service
          # once it can actually serve a schema its code agrees with. Liveness stays
          # on the shallow /health/ so a transient dependency blip can't restart-loop.
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.api.readinessPath | default "/api/v1/readyz" }}
              port: http
              {{- with include "trueppm.probeHostHeader" . }}
              # Without this, kubelet sends `Host: <podIP>:8000` and Django rejects
              # it against ALLOWED_HOSTS with a 400 before the view runs (#3183).
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.api.readinessInitialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.api.readinessPeriodSeconds | default 10 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.api.livenessPath | default "/api/v1/health/" }}
              port: http
              {{- with include "trueppm.probeHostHeader" . }}
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.api.livenessInitialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.probes.api.livenessPeriodSeconds | default 30 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
