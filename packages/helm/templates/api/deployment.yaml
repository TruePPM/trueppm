apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trueppm.fullname" . }}-api
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Omitted entirely when autoscaling is on (#3188). Setting `replicas` here
  # while an HPA owns the same field makes every `helm upgrade` reset the count
  # to this value; the HPA then scales it back up, so each release is a
  # scale-down flap. Verified before the fix: with autoscaling.enabled=true the
  # Deployment rendered `replicas: 1` against the HPA's minReplicas: 2.
  # Omitting the field lets Kubernetes keep whatever the HPA has set.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trueppm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "trueppm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # The pods make no in-cluster Kubernetes API calls, so the default
      # ServiceAccount token is never needed and is left unmounted to shrink
      # the blast radius of a compromised container.
      automountServiceAccountToken: false
      {{- include "trueppm.terminationGrace" (dict "root" $ "tier" "api") | nindent 6 }}
      {{- include "trueppm.podPlacement" (dict "root" $ "component" "api") | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # admin-password is an emptyDir volume shared between the bootstrap init
        # container and the main api container.  The init container writes the
        # one-time admin password to /run/trueppm/admin_password (0o600) and the
        # volume keeps it accessible to the running pod so operators can retrieve
        # it with: kubectl exec <pod> -- cat /run/trueppm/admin_password
        - name: admin-password
          emptyDir: {}
        # readOnlyRootFilesystem is on, so every path the app writes to needs an
        # explicit writable mount:
        #   /tmp           — tempfile (MS Project parse, workspace export) and
        #                    Django's upload buffering for >2.5 MB request bodies
        #   /app/staticfiles — collectstatic target (StaticFilesStorage)
        - name: tmp
          emptyDir: {}
        - name: staticfiles
          emptyDir: {}
        # The attachment/media claim, when local attachment storage is in use.
        # Mounted on the init containers too: they import settings.prod, whose
        # boot guard now probes MEDIA_ROOT for writability (#3184), so an
        # unmounted migrate container would crash-loop the pod.
        {{- with (include "trueppm.mediaVolume" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # migrate_locked, not migrate (#3188). This is a PER-POD init
          # container, not a pre-upgrade hook Job, so at replicaCount >= 2 every
          # pod runs it concurrently against one database — and Django has no
          # concurrency control of its own. migrate_locked serializes them
          # behind a PostgreSQL advisory lock; the losers block, and by the time
          # they acquire it their own migrate is a no-op.
          command: ["python", "manage.py", "migrate_locked"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.envFrom }}
          # Bulk-injected Secret/ConfigMap env (SECRET_KEY, ALLOWED_HOSTS,
          # INTEGRATION_ENCRYPTION_KEY, …). Required on the init containers too:
          # `migrate` imports settings.prod, whose import-time boot guards (#1002,
          # #775) crash-loop the pod before the api container ever starts.
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.envVars" . | nindent 12 }}
            {{- include "trueppm.connectionEnv" . | nindent 12 }}
            {{- include "trueppm.datastoreSecurityEnv" . | nindent 12 }}
            {{- include "trueppm.mediaEnv" . | nindent 12 }}
            {{- include "trueppm.demoReadOnlyEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "create_admin"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.envVars" . | nindent 12 }}
            {{- include "trueppm.connectionEnv" . | nindent 12 }}
            {{- include "trueppm.datastoreSecurityEnv" . | nindent 12 }}
            {{- include "trueppm.mediaEnv" . | nindent 12 }}
            {{- include "trueppm.demoReadOnlyEnv" . | nindent 12 }}
            - name: TRUEPPM_ADMIN_PASSWORD_FILE
              value: {{ .Values.admin.passwordFile | quote }}
            {{- if .Values.admin.email }}
            - name: DJANGO_SUPERUSER_EMAIL
              value: {{ .Values.admin.email | quote }}
            {{- end }}
          volumeMounts:
            - name: admin-password
              mountPath: /run/trueppm
            - name: tmp
              mountPath: /tmp
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
        # collectstatic populates the /app/staticfiles emptyDir the api container
        # serves through WhiteNoise (#3183). The image deliberately does NOT bake
        # the output — packages/api/Dockerfile:103 says it "writes here at
        # startup" — and the chart never ran it, so `/static/` 404'd on every Helm
        # install: unstyled Django admin (the surface web.adminAccess exists to
        # expose) and a blank Swagger UI. STATIC_ROOT must be set explicitly
        # because the default resolves to BASE_DIR, which is inside the read-only
        # venv when the app is pip-installed (settings/base.py:891-894). The
        # compose path has always done both (docker-compose.prod.yml:104,115).
        - name: collectstatic
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.envVars" . | nindent 12 }}
            {{- include "trueppm.connectionEnv" . | nindent 12 }}
            {{- include "trueppm.datastoreSecurityEnv" . | nindent 12 }}
            {{- include "trueppm.mediaEnv" . | nindent 12 }}
            {{- include "trueppm.demoReadOnlyEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: staticfiles
              mountPath: /app/staticfiles
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Explicit command, not a bare reliance on the image's CMD (#3833).
          # Every flag below must stay IDENTICAL to packages/api/Dockerfile's
          # `CMD ["uvicorn", "trueppm_api.asgi:application", "--host",
          # "0.0.0.0", "--port", "8000"]` except for the appended --workers —
          # this only ADDS a worker count, it must never change the bind
          # address or port out from under the readiness/liveness probes
          # above, which target containerPort 8000 by name.
          {{- $apiWorkers := int (.Values.api.workers | default 1) }}
          {{- if lt $apiWorkers 1 }}
            {{- fail (printf "api.workers must be >= 1, got %d — uvicorn requires at least one worker process (#3833)" $apiWorkers) }}
          {{- end }}
          command:
            - uvicorn
            - trueppm_api.asgi:application
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - {{ $apiWorkers | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "trueppm.appEnv" . | nindent 12 }}
            - name: TRUEPPM_ADMIN_PASSWORD_FILE
              value: {{ .Values.admin.passwordFile | quote }}
            {{- include "trueppm.demoGuards" . }}
            {{- if include "trueppm.demoReadOnly" . }}
            {{- with (.Values.demo.accessGate | default dict) }}
            {{- if .provider }}
            # The external identity gate an operator declares in front of this demo
            # host (#3969, ADR-1197 D8 resolution). A gate such as Cloudflare Access
            # takes a visitor's email address BEFORE any TruePPM code runs, so the app
            # cannot detect it and cannot disclose it unless it is told. This is that
            # telling — and it is an ASSERTION: nothing in the cluster verifies that
            # the gate is armed, and clearing it in the provider's dashboard leaves
            # this value untouched.
            #
            # Rendered only while the read-only fence is armed, which is exactly when
            # GET /api/v1/edition/ will surface it. trueppm.demoGuards fails the render
            # if the two ever disagree, so this can never be a dead control.
            - name: TRUEPPM_DEMO_ACCESS_GATE_PROVIDER
              value: {{ .provider | quote }}
            {{- if .privacyUrl }}
            - name: TRUEPPM_DEMO_ACCESS_GATE_PRIVACY_URL
              value: {{ .privacyUrl | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /*
              TRUEPPM_DEMO_READ_ONLY itself comes from trueppm.appEnv above
              (trueppm.demoReadOnlyEnv, #3925) — every container/initContainer
              that imports settings.prod needs it, not just this one, so it is
              rendered from one shared define rather than duplicated here. See
              that define's docstring in _helpers.tpl for why.
            */ -}}
            {{- if .Values.demo.interactive }}
            # TRUEPPM_DEMO_LOGIN_HINT is read: #3926 (merged) surfaces it as
            # `demo_login_hint` on the public GET /api/v1/edition/ response,
            # gated on demo_read_only being true (packages/api/src/trueppm_api/
            # urls.py). TRUEPPM_DEMO_RESET_SCHEDULE below is read the same way
            # (#4152): `demo_reset_schedule` on that same response, so the shell's
            # demo bar can state "resets daily at HH:MM UTC" from the value that
            # actually drives the CronJob.
            #
            # The displayed credential, assembled from demo.loginHint and from
            # nothing else. Never from $TRUEPPM_DEMO_PASSWORD: see trueppm.demoGuards.
            - name: TRUEPPM_DEMO_LOGIN_HINT
              value: {{ include "trueppm.demoLoginHint" . | quote }}
            # The reset cadence, so the demo bar can state it instead of hardcoding
            # a number that drifts from the CronJob the moment an operator retunes it
            # (ADR-1197 D9, #4152). Empty when demo.reset is off — the bar must then
            # say nothing about refreshes rather than imply a schedule that does not
            # run.
            - name: TRUEPPM_DEMO_RESET_SCHEDULE
              value: {{ (and .Values.demo.enabled .Values.demo.reset.enabled) | ternary (.Values.demo.reset.schedule | toString) "" | quote }}
            {{- /*
              ADR-1197 D6, throttle re-aim. Per-account throttles are the wrong
              axis for ONE identity every visitor shares: #1717's login_account
              control protects a SECRET, and this credential is published, so
              there is nothing left for it to protect. Re-aimed for CONCURRENCY,
              never for credential-stuffing resistance — the per-IP `login`
              scope and the `anon` scope (both untouched here) become the real
              limiters. The login-account rate yields to an operator's own
              env.TRUEPPM_* entry, same pattern as trueppm.mediaEnv. The user
              rate cannot: values.yaml's env block ships
              TRUEPPM_THROTTLE_USER_RATE as a chart default, so hasKey is always
              true and the demo value never rendered (#3998). In this mode
              demo.throttle.userRate owns the key outright, trueppm.envVars
              drops the generic entry, and demo.throttle.userRate is the knob.
            */ -}}
            {{- if not (hasKey .Values.env "TRUEPPM_THROTTLE_LOGIN_ACCOUNT_RATE") }}
            - name: TRUEPPM_THROTTLE_LOGIN_ACCOUNT_RATE
              value: {{ .Values.demo.throttle.loginAccountRate | quote }}
            {{- end }}
            - name: TRUEPPM_THROTTLE_USER_RATE
              value: {{ .Values.demo.throttle.userRate | quote }}
            {{- /*
              MAX_PERSONAL_ACCESS_TOKENS is per-account and therefore
              shared-fate too, but D2's ALLOWED_WRITES does not list any
              api-tokens create path, so token creation is refused before this
              cap is ever consulted — it is ACCEPTED at its default, not
              re-aimed, and rendered anyway so the decision is explicit rather
              than silently absent (ADR-1197 D6).
            */ -}}
            {{- if not (hasKey .Values.env "TRUEPPM_MAX_PERSONAL_ACCESS_TOKENS") }}
            - name: TRUEPPM_MAX_PERSONAL_ACCESS_TOKENS
              value: {{ .Values.demo.throttle.maxPersonalAccessTokens | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: admin-password
              mountPath: /run/trueppm
            - name: tmp
              mountPath: /tmp
            - name: staticfiles
              mountPath: /app/staticfiles
            {{- with (include "trueppm.mediaVolumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- include "trueppm.preStop" (dict "root" $ "tier" "api") | nindent 10 }}
          {{- if .Values.probes.api.startupEnabled }}
          # Governs the boot window instead of liveness (#3188). While a startup
          # probe is in play Kubernetes suspends liveness entirely, so a slow
          # first boot on a loaded node cannot restart-loop — and a genuinely
          # wedged process is still caught once this probe gives up.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.api.startupPath | default "/api/v1/health/" }}
              port: http
              {{- with include "trueppm.probeHostHeader" . }}
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            periodSeconds: {{ .Values.probes.api.startupPeriodSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.api.startupFailureThreshold | default 30 }}
          {{- end }}
          # Readiness points at /readyz (#1894, #2217) — a deep check that verifies
          # the database/cache dependencies are reachable AND that no migrations are
          # unapplied/in-flight for this image, so a pod is only added to the Service
          # once it can actually serve a schema its code agrees with. Liveness stays
          # on the shallow /health/ so a transient dependency blip can't restart-loop.
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.api.readinessPath | default "/api/v1/readyz" }}
              port: http
              {{- with include "trueppm.probeHostHeader" . }}
              # Without this, kubelet sends `Host: <podIP>:8000` and Django rejects
              # it against ALLOWED_HOSTS with a 400 before the view runs (#3183).
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.api.readinessInitialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.api.readinessPeriodSeconds | default 10 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.api.livenessPath | default "/api/v1/health/" }}
              port: http
              {{- with include "trueppm.probeHostHeader" . }}
              httpHeaders:
                - name: Host
                  value: {{ . | quote }}
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.api.livenessInitialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.probes.api.livenessPeriodSeconds | default 30 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
