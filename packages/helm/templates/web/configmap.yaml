{{- if .Values.web.enabled }}
{{/*
Chart-managed nginx server config for the web (SPA) pod.

The web image bakes packages/web/nginx.conf, which reverse-proxies /api, /ws,
/admin and /static to the upstream host `api` — the correct name under
docker-compose, where the backend service is literally `api`. In Kubernetes the
API Service is release-scoped (`{{ include "trueppm.fullname" . }}-api`), so the
baked `api` never resolves. nginx resolves a literal upstream host at *startup*,
so the web pod crash-loops with `host not found in upstream "api"` before it can
serve a single request — the chart could never boot web (caught by the #2279
deploy smoke test).

The upstream host is therefore release-dependent and belongs in the chart, not
baked into a static image. This ConfigMap renders the same server block with the
correct Service DNS name and is mounted over /etc/nginx/conf.d/default.conf in the
web Deployment, so it works against any pre-built (released) web image.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trueppm.fullname" . }}-web-nginx
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
{{- if .Values.demo.interactive }}
{{/*
  INTERACTIVE DEMO server block (ADR-1197, #3925 MR 2) — a METHOD FENCE, not a
  route list.

  This is the third and newest of this ConfigMap's server blocks, deliberately
  its OWN block rather than a patch onto either of the other two — same
  reasoning the share-link block below draws from D7a, with more force here:
  the difference that matters is which routes exist, and a patch-style diff
  makes it far too easy to reintroduce a blanket proxy later.

  ADR-1197 D1 as originally written reused D7a's narrow route allowlist.
  Amended 2026-09-20: a demo that tours the FULL app (schedule, board,
  resources, reports, programs) reads from essentially every GET under
  /api/v1/, so an allowlist wide enough for that IS a proxy of /api/ with a
  method restriction — there is no narrower route list left to write. So this
  block is a METHOD FENCE instead: `limit_except GET HEAD OPTIONS` denies every
  unsafe method under /api/, with three exact-match carve-outs for the paths
  DemoReadOnlyMiddleware itself allows (sign-in, token refresh, sign-out) —
  mirroring D2 at the edge rather than replacing it. D2, not this block, is the
  real control; this is defense in depth so a refused request never has to
  reach Django to be refused.

  /admin/ stays 404 here too (belt-and-braces over #3557's application-level
  default, DJANGO_ADMIN_ENABLED=false). /ws/ is CLOSED: in a read-only
  instance the only broadcasts are the scheduled reset's, so the socket
  carries nothing a visitor would see — real-time collaboration needs
  mutually-isolated writable sessions, which is #1672.

  The CSP is the share-link block's, unchanged: `connect-src 'self'` with no
  ws:/wss:, correct here for the same reason — this mode opens no live
  WebSocket subscription either, even though the socket endpoint itself is
  reachable-but-404 rather than proxied away.
*/}}
  default.conf: |
    server {
        listen {{ .Values.web.containerPort | default 8080 }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Keep the public demo out of every search index.
        add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
        # Literals, not web.securityHeaders knobs — same reasoning as the
        # share-link block: this is a public host under our own DNS (a login
        # page until a visitor signs in) and an operator has no legitimate
        # reason to relax these.
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

        # No writable media path in this mode (D2 already refuses the upload;
        # see _helpers.tpl's trueppm.demoGuards for the render-time assertion
        # that persistence.media stays off) and no import surface either.
        client_max_body_size 1M;

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Unlike the share-link block below, `/` is NOT redirected here — this
        # mode's whole point is a visitor who lands on the login page and signs
        # in, so the SPA fallback serves it directly.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Method fence ─────────────────────────────────────────────────────
        # Ordering note: an exact `=` match outranks the plain `/api/` prefix
        # below regardless of file order, so these three reach Django on ANY
        # method unconditionally — they must, since login and refresh ARE the
        # POSTs D2 allows — while everything else under /api/ is bounded by
        # limit_except.
        location = /api/v1/auth/token/ {
            proxy_pass         http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /api/v1/auth/token/refresh/ {
            proxy_pass         http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /api/v1/auth/logout/ {
            proxy_pass         http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Everything else under /api/: GET/HEAD/OPTIONS pass through — this is
        # essentially the whole app's read surface, including
        # GET /api/v1/edition/, which #3926 reads for the login page's runtime
        # mode signal and needs no special case here because it is already a
        # GET. Any other method is refused by nginx itself, before the request
        # ever reaches Django or DemoReadOnlyMiddleware.
        location /api/ {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            # The fence's 403 is answered with the SAME JSON body
            # DemoReadOnlyMiddleware emits, not nginx's stock HTML page: the web
            # app recognizes a demo refusal only by status AND body code
            # (packages/web/src/lib/demoReadOnly.ts). No `=`: the status stays 403.
            # Upstream 403s are unaffected (proxy_intercept_errors is off).
            error_page 403 @demo_read_only;
            proxy_pass         http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Named locations are internal by construction: a client request can
        # never select this one directly. The body is static — nothing from the
        # request is reflected into it. Keep `detail` equal to
        # DEMO_READ_ONLY_DETAIL in core/demo_read_only.py (a pytest pins it).
        location @demo_read_only {
            default_type application/json;
            return 403 '{"detail": "This is a read-only demo. Your change was not saved. Nothing in this deployment can be modified.", "code": "demo_read_only"}';
        }

        # No live-collaboration WebSocket (D1): the only broadcasts in a
        # read-only instance are the scheduled reset's, which a visitor should
        # not see mid-tour.
        location /ws/ {
            return 404;
        }

        # Django admin is not published. Reach it with kubectl port-forward.
        location /admin/ {
            return 404;
        }

        location /static/ {
            proxy_pass       http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header Host $host;
        }
    }
{{- else if .Values.demo.enabled }}
{{/*
  DEMO server block (#2440, ADR-0658) — an ALLOWLIST, not the production proxy.

  This mirrors nginx/demo.conf.template (#1487, hardened #1763), which is the
  vetted posture for a public demo, with the upstream swapped for the
  release-scoped Service DNS name. It is a SEPARATE block rather than the
  production one plus a couple of headers, because the difference that matters is
  which routes exist at all.

  The demo's whole security model is "zero reachable authenticated surface". The
  production block below blanket-proxies /api/, /ws/ and /admin/ — correct there,
  because production is auth-gated with real accounts, and catastrophic here: it
  would publish auth/token, every project viewset, the Admin-only share-link
  management routes, workspace SSO and the OpenAPI schema to the internet, plus
  the Django admin login for the superuser that the api Deployment's `bootstrap`
  initContainer creates on every deploy.

  So the public surface is exactly: the two anonymous, read-only, GET-only,
  throttled share projections (projects/share_views.py) and the liveness probe.
  Everything else under /api/ returns 404, /ws/ returns 404 (the read-only share
  pages open no live subscription), and /admin/ returns 404.

  /admin/ differs deliberately from the compose template, which uses
  `allow 127.0.0.1; deny all;`. Behind an ingress the client IP is the ingress
  pod, not the operator, so a loopback allowlist would be either useless or
  accidentally permissive depending on proxy config. A flat 404 is unambiguous;
  the in-cluster equivalent of compose's SSH tunnel is:
      kubectl port-forward svc/<release>-trueppm-api 8000:8000
*/}}
  default.conf: |
    server {
        listen {{ .Values.web.containerPort | default 8080 }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Keep the public demo out of every search index.
        add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
        # Non-negotiable on the demo, so these are literals rather than
        # web.securityHeaders knobs: the demo is a public, unauthenticated host
        # under our own DNS, and an operator has no legitimate reason to relax
        # its headers. The CSP is nginx/demo.conf.template's, which differs from
        # production in one way — `connect-src 'self'` with no ws:/wss:, because
        # the read-only share pages open no live-collaboration socket (#2849).
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # #3553 — see packages/web/nginx.conf. A literal here for the same reason
        # as the two above: the demo is public and an operator has no legitimate
        # reason to widen it.
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

        # Read-only demo: no large upload is ever legitimate. Deliberately
        # ignores web.maxBodySize — the production branch raises that ceiling to
        # clear the import caps (#2604), and the demo has nothing to import.
        client_max_body_size 1M;

        # Belt-and-braces alongside X-Robots-Tag. Exact match outranks the SPA
        # fallback, so a crawler gets a real robots.txt rather than index.html.
        #
        # `default_type`, NOT `add_header Content-Type`: nginx's add_header is
        # replace-not-append across levels, so ANY add_header inside a location
        # discards every server-level one — this block would have served the
        # only non-SPA document on the host with no X-Robots-Tag, no framing
        # protection, and no CSP (#2849). default_type sets the content type
        # without touching the header set.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # The bare origin has nothing to show: the demo has no accounts, so the SPA's
        # login form at `/` can never succeed, and the only usable entry points are
        # the share URLs (#3911). Send a visitor who types the domain to the schedule
        # link. 302, not 301, so rotating the pinned token is never fought by a
        # browser's cached redirect. The target is the operator's own demo.baseUrl
        # (absolute, so the scheme stays https behind a TLS-terminating tunnel that
        # hands nginx plain http) plus a token that is already public — nothing new
        # is disclosed.
        #
        # No add_header in here, for the reason robots.txt spells out above: it
        # would discard the server-level security headers for this response.
        location = / {
            return 302 {{ trimSuffix "/" .Values.demo.baseUrl }}/share/schedule/{{ .Values.demo.shareToken.schedule }};
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API allowlist ────────────────────────────────────────────────────
        # Ordering note: `^~` (prefix, skips regex) and `=` (exact) both outrank
        # the plain `/api/` prefix below and are longer matches besides, so the
        # allowed routes win and the catch-all only sees the denied remainder.

        # The ONLY public data plane: anonymous, read-only, throttled, GET-only
        # share projections. Self-contained — the share pages fetch nothing else.
        location ^~ /api/v1/share/ {
            proxy_pass         http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Liveness probe (AllowAny), kept reachable for an upstream LB/ingress
        # check. Exact match so it cannot widen the surface.
        location = /api/v1/health/ {
            access_log off;
            proxy_pass       http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else under /api/ is intentionally absent from the demo.
        location /api/ {
            return 404;
        }

        # No live-collaboration WebSocket: no accounts, no writes, and the share
        # pages open no subscription.
        location /ws/ {
            return 404;
        }

        # Django admin is not published. Reach it with kubectl port-forward.
        location /admin/ {
            return 404;
        }

        location /static/ {
            proxy_pass       http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header Host $host;
        }
    }
{{- else }}
  default.conf: |
    {{- if and .Values.web.adminAccess.enabled .Values.web.adminAccess.rateLimit.enabled }}
    # Per-source-IP rate limit for the Django admin login surface (#2569),
    # matching nginx/app.conf.template's 5r/m + burst 2. Declared here at http
    # scope because this file is included from nginx.conf's `http` block —
    # limit_req_zone is not valid inside `server`. Django admin is a plain
    # Django view, so no DRF throttle scope covers it and there is no lockout
    # backend; this is the only rate limit that surface has.
    limit_req_zone $binary_remote_addr zone=admin_login:1m rate={{ .Values.web.adminAccess.rateLimit.rate }};
    {{- end }}
    server {
        listen {{ .Values.web.containerPort | default 8080 }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # nginx appends a missing trailing slash during location matching, i.e.
        # BEFORE the access phase — so a denied client hitting /admin still gets
        # a 301 that both confirms the proxy exists and, because the default
        # redirect is built from $server_port, leaks the internal container port
        # and downgrades the scheme behind a TLS-terminating ingress.
        absolute_redirect off;

        {{- if .Values.web.securityHeaders.enabled }}

        # Security response headers (#2849). Django's XFrameOptions /
        # SECURE_CONTENT_TYPE_NOSNIFF / CSP middleware only decorate responses
        # DJANGO produces; index.html and every JS bundle come off disk here and
        # never reach Django. Before 0.4 this branch set NONE of these while both
        # compose templates set four — so the recommended production path served
        # the document running the whole application unframed-protected and with
        # no CSP. Values are knobs (web.securityHeaders.*) because operators
        # front this with their own ingress/WAF and a CSP that breaks the app is
        # worse than no CSP; `always` so they survive 4xx/5xx responses too.
        {{- with .Values.web.securityHeaders.frameOptions }}
        add_header X-Frame-Options        "{{ . }}" always;
        {{- end }}
        {{- with .Values.web.securityHeaders.contentTypeOptions }}
        add_header X-Content-Type-Options "{{ . }}" always;
        {{- end }}
        {{- with .Values.web.securityHeaders.referrerPolicy }}
        # #3553. Unlike strictTransportSecurity below, this one has a non-empty
        # default: it is safe on a plain-HTTP tier, no ingress controller sets it
        # by default, and the browser default varies by vendor and version.
        add_header Referrer-Policy        "{{ . }}" always;
        {{- end }}
        {{- with .Values.web.securityHeaders.contentSecurityPolicy }}
        add_header Content-Security-Policy "{{ . | trim | replace "\n" " " }}" always;
        {{- end }}
        {{- with .Values.web.securityHeaders.strictTransportSecurity }}
        add_header Strict-Transport-Security "{{ . }}" always;
        {{- end }}
        {{- end }}

        # Transport upload ceiling (#2604). nginx defaults to 1m, which is under
        # every application cap (MS Project 50 / Jira 25 / CSV 10 MB) — so an
        # operator routing uploads through this tier got a bare 413 at the proxy
        # and the app never saw the request. Keep this >= the largest cap: the
        # application's own limit should be what rejects an oversized file,
        # because it names the limit in the error.
        client_max_body_size {{ .Values.web.maxBodySize | default "110M" }};

        # Proxy API calls to the Django backend (release-scoped Service DNS).
        location /api/ {
            proxy_pass http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_redirect off;
        }

        # WebSocket (Django Channels)
        location /ws/ {
            proxy_pass         http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }

        # Django admin — fails CLOSED (#2569). With the default empty
        # web.adminAccess.allowCIDRs this renders a bare `deny all`, so a
        # default install publishes no admin login surface at all. The
        # in-cluster equivalent of compose's SSH tunnel needs no chart change
        # and bypasses nginx entirely:
        #   kubectl port-forward svc/{{ include "trueppm.fullname" . }}-api {{ .Values.service.port }}:{{ .Values.service.port }}
        # then visit http://localhost:{{ .Values.service.port }}/admin/
        location /admin/ {
        {{- if .Values.web.adminAccess.enabled }}
            # Ordering is load-bearing: nginx takes the FIRST matching
            # allow/deny rule, so every allow must precede the `deny all`.
            {{- range .Values.web.adminAccess.allowCIDRs }}
            {{- /* Entries must look like an address or CIDR. This exists to
                   reject the allowlist-shaped `all`, which nginx accepts as a
                   valid `allow all;` and which would silently turn this control
                   off while still reading like a restriction. A malformed CIDR
                   is also caught here rather than crash-looping nginx. */}}
            {{- if not (regexMatch "^[0-9a-fA-F:.]+(/[0-9]{1,3})?$" (toString .)) }}
              {{- fail (printf "web.adminAccess.allowCIDRs entry %q is not an IP address or CIDR — note that 'all' would render `allow all;` and disable the restriction entirely (#2569)" .) }}
            {{- end }}
            allow {{ . }};
            {{- end }}
            deny all;
            {{- if .Values.web.adminAccess.rateLimit.enabled }}
            limit_req zone=admin_login burst={{ .Values.web.adminAccess.rateLimit.burst }} nodelay;
            {{- end }}

            proxy_pass http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        {{- else }}
            return 404;
        {{- end }}
        }

        # Django static files (admin CSS/JS, collectstatic output).
        location /static/ {
            proxy_pass http://{{ include "trueppm.fullname" . }}-api:{{ .Values.service.port }};
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # SPA fallback — all unmatched routes serve index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
{{- end }}
