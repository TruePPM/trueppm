{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trueppm.fullname" . }}-web
  labels:
    {{- include "trueppm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  # Sprig's `default` treats 0 as unset too, which clobbered an explicit
  # `replicas.web: 0` (scale the web tier to zero) back up to replicaCount
  # (#4351). replicas.web's unset sentinel is specifically the empty string
  # "" (see values.yaml) — never nil, since the schema also allows null — so
  # the presence check below distinguishes "not set, follow replicaCount"
  # from "set to a real integer, including 0" by kind/emptiness rather than
  # by truthiness. Its predecessor (web.replicaCount, renamed by ADR-1248)
  # shipped as 1 — truthy — so the fallback could never fire and the tier
  # every user actually loads was a singleton under values-prod.yaml's
  # replicaCount: 2 (#3188).
  {{- $webReplicas := .Values.replicas.web }}
  {{- if or (kindIs "invalid" $webReplicas) (and (kindIs "string" $webReplicas) (eq $webReplicas "")) }}
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  replicas: {{ $webReplicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trueppm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      # nginx reads default.conf once at start, and the subPath mount below never
      # receives ConfigMap updates in a running pod. Without this hash a config-only
      # upgrade (demo.interactive, demo.baseUrl, a share token, the allowlist) leaves
      # the pod spec unchanged, so the pod is never rolled and keeps serving the
      # previous config indefinitely.
      annotations:
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/web/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "trueppm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      {{- include "trueppm.terminationGrace" (dict "root" $ "tier" "web") | nindent 6 }}
      {{- include "trueppm.podPlacement" (dict "root" $ "component" "web") | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # The web image is a static nginx build of the SPA. With
        # readOnlyRootFilesystem on, nginx needs writable scratch paths for its
        # PID file, temp bodies, and cache — all ephemeral, so emptyDir suffices.
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        # Chart-rendered nginx server config, mounted over the image's baked
        # default.conf so the reverse-proxy upstream points at the release-scoped
        # API Service (`<fullname>-api`) instead of the docker-compose-only `api`.
        - name: nginx-conf
          configMap:
            name: {{ include "trueppm.fullname" . }}-web-nginx
      containers:
        - name: web
          image: "{{ .Values.image.webRepository }}:{{ include "trueppm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              # `| default 8080` is reasoned safe (#4351 sweep): 0 is not a valid
              # container port, so there is no legitimate explicit value for it
              # to clobber.
              containerPort: {{ .Values.web.containerPort | default 8080 }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            # A `kindIs "invalid"` presence guard replaces `| default 5` on
            # initialDelaySeconds (#4351): 0 is a valid, legitimate Kubernetes
            # setting (probe immediately), so plain `| default` would have
            # clobbered it. Bare dot-access after dropping `| default` would
            # reopen a different hole: the chart's documented null-to-delete
            # override idiom (docs/administration/openshift.md) deletes a key
            # set to `null` from the merged map, and an empty
            # initialDelaySeconds likely fails admission. periodSeconds keeps
            # its `| default` — the Kubernetes API requires it >= 1, so 0 is
            # invalid regardless and there is no null-to-delete hole to worry
            # about.
            {{- $webReadinessInitialDelay := 5 }}
            {{- if not (kindIs "invalid" .Values.probes.web.readinessInitialDelaySeconds) }}
            {{- $webReadinessInitialDelay = .Values.probes.web.readinessInitialDelaySeconds }}
            {{- end }}
            initialDelaySeconds: {{ $webReadinessInitialDelay }}
            periodSeconds: {{ .Values.probes.web.readinessPeriodSeconds | default 10 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            # See the readiness probe above for why initialDelaySeconds uses a
            # presence guard instead of `| default` while periodSeconds keeps
            # one (#4351).
            {{- $webLivenessInitialDelay := 10 }}
            {{- if not (kindIs "invalid" .Values.probes.web.livenessInitialDelaySeconds) }}
            {{- $webLivenessInitialDelay = .Values.probes.web.livenessInitialDelaySeconds }}
            {{- end }}
            initialDelaySeconds: {{ $webLivenessInitialDelay }}
            periodSeconds: {{ .Values.probes.web.livenessPeriodSeconds | default 30 }}
          {{- include "trueppm.preStop" (dict "root" $ "tier" "web") | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
{{- end }}
