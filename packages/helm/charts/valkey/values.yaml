# Values for the vendored dev/demo Valkey subchart.
# The parent chart's `valkey:` block maps onto these keys; the parent's
# `condition: valkey.enabled` gates whether this subchart renders at all.
image:
  repository: valkey/valkey
  tag: "8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2"
  pullPolicy: IfNotPresent

auth:
  # When true, the server requires `--requirepass` and REDIS_URL must include
  # the password. Default ON (the parent chart sources the password from its
  # connection Secret; see global.trueppm in the parent values.yaml). The
  # `password` here is only used for standalone subchart rendering — under the
  # parent it is ignored in favor of the shared connection Secret.
  enabled: true
  password: ""

persistence:
  size: 2Gi
  storageClass: ""

# Memory ceiling and eviction policy (#3188). Neither was set, so Valkey grew
# until the container hit its 1Gi limit and was OOMKilled — and because /readyz
# gates on cache reachability, that is a full API outage, not a cache miss.
#
# `noeviction` is REQUIRED, not a preference (see /administration/observability/):
# this instance is the Celery BROKER and the Channels layer, not only a cache.
# Under `allkeys-lru` a memory-pressure event silently discards queued tasks and
# in-flight WebSocket group state — data loss that looks like nothing at all.
# With `noeviction` the write fails loudly instead, which is recoverable.
#
# maxmemory is set BELOW the container limit on purpose: Valkey accounts for its
# own dataset, not for copy-on-write during AOF rewrite or for allocator
# overhead, so a maxmemory equal to the limit still OOMKills. ~75% of
# resources.limits.memory is the usual headroom. Keep the two in step if you
# raise either.
maxmemory: 768mb
maxmemoryPolicy: noeviction

# Eviction posture for the bundled cache/broker (#3934, structural sibling of
# postgresql's — see charts/postgresql/values.yaml). A StatefulSet of one with
# no PDB and no priority is the first thing a node drain evicts and the last
# thing rescheduling brings back — and this pod is load-bearing for FOUR
# subsystems at once (Django Channels real-time layer, Celery broker, Django
# cache backend, and notification throttles), so its loss degrades real-time,
# async, and caching together.
#
# The PDB is maxUnavailable: 0, unlike the app tiers' maxUnavailable: 1. On a
# single-replica stateful workload that is the point: it does not make Valkey
# highly available (nothing here can, see #3404 for that), it makes a drain
# BLOCK and surface as a stuck drain the operator can see and act on, rather
# than a silent outage. `kubectl drain --disable-eviction` or deleting the PDB
# is the deliberate override. Turn it off if you would rather drains never
# block.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 0

# Set to a PriorityClass you have created (the subchart creates none — a chart
# that mints a cluster-scoped PriorityClass steps on the cluster's own priority
# budget). system-cluster-critical exists on every cluster but is generally
# reserved for control-plane components; prefer your own class.
priorityClassName: ""

# Seconds Valkey gets to finish its AOF rewrite/fsync and shut down cleanly. The
# 30s Kubernetes default can still cut a large AOF flush short and force a
# slower AOF-log replay on next start.
terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    # AOF lives on the PVC; ephemeral covers /tmp scratch only.
    ephemeral-storage: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 512Mi
