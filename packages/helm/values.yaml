replicaCount: 1

# Global values propagate to the bundled postgresql / valkey subcharts. The
# presence of this block tells those subcharts they are running under the parent
# TruePPM chart, so they should source their password from the parent's
# connection Secret (the single credential source of truth) rather than minting
# their own. Leave connectionSecretName empty to use the default name derived
# from the release name; override only if you renamed the connection Secret.
global:
  trueppm:
    connectionSecretName: ""

image:
  repository: registry.gitlab.com/trueppm/trueppm/api
  # Web tier image: an nginx build of the compiled React SPA (#1896). Shares the
  # tag and pullPolicy below with the API so a release deploys a matching pair.
  webRepository: registry.gitlab.com/trueppm/trueppm/web
  # Empty by default so the chart pins itself to its own appVersion
  # (reproducible rollbacks). Empty resolves to `v<appVersion>` — the v-prefixed
  # form is the only tag the release pipeline pushes to this registry, so a bare
  # version would never pull (#2811). Override per-deploy with a concrete tag.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

# Web tier (#1896) — the nginx-served React SPA. On by default so a stock
# `helm install` renders a complete, browsable instance (there was no web tier
# before 0.4). Disable it if you front the SPA from your own CDN / static host and
# only want the API + workers from this chart.
web:
  enabled: true
  # Independent replica count. EMPTY means "follow the top-level replicaCount",
  # which is what the fallback in the template was always documented to do and
  # never did: this shipped as `1`, and Helm's `default` treats any truthy value
  # as set, so the fallback could not fire. Under values-prod.yaml's
  # replicaCount: 2 the render was api=2, worker=2, web=1 — the only tier a user
  # actually loads was the unprotected singleton (#3188). Set a number here only
  # to scale the web tier independently of the rest.
  replicaCount: ""
  # Port nginx listens on inside the container. The stock unprivileged nginx SPA
  # image serves on 8080 as a non-root user, which satisfies the restricted
  # podSecurityContext (runAsNonRoot).
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  # Django admin exposure through the web tier's nginx (#2569).
  #
  # Django admin is a plain Django view, so NONE of the DRF `login` throttle
  # scopes apply to it, there is no lockout backend in the dependency set, and
  # the api Deployment's `bootstrap` initContainer guarantees a valid superuser
  # exists to guess against. Proxying it unrestricted — as this chart did before
  # 0.4 — turns a default ingress-enabled install into an unthrottled, publicly
  # reachable credential-guessing surface against a known-present privileged
  # account. So the block below fails CLOSED: with the default empty allowlist
  # nginx renders a bare `deny all`, and admin is reached out-of-band with
  #   kubectl port-forward svc/<release>-trueppm-api 8000:8000
  # which bypasses the web tier entirely and needs no chart change.
  #
  # SCOPE: this is an nginx control, so it only binds while the web tier is
  # deployed. With web.enabled=false the Ingress routes / straight to the API
  # Service and Django serves /admin/ there unrestricted — restrict it at your
  # own edge in that topology. Same caveat for any ingress path pointing at
  # `service: api`, or a non-ClusterIP service.type.
  adminAccess:
    # false renders `return 404` instead of the proxy — the demo posture, for
    # operators who never want the path to exist on the public listener.
    enabled: true
    # Source CIDRs allowed to reach /admin/. EMPTY MEANS DENY EVERYTHING.
    #
    # nginx matches these against $remote_addr, which behind an Ingress is the
    # INGRESS CONTROLLER's pod IP, not the operator's address — so an allowlist
    # is only meaningful when the web tier sees real client addresses (hostPort,
    # a LoadBalancer with externalTrafficPolicy: Local, or an ingress configured
    # to preserve the source IP). If in doubt leave this empty and port-forward.
    allowCIDRs: []
    # Per-source-IP rate limit on the admin login surface, matching the
    # docker-compose sibling (nginx/app.conf.template): 5 requests/minute with a
    # burst of 2. Defense in depth behind the allowlist — an allowlisted subnet
    # is still not a reason to permit unbounded password guessing.
    rateLimit:
      enabled: true
      rate: 5r/m
      burst: 2
  # nginx `client_max_body_size` for the web tier (#2604).
  #
  # In the DEFAULT topology this is inert: the Ingress routes /api and /ws
  # straight to the API Service, so uploads never traverse this nginx and
  # `ingress.annotations` proxy-body-size is the binding constraint. It matters
  # when an operator routes everything through the web tier instead (a single
  # `service: web` path, or a LoadBalancer in front of the web Service) — a
  # topology that previously had no knob at all and inherited nginx's 1m default.
  #
  # Set >= the largest application upload cap, same rule as the ingress
  # annotation. The demo overlay deliberately ignores this and pins 1M: a
  # read-only demo has no legitimate large upload.
  maxBodySize: 50M
  # Security response headers on everything the web tier serves (#2849).
  #
  # These are NOT redundant with Django's XFrameOptionsMiddleware,
  # SECURE_CONTENT_TYPE_NOSNIFF, or core.csp.ContentSecurityPolicyMiddleware.
  # Django only decorates responses DJANGO produces — the API. index.html and
  # every JS bundle are served straight off disk by this nginx and never reach
  # Django, so without the directives below the document that runs the entire
  # application carries no framing, MIME-sniff, or CSP protection at all. That
  # was the state of this chart before 0.4 while BOTH compose paths set four
  # headers — and Helm is the path the docs recommend for production.
  #
  # Every value is a knob rather than a hardcoded string because operators
  # front this tier with their own ingress, WAF, or CDN: a CSP that breaks the
  # app is worse than no CSP, and an operator who cannot loosen it will delete
  # the whole block. Set a value to "" to omit that header entirely.
  #
  # Parity with the compose templates (nginx/app.conf.template) is asserted by
  # scripts/check-nginx-security-headers.sh — change a default here and the
  # gate will tell you which sibling path drifted.
  securityHeaders:
    # false omits every header below. Only reasonable when a trusted upstream
    # (ingress-nginx `configuration-snippet`, a WAF, a CDN edge) sets the same
    # set — nginx cannot merge headers, so duplicates are the usual reason.
    enabled: true
    # Clickjacking: the SPA is never legitimately framed. DENY, not SAMEORIGIN.
    frameOptions: DENY
    # Stops a browser from re-typing a response as a script.
    contentTypeOptions: nosniff
    # Matches nginx/app.conf.template verbatim. `connect-src` includes ws:/wss:
    # for the Channels real-time collaboration socket; `style-src` needs
    # 'unsafe-inline' while the build still emits inline critical CSS. Widen
    # this if you host fonts/images off-origin or add an analytics endpoint.
    contentSecurityPolicy: >-
      default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self';
      frame-ancestors 'none'
    # HSTS. EMPTY BY DEFAULT, unlike the compose TLS template — and deliberately.
    # In the chart's default topology TLS terminates at the Ingress and this
    # nginx speaks plain HTTP, so the header would be set by a tier that has no
    # way to know whether the edge is actually HTTPS; most ingress controllers
    # (ingress-nginx included) already emit HSTS themselves, and nginx cannot
    # deduplicate a header the upstream also set. Turn it on only when this tier
    # IS the TLS edge, and note that includeSubDomains binds every sibling
    # subdomain of the apex you serve from:
    #   strictTransportSecurity: "max-age=63072000; includeSubDomains"
    strictTransportSecurity: ""

# Chart-managed Ingress + edge TLS (#1714). Off by default: the ingress class,
# hostnames, and certificate source are cluster-specific, so a default-on ingress
# would render a broken object on first install. Enable it and fill hosts/tls to
# expose the API over HTTPS. The Service stays ClusterIP; the Ingress is the sole
# externally-facing object and the TLS termination point.
ingress:
  enabled: false
  # IngressClass to bind (e.g. "nginx", "traefik"). Empty uses the cluster's
  # default IngressClass, if one is marked default.
  className: ""
  # Controller / cert-manager annotations. Example for cert-manager:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #
  # proxy-body-size (#2604): the transport limit must be >= the largest
  # application upload cap, or the import fails at the edge with a bare 413 and
  # the app never sees the request. 50m matches MSPROJECT_MAX_UPLOAD_MB, the
  # largest of the four caps (MS Project 50 / Jira 25 / CSV 10 / seed 5). Without
  # it, ingress-nginx applies its own 1m default and **every import above 1 MB
  # fails on a default install** — which is how this shipped before 0.4.
  #
  # The app cap, not this one, is what should reject an oversized file: it
  # returns a validation error naming the limit, where the edge returns an
  # unexplained 413. Raise this to stay ahead of the app; do not use it as the
  # enforcement point.
  #
  # This annotation is ingress-nginx-specific. On Traefik use a
  # `buffering` middleware (`maxRequestBodyBytes`); on HAProxy set
  # `haproxy.org/client-body-buffer-size`. Helm deep-merges this map, so adding
  # your own keys keeps this one unless you override it by name.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  # One or more virtual hosts. Each path routes to either the web SPA or the API,
  # selected by its `service:` key (`web` or `api`, default `api`). The default
  # below sends /api and /ws to the Django API Service and everything else (/) to
  # the nginx web tier. List the API prefixes BEFORE / so they win the
  # longest-prefix match on controllers that honor path order. pathType defaults to
  # Prefix when omitted. When web.enabled is false, a `service: web` path falls
  # back to the API Service automatically.
  hosts:
    - host: trueppm.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  # TLS termination. Each entry names a Kubernetes TLS Secret and the host(s) it
  # covers. With cert-manager the named Secret is provisioned automatically from
  # the issuer annotation above. LEAVE EMPTY only for a dev/demo cluster — an
  # empty list renders an HTTP-only Ingress, which must never front production.
  tls: []
  #  - secretName: trueppm-tls
  #    hosts:
  #      - trueppm.example.com

postgresql:
  enabled: true
  auth:
    username: trueppm
    # Leave password empty to have the chart generate a strong random password
    # (randAlphaNum 32) on first install and persist it in the chart-owned
    # connection Secret (helm.sh/resource-policy: keep), so re-renders never
    # churn it. Set an explicit value only if you must control the credential;
    # in that case the chart honors it verbatim.
    password: ""
    database: trueppm

valkey:
  # Valkey (BSD-licensed Redis fork, wire-compatible). NOTE: this bundled Valkey
  # pod is SINGLE-NODE — no replication, no failover. It is load-bearing for
  # FOUR subsystems at once (Django Channels real-time layer, Celery broker,
  # Django cache backend, and notification throttles), so its loss degrades
  # real-time, async, and caching together. For production on-prem, an HA
  # topology is effectively mandatory: set `enabled: false` and either point
  # `env.REDIS_URL` at a replicated endpoint that survives failover (e.g. AWS
  # ElastiCache for Valkey, GCP Memorystore for Valkey), or configure
  # `valkey.sentinel` below.
  #
  # Supported HA topologies (ADR-0716): a replicated primary behind ONE stable
  # endpoint (managed service, Service, or VIP), or Sentinel (EXPERIMENTAL in
  # 0.4 — see the sentinel block below). Cluster mode is
  # NOT supported — a clustered endpoint exposes only database 0 and TruePPM
  # uses four (0 Celery, 1 Channels, 2 cache, 3 notification throttles).
  # See docs → Administration → Valkey High Availability
  # (packages/website/src/content/docs/administration/valkey-ha.md).
  #
  # Auth is ON by default. Leave password empty to have the chart generate and
  # persist a strong random password (same pattern as postgresql.auth.password).
  enabled: true
  auth:
    enabled: true
    password: ""

  # External Valkey Sentinel (#2554, ADR-0716). EXPERIMENTAL in 0.4: the wiring
  # is unit-tested (every consumer gets the right topology, database, and
  # credentials) but has NOT been verified against a live Sentinel quorum
  # performing a real failover — the bundled dev stack is single-node, so there
  # is no end-to-end promotion test. Validate a full failover in staging before
  # depending on it; prefer a replicated primary behind one stable endpoint if
  # you need an already-proven path.
  #
  # Only consulted when `valkey.enabled: false` — Sentinel replaces the bundled
  # pod, it does not front it. When `sentinel.enabled: true`, `env.REDIS_URL` is
  # no longer required: the primary is discovered from the Sentinels at connect
  # time, so failover is designed to need no restart and no config change.
  sentinel:
    enabled: false
    # Comma-separated host:port list of the Sentinel nodes. Use three or more —
    # Sentinel needs a quorum to authorize a failover, so two can never promote.
    nodes: ""
    # The name the Sentinels monitor the primary under: the first argument of
    # `sentinel monitor` in sentinel.conf. Commonly "mymaster".
    masterName: ""
    # Password for the DATA nodes (primary/replicas). Rendered into the
    # chart-owned connection Secret, never into a Deployment manifest.
    password: ""
    # Password for the SENTINEL nodes themselves. Deliberately separate —
    # sentinels frequently carry a different password from the data nodes, or
    # none at all. Leave empty when the sentinels are unauthenticated.
    sentinelPassword: ""
    # Use TLS to the data nodes.
    tls: false

# NetworkPolicy — ON by default (#1715). The bundled PostgreSQL and Valkey pods
# speak PLAINTEXT on the pod network (no in-transit TLS), so on a flat network any
# pod in the cluster could open 5432/6379 and read/write the datastore. When
# enabled the chart restricts ingress to the datastores so ONLY the tiers that
# legitimately open them can (api, celery-worker, celery-beat, backup, demo-seed —
# matched by selector labels), and applies a default-deny EGRESS posture to the
# datastore pods (they never legitimately dial out). This is the enforced default
# for the bundled dev/demo datastores.
#
# REQUIRES a CNI that enforces NetworkPolicy (Calico, Cilium, Antrea, Weave, …).
# On a cluster whose CNI does NOT enforce policy these objects are accepted but
# silently unenforced — the datastore is then reachable on the flat pod network.
# If your cluster lacks a policy-enforcing CNI, do NOT rely on the bundled
# datastores for anything sensitive; use managed external datastores with TLS
# (values-prod.yaml) instead. Set enabled=false only if you have an equivalent
# network control (e.g. a service mesh) enforcing the same isolation.
#
# Enforcement is TESTED, not assumed (#2560): scripts/helm-netpol-drill.sh installs
# the chart on a kind cluster with Calico and asserts the positive, negative, and
# egress-deny cases (CI job `helm:netpol`, per-MR + nightly). Note that the broader
# `helm:install` deploy drill runs on kind's DEFAULT CNI, which does NOT enforce
# NetworkPolicy — a green helm:install says nothing about isolation.
#
# ADDING A DATASTORE CLIENT: the allow-lists in templates/networkpolicy.yaml name
# clients by `app.kubernetes.io/component`. A new Deployment/Job/CronJob that opens
# PostgreSQL or Valkey must be added there, or its connections are dropped on any
# enforcing cluster while every render-time gate stays green.
networkPolicy:
  enabled: true

# Pod-level and container-level security hardening applied to the API and Celery
# worker pods. Defaults follow the restricted Pod Security Standard.
# Image for the `helm test` connection hook (templates/tests/api-connection.yaml).
# A minimal curl image, run under the same restricted securityContext as the app
# containers. Only pulled when you run `helm test <release>` (or CI's helm:install
# job) — never during a normal install/upgrade.
tests:
  image:
    repository: curlimages/curl
    tag: "8.11.1"
  # Whether the `helm test` connection probe also checks /api/v1/readyz in
  # addition to /api/v1/health/. Defaults on, because a version-matched deploy
  # serves the migration-aware readyz endpoint (#1894, #2217) and operators want
  # it verified. Set false only when running this chart against an app image
  # that predates readyz (e.g. CI's helm:install drill, which deploys the last
  # RELEASED image tag while the chart is ahead of it) — otherwise the probe
  # 404s on an endpoint the image simply does not have yet.
  probeReadyz: true

# ---------------------------------------------------------------------------
# Placement and scheduling (#3188)
# ---------------------------------------------------------------------------
# Pass-through blocks applied to the api, celery-worker, celery-beat, and web
# pods. Rendered verbatim with toYaml, so the valid keys are Kubernetes', not
# this chart's. None of these existed before 0.4, and because values.schema.json
# closes the root they were REJECTED rather than ignored — an operator mirroring
# our images into a private registry could not install the chart at all.

# Image pull secrets for a private / mirrored registry. THIS IS THE AIR-GAPPED
# PATH: mirror registry.gitlab.com/trueppm/trueppm/* into your own registry, set
# image.repository and web.image.repository to it, and name the pull secret here.
#   imagePullSecrets:
#     - name: regcred
imagePullSecrets: []

# Scheduling priority. Set to a PriorityClass you have created — the chart
# creates none, because a chart that mints a cluster-scoped PriorityClass steps
# on the cluster's own priority budget.
priorityClassName: ""

#   nodeSelector:
#     kubernetes.io/os: linux
#     node.kubernetes.io/instance-type: m6i.xlarge
nodeSelector: {}

#   tolerations:
#     - key: dedicated
#       operator: Equal
#       value: trueppm
#       effect: NoSchedule
tolerations: []

# Full affinity/anti-affinity control. Prefer topologySpreadConstraints below for
# the ordinary "spread my replicas across nodes" case — this is here for the
# cases that cannot express (node affinity to a label set, inter-pod affinity to
# a co-located cache).
affinity: {}

# Spread replicas across failure domains.
#
# WITHOUT THIS, replicaCount: 2 PLUS A PDB PROTECTS NOTHING: both API pods can
# land on the same node, where a node failure takes 100% of the tier and the
# budget is never consulted. That was the chart's real redundancy ceiling.
#
# LEAVE labelSelector OUT and the chart fills it in per tier (this release's
# selector labels plus that tier's component), so ONE constraint written here
# means the right thing on api, celery-worker, celery-beat, and web
# independently. Supply your own labelSelector only to override that.
#
# whenUnsatisfiable: ScheduleAnyway is the deliberate default in the example
# below — DoNotSchedule on a single-node or capacity-constrained cluster leaves
# the second replica Pending forever, which is a worse failure than an
# imperfect spread. Switch to DoNotSchedule once you have the nodes for it.
#
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: kubernetes.io/hostname
#       whenUnsatisfiable: ScheduleAnyway
#
# values-prod.yaml sets exactly that, alongside replicaCount: 2.
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Celery worker process tuning (#2571).
#
# Celery prefork defaults its pool size to `cpu_count()`, which inside a
# container reads the NODE's core count and ignores the cgroup CPU limit. On a
# 32-core node that forks 32 children at ~150-250 MB RSS each — roughly 6.4 GB
# against the 2Gi limit below — so the worker OOMKills at zero load and takes
# CPM recalculation, imports, notification email, and Beat down with it. The
# break-even is around 10 cores, well under a routine cloud node size, so the
# concurrency MUST be pinned in-chart rather than left to auto-detection.
celeryWorker:
  # Pinned, not auto-detected. 2 matches the small-profile sizing guidance and
  # the dev compose file; raise it toward the pod's CPU limit as you scale
  # (see /administration/sizing/). Must be >= 1.
  concurrency: 2
  # Recycle each prefork child after this many tasks so a long-running job
  # (workspace export and MS Project import can run for minutes and hold large
  # parse buffers) cannot accumulate RSS for the pod's whole lifetime. Set to 0
  # to disable recycling.
  maxTasksPerChild: 100
  # Escape hatch for flags the chart does not model, appended verbatim and in
  # order after the flags above — e.g. ["--queues=exports", "--prefetch-multiplier=1"].
  extraArgs: []

# Default resource requests/limits for the API and Celery worker containers.
# Tune for your workload; these are conservative single-team defaults.
resources:
  api:
    requests:
      cpu: 250m
      memory: 512Mi
      # /tmp scratch for MS Project parse, workspace export, and Django's
      # buffering of >2.5 MB request bodies (emptyDir, so it counts as ephemeral).
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 1Gi
  worker:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 1Gi
  # Celery Beat is the single scheduler process — light CPU, small memory. It only
  # dispatches; the actual work runs on the worker.
  beat:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 256Mi
  # Web tier is static nginx — very light.
  web:
    requests:
      cpu: 25m
      memory: 64Mi
      # nginx PID file, temp bodies, and cache (all emptyDir scratch).
      ephemeral-storage: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 256Mi

# Health probes (#1904, #1894). The API uses HTTP probes; the Celery worker and
# beat use a `celery inspect ping` exec probe (a control-plane round-trip catches a
# wedged event loop that a bare process-alive check would miss). Every field is
# tunable so operators can loosen timings on constrained clusters.
# ---------------------------------------------------------------------------
# Graceful shutdown (#3188)
# ---------------------------------------------------------------------------
# terminationGracePeriodSeconds and preStop existed nowhere across all six
# workloads, so every pod took Kubernetes' 30s default with no drain window.
#
# The API is the one that hurt: it serves Channels WebSockets for real-time
# collaboration, and a rollout SIGKILLed them with no chance to close. The
# preStop sleep is NOT about finishing in-flight work — it covers the window
# where kubelet has begun termination but Endpoints/ingress have not yet stopped
# routing to this pod, which is a race no application-level handling can win.
lifecycle:
  api:
    # >= 60 so a long-poll / WebSocket has a real drain window.
    terminationGracePeriodSeconds: 60
    # Seconds to sleep in preStop before SIGTERM reaches the process, letting
    # endpoint deregistration propagate. 0 disables the hook entirely.
    preStopSleepSeconds: 5
  worker:
    # MUST exceed your longest task, or Kubernetes SIGKILLs a worker mid-import
    # and the task waits out CELERY_BROKER_TRANSPORT_OPTIONS["visibility_timeout"]
    # (900s, settings/base.py) before anything retries it. MS Project import and
    # workspace export are the multi-minute ones. Celery's own warm shutdown
    # stops prefetching and finishes what it holds, so this is the ceiling on
    # that, not a fixed wait.
    terminationGracePeriodSeconds: 300
    preStopSleepSeconds: 0
  beat:
    # Beat holds no request and no task; it just needs to write its shelve.
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 0
  web:
    # nginx: finish in-flight responses, then go.
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 5

probes:
  api:
    # Startup probe (#3188). OFF by default because it changes restart semantics
    # and not every cluster wants it; ON is the right choice on a loaded node.
    #
    # Without one, liveness governs the boot: initialDelay 30 + period 30 x the
    # default failureThreshold 3 gives roughly 120s before a restart loop begins
    # — measured from the moment the container starts, AFTER the migrate,
    # bootstrap, and collectstatic init containers have already consumed
    # wall-clock. A startup probe moves that budget to failureThreshold x
    # periodSeconds (default 30 x 5s = 150s) and suspends liveness until it
    # passes, so a slow first boot cannot restart-loop while a genuinely wedged
    # process is still caught.
    startupEnabled: false
    startupPath: /api/v1/health/
    startupPeriodSeconds: 5
    startupFailureThreshold: 30
    # Readiness points at the deep /readyz check (#1894, #2217) so a pod only joins
    # the Service once its DB/cache dependencies are reachable AND every migration
    # shipped in its image is applied — during a rolling upgrade this keeps traffic
    # off a pod whose schema and code disagree. Liveness stays on the shallow
    # /health/ so a transient dependency blip cannot restart-loop the pod.
    readinessPath: /api/v1/readyz
    readinessInitialDelaySeconds: 10
    readinessPeriodSeconds: 10
    livenessPath: /api/v1/health/
    livenessInitialDelaySeconds: 30
    livenessPeriodSeconds: 30
    # Host header kubelet sends on the two probes above (#3183).
    #
    # kubelet dials a probe by POD IP, so with no header it sends
    # `Host: <podIP>:8000`. Django checks that against ALLOWED_HOSTS inside
    # HttpRequest.get_host(), which runs BEFORE any view and which
    # SECURE_REDIRECT_EXEMPT does not reach — so a perfectly correct
    # `ALLOWED_HOSTS=trueppm.example.com` makes /readyz answer 400
    # DisallowedHost, the pod never turns Ready, the Service gets no endpoints,
    # and the Ingress serves 503. Nothing in that failure names ALLOWED_HOSTS.
    #
    # Empty (the default) resolves to the first ingress host — the name you
    # already had to put in ALLOWED_HOSTS to serve traffic at all — so the
    # common case needs no configuration. Set it explicitly when you run
    # without an Ingress (a LoadBalancer Service, a service mesh) and
    # ALLOWED_HOSTS is not a wildcard. Setting it to a name absent from
    # ALLOWED_HOSTS reproduces the bug, so keep the two in step.
    #
    # https://docs.trueppm.com/administration/configuration/
    hostHeader: ""
  worker:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
  beat:
    enabled: true
    # Beat has no worker control plane, so its ping targets the fleet (broker
    # reachability). A generous failureThreshold avoids restarting beat over a
    # brief worker blip.
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 5

# Root Django log level threaded into the api, worker, and beat containers via
# DJANGO_LOG_LEVEL (#1899). Empty = leave the app default. Set to DEBUG/INFO/
# WARNING/ERROR to tune verbosity fleet-wide from one knob.
logging:
  level: ""

# PodDisruptionBudgets for the API and worker tiers (#1904). OFF by default — a PDB
# is only meaningful at replicaCount >= 2 (the production posture); on a
# single-replica dev install it adds nothing. Expressed as maxUnavailable so it
# never wedges a node drain. Beat is excluded (pinned singleton).
podDisruptionBudget:
  enabled: false
  api:
    maxUnavailable: 1
  worker:
    maxUnavailable: 1
  # The web tier had no budget at all until #3188 — the one tier a browser
  # actually loads was the unprotected one.
  web:
    maxUnavailable: 1

# Optional HorizontalPodAutoscaler (#1904). OFF by default: an HPA overrides the
# static replicaCount and needs metrics-server (or a custom metrics adapter)
# installed. Enable to scale the API (and optionally the worker) on CPU/memory.
autoscaling:
  enabled: false
  api:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    # Set to add a memory target; leave empty for CPU-only scaling.
    targetMemoryUtilizationPercentage: ""
  worker:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

env:
  DJANGO_SETTINGS_MODULE: trueppm_api.settings.prod
  # Where collectstatic writes and WhiteNoise reads (#3183). Must match the
  # staticfiles emptyDir mountPath in the api Deployment, and must be set
  # explicitly: the settings default is BASE_DIR/staticfiles, and BASE_DIR
  # resolves INSIDE the read-only venv when the app is pip-installed, as it is
  # in the published image (settings/base.py:891-894). Leaving it unset made
  # /static/ 404 on every Helm install. Change it only if you also change the
  # mountPath.
  STATIC_ROOT: /app/staticfiles
  # Public origin the web app is served from, e.g. "https://trueppm.example.com".
  # Used to build absolute task deep-links in notification emails (ADR-0143, #1158).
  # Leave empty to omit the link line (emails still carry blocker type/age/actor).
  # No trailing slash, no path. Standardized on the TRUEPPM_ prefix pre-0.3
  # (#1355); the legacy bare FRONTEND_BASE_URL still works as a fallback.
  TRUEPPM_FRONTEND_BASE_URL: ""
  # Retention window (days) for soft-deleted ("trashed") projects. Once a project
  # has been in the trash longer than this, the consolidated retention purge
  # (retention.run_purge, ADR-0173) HARD-deletes it and all its child data —
  # tasks, dependencies, sprints, baselines — via DB CASCADE. Irreversible: there
  # is no tombstone and no undo.
  #
  # Default 30. OMIT the key to keep that default.
  #
  # DO NOT set "0". It does not mean "use the default" — env.int parses it as the
  # number zero, which puts the purge cutoff at the present moment and deletes
  # every trashed project on the next tick. The API has always refused 0
  # (min_value=1) and since #3186 the app refuses to boot on it, so this is now a
  # crash rather than silent data loss — but do not set it.
  #
  # An empty string is invalid, not "disabled": env.int raises ValueError on ""
  # and the container crash-loops at settings import.
  #
  # To DISABLE auto-purge entirely, leave this variable unset and turn the policy
  # off in Workspace → Settings → System Health, which stores a RetentionPolicy
  # override with enabled=false. That is also where operators tune the live value
  # without a redeploy — the value here is only the fallback used when no
  # override row exists.
  #
  # https://docs.trueppm.com/administration/retention/
  TRUEPPM_PROJECT_SOFT_DELETE_RETENTION_DAYS: "30"
  # General API rate limits (#1080). The default throttle applies to every
  # endpoint that does NOT declare its own scoped throttle; the /api/v1/health/
  # and /api/v1/edition/ Kubernetes probe endpoints are always exempt. Format is
  # DRF "<count>/<period>" where period is sec|min|hour|day. TRUEPPM_THROTTLE_ANON_RATE
  # bounds unauthenticated traffic per client IP; TRUEPPM_THROTTLE_USER_RATE bounds
  # an authenticated account. Raise or lower to fit your deployment.
  TRUEPPM_THROTTLE_ANON_RATE: "60/min"
  TRUEPPM_THROTTLE_USER_RATE: "1000/min"
  # Trusted reverse-proxy depth for real-client-IP extraction behind the anon
  # rate limit. Default 1 matches this chart's single ingress; set to your actual
  # proxy depth (0 = direct, use REMOTE_ADDR). A wrong value lets clients spoof
  # X-Forwarded-For and evade the anon limit.
  TRUEPPM_NUM_PROXIES: "1"
  # Global API rate-limiting kill switch (#2316, ADR-0604). "true" (default) keeps
  # ALL throttling on. Setting "false" alone does nothing — disabling also requires
  # TRUEPPM_RATE_LIMIT_DISABLE_ACK set to the exact sentinel
  # "i-understand-this-disables-abuse-protection" (add it yourself; it is not a
  # pre-populated key, on purpose). An unacknowledged "false" is refused (limits
  # stay on) and logged at CRITICAL. Disabling removes DoS/abuse protection for the
  # WHOLE instance — only ever use it on a throwaway load-test box, never in
  # production. Live state shows read-only to workspace admins (Settings → System)
  # and via the trueppm.ratelimit.enabled OTel gauge.
  TRUEPPM_RATE_LIMIT_ENABLED: "true"
  # Public read-only board sharing (#283, ADR-0245). The org-wide kill switch for
  # the unauthenticated /share/board/<token> endpoint. "true" (default) lets project
  # Admins mint public board links; NO data is exposed until one is explicitly
  # created. Set "false" to disable minting (403) AND retroactively turn off every
  # existing public link (uniform 404) across the whole instance — the operator lever
  # for locked-down/regulated environments. Rate limits for the endpoints:
  #   TRUEPPM_THROTTLE_SHARE_ACCESS_RATE (public GET, default 60/min)
  #   TRUEPPM_THROTTLE_SHARE_MINT_RATE   (Admin create, default 20/min)
  TRUEPPM_PUBLIC_BOARD_SHARING_ENABLED: "true"
  # Bundled demo-sample loader (#2402). POST /programs/load-sample/ tears down the
  # caller's previous copy of the sample and re-imports the whole fixture
  # synchronously — by a wide margin the most expensive single write in the API.
  # This per-account cap keeps it from being looped into a resource-exhaustion
  # vector. 6/min is ample for a person clicking "Load demo data" and trying a
  # couple of samples; raise it only if you script demo environments.
  TRUEPPM_THROTTLE_SAMPLE_LOAD_RATE: "6/min"
  # POST /programs/import/ runs that same importer on a caller-supplied payload,
  # so it carries the same bound in its own bucket (loading a demo must not spend
  # a user's import allowance). Raise if you bulk-migrate programs via the API.
  TRUEPPM_THROTTLE_SEED_IMPORT_RATE: "6/min"
  # MCP administration controls (#2021, ADR-0497). TRUEPPM_MCP_ENABLED is the
  # instance-wide kill switch for read-only MCP (AI-agent) token access. "true"
  # (default) lets personal tokens carrying the mcp:read scope read the MCP
  # surface; set "false" to deny every MCP-token read (403) across the whole
  # instance — the operator lever for "no agent access, period." Human
  # JWT/session traffic on the same endpoints is unaffected either way.
  TRUEPPM_MCP_ENABLED: "true"
  # Whether a member project's agent-read opt-out withholds a PROGRAM-LEVEL BULK
  # EXPORT from an agent token (#3014, ADR-0678). Both program exports — the sync
  # JSON seed and the async .tar.gz bundle — carry every member project's rows
  # verbatim, and neither can be narrowed, so the lever is serve-or-refuse.
  #   "withhold" (default) — refuse an agent token when ANY member project has
  #     opted out of agent reads. A team's "no" is final.
  #   "allow" — treat the export as a program-level artifact governed by the
  #     program's own agent-read setting alone (pre-0.4 behavior).
  # Humans are unaffected by either value. This is an OPERATOR setting on purpose:
  # a per-workspace or per-program toggle would let a scope above a team override
  # that team's own consent decision, which the opt-out exists to prevent.
  TRUEPPM_MCP_PROGRAM_EXPORT_POLICY: "withhold"
  # Per-token rate limits for the MCP read surface (#1808). These bound
  # token-authenticated reads ONLY; human JWT/session traffic on the same views is
  # unaffected. TRUEPPM_THROTTLE_MCP_READ_RATE is the baseline per-token cap on
  # every MCP-readable view; TRUEPPM_THROTTLE_MCP_READ_COMPUTE_RATE is the tighter
  # bucket the four compute-heavy tools (whatif, monte-carlo/latest, forecast,
  # sprint-forecast) stack on top, since each triggers a CPM + Monte Carlo
  # recompute. Widen for a trusted agent fleet or tighten under load.
  TRUEPPM_THROTTLE_MCP_READ_RATE: "120/min"
  TRUEPPM_THROTTLE_MCP_READ_COMPUTE_RATE: "12/min"
  # Reaching a self-hosted integration host on a PRIVATE / in-cluster address
  # (Jira Data Center, GitHub Enterprise, GitLab CE) needs BOTH of the next two
  # allow-lists — they are different gates and neither implies the other:
  #   TRUEPPM_INTEGRATION_ALLOWED_HOSTS  the PAT-exfiltration gate (#2860). A
  #     user's Connected Account credential is only ever put on the wire toward a
  #     host named here. Atlassian Cloud and github.com / gitlab.com are always
  #     allowed and need no entry, so this is only for self-hosted hosts.
  #   TRUEPPM_EGRESS_ALLOWLISTED_HOSTS   the SSRF deny-list escape hatch
  #     (ADR-0590). The outbound guard rejects any host resolving to a private /
  #     loopback / link-local address; a host named here bypasses that check.
  #     ALSO how an in-cluster identity provider is reached (see the SSO docs) —
  #     the exemption is GLOBAL across every outbound caller (PAT verification,
  #     git-link refresh, webhooks, SMTP relay, SSO), not scoped to integrations,
  #     so name the specific host and nothing broader.
  # Both are comma-separated and match on an EXACT, case-insensitive hostname —
  # no wildcards, no suffix matching. A publicly-reachable self-hosted host needs
  # only the first. Both default to empty; uncomment and set to enable:
  #   TRUEPPM_INTEGRATION_ALLOWED_HOSTS: "jira.example.com,gitlab.example.com"
  #   TRUEPPM_EGRESS_ALLOWLISTED_HOSTS: "jira.example.com,gitlab.example.com"
  # Outbound email / SMTP transport (#764). These bind Django's standard EMAIL_*
  # settings; they flow to the api AND celery worker/beat via `trueppm.envVars`,
  # so the Beat-driven notification drain has the same transport everywhere.
  # Leave EMAIL_HOST empty (the default) to run without outbound mail — the
  # read-only Workspace → Settings → Email & SMTP page then reports "Not
  # configured" and in-app notifications still work. Uncomment and set to enable:
  #   EMAIL_HOST: "smtp.example.com"
  #   EMAIL_PORT: "587"
  #   EMAIL_USE_TLS: "true"          # STARTTLS; mutually exclusive with EMAIL_USE_SSL
  #   EMAIL_USE_SSL: "false"
  #   EMAIL_HOST_USER: "notifications@example.com"
  #   DEFAULT_FROM_EMAIL: "notifications@example.com"
  # EMAIL_HOST_PASSWORD MUST come from a Kubernetes Secret — NEVER a plaintext
  # value here. Create the Secret, then reference it via secretKeyRef (the same
  # map form the chart uses for DATABASE_URL). Uncomment to wire it:
  #   EMAIL_HOST_PASSWORD:
  #     secretKeyRef:
  #       name: trueppm-smtp
  #       key: password
  # DATABASE_URL and REDIS_URL are NOT set here, and while the bundled
  # postgresql / valkey subcharts are enabled they must not be: the chart builds
  # both server-side from the credentials it generated, stores them in the
  # chart-owned connection Secret, and injects them by secretKeyRef. Setting
  # either one alongside a bundled datastore now FAILS the render rather than
  # being silently ignored.
  #
  # When postgresql / valkey are disabled (the managed-DB / production path) one
  # of them becomes REQUIRED, in either of two forms:
  #
  #   1. A Secret you already manage — PREFERRED. Nothing about the credential
  #      passes through Helm, so it is absent from your values file, your shell
  #      history, and your GitOps repo:
  #        DATABASE_URL:
  #          secretKeyRef:
  #            name: trueppm-db
  #            key: url
  #        REDIS_URL:
  #          secretKeyRef:
  #            name: trueppm-cache
  #            key: url
  #
  #   2. A plain URL string. The chart moves it into the chart-owned connection
  #      Secret and injects it by secretKeyRef, so it still never reaches a
  #      Deployment manifest — but it does pass through Helm, so it lands in
  #      whatever holds it (a values file, `--set` in your shell history, the
  #      Helm release Secret):
  #        DATABASE_URL: "postgres://user:pass@db.example.com:5432/trueppm?sslmode=require"
  #
  # An external DATABASE_URL must carry sslmode=require — settings.prod refuses
  # to boot on a plaintext external database. The chart cannot verify that for
  # form 1 (it never sees the value), so with an external Secret the check is
  # the app's alone, at boot.
  #
  # SECRET_KEY, ALLOWED_HOSTS, and INTEGRATION_ENCRYPTION_KEY must be set via a
  # Kubernetes Secret — do NOT store them here in plaintext. Create a Secret and
  # reference it through `envFrom` below (see the `envFrom:` key further down).

# Bulk-inject env vars from existing Secrets/ConfigMaps into the API, Celery
# worker, AND the bootstrap/migrate init containers. This is the supported way to
# supply the secrets that must not live in plaintext and that prod REFUSES TO
# BOOT without (settings.prod enforces them at import time):
#   SECRET_KEY (#566), ALLOWED_HOSTS, INTEGRATION_ENCRYPTION_KEY (#1002)
# Plus a storage choice — TRUEPPM_DEFAULT_FILE_STORAGE + TRUEPPM_S3_BUCKET_NAME
# (object storage) or TRUEPPM_ALLOW_LOCAL_ATTACHMENT_STORAGE=true (#775, #2559).
#
# Create the Secret:
#   kubectl create secret generic trueppm-env \
#     --from-literal=SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))") \
#     --from-literal=ALLOWED_HOSTS=trueppm.example.com \
#     --from-literal=INTEGRATION_ENCRYPTION_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())") \
#     --from-literal=TRUEPPM_DEFAULT_FILE_STORAGE=storages.backends.s3.S3Storage \
#     --from-literal=TRUEPPM_S3_BUCKET_NAME=trueppm-attachments
#
# The API image bundles the S3 backend, so those two keys suffice on AWS S3
# (credentials resolve via IRSA / instance profile). For MinIO or another non-AWS
# endpoint also set TRUEPPM_S3_ENDPOINT_URL, TRUEPPM_S3_ADDRESSING_STYLE=path, and
# TRUEPPM_S3_ACCESS_KEY_ID / TRUEPPM_S3_SECRET_ACCESS_KEY -- scoped to the
# attachments bucket, not the MinIO root account. The bucket name is
# REQUIRED whenever the backend is S3 — startup fails with trueppm.E008 without
# it. GCS and Azure Blob backends are NOT bundled; they need a derived image.
#
# Then reference it here. Explicit `env:` entries above (e.g. the chart-built
# DATABASE_URL) always take precedence over an envFrom key of the same name.
#   envFrom:
#     - secretRef:
#         name: trueppm-env
envFrom: []

# OpenTelemetry observability (ADR-0223, #708). OPT-IN with NO default endpoint:
# leave observability.otlp.endpoint empty (the default) and the API installs no
# telemetry provider at all — a strict no-op with zero per-request cost. Set the
# endpoint to your OTLP collector (Grafana Tempo/Alloy, Jaeger, an OpenTelemetry
# Collector, or a SaaS APM) to export traces and metrics. These values render into
# the standard OTEL_*/TRUEPPM_OTEL_* env vars for BOTH the API and the Celery
# worker/beat, via the trueppm.observabilityEnv helper.
#
# What you actually get once an endpoint is set (#708-#710): TRACES for HTTP
# requests (Django), SQL statements (psycopg), Celery tasks with trace context
# propagated across the broker, WebSocket connections, and the CPM / Monte Carlo
# scheduling engine; and METRICS for request latency/count, Celery task duration,
# transactional-outbox depth/lag, broker queue depth, database backend counts, and
# WebSocket connections/broadcasts. Enterprise attaches its own exporters against
# the same OSS provider.
#
# THIS BLOCK IS THE SUPPORTED WAY TO CONFIGURE TELEMETRY. Setting the underlying
# OTEL_* variables by hand under `env:` also works, but it loses the TRUEPPM_POD_NAME
# downward-API injection and every exportHealth knob below — and if BOTH are set the
# structured block wins (it renders after `env:` in trueppm.appEnv, and Kubernetes
# keeps the last entry for a duplicated name), so the hand-set values silently do
# nothing. Configure telemetry here, not there (#2879).
observability:
  otlp:
    # Collector endpoint. EMPTY = telemetry off (default). Examples:
    #   http://otel-collector:4317   (grpc, default protocol)
    #   http://otel-collector:4318   (http/protobuf — set protocol below to match)
    endpoint: ""
    # "grpc" (default, port 4317) or "http/protobuf" (port 4318).
    protocol: "grpc"
    # Resource service.name reported on every span/metric.
    serviceName: "trueppm-api"
    # Master switch. Set false to disable export while keeping the endpoint set.
    enabled: true
    # Per-signal toggles (only consulted when enabled and an endpoint is set).
    tracesEnabled: true
    metricsEnabled: true
    # Trace sampling (#1903). These render into the standard OTEL_TRACES_SAMPLER /
    # OTEL_TRACES_SAMPLER_ARG env vars honored by the OpenTelemetry SDK, so a busy
    # instance can sample a fraction of traces instead of exporting every request.
    # Leave both empty to keep the SDK default (parentbased_always_on). Common:
    #   tracesSampler: "parentbased_traceidratio"
    #   tracesSamplerArg: "0.1"   # keep 10% of root traces
    tracesSampler: ""
    tracesSamplerArg: ""
    # Optional OTLP headers (e.g. auth) as comma-separated key=value pairs.
    # Prefer headersSecret for tokens so they never render into a plaintext
    # manifest; `headers` is the inline fallback for non-secret values.
    headers: ""
    headersSecret:
      name: ""
      key: "headers"
    # Actor attributes on the HTTP request span (#2880). true (default) stamps each
    # request span with trueppm.user.id (the acting account's opaque UUID) and
    # trueppm.user.role (the symbolic project role the request was authorized under:
    # VIEWER | MEMBER | SCHEDULER | ADMIN | OWNER), so a slow or failing trace can be
    # attributed to a who and a permission level. NOTHING else about the person is
    # exported under trueppm.user.* — no email, username, display name, or client IP.
    # Set false where a per-user identifier must not leave the instance even to your
    # own collector; project/program/task ids are unaffected either way.
    actorAttributes: true
    # Live export-health strip (ADR-0601, #2109). When enabled (default), each pod
    # records per-signal export success/error/counts into Valkey /2 so the Telemetry
    # card at Settings → Workspace → Observability (#2250) shows a cross-process live
    # strip ("last export 8s ago · 1,204 spans / 60s") aggregated across the
    # worker/beat pods that actually export.
    # Best-effort and non-fatal — it can never slow or break export. REQUIRES the
    # Valkey /2 DB to run maxmemory-policy noeviction (the same requirement the
    # rate-limit counters already impose). Each pod's identity is injected from the
    # Kubernetes downward API (metadata.name) automatically — no config needed.
    exportHealth:
      # Master switch for the recorder. false → the wrappers are not installed and the
      # card falls back to the config-only posture (export itself is unaffected).
      enabled: true
      # Advanced tuning (seconds). Leave unset to use the app defaults, which suit the
      # standard 60s metric export interval. INVARIANT: stalenessSeconds MUST exceed
      # healthyWithinSeconds, or the stalled/idle states become unobservable (an
      # overdue signal is masked as "never"). Set all three, or none.
      #   stalenessSeconds:      how long a pod counts as live after its last export
      #                          (default 600). Beyond it a silent pod reads "never".
      #   healthyWithinSeconds:  a success newer than this ⇒ healthy; older (still
      #                          live) ⇒ stalled (metrics) / idle (traces) (default 150).
      #   windowSeconds:         rolling window the exported-item counts cover; the
      #                          card labels the strip from it ("last 60s") (default 60).
      stalenessSeconds: ""
      healthyWithinSeconds: ""
      windowSeconds: ""

# Starter Grafana dashboard shipped as a labeled ConfigMap (#1905). OFF by default:
# it is only useful where a Grafana sidecar (kube-prometheus-stack / grafana chart)
# is watching for the `grafana_dashboard` label to auto-import dashboards. Enable it
# on such a cluster to get the "TruePPM — Async & Outbox Health" dashboard (outbox
# depth/age, dead-letter, beat liveness) with zero manual upload.
dashboards:
  enabled: false
  # The label key/value your Grafana sidecar watches. Defaults match the upstream
  # kube-prometheus-stack sidecar convention.
  label: grafana_dashboard
  labelValue: "1"
  annotations: {}

# Starter alerting rules as a Prometheus Operator PrometheusRule (#1905). OFF by
# default: the object is a monitoring.coreos.com/v1 CRD, so it REQUIRES the
# Prometheus Operator (kube-prometheus-stack) installed — on a cluster without
# those CRDs the apply is rejected. Enable it alongside the operator to ship the
# async/outbox alerts (beat staleness 503, outbox depth/age rising, dead-letter).
# Thresholds are tunable below. The beat-staleness rule reads a Blackbox-Exporter
# probe series of /api/v1/health/beat/, and the dead-letter rule reads the
# `trueppm_task_dead_letter_parked` gauge — which is Prometheus text exposition on
# /api/v1/health/dead-letter/, NOT an OTLP metric, so it needs its own scrape job;
# see docs → Administration → Observability for both wirings.
alerts:
  enabled: false
  # Extra labels stamped on the PrometheusRule (e.g. `release: kube-prometheus-stack`
  # so the operator's ruleSelector picks it up).
  labels: {}
  thresholds:
    beatStaleFor: "2m"
    outboxDepth: 500
    outboxDepthFor: "10m"
    outboxOldestAgeSeconds: 900
    outboxOldestAgeFor: "10m"
    deadLetter: 0
    deadLetterFor: "5m"
    # Outbound-email alerts (#2886). These read the gauges served as Prometheus
    # text exposition by /api/v1/health/email/, which — like the dead-letter gauge
    # — needs its own scrape job; see docs → Administration → Observability.
    emailTransportFor: "5m"
    emailFailed: 0
    emailFailedFor: "10m"
    emailQueueAging: 0
    emailQueueAgingFor: "15m"

# OPTIONAL in-cluster OpenTelemetry Collector guidance (#1905). This chart does NOT
# bundle a Collector subchart — running one is a deliberate operational choice with
# its own lifecycle. The recommended path is the upstream
# `open-telemetry/opentelemetry-collector` Helm chart (or the OpenTelemetry
# Operator). Deploy it as a sibling release, then point observability.otlp.endpoint
# (above) at its in-cluster Service, e.g.:
#   observability.otlp.endpoint: "http://otel-collector:4317"
# A minimal Collector pipeline that fans TruePPM's OTLP metrics into Prometheus and
# traces into Tempo/Jaeger is documented at docs → Administration → Observability.
# This block is documentation-only; it renders no Kubernetes objects.
otelCollector:
  # Set true only as a reminder in your own values overlay; the chart reads nothing
  # from here — deploy the Collector as a separate release (see comment above).
  enabled: false

# Scheduled logical backups (issue #320). OFF by default: a backup CronJob is an
# opt-in operational choice — it needs somewhere durable to write (a PVC or an
# S3-compatible bucket), and enabling it silently would create a PVC the operator
# never asked for. Turn it on deliberately once you have chosen a destination.
#
# The CronJob runs scripts/backup.sh inside the API image (which carries
# postgresql-client + the script), dumps the database with pg_dump --format=custom,
# and writes a single timestamped artifact. Restore is a manual, deliberate action
# with scripts/restore.sh — see docs → Administration → Backup & Restore.
#
# This is LOGICAL backup only (pg_dump). Continuous archiving / point-in-time
# recovery (WAL shipping), cross-region replication, and managed backup automation
# are Enterprise HA features (trueppm-enterprise #20).
backup:
  enabled: false
  # Cron schedule (cluster timezone). Default: 02:00 every day.
  schedule: "0 2 * * *"
  # Image used by the backup CronJob. Defaults to the upstream PostgreSQL image,
  # which carries pg_dump / pg_isready / psql at the matching major version. The
  # lean application image ships only libpq5 (no client binaries), so the job runs
  # from a client-capable image and connects over the network via DATABASE_URL —
  # it needs no application code. The inline backup command mirrors
  # scripts/backup.sh (same pg_dump --format=custom, same timestamped artifact);
  # restores are performed manually with scripts/restore.sh.
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  # How many previously-failed/succeeded jobs Kubernetes retains for inspection.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Where the artifact is written inside the job container. With a PVC (below)
  # this path is the mounted volume; the retention prune runs against it.
  outputDir: /backups
  # Include the local media/attachment directory in the artifact. Only relevant
  # when attachments are on a local PVC (TRUEPPM_ALLOW_LOCAL_ATTACHMENT_STORAGE);
  # with object storage (S3/MinIO) the bucket is backed up by the object store and
  # this should stay empty. Set to the in-container media path to include it.
  mediaDir: ""
  # Retention. keepDaily prunes the LOCAL output directory to the N newest
  # artifacts after each run. It is local-only by design and NEVER deletes from
  # the bucket: a scheduled job that removes remote backups is the one component
  # whose bug destroys the thing it exists to protect. keepWeekly is likewise
  # advisory metadata — the CronJob does not promote dailies to weeklies.
  # For an S3 destination, set retention with the bucket's own lifecycle policy
  # and document it alongside these values.
  keepDaily: 7
  keepWeekly: 4
  # Destination. Two shapes, and they compose:
  #   persistence.enabled: true  → mount a chart-managed PVC at outputDir
  #   s3.enabled: true           → after the dump, upload the artifact to an
  #                                S3-compatible bucket (a second container in
  #                                the same job actually performs the upload)
  # With s3.enabled the local copy is still written to outputDir first, so a
  # PVC is worth keeping as a staging area even when the bucket is the target.
  # Leave both off only if you are supplying your own volume via extraVolumes.
  persistence:
    enabled: false
    # Reuse an existing claim instead of creating one.
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  # S3-compatible off-cluster destination. When enabled, the job gains a second
  # container that uploads the finished artifact to the bucket. It runs a
  # separate image because the PostgreSQL image above carries pg_dump but no
  # object-storage client (no aws, no mc), so the upload cannot happen in the
  # same container as the dump.
  #
  # A failed upload fails the job — the artifact is never left only on the PVC
  # while the operator believes it went off-cluster.
  #
  # The secret key MUST come from a Kubernetes Secret, never a plaintext value
  # here. Credentials are passed as AWS_* env vars and never assembled into a
  # URL: a real 40-char secret key routinely contains "/", "+" and ":", which
  # corrupts URL-based credential forms.
  s3:
    enabled: false
    bucket: ""
    # S3-compatible endpoint. Leave empty for real AWS S3 (the region below
    # selects the endpoint). Set it for MinIO and friends — when it is set, the
    # upload forces path-style addressing, because a self-hosted object store is
    # normally reached by IP or by a single hostname with no wildcard DNS, and
    # virtual-hosted-style requests would resolve to nothing.
    endpoint: ""
    region: ""
    # The upload artifact is a full PostgreSQL dump. When `endpoint` is
    # http:// and does not look like an in-cluster or private-network
    # address (a bare short name, *.svc, *.local, or an RFC1918/loopback
    # literal), the job logs a WARNING that the dump will cross the network
    # unencrypted — it does not fail the job. Set this to true only once
    # you've verified the network path is trusted (e.g. a private peered
    # link this heuristic can't see) to silence that warning deliberately.
    allowPlaintext: false
    # Optional key prefix inside the bucket. The object key is
    # <prefix>/trueppm-backup-<UTC timestamp>.tar.gz.
    prefix: ""
    # Reference the credentials Secret (keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY).
    existingSecret: ""
    # Image for the upload container. Must carry the AWS CLI as `aws`.
    # TODO(#1733): pin by digest alongside the other subchart/backup images.
    image:
      repository: amazon/aws-cli
      tag: "2.17.0"
      pullPolicy: IfNotPresent
  # Extra volumes / mounts for the backup job — the supported way to give the job
  # read access to your media PVC when mediaDir is set (mount the same claim the
  # API uses at the mediaDir path, read-only). Ignored unless mediaDir is set.
  extraVolumes: []
  extraVolumeMounts: []
  # Resource requests/limits for the backup job container.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Admin bootstrap settings.
# The bootstrap init container runs `create_admin` once on first deploy and
# writes the one-time password to passwordFile (emptyDir, 0o600).
# Retrieve it with: kubectl exec <api-pod> -- cat /run/trueppm/admin_password
admin:
  # Path inside the container where the one-time password is written.
  # Must match the emptyDir mountPath in the deployment template.
  passwordFile: /run/trueppm/admin_password
  # Admin email address. SET THIS. Left empty the bootstrap falls back to
  # admin@example.com — an RFC 2606 reserved domain that cannot receive mail, so
  # password reset for the root account will not work and you will be recovering
  # it through `manage.py changepassword` instead. The old fallback was
  # admin@trueppm.com, a domain the vendor owns rather than you (#3175).
  # NOTES.txt prints a warning when this is unset.
  email: ""

# Public read-only demo mode (#2440, ADR-0658).
#
# DEMO ONLY — never enable against an instance holding real data. A post-install/
# post-upgrade hook Job runs `load_sample_project`, which is destructively idempotent:
# it DELETES the demo projects it previously created and their demo-only resources,
# then re-seeds them. Since #2476 that reset is scoped to the seeder's own output (the
# `is_sample` flag it sets, not the project name), so it cannot reap a real project
# that happens to share the demo name — but this mode also publishes unauthenticated
# read-only share links, so it still belongs on its own instance. Hence the default
# below.
#
# The posture: the only PUBLICLY REACHABLE surface is the two anonymous, read-only
# share links printed by the hook Job. Be precise about why, because the obvious
# phrasing is wrong — a bootstrap superuser DOES exist (the api Deployment's
# `bootstrap` initContainer runs create_admin on every deploy, exactly as
# docker-compose.demo.yml does). What makes the demo safe is that demo mode swaps
# the web tier's nginx config for an ALLOWLIST: /admin/, /ws/ and every /api/ route
# except the share projections and the liveness probe return 404, so the
# authenticated API and the admin login are simply not there from the internet.
#
# Two consequences. Reaching Django admin on a demo release requires
# `kubectl port-forward svc/<release>-trueppm-api 8000:8000` — there is no public
# path to it by design. And anything that widens that allowlist, or exposes the API
# by another route, invalidates the security argument in ADR-0658 rather than
# merely bending it.
#
# See values-demo.yaml for a ready-made fragment, and packages/helm/README.md for the
# full walkthrough.
demo:
  # Master switch. Everything else in this block is inert while false.
  enabled: false
  # Public origin serving this instance, e.g. https://demo.example.com — no trailing
  # slash. Used to print the share URLs; it cannot be inferred from inside the
  # cluster, so demo.enabled with an empty baseUrl fails the render.
  baseUrl: ""
  # Pinned share tokens. BOTH are required and they must differ.
  #
  # Pinning is not a convenience here, it is a correctness requirement: the seed is
  # destructive and ShareLink.project is on_delete=CASCADE, so each upgrade drops the
  # links. Pinned tokens recreate them at the same URLs; unpinned ones would change
  # the public URL on every upgrade. Two tokens are needed because
  # ShareLink.token_hash is globally unique — one token cannot back both links.
  #
  # Generate each with: openssl rand -base64 32 | tr -d '=+/'
  #
  # These are public URL components, not credentials — the server stores only
  # sha256(token) — so values (rather than a Secret) is the right home. No default is
  # shipped: a chart-wide default token would hand every deployment the same
  # guessable URL.
  shareToken:
    schedule: ""
    board: ""
  # Retries before the hook Job is considered failed. Exhaustion fails the Helm
  # release on purpose — a demo that deployed without data is broken and must not
  # report success. The failed Job is retained (hook-delete-policy is
  # before-hook-creation, not hook-succeeded) so `kubectl logs` shows the traceback.
  backoffLimit: 2
  # Short-lived seeding Job. Sized for the seed transaction, not for serving.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 512Mi
