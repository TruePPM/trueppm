# Public read-only demo overlay (#2440, ADR-0658).
#
# A fragment layered on values.yaml, matching the values-dev.yaml convention:
#
#     helm install trueppm ./packages/helm \
#       -f packages/helm/values-demo.yaml \
#       --set demo.baseUrl=https://demo.example.com \
#       --set demo.shareToken.schedule=$SCHEDULE_TOKEN \
#       --set demo.shareToken.board=$BOARD_TOKEN
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS IS
#
# A throwaway instance whose only publicly reachable entry points are two anonymous,
# read-only share links. The one mutation any visitor can cause is an access-counter
# bump on the share link itself.
#
# Note what this does NOT claim: a bootstrap superuser exists, because the api
# Deployment creates one on every deploy. It has no public login surface — demo
# mode replaces the web nginx config with an allowlist that 404s /admin/, /ws/
# and all of /api/ except the share projections and the liveness probe. Reach
# admin with:
#   kubectl port-forward svc/<release>-trueppm-api 8000:8000
#
# This is safe HERE and was NOT safe on the compose demo, for one reason: this
# file bakes no secrets (see below), so the superuser's tokens are signed with
# the operator's own SECRET_KEY. docker-compose.demo.yml bakes a public one, and
# it also ran create_admin — a superuser whose tokens anyone could forge. It no
# longer does (#3187), so do not re-derive "the compose demo does it too" from
# this comment.
#
# EXPOSURE
#
# Expose the WEB Service (svc/<release>-trueppm-web), never the api Service: the
# read-only allowlist is the web tier's nginx, and only traffic through it is
# constrained. Cloudflare Tunnel pointed at the web Service is the intended path
# (ADR-0658 D9). If you use an Ingress instead, every path must be
# `service: web` — the chart refuses to render demo.enabled with an Ingress that
# routes anything to the API Service (#3908), and refuses a non-ClusterIP api
# Service. What the chart cannot see: your own Ingress object, and controller
# annotations under ingress.annotations that reroute traffic behind the chart's
# back (e.g. ingress-nginx's default-backend pointing at the api Service) — keep
# those out of a demo.
#
# NETWORK POLICY (#4003): with this overlay you render NO Ingress, so the
# api/web default-deny NetworkPolicy's networkPolicy.ingressControllerSelector
# (default: a namespace called ingress-nginx) is the WRONG peer for a tunnel —
# cloudflared is not an ingress controller and does not run in that namespace.
# Left at the default the chart refuses to render at all (both on a fresh
# install and on every later upgrade, since there is no in-cluster ingress
# controller to eventually match). Point the selector at the namespace your
# tunnel client actually runs in:
#
#   --set-json 'networkPolicy.ingressControllerSelector={"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"cloudflared"}},"podSelector":{}}'
#
# If cloudflared instead runs on the HOST rather than as an in-cluster pod, it
# is not a pod-network peer at all — front it with an ipBlock naming the host's
# address instead, or set networkPolicy.ingressControllerConfirmed=true only
# after verifying host-to-pod reachability yourself; the chart cannot verify it
# for you.
#
# WHAT THIS IS NOT
#
# A production deployment, and not a base to build one from. `demo.enabled` runs a
# destructive seeder on every install AND every upgrade — it deletes the demo data it
# previously created and re-creates it. The reset is scoped to the seeder's own output
# (it will not reap a real project that shares the demo name), but this deployment also
# publishes unauthenticated read-only share links. Never point it at a cluster holding
# real data.
# ─────────────────────────────────────────────────────────────────────────────

demo:
  enabled: true

  # Re-seed on a timer so the sample's dates do not age (ADR-1197 D9). The share URLs
  # are pinned, so they survive a run, but they are absent for a few seconds while the
  # seed runs. Read the demo.reset block in values.yaml before changing this.
  reset:
    enabled: true
    # Pinned explicitly (#4151) rather than left to inherit values.yaml's default, so
    # this reference deployment's actual cadence is visible here and does not
    # silently move if that default is ever retuned. Matches values.yaml's default —
    # once a day, not every 6 hours (D9): D2's write refusal already leaves almost
    # nothing for the reset to clean up, so the reset's real job is re-anchoring the
    # sample's dates, which a daily cadence does just as well as a 6-hourly one while
    # 404ing a sitting visitor's page a quarter as often.
    schedule: "0 8 * * *"

  # ───────────────────────────────────────────────────────────────────────────
  # Interactive read-only mode (ADR-1197, #3925) — DELIBERATELY LEFT OFF HERE.
  #
  # This overlay is the SHARE-LINK demo, and its rendered manifests are asserted
  # unchanged by CI precisely so that turning that demo on can never turn a public
  # login on as a side effect. To run the interactive demo instead, add:
  #
  #     --set demo.interactive=true \
  #     --set demo.loginHint.username=atlas-visitor \
  #     --set demo.loginHint.password="$(openssl rand -base64 18 | tr -d '=+/')"
  #
  # `atlas-visitor` is the bundled Atlas sample's demo account: a MEMBER on the
  # program and on all three projects, holding no work and no ADMIN/OWNER role
  # anywhere. Member rather than Viewer is an owner decision (ADR-1197 Amendment 1)
  # and a UX one only — the read-only guarantee is DemoReadOnlyMiddleware refusing by
  # request method, never the role. See the demo.loginHint block in values.yaml.
  #
  # THE LOGIN IS NOT REACHABLE THROUGH THIS OVERLAY'S WEB TIER YET, and that is not a
  # bug in the recipe — it is the deferral. The web ConfigMap has exactly two
  # branches, keyed on `demo.enabled`: the share-link branch (this one) `return 404`s
  # all of `location /api/`, which includes /api/v1/auth/token/, and redirects the
  # bare origin to the schedule share link. The interactive mode needs a THIRD server
  # block with a `limit_except GET HEAD OPTIONS` method fence, and that block is
  # #3925 MR 2. Until it lands, reach the login only by port-forwarding the api
  # Service, or front the release with your own access-controlled ingress.
  #
  # DO NOT EXPOSE IT PUBLICLY YET for the same reason, plus two more: the egress
  # NetworkPolicy is also MR 2, and `login_account` throttles on the submitted
  # USERNAME at 5/min across all source IPs — so one shared username hands the whole
  # internet a 5/min login budget (threat-model T2, which fires with no attacker).
  #
  # Verify an interactive install with `helm test <release>`: it signs in with the
  # hint and asserts an authenticated POST answers 403 demo_read_only. Read what it
  # says carefully — it reaches the api Service by in-cluster DNS, so it proves the
  # API-tier fence and says NOTHING about the public edge.

  # REQUIRED — no default is shipped, and the chart render fails without them.
  #
  # baseUrl: the public origin, no trailing slash (e.g. https://demo.example.com).
  # shareToken.*: two DIFFERENT pinned tokens. Both are public URL components, not
  #   credentials (the server persists only sha256(token)), but they are left empty
  #   on purpose — a shipped default would hand every deployment the same guessable
  #   URL. Generate each with:
  #
  #     openssl rand -base64 32 | tr -d '=+/'
  #
  # Pinning is mandatory, not cosmetic: the seed is destructive and
  # ShareLink.project is on_delete=CASCADE, so every `helm upgrade` drops the links.
  # Pinned tokens recreate them at identical URLs; unpinned ones would silently
  # change the public URL each upgrade.
  baseUrl: ""
  shareToken:
    schedule: ""
    board: ""

# The share endpoints are gated instance-wide by this switch (ADR-0245; ADR-0265
# deliberately reuses the same one for schedule links rather than adding a second).
# It already defaults to "true" in values.yaml — asserted here so the dependency is
# explicit and a future change to that default cannot silently 404 every demo URL.
env:
  TRUEPPM_PUBLIC_BOARD_SHARING_ENABLED: "true"
  # Asserted for the same reason, and with more force: when rate limiting is off
  # every named throttle scope's rate becomes None, which removes the share_access
  # throttle — the only bound on the sole public endpoint. A demo pins one replica
  # at a 1-CPU limit with autoscaling and the PDB disabled, so there is no headroom
  # to absorb an unthrottled crawler.
  TRUEPPM_RATE_LIMIT_ENABLED: "true"
  # The Secret below opts in to local attachment storage, and settings.prod then
  # refuses to boot unless MEDIA_ROOT is writable — on every pod that imports
  # settings, including the demo-seed Job's migrate init container. Every pod has
  # readOnlyRootFilesystem, so the default /var/lib/trueppm/media is not writable
  # and the whole install fails: api and seed Init:Error, worker CrashLoopBackOff,
  # `helm install` reporting BackoffLimitExceeded on the seed hook.
  #
  # /tmp is the per-pod emptyDir every one of those pods already mounts, and it
  # is the right home for a demo: no visitor has an account or a write path, so
  # nothing ever stores an attachment. This deliberately does NOT enable
  # persistence.media — the seed Job's template does not mount that claim, so a
  # PVC would fix the api pod and leave the seed hook failing.
  #
  # Not a base for a real install: files here vanish with the pod.
  TRUEPPM_MEDIA_ROOT: /tmp

  # The demo's proxy chain is TWO hops deep, and the chart default of 1 is wrong
  # for it (#4017). DRF keys every per-IP throttle on the address NUM_PROXIES
  # hops back in X-Forwarded-For. Demo mode FORBIDS an Ingress path that reaches
  # the API Service directly (#3908), so /api/v1/share/ always travels
  #
  #   cloudflared (ADR-0658 D9) — or ingress-nginx — -> the web tier's nginx -> api
  #
  # and the web tier appends its own peer with $proxy_add_x_forwarded_for. At 1,
  # DRF reads the LAST entry: the tunnel pod's address, identical for every
  # visitor. share_access then stops being a per-visitor 60/min limit and becomes
  # ONE GLOBAL 60/min bucket for the whole internet.
  #
  # That inverts what the scope is for. ADR-0245 added share_access so a leaked or
  # viral link could not become an unthrottled load source; at 1 it does not
  # throttle the abuser, it takes the demo down for everyone — one crawler spends
  # the minute and every human visitor gets 429. Measured on a kind install: with
  # 1, a second visitor's FIRST request answers 429; with 2, it answers 200.
  #
  # Set this back to 1 ONLY if you expose the web Service with no proxy in front
  # of it (the topology networkPolicy.ingressControllerConfirmed exists to make
  # you confirm). At 2 with nothing in front, a client that sends its own
  # X-Forwarded-For picks its own bucket.
  TRUEPPM_NUM_PROXIES: "2"

# ─────────────────────────────────────────────────────────────────────────────
# SECRETS
#
# This file deliberately bakes NO secrets, unlike docker-compose.demo.yml. That
# file's baked SECRET_KEY / INTEGRATION_ENCRYPTION_KEY are safe under its
# no-accounts premise, but a values file is copied and adapted far more often than
# a demo compose file, and a known SECRET_KEY reaching a real deployment is a much
# worse outcome than one extra setup step here.
#
# So demo mode uses the chart's normal secret path. Create the Secret first:
#
#   kubectl create secret generic trueppm-env \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=INTEGRATION_ENCRYPTION_KEY="$(python3 -c \
#       'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
#     --from-literal=ALLOWED_HOSTS="demo.example.com,trueppm-api" \
#
#   ALLOWED_HOSTS must carry `trueppm-api` as well as the public name (#3237).
#   Demo mode renders no Ingress by default, so the kubelet probes and the `helm test` Job
#   both reach the api by its Service DNS name rather than by demo.example.com.
#   Omit it and /readyz answers 400 DisallowedHost, the pod never turns Ready,
#   and nothing in the failure names ALLOWED_HOSTS. Replace `trueppm-api` with
#   `<release>-trueppm-api` if your release name does not contain "trueppm".
#     --from-literal=TRUEPPM_ALLOW_LOCAL_ATTACHMENT_STORAGE=true
#
# All four keys are required: settings.prod validates them at import time, so a
# Secret missing any one of them crash-loops the migrate init container (#2812).
# Local attachment storage is the right call for demo mode — the data is seeded
# and disposable — but it is ephemeral, so never carry this key into an install
# holding real uploads. The `env.TRUEPPM_MEDIA_ROOT` above is what makes the opt-in
# bootable on a read-only root filesystem; do not remove it.
#
# then leave the envFrom reference below in place.
# ─────────────────────────────────────────────────────────────────────────────
envFrom:
  - secretRef:
      name: trueppm-env

# Single-node sizing. Celery stays enabled — ADR-0658 D4 keeps demo mode on the
# production topology rather than carving an exception to ADR-0081 (Beat is a silent
# SPOF; drains, purges and health depend on it). It is sized down instead, since a
# demo with no write path enqueues almost nothing.
replicaCount: 1

resources:
  api:
    requests:
      cpu: 100m
      memory: 384Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 512Mi
  worker:
    requests:
      cpu: 50m
      memory: 192Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 256Mi
  beat:
    requests:
      cpu: 25m
      memory: 96Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 100m
      memory: 192Mi
      ephemeral-storage: 128Mi

# A single-node demo has nothing to fail over to, so the HA machinery is noise:
# a PDB with one replica blocks node drains, and autoscaling has no headroom.
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false

# Backups are for data worth keeping. Demo state is regenerated destructively on
# every upgrade by definition.
backup:
  enabled: false
