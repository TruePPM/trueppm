        - scripts/osv-severity-gate.sh
        - scripts/backup.sh
        - scripts/restore.sh
        - scripts/lib/s3.sh
        - scripts/check-enterprise-imports.sh
        - scripts/check-suppression-issues.sh
        - scripts/helm-netpol-drill.sh
        - scripts/helm-install-drill.sh
        - packages/helm/values.schema.json
        - scripts/check-release-images.sh
        - scripts/tests/rotate-scheduler-changelog.test.sh
        - scripts/tests/assemble-changelog.test.sh
        - scripts/tests/release-staging.test.sh
        - scripts/tests/release-preflight.test.sh
        - scripts/tests/wt-args.test.sh
        - scripts/tests/wt-prune.test.sh
        - scripts/tests/wt-reserve.test.sh
        - scripts/tests/wt-stash.test.sh
        - scripts/tests/wt-testdb.test.sh
        - scripts/tests/osv-severity-gate.test.sh
        - scripts/tests/backup-s3.test.sh
        - scripts/tests/check-enterprise-imports.test.sh
        - scripts/tests/check-suppression-issues.test.sh
        - scripts/tests/helm-netpol-probe.test.sh
        - scripts/tests/helm-celery-probe-overrides.test.sh
        - scripts/tests/helm-upgrade-leg-version.test.sh
        - scripts/tests/helm-sentinel-schema-experimental.test.sh
        - scripts/tests/check-release-images.test.sh
        - scripts/check-migration-constraint-safety.py
        - scripts/tests/check-migration-constraint-safety.test.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/rotate-scheduler-changelog.sh
        - scripts/assemble-changelog.sh
        - scripts/release.sh
        - scripts/wt
        - scripts/osv-severity-gate.sh
        - scripts/backup.sh
        - scripts/restore.sh
        - scripts/lib/s3.sh
        - scripts/check-enterprise-imports.sh
        - scripts/check-suppression-issues.sh
        - scripts/helm-netpol-drill.sh
        - scripts/helm-install-drill.sh
        - packages/helm/values.schema.json
        - scripts/check-release-images.sh
        - scripts/tests/rotate-scheduler-changelog.test.sh
        - scripts/tests/assemble-changelog.test.sh
        - scripts/tests/release-staging.test.sh
        - scripts/tests/release-preflight.test.sh
        - scripts/tests/wt-args.test.sh
        - scripts/tests/wt-prune.test.sh
        - scripts/tests/wt-reserve.test.sh
        - scripts/tests/wt-stash.test.sh
        - scripts/tests/wt-testdb.test.sh
        - scripts/tests/osv-severity-gate.test.sh
        - scripts/tests/backup-s3.test.sh
