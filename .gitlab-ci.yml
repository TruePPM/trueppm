ci:mirror-playwright-base:
  # Ensure the upstream Playwright base image is mirrored into our own GitLab
  # Container Registry so the rest of CI never pulls it anonymously from
  # mcr.microsoft.com. Microsoft throttles cold anonymous pulls from CI runner
  # IPs (401/429 on its oauth2/token endpoint); an isolated dind daemon hits that
  # on every build. Our registry has no such limit and dind authenticates to it
  # via CI_REGISTRY creds.
  #
  # This is the ONLY job that pulls from MCR. Every Playwright-based job —
  # ci:build-integration-image's FROM, and the web:e2e / web:e2e:report /
  # web:e2e:coverage / website:build jobs' `image:` — consumes the mirror
  # tag ($CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG) instead of
  # mcr.microsoft.com. The DAG (needs:) consumers declare an optional need on
  # this job so they wait for it when it is in the pipeline (a bump) and pull the
  # existing tag when it is not (steady state); the stage-ordered consumer
  # (website:build) runs in a later stage so the lint-stage mirror precedes it
  # without an explicit need. `pages` is deliberately NOT in this list: it
  # publishes website:build's artifact and runs no build, so it needs no
  # Chromium and stays on the plain node:22-alpine base (#2799).
  #
  # It is an idempotent gate that ci:build-integration-image `needs:`, sharing
  # the build's rules so the two are always co-present — guaranteeing the mirror
  # exists before the build resolves its FROM (no manual ordering, no race). A
  # Playwright bump touches integration.Dockerfile (bump the tag there, in the
  # PLAYWRIGHT_BASE_TAG variable, and in the packages/web + packages/website
  # package.json pins together — four places, enforced by web:playwright-pins;
  # this note used to say "the playwright configs", which named a file carrying
  # no version at all and omitted packages/website entirely, #2797), which
  # trips these rules and refreshes the mirror before the bumped consumers pull.
  # It is a fast no-op when the tag is already mirrored (`docker manifest
  # inspect` short-circuits before any MCR traffic); it only pulls from MCR when
  # the tag is genuinely missing — a fresh mirror or a Playwright bump — and the
  # weekly schedule refreshes it. The cold pull is wrapped in exponential-backoff
  # retry since that one pull may still hit the throttle window; once pushed, the
  # mirror tag persists until the bump.
  #
  # `.gitlab-ci.yml` is in the rules because PLAYWRIGHT_BASE_TAG is declared here
  # and now names the derived ci-integration tag too (#2825) — a pipeline that
  # changes the variable has to build both tags, or the consumers reference an
  # image nobody pushed.
  stage: lint
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CLI_EXPERIMENTAL: "enabled"
    SRC: "mcr.microsoft.com/playwright:$PLAYWRIGHT_BASE_TAG"
    DEST: "$CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/scheduler/pyproject.toml
        - packages/api/pyproject.toml
        - .gitlab/ci-images/integration.Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/scheduler/pyproject.toml
        - packages/api/pyproject.toml
        - .gitlab/ci-images/integration.Dockerfile
        - .gitlab-ci.yml
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Already mirrored (steady state) — skip without touching MCR. The schedule
    # run forces a refresh by ignoring this short-circuit.
    - |
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ] && docker manifest inspect "$DEST" >/dev/null 2>&1; then
        echo "$DEST already present — skipping MCR mirror."
        exit 0
      fi
    - |
      attempt=1
      max_attempts=5
      delay=30
      until docker pull "$SRC"; do
        if [ "$attempt" -ge "$max_attempts" ]; then
          echo "docker pull $SRC failed after ${max_attempts} attempts" >&2
          exit 1
        fi
        echo "pull attempt ${attempt} failed (MCR throttle?); retrying in ${delay}s..." >&2
        sleep "$delay"
        attempt=$((attempt + 1))
        delay=$((delay * 2))
      done
    - docker tag "$SRC" "$DEST"
    - docker push "$DEST"

ci:build-integration-image:
  # Rebuild and push the custom ci-integration image used by web:integration.
  # Bakes Python 3 + libpq-dev + gcc + uvicorn + scheduler[dev] + api[dev]
  # dev-deps on top of the Playwright image so the integration job skips
  # the ~3min apt+pip cold install on every main run.
  #
  # Trigger: same shape as ci:build-api-image — Dockerfile / pyproject changes,
  # plus the weekly scheduled run. Validated on MR pipelines when the relevant
  # files change so a broken Dockerfile is caught before merge; web:integration
  # itself is main-only and pulls the existing registry tag in steady state.
  #
  # Builds FROM our registry mirror of the Playwright base via the
  # PLAYWRIGHT_BASE build-arg, so this job — which runs on every qualifying MR —
  # never pulls from the throttled MCR endpoint. `needs: ci:mirror-playwright-base`
  # guarantees the mirror tag exists before the FROM is resolved; that gate is a
  # no-op in steady state, so the dependency costs nothing once mirrored.
  #
  # The tag carries $PLAYWRIGHT_BASE_TAG and must keep carrying it (#2825). This
  # image was tagged `:noble` — a name that never changed when its contents did.
  # Our runners pull `if-not-present`, so on the 1.62.1 bump each one served
  # whatever `:noble` it had cached instead of the freshly pushed digest, and
  # every web:integration spec died at `browserType.launch: Executable doesn't
  # exist at /ms-playwright/chromium_headless_shell-<rev>` — npm's
  # @playwright/test resolves the browser through a version-stamped path and
  # never re-downloads, so a base/package mismatch is a hard failure. `needs:`
  # does not help: it orders the jobs, but nothing makes a runner re-pull a tag
  # it already holds. Version-stamping mints a tag name no runner can have
  # cached, which is precisely why every playwright-base:$PLAYWRIGHT_BASE_TAG
  # consumer (web:e2e, website:build, pages) survived the same pipeline. Do not
  # "simplify" this back to a fixed tag; `pull_policy: always` is not an
  # available substitute — these are self-hosted group runners and the job would
  # be rejected unless their allowed_pull_policies is widened first.
  stage: lint
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs:
    - job: ci:mirror-playwright-base
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE/ci-integration:$PLAYWRIGHT_BASE_TAG"
    PLAYWRIGHT_BASE: "$CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/scheduler/pyproject.toml
        - packages/api/pyproject.toml
        - .gitlab/ci-images/integration.Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/scheduler/pyproject.toml
        - packages/api/pyproject.toml
        - .gitlab/ci-images/integration.Dockerfile
        - .gitlab-ci.yml
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE" || true
    - docker build
        --build-arg PLAYWRIGHT_BASE="$PLAYWRIGHT_BASE"
        --cache-from "$IMAGE"
        --tag "$IMAGE"
        --file .gitlab/ci-images/integration.Dockerfile
        .
    - docker push "$IMAGE"

ci:build-keycloak-image:
  # Bake the static realm export into a Keycloak service image for the nightly
  # sso:integration smoke (#2274). GitLab `services:` containers cannot mount the
  # job checkout, so the realm JSON must live in the image — this job builds it
  # (mirrors ci:build-integration-image). FROM quay.io/keycloak (not the throttled
  # MCR Playwright base), so no mirror dependency.
  #
  # Trigger: the Dockerfile or realm export changes (validated on MR so a broken
  # realm is caught pre-merge), OR the nightly SSO schedule (so sso:integration
  # always pulls a fresh image). sso:integration `needs:` this job (optional), and
  # pulls the existing registry tag in steady state.
  stage: lint
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE/ci-keycloak:26"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SSO_NIGHTLY == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - .gitlab/ci-images/keycloak.Dockerfile
        - .gitlab/keycloak/trueppm-realm.json
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab/ci-images/keycloak.Dockerfile
        - .gitlab/keycloak/trueppm-realm.json
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE" || true
    - docker build
        --cache-from "$IMAGE"
        --tag "$IMAGE"
        --file .gitlab/ci-images/keycloak.Dockerfile
        .
    - docker push "$IMAGE"

scheduler:lint:
  extends: [.scheduler, .fast-job]
  stage: lint
  <<: *rules-scheduler
  script:
    - cd packages/scheduler
    - ruff check src/ tests/
    - ruff format --check src/ tests/

api:extension-signals:
  extends: .fast-job
  # Every OSS→Enterprise extension signal must dispatch robustly (#2606).
  #
  # `Signal.send()` propagates a receiver's exception to the sender, so a bug in
  # an enterprise receiver breaks the OSS write path that fired it — inverting
  # the boundary contract that OSS works regardless of what enterprise does.
  # `history_record_created` is fired from the post_save of every Historical* row
  # for Project, Task and Dependency, so it was one receiver away from failing
  # every task save in the product.
  #
  # The invariant was documented in five skills and honored at 7 of 15 sites,
  # which is the case for a gate rather than a convention. The signal set is
  # discovered from the `= Signal()` declarations rather than hardcoded, so a
  # NEW extension point written in the old style is caught — that being the
  # failure mode this actually has to catch.
  #
  # A fail-closed veto (a receiver raising IS the mechanism) keeps .send() and is
  # allowed by a FAIL-CLOSED comment above the call. Grep + sed; ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    - bash scripts/check-extension-signals.sh

demo:readonly-posture:
  extends: .fast-job
  # The hosted demo must stay read-only by construction (#2773, gates #2271).
  #
  # `try.trueppm.com` has no login-capable account, because `seed_demo_project`
  # runs without `--with-personas` in both deployment manifests. No account means
  # no token, which means the ungoverned `legacy:full` write path (#2749) is not
  # reachable from the public internet. That is the whole security argument for
  # publishing the demo at all.
  #
  # It was enforced by the absence of a flag in two YAML files and by nothing
  # else — no test, no lint, no review checklist. Adding it back is a one-line
  # change someone makes for a sales walkthrough, at launch, under time pressure,
  # which is exactly when #2271 is being worked.
  #
  # The runtime half (zero login-capable accounts, no registration route, GET-only
  # public surface) is pytest, in
  # packages/api/tests/apps/projects/test_demo_readonly_posture.py. This job is
  # the manifest half, which pytest cannot see because nothing imports those
  # files. Comments naming the flag are ignored — both manifests document why it
  # is absent, and that prose is worth keeping. bash + grep; ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    # Self-test first: a guard nobody has watched fail is indistinguishable from
    # one with a typo in its pattern.
    - bash scripts/check-demo-readonly.sh --self-test
    - bash scripts/check-demo-readonly.sh

web:playwright-pins:
  extends: .fast-job
  # The Playwright npm version must equal the tag of the image the Playwright
  # jobs run in (#2797).
  #
  # The mcr.microsoft.com/playwright image bakes browsers into a version-stamped
  # path, and a Playwright package only looks in the path matching its own
  # revision — so a mismatch is a hard "Executable doesn't exist" on launch, not
  # a soft degrade. In web:e2e that is loud. In website:build it is SILENT:
  # Astro's content loader catches the throw, drops the whole page body, emits
  # the HTML anyway, and exits 0. Three docs pages published as bare navigation
  # chrome for 19 days across green pipelines.
  #
  # The version lives in four places with no automatic relationship — the CI
  # variable, the integration Dockerfile ARG, and two package.json/lock pairs —
  # so nothing but this job ties them together. It runs in the lint stage rather
  # than gating website:build because the answer is static: it needs no install,
  # no build, and no network. python3 for the lockfile JSON; ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep sed python3
  script:
    # Self-test first: this gate's failure mode produces a GREEN pipeline, so
    # "it passed" is not evidence that it can still fail.
    - bash scripts/check-playwright-pins.sh --self-test
    - bash scripts/check-playwright-pins.sh

web:row-vocabulary:
  extends: .fast-job
  # The outline's governed vocabulary, written anywhere but its module (#3031).
  #
  # A row in the outline may be a task, a phase, a milestone or a subtask, and
  # `structure_role` is declared only once something declares it (ADR-0843). On
  # the surfaces that exist BEFORE the type does — column headers, create
  # affordances, placeholders, and the name a create path mints — the noun must
  # be "item", because any other noun is a claim about a row nobody has made.
  #
  # This is a CI job rather than a review habit because the rule reaches things
  # no reviewer thinks of as copy. #3027's instance was `+ Item` creating a row
  # literally NAMED "New task" — invisible to a sweep looking at button labels,
  # and it persisted into the plan, the WBS and the rollup if the user pressed
  # Escape. That was the SECOND hand sweep; web rule 300 says a rule needing a
  # second one has no working mechanism.
  #
  # Note the primary mechanism is the type system, not this job: governed copy
  # is a branded `VocabularyToken` only `rowVocabulary.ts` can mint, so a literal
  # in a governed prop does not compile. This covers the residual — a component
  # that renders a governed surface without going through the module at all.
  #
  # Runs in the lint stage: no install, no build, no network. ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep python3
  script:
    # Self-test first: a passing run looks the same whether the gate works or
    # its patterns have drifted to match nothing.
    - bash scripts/check-row-vocabulary.sh --self-test
    - bash scripts/check-row-vocabulary.sh

web:rule-numbers:
  extends: .fast-job
  # Two rules in packages/web/CLAUDE.md sharing a number (#2933).
  #
  # Rule numbers are that file's addressing scheme: GanttRenderer.ts and
  # ADR-0803 both cite "rule 295" and expect one answer. For months there were
  # two, because two branches in flight each took the next free number, each was
  # locally correct, and nothing compared them.
  #
  # That is the whole reason this is a CI job rather than a review habit: the
  # duplicate does not exist on either branch — it comes into being on the
  # MERGED tree, which is the one tree neither author's pipeline ever built.
  #
  # Runs in the lint stage: no install, no build, no network. ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep
  script:
    # Self-test first: a passing run looks the same whether the gate works or
    # its pattern has drifted to match nothing.
    - bash scripts/check-web-rule-numbers.sh --self-test
    - bash scripts/check-web-rule-numbers.sh

helm:metric-names:
  extends: .fast-job
  # The chart's PromQL must only name series the application emits (#2805).
  #
  # The shipped dead-letter alert and Grafana panel queried
  # `trueppm_deadletter_parked` while the app emitted
  # `trueppm_task_dead_letter_parked`. Prometheus treats a name with no series as
  # an empty vector, not an error — so the alert could never fire, the panel was
  # permanently blank, and permanently-lost background work went unnoticed with
  # every gate in this file green. `helm lint` proves the template renders; it
  # cannot know what the application publishes, and the docs pages (which had the
  # name right) are not machine-checked against the chart.
  #
  # Rules are deliberately unconditional rather than *rules-helm: the two halves
  # of this contract live in different trees, so the drift can be introduced by a
  # chart-only MR OR by an api-only rename, and a change-gated job would miss one
  # direction. Stdlib Python over two chart files; well under a second.
  stage: lint
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Self-test first: a guard nobody has watched fail is indistinguishable from
    # one with a typo in its pattern.
    - python3 scripts/check-helm-metric-names.py --self-test
    - python3 scripts/check-helm-metric-names.py .

nginx:headers:
  extends: .fast-job
  # All five nginx configs must agree on one hardening baseline (#2849).
  #
  # TruePPM serves the SPA from five separate nginx configs — two compose
  # templates, the public-demo template, the config baked into the published web
  # image, and the chart's web ConfigMap (prod + demo branches) — and until this
  # job nothing compared them to each other. Two defects fell straight out of
  # that gap: the Helm production branch rendered the SPA with ZERO security
  # response headers while both compose paths set four (and Helm is the path the
  # docs recommend for production), and the image-baked config still proxied
  # /admin/ wide open and unthrottled long after #2569 hardened the three
  # *rendered* configs. Same shape both times — a fix applied at its instances,
  # with nothing enumerating the instances as a set.
  #
  # Rules are deliberately unconditional rather than *rules-helm: the five halves
  # of this contract live in three different trees (nginx/, packages/web/,
  # packages/helm/), so the drift can be introduced from any of them and a
  # change-gated job would miss the direction it was not scoped to. bash + awk
  # over four files plus two `helm template` renders; seconds, no cluster.
  stage: lint
  image:
    name: alpine/helm:3.14.0@sha256:a90798c9c2b671e3546b10db1ae0b845f9abccc9f9ff79b34744a1ba146b67ed
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    # Self-test first: this gate's failure mode is a GREEN pipeline over a
    # silently-unhardened deployment path, so "it passed" is not evidence that it
    # can still fail. The self-test replays both #2849 shapes as fixtures.
    - bash scripts/check-nginx-security-headers.sh --self-test
    - bash scripts/check-nginx-security-headers.sh

api:lint:
  extends: .fast-job
  stage: lint
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  cache:
    <<: *api-cache
    policy: pull
  <<: *rules-api
  before_script:
    - pip install ruff --quiet
  script:
    - cd packages/api
    - ruff check src/ tests/
    - ruff format --check src/ tests/

web:lint:
  extends: [.web, .fast-job]
  stage: lint
  <<: *rules-web
  script:
    - npm run lint

mobile:lint:
  extends: [.mobile, .fast-job]
  stage: lint
  <<: *rules-mobile
  script:
    - npm run lint

wasm:lint:
  extends: [.wasm, .fast-job]
  stage: lint
  <<: *rules-wasm
  script:
    - cargo clippy --all-targets -- -D warnings

helm:lint:
  extends: .fast-job
  image:
    name: alpine/helm:3.14.0@sha256:a90798c9c2b671e3546b10db1ae0b845f9abccc9f9ff79b34744a1ba146b67ed
    entrypoint: [""]
  stage: lint
  <<: *rules-helm
  script:
    - helm lint packages/helm/
    # Lint each shipped overlay too (#2879). `helm lint` validates values against
    # values.schema.json, and the schema is the only thing that catches a values key
    # no template reads — an unknown or misspelled key is otherwise accepted in
    # silence and changes nothing on the pod (the #2860 mechanism). Linting the
    # default values alone would leave the overlays uncovered. Each overlay is given
    # the minimum extra --set it needs to RENDER, so a schema violation is the only
    # thing that can fail here.
    - helm lint packages/helm/ -f packages/helm/values-dev.yaml
    - |
      helm lint packages/helm/ -f packages/helm/values-prod.yaml \
        --set 'env.DATABASE_URL=postgres://u:p@db.example.com:5432/trueppm?sslmode=require' \
        --set 'env.REDIS_URL=redis://cache.example.com:6379/0'
    - |
      helm lint packages/helm/ -f packages/helm/values-demo.yaml \
        --set demo.baseUrl=https://demo.example.com \
        --set demo.shareToken.schedule=ci-schedule-token \
        --set demo.shareToken.board=ci-board-token
    # Guard the bug class from #777: a `DJANGO_SETTINGS_MODULE` typo in the chart
    # (e.g. `settings.production` vs the real `settings.prod`) crash-loops every
    # fresh deploy yet passes `helm lint` silently. Verify every settings module
    # the chart names actually exists in packages/api. Dependency-free (no
    # `helm template`, which would require the subcharts to be built first).
    - |
      fail=0
      for mod in $(grep -rhoE 'trueppm_api\.settings\.[a-z_]+' packages/helm/ | sort -u); do
        f="packages/api/src/$(echo "$mod" | tr '.' '/').py"
        if [ ! -f "$f" ]; then
          echo "ERROR: chart references settings module '$mod' but $f does not exist"
          fail=1
        fi
      done
      [ "$fail" -eq 0 ] || exit 1

helm:template:
  # Static deploy-contract gate (#2279): render the chart and prove the manifests
  # are (a) schema-valid and (b) still honor the runtime invariants the beta-QA
  # plan §2.4 checks by hand. `helm lint` only proves the templates PARSE;
  # kubeconform proves every rendered object validates against the Kubernetes API
  # schema, and helm-structure-check.sh asserts the deploy contract that a refactor
  # could silently break (init-container order, secret propagation to the init
  # containers, the shared admin-password emptyDir). No cluster — always-on,
  # seconds, zero flake. The runtime half lives in helm:install below.
  extends: .fast-job
  image:
    name: alpine/helm:3.14.0@sha256:a90798c9c2b671e3546b10db1ae0b845f9abccc9f9ff79b34744a1ba146b67ed
    entrypoint: [""]
  stage: lint
  <<: *rules-helm
  variables:
    KUBECONFORM_VERSION: "0.6.7"
    YQ_VERSION: "4.44.3"
  before_script:
    - apk add --no-cache bash curl tar
    - curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
    - curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
    - chmod +x /usr/local/bin/yq
  script:
    # Render the full chart the way a real deploy is shaped (a released image tag
    # + an operator envFrom secret) so kubeconform validates concrete manifests.
    - helm template trueppm packages/helm --set image.tag=latest --set 'envFrom[0].secretRef.name=trueppm-env' > /tmp/rendered.yaml
    # -ignore-missing-schemas: PrometheusRule is a CRD with no upstream schema; all
    # core kinds (Deployment/Service/Secret/NetworkPolicy/...) are still validated.
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml
    - bash scripts/helm-structure-check.sh packages/helm
    # Demo mode (#2440, ADR-0658) is gated behind demo.enabled, so the default
    # render above never reaches templates/demo-seed-job.yaml or the demo branch of
    # the web ConfigMap — the whole mode would ship unvalidated. Render it too.
    - |
      helm template trueppm packages/helm -f packages/helm/values-demo.yaml \
        --set image.tag=latest \
        --set demo.baseUrl=https://demo.example.com \
        --set demo.shareToken.schedule=ci-schedule-token \
        --set demo.shareToken.board=ci-board-token > /tmp/rendered-demo.yaml
    - kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered-demo.yaml
    # The demo's security model IS the nginx allowlist: /admin/, /ws/ and every
    # /api/ route other than the share projections and the liveness probe must be
    # closed. A regression here silently publishes the authenticated API — the
    # exact defect security review caught pre-merge on #2440 — so assert it rather
    # than trusting the template to stay correct.
    - |
      for closed in 'location /admin/' 'location /ws/' 'location /api/'; do
        grep -A1 -F "$closed" /tmp/rendered-demo.yaml | grep -q 'return 404' \
          || { echo "DEMO ALLOWLIST REGRESSION: '$closed' no longer returns 404"; exit 1; }
      done
    # Block scalars, not plain ones: an unquoted YAML scalar cannot contain ": ",
    # so the message text would be parsed as a mapping and reject the whole file.
    - |
      grep -q 'location \^~ /api/v1/share/' /tmp/rendered-demo.yaml \
        || { echo "DEMO BROKEN: share projections not proxied"; exit 1; }
    - |
      grep -q 'X-Robots-Tag' /tmp/rendered-demo.yaml \
        || { echo "DEMO REGRESSION: noindex header missing"; exit 1; }
    # The demo serves the SPA to the public internet with no login in front of
    # it, so its header set is not optional and not operator-tunable (#2849).
    # nginx:headers proves all five configs agree; this pins the demo's own.
    - |
      grep -q "frame-ancestors 'none'" /tmp/rendered-demo.yaml \
        || { echo "DEMO REGRESSION: the public demo SPA has no Content-Security-Policy (#2849)"; exit 1; }
    # The PRODUCTION render needs the same scrutiny the demo render gets above.
    # Asserting /admin/ only on the demo render is exactly how #2569 shipped: the
    # production block proxied Django admin unrestricted and unthrottled — against
    # the superuser the `bootstrap` initContainer creates on every deploy — while
    # this job stayed green. helm-structure-check.sh asserts the full contract
    # (allow-before-deny ordering, limit_req zone declared); this keeps the
    # headline invariant visible right next to its demo counterpart.
    - |
      grep -A14 -F 'location /admin/' /tmp/rendered.yaml | grep -qE '^\s+deny all;' \
        || { echo "PROD REGRESSION: /admin/ no longer denies by default — a default install publishes Django admin (#2569)"; exit 1; }
    - |
      grep -A14 -F 'location /admin/' /tmp/rendered.yaml | grep -q 'limit_req zone=admin_login' \
        || { echo "PROD REGRESSION: /admin/ login is no longer rate-limited (#2569)"; exit 1; }
    # Transport limits must clear the application upload caps (#2604). Before 0.4
    # the ingress shipped `annotations: {}` and the production nginx branch
    # declared no client_max_body_size at all, so both inherited a 1m default
    # against app caps of 10-50 MB: every import above 1 MB failed at the edge
    # with a bare 413 and the app never saw the request. Assert both, because a
    # values-file tidy-up is exactly how the empty map came back.
    - |
      grep -q 'client_max_body_size 50M;' /tmp/rendered.yaml \
        || { echo "PROD REGRESSION: web nginx no longer clears the 50 MB app upload cap (#2604)"; exit 1; }
    - |
      helm template trueppm packages/helm --set image.tag=latest --set ingress.enabled=true \
        | grep -q 'nginx.ingress.kubernetes.io/proxy-body-size: 50m' \
        || { echo "PROD REGRESSION: ingress no longer raises proxy-body-size — a default install 413s every import >1 MB (#2604)"; exit 1; }
    # The demo keeps its own 1M ceiling: it is read-only and imports nothing. If
    # web.maxBodySize ever leaks into the demo branch, the demo has silently
    # gained a 50 MB upload surface.
    - |
      grep -q 'client_max_body_size 1M;' /tmp/rendered-demo.yaml \
        || { echo "DEMO REGRESSION: demo no longer pins its 1M upload ceiling (#2604)"; exit 1; }
    # And the inverse: none of this may leak into a normal deploy. Scoped to the
    # Job kind, not a bare grep: the datastore NetworkPolicy allow-lists name
    # `demo-seed` as a client selector unconditionally (#2560), and a selector
    # matching a pod that does not exist is inert, not a leak.
    - |
      yq ea 'select(.kind == "Job") | .metadata.name' /tmp/rendered.yaml | grep -q 'demo-seed' \
        && { echo "LEAK: demo Job rendered with demo.enabled=false"; exit 1; } || true
    - |
      grep -q 'X-Robots-Tag' /tmp/rendered.yaml \
        && { echo "LEAK: demo noindex rendered into a non-demo release"; exit 1; } || true

ci:build-deploy-images:
  # Build the deployable api + web runtime images from the CURRENT COMMIT's code
  # and tag them $CI_COMMIT_SHA (#2284). This is the prerequisite that lets
  # helm:install below drill the HEAD chart against HEAD application code instead
  # of the last released tag — closing the version-skew hole that forced the
  # drill advisory (a chart assumption ahead of a release, e.g. the /readyz probe,
  # no longer red-Xes against a stale image).
  #
  # Internal GitLab Container Registry only — this is a transient, per-commit
  # drill artifact, NOT a public release. The Trivy scan, SBOM, GHCR mirror, and
  # Cosign signing live on api:publish / web:publish (tag-triggered); duplicating
  # them here would tax every chart/CI MR for no release value.
  #
  # Rules mirror helm:install EXACTLY so the two always co-occur (helm:install
  # `needs:` this job non-optionally). kind-in-dind + docker build both need the
  # privileged docker:27-dind service.
  stage: test
  interruptible: false
  timeout: 25m
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # The changes: list is the UNION of every drill that `needs:` this job —
  # helm:install, compose:prod (#2817) AND helm:netpol (#2944). It has to be a
  # superset: a drill scheduled without this job is a pipeline configuration
  # error that fails the whole pipeline instantly with zero jobs, not a skipped
  # drill. helm-netpol-drill.sh was missing here until #2944, so an MR touching
  # only that script scheduled helm:netpol against a `needs:` that did not exist.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: &deploy-drill-paths
        - packages/helm/**/*
        - scripts/helm-install-drill.sh
        - scripts/prod-compose-drill.sh
        - scripts/helm-netpol-drill.sh
        - docker-compose.prod.yml
        - init-prod.sh
        - .env.example
        - nginx/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *deploy-drill-paths
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      API_IMAGE="${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}"
      WEB_IMAGE="${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
      # api: context = repo root, Dockerfile under packages/api (mirrors api:publish).
      # --cache-from the published :latest layers so a no-op rebuild is cheap.
      docker pull "${CI_REGISTRY_IMAGE}/api:latest" || true
      docker build -f packages/api/Dockerfile \
        --cache-from "${CI_REGISTRY_IMAGE}/api:latest" \
        -t "$API_IMAGE" .
      docker push "$API_IMAGE"
      # web: context = packages/web (mirrors web:publish's `cd packages/web`).
      docker pull "${CI_REGISTRY_IMAGE}/web:latest" || true
      docker build \
        --cache-from "${CI_REGISTRY_IMAGE}/web:latest" \
        -t "$WEB_IMAGE" packages/web
      docker push "$WEB_IMAGE"

helm:install:
  # Runtime deploy smoke test on a real kind cluster (#2279): the half helm:template
  # cannot reach — actually BOOT the chart. Installs the HEAD chart against the
  # per-commit image built by ci:build-deploy-images (#2284, tag $CI_COMMIT_SHA),
  # waits for full rollout, runs `helm test` (migrate->bootstrap->api /readyz),
  # asserts the admin password is retrievable from the shared emptyDir, and a
  # negative probe proves the settings.prod SECRET_KEY guard fails closed. See
  # scripts/helm-install-drill.sh.
  #
  # Trigger: chart / CI changes on MR + main, plus the nightly schedule.
  # BLOCKING on MR + main (#2284): now that the drill runs HEAD chart against HEAD
  # app code, a red means a real deploy regression, not version skew — so it gates
  # the merge. Schedule stays advisory (allow_failure) so a nightly infra blip on
  # the shared pipeline is a signal, not a hard red. The static deploy-contract
  # gate is helm:template above; this is the runtime half. It already earned its
  # keep: it caught the web nginx upstream mismatch now fixed in-chart (#2283).
  # kind-in-dind needs the privileged docker:27-dind service (same as the image
  # build jobs). Not `interruptible` so a rebased push doesn't abort a cluster
  # mid-provision and leak it. `needs:` the image build so it drills real code.
  stage: test
  interruptible: false
  timeout: 25m
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs:
    - job: ci:build-deploy-images
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.3"
    RELEASE_IMAGE_TAG: "$CI_COMMIT_SHA"
    APISERVER_HOST: "docker"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/helm/**/*
        - scripts/helm-install-drill.sh
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/helm/**/*
        - scripts/helm-install-drill.sh
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache bash curl
    - curl -sSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64" && chmod +x /usr/local/bin/kind
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
    - curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp linux-amd64/helm && mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
  script:
    - bash scripts/helm-install-drill.sh

compose:prod:
  # Production docker-compose BOOT drill (#2817): the runtime half of the
  # prod-compose completeness fix (#2804, !1945), whose three fixes were all
  # verified by `docker compose config` rendering and unit-level contract tests
  # — nothing ever started the stack. A compose file renders green and
  # crash-loops; a service is declared and never dispatches. This job boots the
  # documented single-server path (init-prod.sh + docker-compose.prod.yml,
  # unmodified) from a filled .env.example and asserts the api clears its three
  # settings.prod boot guards, /api/v1/readyz goes ready through nginx,
  # /api/v1/health/beat/ returns 200 (proving celery-beat actually heartbeats),
  # and the stack survives `docker compose restart api`. Tears down with -v.
  # See scripts/prod-compose-drill.sh for the full rationale.
  #
  # Mirrors helm:install (#2279), which already caught a real deploy regression
  # (#2283); the prod compose path — the primary story the 0.4 operator on-ramp
  # documents — had no equivalent. BLOCKING on MR + main for the same reason:
  # `needs:` ci:build-deploy-images means it drills HEAD chart-equivalents
  # against HEAD application code, so a red is a real deploy regression rather
  # than version skew. Schedule stays advisory so a nightly infra blip on the
  # shared runner is a signal, not a hard red.
  #
  # Not `interruptible`: a rebased push must not abort a half-created stack and
  # leak its containers and volumes into the dind daemon.
  #
  # This job is the PLAIN-HTTP leg (TLS_MODE=none). compose:prod:tls below is
  # its sibling and boots the TLS template; see that job for why the split
  # exists (#2829).
  stage: test
  interruptible: false
  timeout: 25m
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs:
    - job: ci:build-deploy-images
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    RELEASE_IMAGE_TAG: "$CI_COMMIT_SHA"
    # The dind service publishes the stack's port 80 under this hostname, and it
    # is also what lands in the Host header, so it must be in ALLOWED_HOSTS —
    # the drill writes it there.
    PROBE_HOST: "docker"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *deploy-drill-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *deploy-drill-paths
  before_script:
    # docker-compose-plugin, curl and python3 are not in the docker:27 image.
    # openssl is what init-prod.sh mints the self-signed lineage with in the
    # TLS leg; it costs nothing here and keeps the two jobs on one before_script.
    - apk add --no-cache bash curl python3 openssl docker-cli-compose
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
  script:
    - bash scripts/prod-compose-drill.sh

compose:prod:tls:
  # The TLS leg of the prod compose boot drill (#2829).
  #
  # compose:prod boots `TLS_MODE=none`, which selects nginx/app-http.conf.template.
  # `nginx/app.conf.template` — the TLS variant, and a genuinely DIFFERENT FILE —
  # had therefore never been started by anything except a human on tag day. That
  # is the same coverage the nginx service itself had before #2817, and #2828
  # then found FOUR independently fatal faults in it, every one of which
  # `docker compose config` and the structural contract tests rendered happily.
  # Assuming the TLS variant is fine, given that base rate, is not a neutral
  # assumption — which is the whole argument of #2829.
  #
  # `selfsigned` rather than `letsencrypt`: init-prod.sh mints the lineage with
  # openssl, so this needs no domain, no ACME server, and no egress, while
  # exercising the identical template, the identical certificate paths, and the
  # identical nginx service. On top of what compose:prod already asserts, this
  # leg adds HTTPS on :443, the :80 → :443 redirect, HSTS, and — the one that
  # matters most — that `/.well-known/acme-challenge/` is served from the
  # webroot over plain HTTP and is NOT swallowed by the redirect. That last
  # assertion is the `certbot renew -a webroot` contract; break it and the
  # certificate still issues, then fails to renew at ~60 days, with nothing in
  # CI to say so.
  #
  # What is still uncovered, and stays a tag-day manual smoke: the `--standalone`
  # first issuance and the standalone→webroot authenticator switch recorded in
  # the renewal lineage. Both need a real ACME exchange (#2804).
  extends: compose:prod
  variables:
    TLS_MODE: "selfsigned"

helm:netpol:
  # Datastore NetworkPolicy ENFORCEMENT drill (#2560). See
  # scripts/helm-netpol-drill.sh for the full rationale and the probe list.
  #
  # helm:install above boots the chart on a kind cluster running the DEFAULT CNI
  # (kindnetd), which does not implement NetworkPolicy — by design, per the kindnet
  # project. So the policy objects are admitted and silently ignored there, and a
  # policy that selected the wrong pods or omitted a legitimate client passed every
  # gate we had. That is not a hypothetical: #2560 found the `backup` CronJob and
  # `demo-seed` Job missing from the ingress allow-list.
  #
  # This job therefore creates its OWN cluster with disableDefaultCNI + Calico and
  # asserts behavior: positive probes (api/worker/beat/backup/demo-seed reach the
  # datastores), negative probes (unlabeled and wrong-component pods are denied),
  # datastore egress default-deny, plus two controls that prove a DENIED result came
  # from the policy rather than from a broken CNI.
  #
  # It is a SEPARATE cluster rather than a flag on helm:install because swapping the
  # CNI there would slow the common deploy smoke test and couple two unrelated
  # failure modes. Same dind + kind-in-dind recipe otherwise.
  stage: test
  interruptible: false
  timeout: 30m
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs:
    - job: ci:build-deploy-images
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.3"
    CALICO_VERSION: "v3.32.1"
    RELEASE_IMAGE_TAG: "$CI_COMMIT_SHA"
    APISERVER_HOST: "docker"
  rules:
    # Schedule stays advisory, matching helm:install: a nightly blip on the shared
    # pipeline (Calico manifest fetch, image pull) is a signal, not a hard red.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    # BLOCKING on MR + main. Scoped to the whole chart rather than just
    # networkpolicy.yaml on purpose: the policy names its allowed clients by
    # `app.kubernetes.io/component`, so ADDING a template that opens a datastore
    # connection breaks isolation without touching the policy file itself — which
    # is precisely how #2560's backup/demo-seed gap went unnoticed.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/helm/**/*
        - scripts/helm-netpol-drill.sh
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/helm/**/*
        - scripts/helm-netpol-drill.sh
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache bash curl
    - curl -sSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64" && chmod +x /usr/local/bin/kind
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
    - curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp linux-amd64/helm && mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
  script:
    - bash scripts/helm-netpol-drill.sh

backup:restore-drill:
  # Restore drill (#320): the standing evidence that scripts/backup.sh and
  # scripts/restore.sh actually work end to end. Seeds a database (required
  # ltree + pg_trgm + btree_gist extensions and two tables with known row counts), backs it up
  # into a single artifact, DROPs the database, restores from the artifact, and
  # asserts the row counts match and the extensions survived. A schema-only proof
  # — it deliberately does NOT boot Django, so it stays self-contained on the
  # Debian-based postgres:16 image (which carries bash + pg_dump/pg_restore/psql/
  # pg_isready), needing no prebaked registry image.
  #
  # Trigger: nightly schedule (catches rot between changes) + any change to the
  # scripts or the CronJob template (and this CI file, so the job tests itself).
  stage: test
  image:
    name: postgres:16
    # The postgres image ENTRYPOINT starts a database; blank it so GitLab runs
    # the job script instead (same override helm:lint uses for alpine/helm).
    entrypoint: [""]
  services:
    # The service reads POSTGRES_DB/USER/PASSWORD from the global variables block.
    - name: postgres:16-alpine
      alias: postgres
    # Object store for the off-cluster leg of the drill (#2611).
    - name: minio/minio:latest
      alias: minio
      command: ["server", "/data"]
      variables:
        MINIO_ROOT_USER: drillkey
        MINIO_ROOT_PASSWORD: "dr/ill+sec:ret12345"
  variables:
    PGPASSWORD: trueppm
    DATABASE_URL: "postgres://trueppm:trueppm@postgres:5432/drilldb"
    # Deliberately NOT named S3_ENDPOINT / S3_BUCKET: backup.sh reads those from
    # the environment, so job-level variables with those names would silently
    # switch the local leg of the drill into upload mode too.
    DRILL_S3_ENDPOINT: "http://minio:9000"
    DRILL_S3_BUCKET: trueppm-drill
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/backup.sh
        - scripts/restore.sh
        - scripts/lib/s3.sh
        - packages/helm/templates/cronjob-backup.yaml
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/backup.sh
        - scripts/restore.sh
        - scripts/lib/s3.sh
        - packages/helm/templates/cronjob-backup.yaml
        - .gitlab-ci.yml
  script:
    - echo "waiting for the postgres service..."
    - until pg_isready -h postgres -U trueppm >/dev/null 2>&1; do sleep 1; done
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    # Seed a representative schema: the three extensions the real schema depends on
    # (ltree powers wbs_path, pg_trgm powers trigram search, btree_gist backs the
    # (project, wbs_path) exclusion constraint) plus two tables with known row
    # counts to assert against after the round-trip.
    - |
      psql "$DATABASE_URL" <<'SQL'
      CREATE EXTENSION IF NOT EXISTS ltree;
      CREATE EXTENSION IF NOT EXISTS pg_trgm;
      CREATE EXTENSION IF NOT EXISTS btree_gist;
      CREATE TABLE projects_project (id serial PRIMARY KEY, name text);
      INSERT INTO projects_project (name) SELECT 'p' || g FROM generate_series(1, 42) g;
      CREATE TABLE projects_task (id serial PRIMARY KEY, wbs_path ltree, title text);
      INSERT INTO projects_task (wbs_path, title)
        SELECT ('1.' || g)::ltree, 't' || g FROM generate_series(1, 100) g;
      SQL
    - BEFORE_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - BEFORE_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - echo "seeded projects=$BEFORE_PROJECTS tasks=$BEFORE_TASKS"
    # 1. back up
    - ./scripts/backup.sh --output-dir "$CI_PROJECT_DIR/drill-backups"
    - ARTIFACT=$(ls -1 "$CI_PROJECT_DIR"/drill-backups/trueppm-backup-*.tar.gz | head -n1)
    - echo "artifact=$ARTIFACT"
    # 2. destroy the source (FORCE drops any lingering connection from pg_dump)
    - psql -h postgres -U trueppm -d trueppm_test -c "DROP DATABASE drilldb WITH (FORCE);"
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    # 3. restore (restore.sh verifies ltree + pg_trgm + btree_gist internally and exits non-zero if absent)
    - ./scripts/restore.sh --artifact "$ARTIFACT" --yes
    # 4. assert the round-trip preserved every row
    - AFTER_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - AFTER_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - echo "restored projects=$AFTER_PROJECTS tasks=$AFTER_TASKS"
    - |
      if [ "$AFTER_PROJECTS" != "$BEFORE_PROJECTS" ] || [ "$AFTER_TASKS" != "$BEFORE_TASKS" ]; then
        echo "RESTORE DRILL FAILED: row counts differ after restore" >&2
        echo "  projects: before=$BEFORE_PROJECTS after=$AFTER_PROJECTS" >&2
        echo "  tasks:    before=$BEFORE_TASKS after=$AFTER_TASKS" >&2
        exit 1
      fi
    - echo "restore drill GREEN — row counts match and required extensions present"
    # ---- 5. off-cluster round trip (#2611) ---------------------------------
    # The local drill above proves the artifact is correct; this proves it can
    # actually reach a bucket and come back. Before #2611 the chart injected a
    # full S3 env contract and the job answered it with an `echo`, so "backups
    # are off-cluster" was true in the runbook and false in the cluster. Only an
    # end-to-end upload/download against a real object store catches that class
    # of gap, so it runs here rather than being asserted in a stub.
    #
    # The MinIO credentials deliberately contain "/" "+" and ":" — a real 40-char
    # AWS secret key is base64 and routinely does. Credential handling that
    # round-trips through a URL corrupts exactly these characters, so a plain
    # alphanumeric secret would let that regression through.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends awscli
    - export AWS_ACCESS_KEY_ID=drillkey AWS_SECRET_ACCESS_KEY='dr/ill+sec:ret12345' AWS_DEFAULT_REGION=us-east-1
    - echo "waiting for the minio service..."
    - |
      i=0
      until aws --endpoint-url "$DRILL_S3_ENDPOINT" s3 ls >/dev/null 2>&1; do
        i=$((i+1)); [ "$i" -ge 60 ] && { echo "minio not ready" >&2; exit 1; }; sleep 1
      done
    - aws --endpoint-url "$DRILL_S3_ENDPOINT" s3 mb "s3://$DRILL_S3_BUCKET"
    # Back up straight to the bucket, then verify the object really landed.
    - ./scripts/backup.sh --output-dir "$CI_PROJECT_DIR/s3-backups" --s3-bucket "$DRILL_S3_BUCKET" --s3-endpoint "$DRILL_S3_ENDPOINT" --s3-prefix drill/daily
    - |
      OBJECTS=$(aws --endpoint-url "$DRILL_S3_ENDPOINT" s3 ls --recursive "s3://$DRILL_S3_BUCKET" | grep -c 'drill/daily/trueppm-backup-.*\.tar\.gz' || true)
      if [ "$OBJECTS" -lt 1 ]; then
        echo "S3 DRILL FAILED: backup.sh reported success but the bucket is empty" >&2
        exit 1
      fi
      echo "bucket holds $OBJECTS artifact(s)"
    # Destroy the database AND every local artifact, so the only surviving copy
    # is the one in the bucket — otherwise --from-s3 could silently be restoring
    # from local disk and the drill would prove nothing.
    - rm -rf "$CI_PROJECT_DIR/s3-backups" "$CI_PROJECT_DIR/drill-backups"
    - psql -h postgres -U trueppm -d trueppm_test -c "DROP DATABASE drilldb WITH (FORCE);"
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    - ./scripts/restore.sh --from-s3 latest --s3-bucket "$DRILL_S3_BUCKET" --s3-endpoint "$DRILL_S3_ENDPOINT" --s3-prefix drill/daily --yes
    - S3_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - S3_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - |
      if [ "$S3_PROJECTS" != "$BEFORE_PROJECTS" ] || [ "$S3_TASKS" != "$BEFORE_TASKS" ]; then
        echo "S3 DRILL FAILED: row counts differ after restoring from the bucket" >&2
        echo "  projects: before=$BEFORE_PROJECTS after=$S3_PROJECTS" >&2
        echo "  tasks:    before=$BEFORE_TASKS after=$S3_TASKS" >&2
        exit 1
      fi
    - echo "S3 round-trip drill GREEN — artifact uploaded, local copies removed, restored from the bucket"

mcp:lint:
  extends: .fast-job
  # Standalone MCP server (packages/mcp, ADR-0186). A pure HTTP client with no
  # prebaked CI image — mirror api:lint's plain-python-slim + pip-install-ruff
  # shape rather than the scheduler's custom-image pattern.
  stage: lint
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  <<: *rules-mcp
  before_script:
    - pip install ruff --quiet
  script:
    - cd packages/mcp
    - ruff check src/ tests/
    - ruff format --check src/ tests/

# ---------------------------------------------------------------------------
# ANALYZE — type-check, static analysis, migration/schema validation.
# Each job uses needs: to start as soon as its package's lint job passes,
# without waiting for other packages' lint jobs.
# ---------------------------------------------------------------------------

scheduler:type-check:
  extends: [.scheduler, .fast-job]
  stage: analyze
  # Two caches: the inherited pip cache (re-stated via the anchor, since a
  # list cache replaces the template's map rather than merging) plus the mypy
  # incremental cache. mypy --strict is cold-slow; persisting .mypy_cache
  # across pipelines turns most runs into incremental re-checks. Keyed on
  # pyproject.toml so a dependency/stub bump resets it cleanly.
  cache:
    - <<: *scheduler-cache
    - key:
        files:
          - packages/scheduler/pyproject.toml
        prefix: scheduler-mypy
      paths:
        - packages/scheduler/.mypy_cache/
  # ci:build-scheduler-image is optional — when deps haven't changed it
  # isn't in the pipeline and the job pulls the existing tag from the
  # registry. Same pattern repeated on every scheduler:* consumer that
  # overrides needs (GitLab replaces needs on extension).
  needs:
    - scheduler:lint
    - job: ci:build-scheduler-image
      optional: true
  <<: *rules-scheduler
  script:
    - cd packages/scheduler
    # Self-heal an occasionally-corrupt restored incremental cache (#2233). mypy
    # exits 2 on a fatal INTERNAL ERROR (distinct from exit 1 = real type errors);
    # on a crash, drop .mypy_cache and retry once from cold so a corrupt cache
    # flakes green instead of failing the pipeline, while genuine type errors
    # still fast-fail. The happy path keeps the incremental speedup.
    - |
      mypy || {
        rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "mypy INTERNAL ERROR (exit 2) — clearing .mypy_cache and retrying cold"
          rm -rf .mypy_cache
          mypy
        else
          exit "$rc"
        fi
      }

api:type-check:
  extends: [.api-no-db, .fast-job]
  stage: analyze
  # Two caches: the inherited pip cache (re-stated via the anchor with its
  # pull policy, since a list cache replaces the template's map rather than
  # merging) plus the mypy incremental cache. mypy --strict is cold-slow;
  # persisting .mypy_cache across pipelines turns most runs into incremental
  # re-checks. Keyed on pyproject.toml so a dependency/stub bump resets it.
  cache:
    - <<: *api-cache
      policy: pull
    - key:
        files:
          - packages/api/pyproject.toml
        prefix: api-mypy
      paths:
        - packages/api/.mypy_cache/
  # ci:build-api-image is optional — when deps haven't changed it isn't in
  # the pipeline and the job pulls the already-published image from the
  # registry. Same pattern repeated on every job that uses the ci-api image.
  needs:
    - api:lint
    - job: ci:build-api-image
      optional: true
  <<: *rules-api
  script:
    - cd packages/api
    # Self-heal an occasionally-corrupt restored incremental cache (#2233). mypy
    # exits 2 on a fatal INTERNAL ERROR (distinct from exit 1 = real type errors);
    # on a crash, drop .mypy_cache and retry once from cold so a corrupt cache
    # flakes green instead of failing the pipeline, while genuine type errors
    # still fast-fail. The happy path keeps the incremental speedup.
    - |
      mypy src/trueppm_api || {
        rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "mypy INTERNAL ERROR (exit 2) — clearing .mypy_cache and retrying cold"
          rm -rf .mypy_cache
          mypy src/trueppm_api
        else
          exit "$rc"
        fi
      }

api:migration-check:
  # makemigrations --check --dry-run compares model state to migration files.
  # No database connection is made; .api-no-db template is sufficient.
  #
  # Runs on every MR pipeline (no `changes:` filter) — kaizen #640 N5. The job
  # is ~36s and catches inter-MR migration drift that the per-MR `changes:`
  # filter misses (two MRs landing close together each pass migration-check on
  # their own diff, but their merged result fails on main).
  extends: [.api-no-db, .fast-job]
  stage: analyze
  needs:
    - job: api:lint
      optional: true
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd packages/api
    - python manage.py makemigrations --check --dry-run

api:migration-numbering:
  # Cross-branch migration-numbering collision guard. makemigrations --check
  # (above) only sees THIS branch's tree, so it cannot catch two parallel
  # branches that each number a migration projects/0080_*.py off the same base:
  # both pass, the first merges, and the second — still on a stale base — merges
  # too, leaving main with two 0080 leaf migrations (a conflict that needs a
  # renumber or a --merge migration, with main red in the meantime).
  #
  # This job compares the branch against origin/main and fails if a NEW migration
  # reuses a number main already assigns to a different migration — the state that
  # becomes a two-leaf conflict at merge, detectable on the second branch BEFORE
  # it merges. Pure git + stdlib Python: no DB, no Django, no dependency install,
  # so before_script (the api[dev] pip install) is skipped. GIT_DEPTH:0 + an
  # explicit fetch make origin/main available under GitLab's shallow clone.
  extends: [.api-no-db, .fast-job]
  stage: analyze
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script: []
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "$CI_DEFAULT_BRANCH" --quiet
    - python3 scripts/check-migration-numbering.py "origin/$CI_DEFAULT_BRANCH"

api:migration-constraint-safety:
  # `AddConstraint` builds and VALIDATES its index against every existing row, so a
  # constraint added to a POPULATED table fails `migrate` on any database already
  # holding a violating row — and migrations run on container start, making that an
  # upgrade crash-loop rather than a failed deploy (#3068).
  #
  # Neither existing migration gate can see this. api:migration-check runs
  # `makemigrations --check --dry-run`, which compares model state to migration files
  # and never opens a database (its own comment says so); api:migration-numbering is a
  # numbering-collision guard. The green api:migration-check on the offending MR read
  # as evidence about the migration when it was evidence about something else.
  #
  # The classification is entirely static, so this is a lint: no Django, no database,
  # no dependency install, seconds. An AddConstraint on a table not created in the same
  # migration must be preceded by a RunPython repair, or carry an explicit
  # `# safe-constraint: <reason>` comment.
  extends: [.api-no-db, .fast-job]
  stage: analyze
  needs:
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script: []
  script:
    - python3 scripts/check-migration-constraint-safety.py

api:openapi-check:
  # drf-spectacular schema generation is pure view/serializer introspection;
  # no database queries are made. --validate checks for valid OpenAPI 3;
  # --fail-on-warn promotes warnings to errors.
  extends: [.api-no-db, .fast-job]
  stage: analyze
  needs:
    - api:lint
    - job: ci:build-api-image
      optional: true
  <<: *rules-api
  script:
    - cd packages/api
    - python manage.py spectacular --validate --file /dev/null

api:schema-drift:
  # Ensures docs/api/openapi.json stays in sync with the live DRF schema.
  # Fails the pipeline if a model/serializer/view change alters the public
  # surface without the committed artifact being regenerated.
  #
  # api:lint is optional because this job's changes: filter includes
  # docs/api/openapi.json — a docs-only branch (e.g. an openapi regen
  # alongside ADR commits) matches this job's rules without matching
  # api:lint's rules-api. needs:optional avoids the "needs job does
  # not exist in the pipeline" creation failure in that case.
  extends: [.api-no-db, .fast-job]
  stage: analyze
  needs:
    - job: api:lint
      optional: true
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/api/**/*
        - packages/scheduler/**/*
        - docs/api/openapi.json
        - scripts/export-openapi.sh
        - .gitlab-ci.yml
  script:
    - ./scripts/export-openapi.sh --check

api:uv-lock-check:
  extends: .fast-job
  # Verify packages/api/uv.lock stays in sync with packages/api/pyproject.toml
  # (#904 supply-chain hardening). Both the api (application) and the scheduler
  # (published library) commit a resolved lockfile — for reproducible installs
  # and a scannable dependency surface (an SCA tool can audit a lockfile; it
  # cannot audit a range). This gate fails if pyproject changed without
  # re-locking; refresh with `cd packages/api && uv lock`. uv is pinned so the
  # committed lock's revision stays stable across CI runs and Renovate's
  # lockFileMaintenance owns the routine refreshes.
  stage: analyze
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/api/pyproject.toml
        - packages/api/uv.lock
        - .gitlab-ci.yml
  before_script:
    - pip install uv==0.9.5 --quiet
  script:
    - cd packages/api
    - uv lock --check

scheduler:uv-lock-check:
  extends: .fast-job
  # Verify packages/scheduler/uv.lock stays in sync with the scheduler's
  # pyproject.toml (#1153 scheduler OSV migration). The scheduler now commits a
  # resolved lock — not to pin the published wheel (it still ships version ranges
  # from pyproject.toml) but to give security:osv a scannable dependency surface
  # (OSV can audit a lockfile; it cannot audit a range). This gate fails if
  # pyproject changed without re-locking; refresh with
  # `cd packages/scheduler && uv lock`. uv is pinned so the committed lock's
  # revision stays stable across CI runs and Renovate's lockFileMaintenance owns
  # the routine refreshes. Mirrors api:uv-lock-check; kept as its own job so a
  # scheduler-only change does not pull in the api manifests and vice versa.
  stage: analyze
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/scheduler/pyproject.toml
        - packages/scheduler/uv.lock
        - .gitlab-ci.yml
  before_script:
    - pip install uv==0.9.5 --quiet
  script:
    - cd packages/scheduler
    - uv lock --check

mcp:uv-lock-check:
  extends: .fast-job
  # Verify packages/mcp/uv.lock stays in sync with packages/mcp/pyproject.toml.
  # Mirrors api:/scheduler:uv-lock-check, and became load-bearing when mcp:publish
  # landed (#2809): that job materializes its CycloneDX SBOM with
  # `uv sync --frozen`, which HARD-FAILS on a stale lock. Without this gate the
  # first symptom of a forgotten `uv lock` would be a red publish job on an
  # already-pushed `mcp-v*` tag — the expensive, mid-release failure mode.
  # Refresh with `cd packages/mcp && uv lock`. uv is pinned so the committed
  # lock's revision stays stable across CI runs and Renovate's
  # lockFileMaintenance owns the routine refreshes.
  stage: analyze
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/mcp/pyproject.toml
        - packages/mcp/uv.lock
        - .gitlab-ci.yml
  before_script:
    - pip install uv==0.9.5 --quiet
  script:
    - cd packages/mcp
    - uv lock --check

web:type-check:
  extends: [.web, .fast-job]
  stage: analyze
  needs: [web:lint]
  <<: *rules-web
  script:
    - npm run typecheck

mcp:typecheck:
  extends: .fast-job
  # mypy --strict over packages/mcp. Uses the custom ci-api image, which now
  # pre-bakes the mcp[dev] wheels (mcp SDK + httpx + stubs) alongside api's; the
  # runtime install is a fast editable re-link, not a cold download. mypy reads
  # the package's own pyproject config (packages = ["trueppm_mcp"], strict).
  # ci:build-api-image is optional — when deps haven't changed it isn't in the
  # pipeline and the job pulls the existing tag from the registry.
  stage: analyze
  image: $CI_REGISTRY_IMAGE/ci-api:py3.11
  needs:
    - mcp:lint
    - job: ci:build-api-image
      optional: true
  <<: *rules-mcp
  before_script:
    - pip install -e "packages/mcp[dev]" --quiet
  script:
    - cd packages/mcp
    - mypy

mobile:type-check:
  extends: [.mobile, .fast-job]
  stage: analyze
  needs: [mobile:lint]
  <<: *rules-mobile
  script:
    - npm run typecheck

wasm:build:
  # Verify the WASM crate compiles to wasm32. The pkg/ output is not passed
  # downstream — this validates the build is clean.
  extends: .wasm
  stage: analyze
  # wasm-pack + the wasm32 target are baked into the ci-wasm image; the job just
  # builds. Re-add the optional ci:build-wasm-image need (extends replaces the
  # template's needs list).
  needs:
    - wasm:lint
    - job: ci:build-wasm-image
      optional: true
  <<: *rules-wasm
  script:
    - wasm-pack build --target web --release
    # The generated .d.ts is the package's public JS surface. Every other
    # TypeScript surface in this repo is camelCase, so a snake_case export here
    # reads as a bug to the first consumer — and once `packages/web` imports the
    # package, renaming becomes a permanent breaking change. Gate it while it is
    # still free (#2602). Only runs where the .d.ts exists, i.e. right here after
    # wasm-pack; the Rust-side names are unaffected.
    - ./scripts/check-dts-camelcase.sh

web:build:
  # Builds the production bundle and publishes dist/ as an artifact so the
  # sharded web:e2e jobs can serve it via `vite preview` (webServer in
  # playwright.config.ts) without each shard rebuilding. web:test runs vitest
  # independently.
  extends: .web
  stage: analyze
  needs: [web:lint]
  <<: *rules-web
  script:
    - npm run build
  artifacts:
    paths:
      - packages/web/dist/
    expire_in: 1 day

security:bandit:scheduler:
  extends: .fast-job
  # Python static security analysis for the scheduler package.
  # Runs in analyze stage alongside type-check — static, no test results needed.
  # -ll = medium severity and above.
  stage: analyze
  needs: [scheduler:lint]
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  <<: *rules-scheduler
  before_script:
    - pip install bandit --quiet
  script:
    - bandit -r packages/scheduler/src/ -ll
        --exclude packages/scheduler/src/trueppm_scheduler/__pycache__

security:bandit:api:
  extends: .fast-job
  # Python static security analysis for the API package.
  # Split from bandit:scheduler so each gates only on its own lint job —
  # a web-only branch no longer triggers a full Python security scan.
  stage: analyze
  needs: [api:lint]
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  <<: *rules-api
  before_script:
    - pip install bandit --quiet
  script:
    - bandit -r packages/api/src/ -ll
        --exclude packages/api/src/trueppm_api/settings,packages/api/src/trueppm_api/apps/projects/migrations,packages/api/src/trueppm_api/apps/resources/migrations

# ---------------------------------------------------------------------------
# TEST — unit + integration tests.
# Each package starts as soon as its own analyze jobs pass, not when all
# packages' analyze jobs are done (DAG via needs:).
# ---------------------------------------------------------------------------

scheduler:test:
  extends: .scheduler
  stage: test
  needs:
    - scheduler:lint
    - scheduler:type-check
    - job: ci:build-scheduler-image
      optional: true
  <<: *rules-scheduler
  script:
    - cd packages/scheduler
    - pytest --cov=trueppm_scheduler --cov-report=term-missing --cov-report=xml --cov-fail-under=80
  coverage: '/TOTAL.*\s(\d+%)/'
  artifacts:
    paths:
      - packages/scheduler/coverage.xml
    expire_in: 7 days
    when: always

mcp:test:
  # pytest over packages/mcp. The auth + transport surface is exercised against
  # httpx.MockTransport, so no running API or network is needed. 80% floor
  # mirrors the other Python packages. Uses the ci-api image (mcp[dev] baked);
  # the runtime install is a fast editable re-link. ci:build-api-image is
  # optional — pulls the existing registry tag when deps haven't changed.
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-api:py3.11
  needs:
    - mcp:lint
    - mcp:typecheck
    - job: ci:build-api-image
      optional: true
  <<: *rules-mcp
  before_script:
    - pip install -e "packages/mcp[dev]" --quiet
  script:
    - cd packages/mcp
    - pytest --cov=trueppm_mcp --cov-report=term-missing --cov-report=xml --cov-fail-under=80
  coverage: '/TOTAL.*\s(\d+%)/'
  artifacts:
    paths:
      - packages/mcp/coverage.xml
    expire_in: 7 days
    when: always

scheduler:bench:
  # Performance regression guard for the CPM engine.
  # Runs on every MR that touches packages/scheduler/ and on main.
  # Timing output is stored as an artifact so regressions can be spotted
  # by comparing successive runs in the GitLab UI.
  # The test itself hard-fails at 2s (catastrophic regression circuit-breaker);
  # the > 20% regression signal requires manual comparison of artifacts.
  extends: .scheduler
  stage: test
  needs:
    - scheduler:test
    - job: ci:build-scheduler-image
      optional: true
  <<: *rules-scheduler
  script:
    - cd packages/scheduler
    - pytest tests/test_bench.py -v --tb=short 2>&1 | tee bench-output.txt
  artifacts:
    paths:
      - packages/scheduler/bench-output.txt
    expire_in: 30 days

scheduler:notebooks:
  # Execute all scheduler notebooks to catch code drift and broken examples.
  # jupyter nbconvert --execute runs each cell in order; a cell that raises an
  # exception fails the job. matplotlib is optional — notebooks guard against
  # ImportError with a try/except so missing it is not a failure.
  extends: .scheduler
  stage: test
  needs:
    - scheduler:test
    - job: ci:build-scheduler-image
      optional: true
  <<: *rules-scheduler
  script:
    - cd packages/scheduler
    # The non-root ci image (USER ci, #2085/#2236) can't write jupyter's data
    # files into the root-owned /usr/local/etc/jupyter prefix. `pip install
    # --user` is not enough: it routes the Python packages to ~/.local but still
    # writes jupyter's data_files to that root-owned prefix (Errno 13). Install
    # into a throwaway venv under $HOME whose prefix is fully writable by uid 1000.
    # --system-site-packages so the venv's kernel still imports the editable
    # trueppm_scheduler from the system site-packages (the notebooks execute it).
    - python -m venv --system-site-packages "$HOME/nbenv"
    - $HOME/nbenv/bin/pip install --quiet jupyter nbconvert
    - $HOME/nbenv/bin/jupyter nbconvert --to notebook --execute --inplace notebooks/*.ipynb
  artifacts:
    paths:
      - packages/scheduler/notebooks/*.ipynb
    expire_in: 7 days

scheduler:fuzz-deep:
  # Tier B of the contract-fuzzing strategy (#1456). The deterministic Tier A
  # gate runs inside scheduler:test on every MR (the `gate` Hypothesis profile);
  # this job runs the same properties under the `deep` profile — stochastic, with
  # a large example budget and a persisted corpus — and ONLY on scheduled
  # pipelines, so it never blocks an MR. A failure here is a real contract
  # finding: triage it into a deterministic case in test_redteam_hardening.py.
  extends: .scheduler
  stage: test
  needs:
    - job: ci:build-scheduler-image
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  # Persist Hypothesis's example database across scheduled runs so the search
  # accumulates a shrinking corpus of interesting inputs rather than starting
  # cold each night. Separate cache key from the pip cache (a list cache replaces
  # the template map, so re-state the pip cache via the anchor).
  cache:
    - <<: *scheduler-cache
      policy: pull
    - key: scheduler-fuzz-corpus
      paths:
        - packages/scheduler/.hypothesis/
  variables:
    HYPOTHESIS_PROFILE: deep
    FUZZ_MAX_EXAMPLES: "50000"
  script:
    - cd packages/scheduler
    - pytest -m fuzz -p no:cacheprovider --no-cov
  artifacts:
    paths:
      - packages/scheduler/.hypothesis/
    expire_in: 30 days
    when: always

scheduler:mutation:
  # Mutation testing of the scheduler (#2282) — the missing third leg alongside
  # Hypothesis (#1456) and Schemathesis (#2121). Coverage proves a line ran under
  # test; mutmut proves the tests would FAIL if that line were wrong by corrupting
  # the code and checking whether the suite catches it.
  #
  # Schedule-only and NON-GATING, exactly like scheduler:fuzz-deep and api:fuzz: a
  # surviving mutant is a triage signal (write an assertion that kills it), never
  # an MR merge gate. `allow_failure: true` keeps a finding from redding the shared
  # nightly schedule (Renovate + SonarCloud) while the survivor list + score stay
  # visible via the artifacts.
  #
  # Scope is the beachhead in [tool.mutmut]: models.py, derive.py, cli.py. The
  # engine.py expansion is tracked as phase 2. The score floor is report-only until
  # the first nightly establishes a baseline; promote the observed score into
  # MUTATION_MIN here to turn it into a warning threshold.
  extends: .scheduler
  stage: test
  needs:
    - job: ci:build-scheduler-image
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  variables:
    MUTATION_MIN: "0"
  script:
    - cd packages/scheduler
    - mutmut run || true          # a non-zero exit just means survivors exist
    - mutmut results || true
    - mutmut export-cicd-stats
    - python scripts/check_mutation_score.py mutants/mutmut-cicd-stats.json
  artifacts:
    paths:
      - packages/scheduler/mutants/mutmut-cicd-stats.json
    expire_in: 30 days
    when: always

api:fuzz:
  # Nightly OpenAPI contract-fuzzing of the live HTTP API with Schemathesis
  # (#2121) — the API-surface sibling of scheduler:fuzz-deep. Schedule-only and
  # non-gating: it runs on the existing nightly pipeline (the workflow rules
  # admit only the Renovate and SonarCloud schedules, and this piggybacks on
  # them the same way scheduler:fuzz-deep does) and NEVER blocks an MR. A red run
  # is a triage signal, not a merge gate — reproduce the failing case as a
  # deterministic pytest, then fix.
  #
  # `allow_failure: true` (#2212) encodes exactly that intent: a fuzz finding must
  # NOT red the nightly *schedule* pipeline, which is shared with Renovate and
  # SonarCloud — a red there conflates "the API has a 500" with "a dependency
  # needs review" and trains maintainers to ignore nightly red. The findings stay
  # visible via the JUnit report (pipeline Tests tab + a ⚠️ warning on the job)
  # and the 30-day artifact; a green pipeline is still the correct outcome. The
  # durable signal (failure -> auto-file/notify) is tracked in #2212.
  #
  # Boots the same real stack as web:integration (Django + PostgreSQL + Valkey),
  # seeds the integration fixtures, mints a JWT for the seeded OWNER user, then
  # fuzzes every documented operation as an authenticated caller.
  #
  # Checks are deliberately scoped to `not_a_server_error` (unhandled 500s) and
  # `response_schema_conformance` (responses that violate the declared schema) —
  # NOT `--checks all`. The other checks (undocumented 4xx status codes,
  # negative-data rejection) fire on hundreds of operations that merely document
  # their responses loosely; including them buries the real defects under
  # thousands of conformance nits. Tighten the schema first, then add those
  # checks back if we want a documentation-accuracy gate.
  #
  # `--suppress-health-check=all` (#2364, widened in #2768) silences the Hypothesis
  # *generation-efficiency* alarm, NOT a check. It fired on
  # `PUT /projects/{id}/calendars/` and errored the whole job without testing
  # anything. Reproduced off the committed schema alone: 23/60 seeds trip it at
  # max-examples=30, and bisecting the body pins it to the `overlays` array's
  # structured item schema — remove the `role` enum property, or make the items
  # free-form, and the rate goes to 0/40. It is not the allOf/$ref/default
  # wrapping drf-spectacular emits, and not the uuid formats. The operation is
  # fully fuzzable regardless: with the check suppressed all 40 seeds produce the
  # full 30 examples and 1200/1200 generated bodies are structurally valid, so
  # suppressing costs zero coverage and hides no defect.
  stage: test
  allow_failure: true
  image: $CI_REGISTRY_IMAGE/ci-integration:$PLAYWRIGHT_BASE_TAG
  needs:
    - job: ci:build-integration-image
      optional: true
  services:
    # max_connections above the stock 100 (#2364). The nightly run exhausted the
    # default pool and returned `OperationalError: sorry, too many clients
    # already` as an unhandled 500, which the fuzzer then reported as an API
    # defect on whichever operation happened to draw it. Headroom, not a proven
    # leak: the trace was truncated at GitLab's 16 MB limit before the summary, so
    # the source of the accumulation was never isolated. A recurrence on this same
    # signature means the accumulation is real and needs its own investigation.
    - name: postgres:16-alpine
      alias: postgres
      command: ["postgres", "-c", "max_connections=300"]
    - name: valkey/valkey:8-alpine
      alias: valkey
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
    TRUEPPM_ALLOW_DEV_SETTINGS: "1"
    DATABASE_URL: "postgres://trueppm:trueppm@postgres/trueppm_test"
    REDIS_URL: "redis://valkey:6379"
    # Non-secret CI key — dev settings enforce ALLOWED_HOSTS=* + AllowAny guard.
    SECRET_KEY: "ci-fuzz-secret-not-for-production"
    INTEGRATION_USER_EMAIL: "ci@trueppm.test"
    INTEGRATION_USER_PASSWORD: "ci-fuzz-pw"
    # The fuzzer signs in once to mint a token; relax the per-account login
    # throttle so token exchange isn't rate-limited (as web:integration, #1717).
    TRUEPPM_THROTTLE_LOGIN_ACCOUNT_RATE: "1000/min"
    # Disable ALL API rate limiting so the fuzzer exercises views instead of the
    # throttle (#2402, ADR-0604 — as perf:load). The job drives ~4,800 req/min
    # from a single account (4 workers x 30 examples x ~557 operations), against a
    # "user" bucket of 1000/min. Once that bucket drains it stays drained and DRF
    # short-circuits in initial(), so the view, serializer, and DB are never
    # touched. In the 2026-07-26 nightly that was 25,596 of 45,912 responses —
    # 56% of the run — and it fell hardest on exactly what the job exists to
    # test: POST /tasks/{id}/split/, POST /projects/{id}/archive/,
    # PUT /tasks/{id}/ and the other mutations, plus the tightly-scoped
    # security-sensitive endpoints (password_reset 5/min, invite_resend 5/min,
    # monte_carlo_whatif 6/min) which exhaust their buckets within the first
    # example or two and spend the remaining ~28 returning 429. Safe here for the
    # same reason as perf:load: an ephemeral CI container on dev settings, torn
    # down after the run. The two-key acknowledgment is required in every
    # environment — see trueppm_api.core.ratelimit.
    #
    # Expect the job to run materially longer than the ~830 s it took while more
    # than half its requests were being rejected at the throttle — that is the
    # point, and `timeout` below bounds it.
    TRUEPPM_RATE_LIMIT_ENABLED: "false"
    TRUEPPM_RATE_LIMIT_DISABLE_ACK: "i-understand-this-disables-abuse-protection"
    # Hypothesis examples per operation. ~550 operations, so 30/op is a
    # substantial nightly pass without running for hours.
    FUZZ_MAX_EXAMPLES: "30"
    # Per-request read timeout for the Schemathesis client (#2402). The default
    # 10 s is below the honest latency of the API's slowest legitimate operation:
    # POST /programs/load-sample/ imports an entire bundled fixture synchronously
    # (~3.4 s and ~3,700 sequential DB round-trips locally for the default
    # sample, several times that on a shared runner, and serialized further by
    # the select_for_update() the four workers contend on). Below this the job
    # reports "Network Error / Read timed out" — an `error`, indistinguishable in
    # the JUnit report from a real defect. 60 s keeps genuinely-hung operations
    # detectable while letting slow-but-correct ones return.
    #
    # UNIT: seconds. Schemathesis changed `--request-timeout` from milliseconds
    # (v3) to seconds (v4); the `schemathesis>=4.0,<5.0` pin in
    # packages/api/pyproject.toml is what makes this 60 s and not 60 ms. If that
    # ceiling is ever raised, re-check the unit — the wrong one fails silently as
    # a flood of spurious timeout `error`s rather than as a config error.
    FUZZ_REQUEST_TIMEOUT: "60"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Bound the run now that the throttle no longer accidentally brakes it. The
  # 2026-07-26 run took ~830 s while 56% of its requests bounced off a drained
  # bucket; executing those for real should land near ~40 min, so 55m is headroom
  # rather than a target. Deliberately under the project's own 60-minute
  # `build_timeout` — a job timeout ABOVE the project ceiling only takes effect
  # through runner `maximum_timeout` precedence, and no runner on this project
  # sets one, so staying below sidesteps the question entirely. If a future run
  # legitimately needs longer, raise the project timeout first, then this.
  timeout: 55m
  before_script:
    - *retry-fn
    # Image bakes scheduler[dev] + api[dev]; re-link editable + add the fuzz
    # extra (Schemathesis). [binary] pulls psycopg for the DB connection.
    - retry pip install -e "packages/scheduler[dev]" --quiet
    - retry pip install -e "packages/api[binary,fuzz]" --quiet
    # Record the resolved Schemathesis version (#2768). The pin is `>=4.0,<5.0`
    # and floats within it, `pip install` runs --quiet, and the 16 MB trace limit
    # truncates the log before the summary — so when behavior changed between the
    # 08-03 (green) and 08-04 (errored) nightlies there was no way to tell from
    # the job whether the tool had moved under us. One line makes the next
    # regression bisectable.
    - pip show schemathesis hypothesis | grep -E '^(Name|Version):'
    - cd packages/api
    - python manage.py migrate --noinput
    - python manage.py seed_integration_fixtures
    # Start the Django ASGI server in the background.
    - >
      PYTHONPATH=src uvicorn trueppm_api.asgi:application
      --host 127.0.0.1 --port 8000 &
    - cd ../..
    # Wait up to 30 s for Django to accept connections.
    - >
      timeout 30 sh -c
      'until curl -sf http://127.0.0.1:8000/api/v1/health/ > /dev/null;
       do sleep 1; done'
    # Mint a JWT for the seeded OWNER user so the fuzzer exercises authenticated
    # read+write operations, not just the anonymous 401 path.
    - >
      FUZZ_TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/token/
      -H 'Content-Type: application/json'
      -d "{\"username\":\"$INTEGRATION_USER_EMAIL\",\"password\":\"$INTEGRATION_USER_PASSWORD\"}"
      | python -c 'import sys, json; print(json.load(sys.stdin)["access"])')
    - export FUZZ_TOKEN
  script:
    # Prove the coverage guard can fail before trusting the run it will judge.
    - python scripts/check_fuzz_coverage.py --self-test
    - python scripts/check_fuzz_suppression.py --self-test
    - cd packages/api
    # `packages/api/schemathesis.toml` also carries --suppress-health-check
    # (#2768). Running from this directory is what makes Schemathesis discover
    # it, so do not move this `cd` below the run.
    #
    # `|| FUZZ_STATUS=$?` instead of letting the run abort the script: the
    # coverage guard below has to see the report even when — especially when —
    # the run itself reported failures. The worse of the two exit codes is
    # returned at the end, so a real fuzz finding is never masked by a clean
    # coverage check.
    # Pre-flight (#2768): prove the shipped config actually resolves to FULL
    # health-check suppression before fuzzing. A health check aborts
    # generation for an operation rather than reducing it, so one that fires
    # costs that operation all of its coverage while the run still reports
    # nearly all green. `filter_too_much` alone was configured for months and
    # was not the member that fired.
    - python ../../scripts/check_fuzz_suppression.py
    - FUZZ_STATUS=0
    - >
      schemathesis run http://127.0.0.1:8000/api/schema/
      --url http://127.0.0.1:8000
      --checks not_a_server_error,response_schema_conformance
      --max-examples "$FUZZ_MAX_EXAMPLES"
      --request-timeout "$FUZZ_REQUEST_TIMEOUT"
      --header "Authorization: Bearer $FUZZ_TOKEN"
      --workers 4
      --suppress-health-check=all
      --report junit --report-junit-path junit-fuzz.xml
      || FUZZ_STATUS=$?
    # Nothing else distinguishes "581 operations fuzzed, all clean" from "580
    # fuzzed, 1 never ran" (#2768). An errored operation gets ZERO checks, and
    # the run still ends 580/581 green.
    - cd ../..
    - COVERAGE_STATUS=0
    - >
      python scripts/check_fuzz_coverage.py
      --report packages/api/junit-fuzz.xml
      --schema docs/api/openapi.json
      || COVERAGE_STATUS=$?
    # Quoted: the `: ` inside the ternary would otherwise make YAML read this
    # scalar as a mapping and the job would parse to nothing.
    - 'if [ "$COVERAGE_STATUS" -gt "$FUZZ_STATUS" ]; then exit "$COVERAGE_STATUS"; fi'
    - exit "$FUZZ_STATUS"
  artifacts:
    when: always
    reports:
      junit: packages/api/junit-fuzz.xml
    paths:
      - packages/api/junit-fuzz.xml
    expire_in: 30 days

perf:load:
  # Nightly perf/load regression harness (#2280) — the throughput/latency sibling
  # of the per-MR N+1 query-count guards (test_perf_n_plus_one.py, #1482). Boots
  # the same real stack as api:fuzz (Django ASGI + PostgreSQL + Valkey), seeds
  # fixtures, mints a JWT, then drives k6 (packages/api/perf/load.js) against the
  # hot read endpoints under concurrency.
  #
  # RELATIVE-regression harness, not a capacity test: it runs against a single
  # in-pipeline uvicorn process on shared runner hardware, so absolute numbers are
  # noise — the value is the trend across runs and the loose tripwires in the k6
  # `thresholds`. k6 exits non-zero on a threshold breach, but `allow_failure:
  # true` (as api:fuzz, #2212) keeps a breach a triage signal, never a merge gate.
  #
  # Schedule-only and non-gating: like api:fuzz, it piggybacks on the existing
  # nightly schedules (the workflow rules admit only the Renovate and SonarCloud
  # schedules) and never blocks an MR. A dedicated PERF_SCHEDULED schedule was the
  # original design, but pipeline-schedule variables are disabled for this
  # project/group (#2280), so there is no way to gate on a per-schedule flag —
  # piggybacking on the nightly is the working equivalent of api:fuzz's cadence.
  stage: test
  allow_failure: true
  image: $CI_REGISTRY_IMAGE/ci-integration:$PLAYWRIGHT_BASE_TAG
  needs:
    - job: ci:build-integration-image
      optional: true
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
    TRUEPPM_ALLOW_DEV_SETTINGS: "1"
    DATABASE_URL: "postgres://trueppm:trueppm@postgres/trueppm_test"
    REDIS_URL: "redis://valkey:6379"
    # Non-secret CI key — dev settings enforce ALLOWED_HOSTS=* + AllowAny guard.
    SECRET_KEY: "ci-perf-secret-not-for-production"
    INTEGRATION_USER_EMAIL: "ci@trueppm.test"
    INTEGRATION_USER_PASSWORD: "ci-perf-pw"
    # The harness signs in once to mint a token; relax the per-account login
    # throttle so token exchange isn't rate-limited (as api:fuzz, #1717).
    TRUEPPM_THROTTLE_LOGIN_ACCOUNT_RATE: "1000/min"
    # Disable ALL API rate limiting so k6 measures raw throughput instead of
    # tripping the per-account "user" throttle once the VUs (one shared token)
    # ramp up (#2316, ADR-0604). Safe here: an ephemeral CI container on dev
    # settings, torn down after the run. The two-key acknowledgment is required
    # in every environment — see trueppm_api.core.ratelimit.
    TRUEPPM_RATE_LIMIT_ENABLED: "false"
    TRUEPPM_RATE_LIMIT_DISABLE_ACK: "i-understand-this-disables-abuse-protection"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    # Pinned k6 binary (bump deliberately; the harness is version-tolerant).
    K6_VERSION: "0.50.0"
    PERF_VUS: "20"
    # Size of the capacity fixture the task-list reads are measured against
    # (#2816). 1,000 tasks is the ceiling of the published scale envelope
    # (#2391 — "comfortable in the Schedule view to roughly 1,000 tasks"), so the
    # nightly measures the endpoint at exactly the scale the docs claim is fine.
    # `bulk_create` seeds this in seconds; raising it lengthens the job.
    PERF_FIXTURE_TASKS: "1000"
    PERF_FIXTURE_EDGE_RATIO: "1.2"
    # Must match `seed_capacity`'s name for its first project — load.js resolves
    # the target BY NAME, because with two projects seeded `results[0]` is
    # whichever the list orders first.
    PERF_PROJECT_NAME: "Capacity project 1"
  before_script:
    - *retry-fn
    # Image bakes scheduler[dev] + api[dev]; re-link editable. [binary] pulls
    # psycopg for the DB connection.
    - retry pip install -e "packages/scheduler[dev]" --quiet
    - retry pip install -e "packages/api[binary]" --quiet
    # Install the pinned k6 binary (single static Go binary). Extract to a
    # writable dir and add it to PATH — the ci-integration image runs as a
    # non-root user, so a write to /usr/local/bin would be denied.
    - >
      retry curl -sfL
      "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
      -o /tmp/k6.tar.gz
    - tar -xzf /tmp/k6.tar.gz -C /tmp
    - export PATH="/tmp/k6-v${K6_VERSION}-linux-amd64:$PATH"
    - k6 version
    - cd packages/api
    - python manage.py migrate --noinput
    - python manage.py seed_integration_fixtures
    # Task-scale fixture (#2816). seed_integration_fixtures creates exactly ONE
    # task, so before this the nightly's `task_list` p95 was the latency of
    # serializing a single row — it could not detect an N+1, a dropped index, or a
    # full-table scan, which is why #2767's 3.3x swing survived a 20-commit bisect.
    #
    # Minted, never committed: seed_capacity creates a real loginable account and a
    # fixed credential in a tracked file is a secret-scanner finding however
    # disposable the stack is (#2457). Nothing needs to log in as this owner — the
    # harness authenticates as INTEGRATION_USER_EMAIL — so a throwaway value that
    # exists only for the life of the job is sufficient. `--member-email` is what
    # grants that identity access; project reads are membership-scoped, so without
    # it the seeded fixture would be invisible and we would be back to one task.
    - export TRUEPPM_CAPACITY_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(16))')
    - >
      python manage.py seed_capacity
      --projects 1
      --tasks "$PERF_FIXTURE_TASKS"
      --edge-ratio "$PERF_FIXTURE_EDGE_RATIO"
      --member-email "$INTEGRATION_USER_EMAIL"
    # Start the Django ASGI server in the background.
    - >
      PYTHONPATH=src uvicorn trueppm_api.asgi:application
      --host 127.0.0.1 --port 8000 &
    - cd ../..
    # Wait up to 30 s for Django to accept connections.
    - >
      timeout 30 sh -c
      'until curl -sf http://127.0.0.1:8000/api/v1/health/ > /dev/null;
       do sleep 1; done'
    # Mint a JWT for the seeded OWNER user so the harness exercises authenticated
    # reads, not the anonymous 401 path.
    - >
      PERF_TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/token/
      -H 'Content-Type: application/json'
      -d "{\"username\":\"$INTEGRATION_USER_EMAIL\",\"password\":\"$INTEGRATION_USER_PASSWORD\"}"
      | python -c 'import sys, json; print(json.load(sys.stdin)["access"])')
    - export PERF_TOKEN
  script:
    - >
      k6 run
      -e BASE_URL=http://127.0.0.1:8000
      -e PERF_TOKEN="$PERF_TOKEN"
      -e PERF_VUS="$PERF_VUS"
      -e PERF_PROJECT_NAME="$PERF_PROJECT_NAME"
      packages/api/perf/load.js
  artifacts:
    when: always
    paths:
      - perf-summary.json
    expire_in: 30 days

wasm:test:
  extends: .wasm
  stage: test
  needs:
    - wasm:lint
    - wasm:build
    - job: ci:build-wasm-image
      optional: true
  <<: *rules-wasm
  script:
    - cargo test --all-targets

wasm:conformance:
  # The PYTHON half of cross-engine conformance: run the Python scheduler against
  # the shared `packages/wasm-scheduler/fixtures/` corpus and its committed
  # `expected/` snapshots.
  #
  # This job alone does NOT prove the two engines agree, despite the name — it
  # exercises one engine. The Rust half is `tests/conformance.rs` +
  # `tests/invalid_conformance.rs`, run by `wasm:test` (`cargo test --all-targets`
  # picks up both integration-test binaries). Agreement is the conjunction of the
  # two jobs against one shared oracle: the `expected/` snapshots, generated from
  # Python (the source of record) and asserted byte-for-byte by both sides.
  #
  # The split rules are deliberate, not a coverage hole (#2602). A
  # wasm-scheduler-only MR runs both jobs. A scheduler-only MR runs just this one,
  # which is sufficient: with the Rust source and the fixtures both untouched, the
  # Rust half would be a no-op re-run. If the Python change moves output, this job
  # fails against the committed snapshots — and regenerating them touches
  # `packages/wasm-scheduler/fixtures/`, which pulls `wasm:test` back into the
  # pipeline to re-check Rust against the new oracle. `main` runs everything.
  stage: test
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  needs:
    # Both needs are optional: this job fires on scheduler OR wasm-scheduler
    # changes, but scheduler:lint only fires on scheduler changes and
    # wasm:lint only fires on wasm-scheduler changes. A wasm-scheduler-only
    # MR schedules conformance + wasm:lint but not scheduler:lint (and vice
    # versa for a scheduler-only MR). Without optional on both, GitLab fails
    # the whole pipeline with "needs job does not exist" the moment either
    # side is scheduled without the other.
    - job: scheduler:lint
      optional: true
    - job: wasm:lint
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/wasm-scheduler/**/*
        - packages/scheduler/**/*
        - .gitlab-ci.yml
  cache:
    <<: *scheduler-cache
    policy: pull
  before_script:
    - pip install -e "packages/scheduler[dev]" --quiet
  script:
    - cd packages/scheduler
    - pytest tests/test_wasm_conformance.py -v

api:testdb-dump:
  # Run real migrations ONCE per pipeline and dump the resulting schema+data so
  # the api:test shards clone each pytest-xdist worker DB from it instead of
  # replaying ~147 migrations per worker (#688, follow-up to #680 sharding).
  # The dump preserves the ltree extension, the wbs_path GiST index, and the
  # data backfills that `--no-migrations` would skip. Runs in the lint stage,
  # overlapping lint/type-check. Since #1121 trimmed api:test's gates to data
  # deps only, api:test starts the moment this job's artifact is ready — so this
  # job IS the api:test start-gate. To keep that gate cheap, the migrate + dump
  # is cached on a migration-file fingerprint (#1122): on the ~70% of MRs that
  # touch no migration, the cached dump is reused and the migrate is skipped.
  extends: .api
  stage: lint
  <<: *rules-api
  cache:
    # Two caches as a list (a list cache replaces the template's map, so the
    # inherited pip cache is re-stated). The second entry persists the migrated
    # schema dump + its fingerprint across pipelines under a static, branch-
    # agnostic key, so a feature-branch run can reuse a dump built by a recent
    # main pipeline. Correctness never depends on cache contents — the in-script
    # fingerprint guard re-migrates on any drift (#1122). Bump -v1 to bust.
    - <<: *api-cache
      policy: pull
    - key: api-testdb-schema-v1
      paths:
        - testdb-schema.sql
        - .testdb-migrations.sha256
  script:
    # Reuse a cached schema dump when no migration changed (#1122). Fingerprint
    # every api migration file by content; if it matches the fingerprint saved
    # next to a cached dump, the schema is identical and we skip the ~150s
    # migrate + dump (and the #1039 cold-Postgres variance). The guard is
    # authoritative — a cache miss or any drift (added/edited/deleted migration)
    # falls through to a full migrate, so correctness never rests on the cache.
    - |
      MIG_FP=$(find packages/api/src -path '*/migrations/*.py' -not -name '__init__.py' \
        | sort | xargs sha256sum | sha256sum | awk '{print $1}')
      echo "migration fingerprint: $MIG_FP"
      if [ -f testdb-schema.sql ] && [ -f .testdb-migrations.sha256 ] \
         && [ "$(cat .testdb-migrations.sha256)" = "$MIG_FP" ]; then
        echo "migrations unchanged since cached dump — reusing it, skipping migrate+pg_dump"
        exit 0
      fi
      echo "migrations changed or no cached dump — running full migrate + dump"
    # Bootstrap fallback for a stale cached image. The ci-api image bakes
    # postgresql-client-16 (api.Dockerfile), but it ships under the mutable
    # :py3.11 tag, and runners here pull with if-not-present (they disallow
    # `always`) — so the very pipeline that first adds the client can land on a
    # runner still holding the prior image without it. Install at runtime only
    # when pg_dump is missing; once main rebuilds the image this is a no-op.
    # Mirrors the Dockerfile's PGDG install (#688).
    - &ensure-pg-client |
      if ! command -v pg_dump >/dev/null 2>&1; then
        echo "pg_dump missing — installing postgresql-client-16 (stale cached image)"
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends curl ca-certificates gnupg
        install -d /usr/share/postgresql-common/pgdg
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        # Verify the PGDG signing key against a known sha256 (#904 supply-chain
        # hardening) — same pinned hash as .gitlab/ci-images/api.Dockerfile. A
        # substituted key (postgresql.org compromise / DNS hijack) aborts here
        # rather than signing a substituted postgresql-client. Bump both if PGDG
        # ever re-publishes the key (fingerprint must stay ACCC4CF8).
        echo "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc" | sha256sum -c -
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main" > /etc/apt/sources.list.d/pgdg.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends postgresql-client-16
      fi
    - cd packages/api
    # Wait for the Postgres service to accept connections before migrating —
    # on cold runner starts `migrate` stalls in the TCP connect phase and
    # inflates this job 30s→170s, dragging the api:test critical path (#1039).
    # Non-fatal: if Postgres still isn't up after 30s, migrate fails with its
    # own clearer error.
    - timeout 30 sh -c 'until pg_isready --dbname "$DATABASE_URL" >/dev/null 2>&1; do sleep 1; done' || echo "warning - postgres not ready after 30s, proceeding"
    - python manage.py migrate --no-input
    # --no-owner/--no-privileges keep the dump role-portable so it reloads
    # cleanly into the `migrated` template under the same CI role on the shards.
    - pg_dump --no-owner --no-privileges --dbname "$DATABASE_URL" --file "$CI_PROJECT_DIR/testdb-schema.sql"
    # Persist the fingerprint beside the dump so the next pipeline's guard can
    # validate the cache. Written at repo root to match the cache: paths above.
    - echo "$MIG_FP" > "$CI_PROJECT_DIR/.testdb-migrations.sha256"
  artifacts:
    paths:
      - testdb-schema.sql
    expire_in: 1 day
    when: always

api:test:
  extends: .api
  stage: test
  # Sharded into 4 groups with pytest-split; each shard fans out to a FIXED -n 4
  # xdist workers (#1303). NOT -n auto: xdist's `auto` resolves to os.cpu_count()
  # — the host logical-CPU count, ignoring any cgroup quota — so on a multi-slot
  # runner (concurrency > 1) every co-tenant shard would grab the whole box
  # (12–16 workers each) and thrash the cores, plus stack a postgres service per
  # shard. A fixed -n 4 keeps the whole stage at 4 shards × 4 = 16 workers, which
  # fits within the two-NUC fleet (6c/12t + 8c/16t) even when shards co-tenant,
  # so the slowest shard — which gates api:coverage (it needs all 4) — runs at a
  # deterministic speed instead of contending. Retune this if runner cores/
  # concurrency change materially. pytest-django gives every xdist worker its own
  # test DB (test_trueppm_test_gw0, _gw1, …) so isolation is preserved.
  # pytest-split reads the committed packages/api/.test_durations baseline and
  # rebalances the per-test timings into N groups at runtime, so the same
  # baseline works for any shard count — bumping 2→4 (#1120) needs no regen,
  # though the api:test-durations job (manual + scheduled, #687) still refreshes
  # it. If the baseline is ever missing, pytest-split falls back to an even
  # test-count split. Each shard emits a partial coverage data file
  # (.coverage.<index>); api:coverage combines them into coverage.xml for the
  # diff-coverage gate and the package soft floor. Mirrors the web:e2e shard →
  # web:e2e:report stitch pattern.
  parallel: 4
  # needs lists only api:test's true data dependencies (#1121): the lint gate
  # (cheap fail-fast, keeps a full sharded run off obviously-broken code) and
  # the testdb-dump artifact it clones the template DB from. type-check,
  # migration-check, and openapi-check are independent quality gates — tests
  # consume none of their output — so they no longer block test start; they run
  # in parallel and still gate the MR merge. Trade-off: a run can proceed while
  # one of those gates is failing (rare), spending runner minutes we'd
  # previously have short-circuited. Worth it — they're the analyze-stage long
  # poles, and decoupling lets the 4 shards start as soon as testdb-dump lands.
  needs:
    - api:lint
    - job: api:testdb-dump
      artifacts: true
    - job: ci:build-api-image
      optional: true
  <<: *rules-api
  variables:
    # Distinct data file per shard so api:coverage's combine doesn't clash.
    # pytest-cov honors COVERAGE_FILE for the final xdist-combined data file.
    COVERAGE_FILE: ".coverage.$CI_NODE_INDEX"
    # Activates the test-only TEST.TEMPLATE branch in settings.dev (#688) so
    # pytest-django clones each worker DB from `migrated` instead of replaying
    # migrations. Built from the api:testdb-dump artifact in before_script.
    TRUEPPM_TEST_DB_TEMPLATE: migrated
  before_script:
    # Same stale-image bootstrap fallback as api:testdb-dump — installs psql/
    # pg_dump when the cached image predates them; a no-op once baked (#688).
    - *ensure-pg-client
    # before_script OVERRIDES (does not merge with) .api's, so the editable
    # re-link is repeated here.
    - pip install -e "packages/scheduler[dev]" --quiet
    - pip install -e "packages/api[dev]" --quiet
    # Build the `migrated` template DB from the dumped schema (#688). Each
    # parallel shard has its own postgres service, so each builds its own copy;
    # the dump already contains CREATE EXTENSION ltree + the GiST index + data.
    - psql "postgres://trueppm:trueppm@postgres/trueppm_test" -c "CREATE DATABASE migrated;"
    - psql "postgres://trueppm:trueppm@postgres/migrated" -f "$CI_PROJECT_DIR/testdb-schema.sql"
  script:
    - cd packages/api
    - python -m pytest tests/ --tb=short -q -n 4
        --splits "$CI_NODE_TOTAL" --group "$CI_NODE_INDEX"
        --cov=trueppm_api --cov-report=
  artifacts:
    paths:
      - packages/api/.coverage.*
    expire_in: 1 day
    when: always

api:s3-drill:
  # Live object-storage drill against a real MinIO service (#2559).
  #
  # The gap this closes: four operator-facing surfaces (the configuration
  # reference, the Helm README, a shipped values.yaml comment, .env.example) tell
  # operators to set TRUEPPM_DEFAULT_FILE_STORAGE=storages.backends.s3.S3Storage,
  # and settings/prod.py refuses to boot on the local default (#775) — so the boot
  # guard steered operators at that value while django-storages was not a
  # dependency at all and the import crashed. No job set TRUEPPM_DEFAULT_FILE_STORAGE
  # to an object-storage backend and there was no S3/MinIO service anywhere in this
  # file, so nothing could have caught it.
  #
  # tests/test_s3_round_trip.py skips itself unless TRUEPPM_S3_ENDPOINT_URL is set,
  # so it is inert in api:test and a developer's local run stays hermetic; this job
  # is the only place it executes. It asserts the attachment round-trips, the
  # presigned URL downloads unauthenticated, an UNsigned URL is denied (or the
  # presigned URL is security theater), and file_overwrite=False holds.
  #
  # Deliberately its own small job rather than a service bolted onto api:test:
  # api:test is sharded x4, so a MinIO service there would spawn four idle copies
  # for a handful of tests.
  extends: .api
  stage: test
  needs:
    - api:lint
    - job: ci:build-api-image
      optional: true
  <<: *rules-api
  services:
    # .api's services are REPLACED, not merged — postgres/valkey are re-declared
    # because the tests import Django settings, which parse DATABASE_URL/REDIS_URL.
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
    # Pinned to a dated release tag (same convention as the postgres/valkey
    # services above — not `latest`). `server /data` is the command MinIO needs to
    # start; the console port is unused here.
    - name: minio/minio:RELEASE.2025-09-07T16-13-09Z
      alias: minio
      command: ["server", "/data"]
  variables:
    # Throwaway root credentials for a service container that lives for one job,
    # has no persistence and no ingress. NOT a pattern to copy into a deploy: the
    # docs deliberately tell operators to change the MinIO root password and give
    # TruePPM a bucket-scoped access key instead. See the "Object storage" section
    # of packages/website/src/content/docs/administration/configuration.md.
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    TRUEPPM_S3_ENDPOINT_URL: "http://minio:9000"
    # MinIO serves path-style; virtual-hosted addressing would need per-bucket DNS.
    TRUEPPM_S3_ADDRESSING_STYLE: path
    TRUEPPM_S3_ACCESS_KEY_ID: minioadmin
    TRUEPPM_S3_SECRET_ACCESS_KEY: minioadmin
  script:
    - cd packages/api
    # The drill skips itself when TRUEPPM_S3_ENDPOINT_URL is unset, and a skip
    # exits 0 — so a green job proving nothing is the exact false assurance #2559
    # was about. Write the report to a file and fail on any skip, so renaming the
    # env var or dropping it from `variables` breaks the job loudly.
    - python -m pytest tests/test_s3_round_trip.py -v -rs --tb=short | tee s3-drill.log
    - |
      if grep -qE '^SKIPPED|skipped' s3-drill.log; then
        echo "FAIL: the S3 drill skipped — MinIO env is not reaching the tests" >&2
        exit 1
      fi
    # The documented configuration must also satisfy the deploy checks it ships
    # with, so `manage.py check --deploy` can never contradict a working install.
    # --fail-level ERROR: dev settings legitimately raise deploy WARNINGs (no TLS
    # redirect, etc.); only our trueppm.E0xx errors should fail this.
    - |
      TRUEPPM_DEFAULT_FILE_STORAGE=storages.backends.s3.S3Storage \
      TRUEPPM_S3_BUCKET_NAME=trueppm-attachments \
      python manage.py check --deploy --fail-level ERROR
  artifacts:
    when: always
    paths:
      - packages/api/s3-drill.log
    expire_in: 1 week

api:coverage:
  # Combines the per-shard coverage data from api:test into a single coverage.xml
  # for api:diff-coverage (the primary tests gate) and enforces the package-total
  # soft floor against legacy regressions. Runs in the same ci-api image the
  # shards used, so the coverage data format matches.
  extends: .api-no-db
  stage: test
  needs:
    - job: api:test
      artifacts: true
    - job: ci:build-api-image
      optional: true
  <<: *rules-api
  script:
    - cd packages/api
    - coverage combine
    - coverage xml
    - coverage report --fail-under=80
  coverage: '/TOTAL.*\s(\d+%)/'
  artifacts:
    paths:
      - packages/api/coverage.xml
    expire_in: 7 days
    when: always

api:test-durations:
  # Generates packages/api/.test_durations — the per-test wall-time baseline
  # pytest-split uses to balance the two api:test shards (#687, follow-up to
  # the #680 sharding). Without this file pytest-split falls back to an even
  # test-COUNT split, which unbalances the shards whenever a few slow tests
  # dominate one group and erases the sharding win.
  #
  # Runs serially and WITHOUT coverage so the recorded numbers are clean
  # per-test wall-times: coverage tracing and xdist contention both skew them,
  # and pytest-split only needs the relative ordering to pack the groups.
  # --clean-durations prunes entries for tests that no longer exist so the
  # committed baseline doesn't accumulate dead weight across refreshes.
  #
  # Trigger:
  #   - scheduled pipelines refresh the baseline as the suite grows;
  #   - manual on any MR or main to regenerate on demand.
  # This job does NOT commit its result — it publishes .test_durations as an
  # artifact. Refresh cadence: download the artifact from the latest scheduled
  # run and commit it to packages/api/.test_durations (a periodic chore, or
  # whenever shard balance visibly drifts). allow_failure keeps a slow or
  # flaky full-suite run from ever blocking an MR.
  extends: .api
  stage: test
  needs:
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - cd packages/api
    - python -m pytest tests/ -q --store-durations --clean-durations
  artifacts:
    paths:
      - packages/api/.test_durations
    expire_in: 30 days
    when: always

web:test-integrity:
  # Guards issue #1657: web:test's only vitest call is `npm run test:coverage`, and
  # a positional path filter in that script silently drops whole directories of
  # specs from CI (src/workers, src/utils, src/styles, App.test.tsx, scripts/*)
  # without failing anything. check-all-tests-run.mjs fails if any test file on
  # disk is not collected by that command. `needs: []` runs it as soon as the
  # pipeline starts (independent of the slow shards) so a re-introduced allowlist
  # fails fast.
  extends: [.web, .fast-job]
  stage: test
  needs: []
  <<: *rules-web
  script:
    - node scripts/check-all-tests-run.mjs

web:test:
  extends: .web
  stage: test
  # Sharded across 4 runners (vitest splits by test file). The configured
  # singleFork pool (fileParallelism: false) keeps each shard's jsdom heap bounded;
  # since the runner is single-core per shard, intra-shard parallelism would not
  # help wall-clock and only reinflates the heap that forced singleFork — so the
  # lever is shard count, not pool concurrency. Profiling (#1295) showed the suite
  # is evenly distributed (no dominant spec; the two old shards ran 301s/302s — a
  # <0.5% imbalance), so wall-clock per shard scales ~linearly with shard count.
  # At parallel: 2 each shard ran ~301s — 2x the next-longest test job (api:test
  # 4/4 at ~161s). At parallel: 4 each shard handles ~115 files (~150s), dropping
  # web:test into the api:test band so it is no longer the critical-path leader;
  # more shards also means fewer files per shard, which *eases* OOM pressure rather
  # than adding to it. api:test already runs parallel: 4 on the same pool. Each
  # shard is a single core (singleFork), so each added shard costs only +1 worker
  # on the fleet — unlike api:test's 4-xdist shards, bumping web:test's shard count
  # does not risk the 28-thread ceiling api:test is tuned against. Raised 4 → 6
  # (#1702) after the 0.4 test-suite growth (+172 web spec files in one week) crept
  # each shard back to ~219s and re-made web:test the critical-path pole; at 6 it
  # handles ~77 files/shard (~100s), ceding the pole to api:test again with runway
  # for continued growth. Each
  # shard writes partial istanbul coverage (coverage-final.json) to
  # coverage-<index>/; web:coverage stitches them (merge-coverage.mjs discovers the
  # coverage-<n>/ dirs dynamically — shard-count-agnostic) for the diff-coverage
  # gate. The `--` forwards the shard + output-dir flags to vitest while preserving
  # the dir filter and coverage config from test:coverage.
  needs: [web:lint, web:type-check, web:build]
  parallel: 6
  <<: *rules-web
  script:
    - npm run test:coverage --
        --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
        --coverage.reportsDirectory="coverage-$CI_NODE_INDEX"
  artifacts:
    paths:
      - packages/web/coverage-*/coverage-final.json
    expire_in: 1 day
    when: always

web:coverage:
  # Stitches the per-shard istanbul coverage from web:test into a single
  # coverage/lcov.info for web:diff-coverage (the primary tests gate) and enforces
  # the package-total line floor. Runs in the cached node image (.web) and merges
  # the coverage maps with scripts/merge-coverage.mjs — no GNU lcov install. The
  # old python:3.11-slim job had to `apt-get install lcov`, which drags in
  # perl + binutils for ~5 min while the merge itself took <1s; the map-level
  # merge here is <1s and also sidesteps the istanbul duplicate-function-name
  # inconsistency that forced --ignore-errors on the lcov text-merge path.
  extends: .web
  stage: test
  needs:
    - job: web:test
      artifacts: true
  <<: *rules-web
  variables:
    # Package-total line floor against legacy regressions, enforced on the merged
    # result (vitest can't — no single shard sees it). Mirrors the api:coverage
    # --fail-under=80 soft floor. The primary gate is web:diff-coverage.
    WEB_COVERAGE_MIN: "75"
    # Full history — check-added-files-covered.mjs diffs against the MR target's
    # merge-base, which a shallow clone may not contain.
    GIT_DEPTH: "0"
  script:
    - node scripts/merge-coverage.mjs
    # Fail if a file ADDED in this MR never entered the merged coverage map —
    # the new-untested-file dodge diff-cover cannot see (issue #1510). Runs here
    # (not web:diff-coverage) because that job's python:3.11-slim image has no
    # node. node:alpine has no git, so install it only in MR context where the
    # check actually diffs.
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        apk add --no-cache --quiet git
        git config --global --add safe.directory "$CI_PROJECT_DIR"
        git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        node scripts/check-added-files-covered.mjs
      fi
  coverage: '/line coverage ([\d.]+)%/'
  artifacts:
    paths:
      - packages/web/coverage/lcov.info
    expire_in: 7 days
    when: always

# ---------------------------------------------------------------------------
# DIFF COVERAGE — gate on lines changed vs the MR target branch.
# Enforces ≥ $COVERAGE_DIFF_MIN% line coverage on new/changed code, regardless
# of whether the package total moves. This is the primary "new feature must
# have tests" gate; the package-total --cov-fail-under flag stays as a soft
# floor against legacy regressions.
#
# Bump COVERAGE_DIFF_MIN to 90 post-beta. MR-only — there's no diff to
# measure on main.
# ---------------------------------------------------------------------------

.diff-coverage:
  stage: test
  variables:
    GIT_DEPTH: "0"
    COVERAGE_DIFF_MIN: "80"

scheduler:diff-coverage:
  extends:
    - .scheduler
    - .diff-coverage
  needs:
    - job: scheduler:test
      artifacts: true
    - job: ci:build-scheduler-image
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/scheduler/**/*
        - .gitlab-ci.yml
  script:
    # python:3.11-slim ships without git; required by `git fetch` and by
    # diff-cover internally (it shells out to `git diff`).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - cd packages/scheduler
    - diff-cover coverage.xml
        --compare-branch="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        --fail-under="$COVERAGE_DIFF_MIN"

api:diff-coverage:
  extends: .diff-coverage
  # Run on the pre-baked ci-api image (same one api:coverage uses) instead of
  # bare python:3.11-slim + a runtime `pip install diff-cover`. The bare-slim
  # path booted a fresh image and installed diff-cover on every run, so a single
  # runner holding a corrupted cached python:3.11-slim layer — pip's own vendored
  # files failing to decode — reliably reddened this gate with nothing wrong in
  # the code (#2234). ci-api bakes git + diff-cover (via packages/api[dev]), so
  # no apt-get / pip install is needed at job time.
  image: $CI_REGISTRY_IMAGE/ci-api:py3.11
  needs:
    - job: api:coverage
      artifacts: true
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/api/**/*
        - .gitlab-ci.yml
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - cd packages/api
    - diff-cover coverage.xml
        --compare-branch="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        --fail-under="$COVERAGE_DIFF_MIN"

web:diff-coverage:
  extends: .diff-coverage
  # diff-cover is a python tool that reads lcov natively, so run it on the same
  # pre-baked ci-api image (git + diff-cover resident) rather than bare
  # python:3.11-slim + a runtime `pip install`. Same corrupted-cached-layer
  # hazard as api:diff-coverage (#2234); the baked image removes the per-run apt
  # + pip install entirely. Still a python image (not node) — no npm install.
  image: $CI_REGISTRY_IMAGE/ci-api:py3.11
  needs:
    - job: web:coverage
      artifacts: true
    - job: ci:build-api-image
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/web/**/*
        - .gitlab-ci.yml
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - cd packages/web
    - diff-cover coverage/lcov.info
        --compare-branch="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        --fail-under="$COVERAGE_DIFF_MIN"

web:e2e:coverage:
  # Playwright E2E line coverage for SonarCloud (#2117). SonarCloud imports LCOV;
  # it does not run tests. The vitest report already imports, but every UI file
  # exercised only by E2E — a large share of the app — is analyzed by Sonar yet
  # absent from that LCOV, so it counts as 0% covered and drags the reported total
  # far below the true API-94%/web-unit-78.5% figures. This job builds an
  # istanbul-instrumented bundle (VITE_COVERAGE=true), runs the mocked, self-
  # contained Chromium suite (specs mock all /api and /ws at the browser — no
  # backend), and the coverage fixture (e2e/fixtures/coverage.ts) writes each
  # page's `window.__coverage__`; merge-e2e-coverage.mjs stitches them into an
  # LCOV with repo-root-relative SF paths that sonar:scan imports.
  #
  # Scheduled-only (mirrors sonar:scan) so day-to-day MR pipelines are unchanged,
  # and allow_failure so a coverage hiccup never reds the nightly run. Builds its
  # OWN instrumented dist rather than reusing web:build's production artifact —
  # the production build is never instrumented. Unsharded so all pages' coverage
  # lands in one workspace for the merge. Independent of the web gate jobs (which
  # the scheduled pipeline may not run); the only need is the optional Playwright
  # mirror gate, present on the scheduled pipeline so this job waits for the
  # image and never pulls from throttled MCR.
  stage: test
  image: $CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG
  needs:
    - job: ci:mirror-playwright-base
      optional: true
  variables:
    VITE_COVERAGE: "true"
  cache:
    <<: *web-cache
    policy: pull
  before_script:
    - *retry-fn
    - cd packages/web
    - retry npm ci --prefer-offline --no-audit --no-fund --quiet
  script:
    - npm run build
    # Always merge + upload whatever coverage was collected, even when some specs
    # fail. Capture Playwright's exit code, run the merge unconditionally, then
    # re-exit with it: without this a single spec failure exits 1 and SKIPS the
    # merge step, so the coverage from the ~1.1k passing specs is discarded and
    # Sonar imports nothing (#2228 — this, plus needs: [] on sonar:scan, is why
    # the dashboard read 0%). The job still reports red on genuine failures (so
    # they stay visible), but allow_failure + artifacts:when:always mean the
    # partial LCOV is uploaded and sonar:scan (which needs: this allow_failure
    # job) still imports it. The merge script already tolerates missing/truncated
    # per-page snapshots, so a partial .nyc_output merges cleanly.
    - set +e; npx playwright test --project=chromium; TEST_EXIT=$?; set -e
    - node scripts/merge-e2e-coverage.mjs
    - exit $TEST_EXIT
  artifacts:
    when: always
    paths:
      - packages/web/coverage/e2e/lcov.info
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
  allow_failure: true

sonar:scan:
  # Nightly SonarCloud analysis WITH coverage import (#2090, #2092, #2113, #2117).
  #
  # Runs ONLY on the scheduled pipeline (SONAR_SCHEDULED == "true"), never on MR
  # or push pipelines — so day-to-day pipeline latency is unchanged. SonarCloud
  # does not run tests; it imports the coverage reports produced by the test
  # stage, via the reportPaths declared in sonar-project.properties.
  #
  # `needs:` the five coverage producers so their reports land in this job's
  # workspace. This RE-COUPLES the scan to coverage (reverting the 2026-07-19
  # `needs: []` decouple, #2228): on a nightly scheduled job, starting the scan
  # ~5 min earlier bought nothing — SonarCloud stores one analysis per project,
  # so a later coverage-bearing scan would just overwrite an early analysis-only
  # one, and nobody watches a 4am pipeline's intermediate state. The only
  # observable outcome is the final dashboard, which needs coverage. So the scan
  # correctly waits for the producers. stage: security keeps it after `test`
  # (a job cannot `needs:` a later-stage job — the producers live in `test`).
  # allow_failure means a Sonar/network hiccup never turns the nightly red.
  stage: security
  image: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
  needs:
    - job: api:coverage
      artifacts: true
    - job: web:coverage
      artifacts: true
    - job: scheduler:test
      artifacts: true
    - job: mcp:test
      artifacts: true
    # Playwright E2E line coverage (#2117) — nightly, same schedule gate as this
    # job, allow_failure + artifacts:when:always, so even a partial run (some
    # specs failing) still hands over the merged LCOV it managed to collect.
    - job: web:e2e:coverage
      artifacts: true
  variables:
    # Full history so SonarCloud's new-code detection and SCM blame are accurate
    # (the default shallow clone makes Sonar warn and skip blame attribution).
    GIT_DEPTH: "0"
    # Keep the analysis cache inside the workspace so it can be cached below.
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: sonar-scanner
    paths:
      - .sonar/cache
  script:
    # Each report rewrite is guarded on the source file existing. The producers
    # are in `needs:`, so all reports are normally present; the guards keep a
    # single producer that failed (e.g. the allow_failure web:e2e:coverage job)
    # from aborting the scan — its absent report is skipped and the rest import.
    #
    # The web LCOV records `SF:src/...` paths relative to packages/web; the
    # scanner runs from the checkout root, so rewrite them to
    # `SF:packages/web/src/...` — the same prefix scripts/sonar-scan.sh and the
    # Makefile diff-cover target apply.
    - if [ -f packages/web/coverage/lcov.info ]; then sed 's|^SF:|SF:packages/web/|' packages/web/coverage/lcov.info > packages/web/coverage/lcov.sonar.info; fi
    # The API report emits an EMPTY `<source></source>` because packages/api sets
    # `[tool.coverage.run] relative_files = true` (needed for the cross-runner
    # shard combine, #1348); its class filenames are `src/trueppm_api/...`. With
    # no source root the scanner resolves them from the repo root — `<repo>/src/
    # trueppm_api/...` — and drops all 328 files (#2113). Inject the real package
    # root so they resolve to `<repo>/packages/api/src/...`, matching the absolute
    # <source> the scheduler/mcp reports already carry. Point the reportPath at
    # coverage.sonar.xml (sonar-project.properties) — the same generated-file
    # pattern as the web lcov above.
    - if [ -f packages/api/coverage.xml ]; then sed "s#<source></source>#<source>${CI_PROJECT_DIR}/packages/api</source>#" packages/api/coverage.xml > packages/api/coverage.sonar.xml; fi
    # SONAR_TOKEN and SONAR_HOST_URL come from masked CI/CD variables and are
    # read from the environment by sonar-scanner automatically. Don't block on
    # the quality-gate compute task — this is a dashboard refresh, not a gate.
    - sonar-scanner -Dsonar.qualitygate.wait=false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SONAR_SCHEDULED == "true"'
  allow_failure: true

web:e2e:
  # End-to-end Playwright tests against the production build, sharded across
  # 2 runners. One shard per runner: the shards run in a single parallel wave
  # (wall-clock ≈ total/2) and cannot co-locate, so the per-shard `workers` in
  # playwright.config.ts stays safe. `fullyParallel`
  # balances the split by test rather than by file, so uneven specs still
  # divide evenly.
  #
  # Consumes dist/ from web:build instead of rebuilding per shard. Emits a blob
  # report per shard; web:e2e:report stitches them into a single HTML report.
  stage: test
  image: $CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG
  # ci:mirror-playwright-base is optional — absent in steady state (this pulls
  # the existing registry mirror tag), present on a Playwright bump so the pull
  # waits for the fresh mirror instead of hitting throttled MCR.
  needs:
    - web:lint
    - web:type-check
    - web:build
    - job: ci:mirror-playwright-base
      optional: true
  parallel: 2
  <<: *rules-web
  cache:
    <<: *web-cache
    policy: pull
  before_script:
    - *retry-fn
    - cd packages/web
    - retry npm ci --prefer-offline --no-audit --no-fund --quiet
  script:
    - npx playwright test --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL" --reporter=blob
  artifacts:
    when: always
    paths:
      - packages/web/blob-report/
    expire_in: 1 day

web:e2e:report:
  # Stitches the per-shard blob reports into one HTML report. Runs even when a
  # shard fails (when: always) — that is exactly when the report matters. Pulls
  # the blob artifacts from all parallel web:e2e instances via needs.
  #
  # --config=playwright.merge.config.ts (not a bare --reporter): the two web:e2e
  # shards bake an ABSOLUTE testDir into their blobs and can run on runners with
  # different builds_dir (/tmp/builds vs /mnt/nvme1/...); merge-reports then aborts
  # with "recorded with different test directories" (issue 1348). The merge config
  # supplies one resolved testDir to rebase every blob onto, and sets reporter:html
  # (the base config uses 'line' in CI, which emits no HTML report).
  stage: test
  image: $CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG
  needs:
    - "web:e2e"
    - job: ci:mirror-playwright-base
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/web/**/*
        - .gitlab-ci.yml
      when: always
  cache:
    <<: *web-cache
    policy: pull
  before_script:
    - *retry-fn
    - cd packages/web
    - retry npm ci --prefer-offline --no-audit --no-fund --quiet
  script:
    - npx playwright merge-reports --config=playwright.merge.config.ts ./blob-report
    # Surface flaky outcomes (tests that only passed on retry) LOUDLY (issue 1514).
    # CI retries otherwise let a non-deterministic test green the job silently.
    # Warn-only for now (exit 0); set TRUEPPM_FLAKY_FAIL=1 to make it a hard gate
    # once the suite is clean. Reads flaky-report.json from the merge step above.
    - node scripts/check-flaky.mjs
  artifacts:
    when: always
    paths:
      - packages/web/playwright-report/
      - packages/web/flaky-report.json
    expire_in: 7 days

web:integration:
  # Full-stack integration tests: real Django + PostgreSQL + Valkey + Vite dev
  # proxy. Covers the three scenarios the mocked web:e2e job cannot exercise:
  #   1. Auth token exchange via the real /api/v1/auth/token/ endpoint
  #   2. Task CRUD write contract against the live database
  #   3. WebSocket broadcast — mutation in one context, assertion in another
  #
  # Runs after every merge to verify end-to-end stack health, and on MRs that
  # touch auth or real-time surfaces (see rules below). The mocked web:e2e job
  # cannot see this class of bug: this is the only job that exercises the full
  # stack across a real page reload, where the in-memory access token, the
  # cookie-based refresh, and WebSocket auth interact (#911 — a reload-only auth
  # regression that slipped through because this job was previously main-only).
  #
  # Uses the custom ci-integration image (built by `ci:build-integration-image`)
  # which pre-bakes Python 3 + libpq-dev + gcc + uvicorn + scheduler[dev] +
  # api[dev] dev-deps on top of the Playwright base. The runtime `pip install -e`
  # only re-links the editable packages — no apt-get, no wheel downloads.
  # Mirrors the #640 ci-api / #651 ci-scheduler pattern.
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-integration:$PLAYWRIGHT_BASE_TAG
  needs:
    - job: ci:build-integration-image
      optional: true
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
    TRUEPPM_ALLOW_DEV_SETTINGS: "1"
    DATABASE_URL: "postgres://trueppm:trueppm@postgres/trueppm_test"
    REDIS_URL: "redis://valkey:6379"
    # Non-secret CI key — dev settings enforce ALLOWED_HOSTS=* + AllowAny guard
    SECRET_KEY: "ci-integration-secret-not-for-production"
    # Vite proxy target: routes /api and /ws/v1 to the local Django process.
    API_URL: "http://127.0.0.1:8000"
    INTEGRATION_USER_EMAIL: "ci@trueppm.test"
    INTEGRATION_USER_PASSWORD: "ci-integration-pw"
    # Every integration spec signs in as the single seeded INTEGRATION_USER, so
    # the whole suite's logins land in one per-account throttle bucket (#1717,
    # default 5/min). Relax that bucket here — this job exercises the real auth
    # *flow* across a live reload, not throttle behavior (covered by the pytest
    # unit tests in tests/apps/access/test_login_throttle.py).
    TRUEPPM_THROTTLE_LOGIN_ACCOUNT_RATE: "1000/min"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Block MRs that change an auth or real-time surface — the interacting
    # in-memory-token / cookie-refresh / WebSocket-auth paths only break under a
    # real reload against the live stack, which web:e2e (mocked) cannot reach.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/web/src/api/client.ts
        - packages/web/src/stores/authStore.ts
        - packages/web/src/features/auth/**/*
        - packages/web/src/hooks/useProjectWebSocket.ts
        - packages/web/src/hooks/useWorkshopSocket.ts
        - packages/web/e2e/integration/**/*
        - packages/api/src/trueppm_api/core/auth_views.py
        - packages/api/src/trueppm_api/apps/sync/consumers.py
        - packages/api/src/trueppm_api/apps/workshops/consumers.py
    # The image this job runs in, and the config that names it. Nothing
    # validated web:integration before merge when only the image changed, which
    # is how a stale-tag pull reached main and broke it for two pipelines
    # (#2825); the Playwright bump that triggered it touched neither an auth nor
    # a real-time surface, so none of the paths above matched.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab/ci-images/integration.Dockerfile
        - .gitlab-ci.yml
  cache:
    # npm content cache (not node_modules — `npm ci` wipes it), so the runtime
    # `npm ci --prefer-offline` rebuilds with zero network on a warm cache (#1212).
    - key:
        files:
          - packages/web/package-lock.json
        prefix: web-npm-cacache
      paths:
        - .cache/npm/
    - key:
        files:
          - packages/api/pyproject.toml
        prefix: api-pip
      paths:
        - .cache/pip/
      policy: pull
  before_script:
    - *retry-fn
    # Image has Python 3 + uvicorn + scheduler[dev] + api[dev] dev-deps resident
    # under /opt/api-venv (on PATH). These installs are fast editable re-links
    # against the checked-out source. `retry` guards the rare case where pip
    # still reaches the index (PIP_RETRIES also applies); the editable re-link
    # itself is offline.
    - retry pip install -e "packages/scheduler[dev]" --quiet
    - retry pip install -e "packages/api[dev]" --quiet
    # Migrate and seed integration fixtures.
    - cd packages/api
    - python manage.py migrate --noinput
    - python manage.py seed_integration_fixtures
    # Start the Django ASGI server in the background.
    - >
      PYTHONPATH=src uvicorn trueppm_api.asgi:application
      --host 127.0.0.1 --port 8000 &
    - cd ../..
    # Wait up to 30 s for Django to accept connections.
    - >
      timeout 30 sh -c
      'until curl -sf http://127.0.0.1:8000/api/v1/health/ > /dev/null;
       do sleep 1; done'
    # Install web dependencies — the step that ECONNRESET-failed in #1212.
    - cd packages/web && retry npm ci --prefer-offline --no-audit --no-fund --quiet && cd ../..
  script:
    - cd packages/web
    # Exclude the @sso-tagged Keycloak handshake spec — it requires the live
    # Keycloak service that only sso:integration stands up (#2274). Both jobs
    # share this testDir, so the split is a CLI filter here, not a config-level
    # testIgnore that would also hide it from sso:integration.
    - npx playwright test e2e/integration/ --grep-invert @sso --config playwright.integration.config.ts --reporter=line
  artifacts:
    when: on_failure
    paths:
      - packages/web/playwright-report/
    expire_in: 7 days

sso:integration:
  # Nightly real-OIDC smoke (#2274). Boots the same real stack as web:integration
  # (Django + PostgreSQL + Valkey + Vite) PLUS a live Keycloak service, then drives
  # a genuine login handshake end-to-end through a real browser: discovery →
  # authorize → Keycloak login form → callback → JWKS-verified ID token → session.
  # Every other SSO test mocks the outbound calls (pytest stubs egress; web:e2e
  # stubs page.route), so this is the only coverage of the real issuer round-trip
  # and the only thing that catches a Keycloak/allauth shape drift.
  #
  # Cadence: nightly-only (the mocked unit/flow tests give fast per-commit
  # coverage; this adds slow drift-detection off the MR critical path). It also
  # runs on MRs that touch the SSO surface / realm / this job so the harness can
  # be validated before merge.
  #
  # Keycloak reaches TruePPM and vice-versa over the private services network, so
  # the OIDC issuer resolves to a private IP that the SSRF egress guard blocks by
  # default — TRUEPPM_EGRESS_ALLOWLISTED_HOSTS=keycloak (ADR-0590) is what makes
  # discovery/token/JWKS reachable, exactly as a self-hoster does for an in-cluster
  # IdP. The browser (Chromium in the job container) reaches keycloak:8080 too.
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-integration:$PLAYWRIGHT_BASE_TAG
  needs:
    - job: ci:build-integration-image
      optional: true
    - job: ci:build-keycloak-image
      optional: true
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
    - name: $CI_REGISTRY_IMAGE/ci-keycloak:26
      alias: keycloak
  variables:
    DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
    TRUEPPM_ALLOW_DEV_SETTINGS: "1"
    DATABASE_URL: "postgres://trueppm:trueppm@postgres/trueppm_test"
    REDIS_URL: "redis://valkey:6379"
    SECRET_KEY: "ci-integration-secret-not-for-production"
    API_URL: "http://127.0.0.1:8000"
    # Deterministic redirect_uri (matches the realm's registered URI) and SPA
    # completion origin — replayed at the token endpoint, so both must be pinned.
    TRUEPPM_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000"
    TRUEPPM_FRONTEND_BASE_URL: "http://127.0.0.1:5173"
    # The one allow-listed host (ADR-0590) — permits egress to the in-network IdP.
    TRUEPPM_EGRESS_ALLOWLISTED_HOSTS: "keycloak"
    # Match the baked realm export + seed_sso_keycloak.
    SSO_KEYCLOAK_ISSUER: "http://keycloak:8080/realms/trueppm-ci"
    SSO_KEYCLOAK_CLIENT_ID: "trueppm-web"
    SSO_KEYCLOAK_CLIENT_SECRET: "trueppm-ci-secret"
    SSO_KEYCLOAK_ALLOWED_DOMAIN: "trueppm-ci.test"
    SSO_ADMIN_EMAIL: "sso-admin@trueppm-ci.test"
    INTEGRATION_USER_EMAIL: "ci@trueppm.test"
    INTEGRATION_USER_PASSWORD: "ci-integration-pw"
    # A single interactive login shouldn't hit the throttle, but relax the
    # per-account login bucket for headroom (as web:integration does, #1717).
    TRUEPPM_THROTTLE_LOGIN_ACCOUNT_RATE: "1000/min"
    # Keycloak start-dev tuning — plain HTTP, request-based hostname.
    KC_HTTP_ENABLED: "true"
    KC_HOSTNAME_STRICT: "false"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SSO_NIGHTLY == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/api/src/trueppm_api/apps/sso/**/*
        - packages/api/src/trueppm_api/apps/integrations/http.py
        - packages/api/src/trueppm_api/settings/base.py
        - packages/web/e2e/integration/sso-keycloak.spec.ts
        - .gitlab/keycloak/trueppm-realm.json
        - .gitlab/ci-images/keycloak.Dockerfile
  cache:
    - key:
        files:
          - packages/web/package-lock.json
        prefix: web-npm-cacache
      paths:
        - .cache/npm/
    - key:
        files:
          - packages/api/pyproject.toml
        prefix: api-pip
      paths:
        - .cache/pip/
      policy: pull
  before_script:
    - *retry-fn
    - retry pip install -e "packages/scheduler[dev]" --quiet
    - retry pip install -e "packages/api[dev]" --quiet
    - cd packages/api
    - python manage.py migrate --noinput
    # A workspace baseline + the Keycloak provider and its test-connection admin.
    - python manage.py seed_integration_fixtures
    - python manage.py seed_sso_keycloak
    - >
      PYTHONPATH=src uvicorn trueppm_api.asgi:application
      --host 127.0.0.1 --port 8000 &
    - cd ../..
    - >
      timeout 30 sh -c
      'until curl -sf http://127.0.0.1:8000/api/v1/health/ > /dev/null;
       do sleep 1; done'
    # Wait for Keycloak to finish start-dev + realm import — its discovery doc
    # answering 200 is the readiness signal the flow actually depends on.
    - >
      timeout 150 sh -c
      'until curl -sf http://keycloak:8080/realms/trueppm-ci/.well-known/openid-configuration > /dev/null;
       do sleep 3; done'
    - cd packages/web && retry npm ci --prefer-offline --no-audit --no-fund --quiet && cd ../..
  script:
    - cd packages/web
    - npx playwright test e2e/integration/sso-keycloak.spec.ts --config playwright.integration.config.ts --reporter=line
  artifacts:
    when: on_failure
    paths:
      - packages/web/playwright-report/
    expire_in: 7 days

website:build:
  # Verify the Starlight documentation site builds cleanly.
  #
  # A zero exit from `astro build` is NOT that verification, and this job's
  # comment used to claim otherwise (#2797). Starlight's content loader catches a
  # per-page render error, logs `[ERROR] Failed to parse Markdown file …`, drops
  # that page's ENTIRE body, emits the index.html anyway, and the build still
  # exits 0. Three pages shipped as bare navigation chrome — 99 characters of
  # body, one <h2> instead of eleven — for 19 days, every pipeline green. The
  # post-build check is what turns that into a red job.
  extends: .website
  # `npm run build` renders ```mermaid fences to static inline SVG at build time
  # via rehype-mermaid, which drives a headless Chromium through Playwright
  # (ADR-0198). The shared `.website` base image is node:22-alpine (musl libc),
  # on which Playwright's bundled Chromium — a glibc binary — cannot launch, so
  # the build would fail there. Override to the same glibc Playwright image the
  # web:e2e suite already uses; Chromium is pre-installed at $PLAYWRIGHT_BROWSERS_PATH.
  # Its version must equal the `playwright` pin in packages/website/package.json —
  # asserted by web:playwright-pins, NOT by a comment: this file previously
  # asserted the match in prose and was silently wrong for 19 days.
  # The client payload stays JS-free — the browser runs only on this build machine.
  image: $CI_REGISTRY_IMAGE/playwright-base:$PLAYWRIGHT_BASE_TAG
  stage: test
  <<: *rules-website
  script:
    # Capture rather than pipe: `npm run build | tee` reports tee's status, so a
    # hard failure would read as exit 0 without `set -o pipefail`. Redirect and
    # re-echo instead, so the job log is unchanged and the exit code is honest.
    - npm run build > ../../website-build.log 2>&1 || { cat ../../website-build.log; exit 1; }
    - cat ../../website-build.log
    # Self-test first: this gate's failure mode is a GREEN build, so "it passed"
    # is not evidence it can still fail. Needs no dist — it builds its own.
    - bash ../../scripts/check-mermaid-rendered.sh --self-test
    - bash ../../scripts/check-mermaid-rendered.sh ../../website-build.log
  artifacts:
    paths:
      - packages/website/dist/
    expire_in: 1 day

# ---------------------------------------------------------------------------
# DEPLOY — GitLab Pages for documentation.
#
# - Release tags (v*): auto-deploy (docs always ship with a release)
# - Main branch: auto-deploy for "next" (unreleased) docs
# ---------------------------------------------------------------------------

pages:
  # GitLab Pages requires the job name to be "pages" and artifacts in public/.
  extends: .website
  stage: deploy
  # Publishes website:build's `packages/website/dist/` artifact instead of
  # rebuilding it. The site is already built once per pipeline, and the second
  # `npm run build` that used to live here paid for a full Mermaid render — plus
  # a ~2 GB glibc Playwright image pull — to reproduce bytes that already
  # existed. With no build left in this job, the image override and the npm
  # install go with it: copying files needs neither Chromium nor node_modules,
  # and dropping the install takes a registry round trip off the deploy path.
  # `website:build` extends *rules-website, which matches main and v* tags
  # unconditionally, so this `needs:` is satisfied on both deploy paths.
  needs: ["website:build"]
  cache: []
  before_script:
    - cd packages/website
  rules:
    # Auto-deploy on release tags
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
      when: on_success
    # Auto-deploy "next" docs from main (#2799). This was `when: manual`, which
    # read like a safety gate and was not one: a click is not a review, nobody
    # diffs a rendered site before clicking, and it fired 3 times across 500
    # jobs — so main and the live site drifted arbitrarily far apart, and every
    # docs bug report had to start by establishing which one it was even looking
    # at. The one run that did fire published three fully blank pages (#2797).
    # Version currency is gated at the content layer instead, where it is
    # actually checkable: `documentedFor` front matter plus :::note[Ships in
    # 0.X] callouts, enforced by scripts/check-version-status.sh. Those callouts
    # are written and removed on a release cadence, so a site this stale worked
    # against the very control meant to keep it honest.
    #
    # No `allow_failure` here: a failed docs deploy must red main rather than
    # pass silently.
    #
    # Scoped to `push` so a merge to main deploys and the nightly SonarCloud
    # schedule (0 1 * * * on refs/heads/main) does not: a schedule republishes
    # a byte-identical site for a tree nobody changed, and "the docs deployed"
    # should mean a commit landed. rules-website matches main unconditionally,
    # so website:build — and therefore this job's `needs:` — is present in the
    # scheduled pipeline too; without this condition the redeploy would fire.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  script:
    # GitLab Pages serves from public/ at the repo root
    - mkdir -p ../../public
    - cp -r dist/* ../../public/
  artifacts:
    paths:
      - public/
    expire_in: 7 days

# ---------------------------------------------------------------------------
# SECURITY — CVE scans + license audit. MR + main only.
#
# The SCA job (security:osv) and the license:check:* jobs use no needs: and rely
# on stage ordering. This avoids blocked-job cascades on single-package MRs: if
# only the API changed, web:test is skipped; a needs: [api:test, web:test] would
# then skip security too, silently dropping the dependency CVE scan.
# ---------------------------------------------------------------------------

scheduler:sbom:
  # Generate + validate a CycloneDX SBOM for the PUBLISHED trueppm-scheduler
  # dependency set so PyPI consumers can verify transparent sources (#936).
  #
  # This job blocks the pipeline on MRs/main: a missing or invalid SBOM is a
  # supply-chain regression for PyPI consumers, so it must fail the pipeline
  # (the same validation is enforced independently in scheduler:publish: before
  # a release is cut). The 0.3 shake-out that ran this non-blocking is over
  # (v0.3.0-alpha.3 shipped), so allow_failure has been removed.
  #
  # cyclonedx-bom is pinned + resident in the ci-scheduler image
  # (.gitlab/ci-images/scheduler.Dockerfile), but the image is published under
  # the mutable :py3.11 tag and our runners only permit the if-not-present pull
  # policy, so a runner holding a pre-rebuild :py3.11 runs without cyclonedx-py
  # ("command not found") on the pipeline that first adds the tool. The
  # before_script install (mirroring scheduler:publish, which runs on a vanilla
  # base) is a fast no-op when the resident copy is present and supplies the
  # tool when the cached image is stale — making the job robust to image churn.
  #
  # The SBOM describes the RUNTIME closure only (networkx + numpy), not dev
  # tooling. It is materialized from the committed packages/scheduler/uv.lock
  # via `uv sync --frozen` — the SAME lockfile security:osv audits — so the SBOM
  # records the exact, hash-verified resolved versions rather than whatever a
  # fresh PyPI resolve happens to return at run time. `--no-editable` installs
  # the project as a built wheel (matching the published artifact); the `dev`
  # extra is opt-in, so a default sync excludes it. cyclonedx-py then describes
  # that locked venv — same analyzer + output shape as before, deterministic
  # input. (uv is pinned to the same 0.9.5 as the api/scheduler uv-lock-check
  # jobs; it is not baked into the ci-scheduler image, so it installs here.)
  extends: .scheduler
  stage: security
  <<: *rules-scheduler
  cache:
    <<: *scheduler-cache
    policy: pull
  before_script:
    - pip install --quiet cyclonedx-bom==7.3.0 uv==0.9.5
  script:
    # only-system pins uv to the image's resident CPython 3.11 instead of
    # downloading a managed interpreter; the locked versions are interpreter-
    # independent, but this keeps the job hermetic.
    - UV_PYTHON_PREFERENCE=only-system uv sync --frozen --no-editable --project packages/scheduler
    - cyclonedx-py environment packages/scheduler/.venv/bin/python
        --validate
        --output-format JSON
        --output-reproducible
        --sv 1.6
        -o packages/scheduler/sbom.cdx.json
    - echo "SBOM generated + validated (locked from uv.lock):" && head -c 400 packages/scheduler/sbom.cdx.json
  artifacts:
    paths:
      - packages/scheduler/sbom.cdx.json
    expire_in: 30 days

security:osv:
  # Unified SCA across the committed lockfiles using the OSV database:
  #   - npm:    packages/web, packages/website, packages/mobile
  #   - Cargo:  packages/wasm-scheduler
  #   - Python: packages/api (uv.lock), packages/scheduler (uv.lock),
  #             packages/mcp (uv.lock)
  # Replaces the per-package npm-audit jobs (former web:security + website:security)
  # and adds Rust coverage that nothing scanned before. This is also where #904's
  # "add npm-audit" finding lands: OSV's surgical, expiring per-advisory ignores
  # supersede a blanket `npm audit --audit-level=high`, so re-adding npm-audit
  # would regress the control rather than strengthen it. The API joined here once
  # its uv.lock was committed (#904), retiring the former combined api+scheduler
  # pip-audit job (#1153 step 1); the scheduler joined once it committed its own
  # uv.lock (#1153 scheduler half), retiring security:pip-audit:scheduler. OSV
  # can only scan a lockfile, so each ecosystem joins here as it commits one.
  #
  # packages/mcp joined at #2603, and was the same omission twice over: it ships
  # to PyPI as `trueppm-mcp`, so it was a PUBLISHED artifact with no dependency
  # scanning at all. If you are reading this list wondering whether a package is
  # covered, the answer is only "yes" if its lockfile appears in -L below.
  #
  # packages/mobile joined late (#2477) and is the cautionary tale for this list:
  # it had committed a lockfile since its first commit but was never added here,
  # so nothing in CI looked at it. GHSA-mh99-v99m-4gvg was caught on web by this
  # job and fixed (#2363) while the identical advisory sat open against mobile
  # for days — visible only as a Dependabot alert on the GitHub mirror, which
  # blocks nothing. A package with a lockfile and no `-L` entry is unscanned, and
  # nothing else in the pipeline will tell you. When adding a package that
  # commits a lockfile, add it here in the same MR.
  #
  # Severity gate (#2261): OSV-Scanner has no native severity threshold — it
  # exits non-zero on ANY non-ignored advisory (confirmed on v2.3.8: no
  # --severity / --fail-on / --audit-level flag). That let a single fixable LOW
  # (dompurify GHSA-c2j3-45gr-mqc4, CVSS 2.1) red-wall the whole pipeline. So we
  # emit `--format json` and pipe it through scripts/osv-severity-gate.sh, which
  # FAILS only on HIGH/CRITICAL (CVSS base score >= 7.0, or the GitHub advisory
  # label when unscored) and WARNS on MEDIUM/LOW (findings still printed, but
  # non-blocking). The `|| true` on the scanner hands the verdict entirely to the
  # gate — the scanner's own exit code (non-zero on any finding) is intentionally
  # discarded. The gate is unit-tested in scripts/tests/osv-severity-gate.test.sh.
  #
  # Suppression still works exactly as before: per-directory osv-scanner.toml
  # files are auto-discovered next to each lockfile, each `IgnoredVulns` entry
  # carrying a `reason` and a self-expiring `ignoreUntil`. OSV-Scanner drops a
  # suppressed advisory before writing the JSON, so it never reaches the gate.
  # Suppression is for an ACCEPTED risk (see packages/api/osv-scanner.toml and
  # packages/scheduler/osv-scanner.toml, migrated off pip-audit); the severity
  # gate is for the "this band shouldn't block at all" case the blanket
  # exit-non-zero conflated with it.
  #
  # Pinned binary download (the official image is distroless / shell-less, which
  # GitLab's script runner can't use); the linux build is a static Go binary.
  stage: security
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  needs: []
  # Run on EVERY MR and branch pipeline, not just when a lockfile changes (#2358).
  # OSV advisories are database-driven: a HIGH can be freshly published against a
  # version we already ship (#2357 — react-router@7.16.0 GHSA-chx6-hx7r-mcp5), with
  # no lockfile diff to trip a `changes:` gate. A changes-scoped MR rule therefore
  # never sees such an advisory on the branch — it first red-walls `main` after
  # merge. Running unconditionally (the job is ~5 s + a static-binary download)
  # catches it on the MR, before it can pollute the protected branch.
  #
  # allow_failure exit_codes 2: the severity gate exits 2 for a MEDIUM/LOW-only
  # result, which GitLab renders as a non-blocking yellow warning (surfacing
  # dependency debt) rather than a silent green pass. HIGH/CRITICAL (exit 1),
  # scan/parse failure (exit 1), and usage error (exit 3) are NOT allowed — they
  # hard-block. See scripts/osv-severity-gate.sh for the full exit-code contract.
  allow_failure:
    exit_codes:
      - 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # jq: the severity gate classifies OSV's JSON output by CVSS band.
    - apk add --no-cache wget jq
    - wget -q -O /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
    - chmod +x /usr/local/bin/osv-scanner
  script:
    # Per-directory osv-scanner.toml files are auto-discovered next to each
    # lockfile (do NOT pass --config, which would force a single global file and
    # break the per-package scoping that keeps a web regression from being masked
    # by a website ignore). `|| true`: the scanner exits non-zero on any finding;
    # the severity verdict is delegated to the gate (see the note above).
    - osv-scanner scan source
        -L packages/web/package-lock.json
        -L packages/website/package-lock.json
        -L packages/mobile/package-lock.json
        -L packages/wasm-scheduler/Cargo.lock
        -L packages/api/uv.lock
        -L packages/scheduler/uv.lock
        -L packages/mcp/uv.lock
        --format json --output-file osv-results.json || true
    - sh scripts/osv-severity-gate.sh osv-results.json

security:gitleaks:
  # Secret scanning across the whole working tree (#1251). The one scanner the
  # suite was missing: bandit/semgrep cover insecure code, osv covers
  # vulnerable deps, trivy covers IaC — none of them catch a committed
  # credential. Runs on every MR and on main (a secret can appear in ANY file,
  # so unlike the dep scanners this carries no `changes:` filter), and is also
  # wired as a pre-commit hook for the earliest catch.
  #
  # `gitleaks dir` scans the checked-out tree (not git history) — fast, and
  # robust to GitLab's shallow clone; it catches anything currently in the tree,
  # including a secret slipped past the local hook via `git push --no-verify`.
  # Scoped, documented allowlists live in .gitleaks.toml (extends the upstream
  # default ruleset). Pinned static binary download, matching the osv/trivy jobs.
  stage: security
  image: alpine:3.20
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache wget
    - wget -q -O /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
    - chmod +x /usr/local/bin/gitleaks
  script:
    - gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

security:trivy:config:
  # IaC misconfiguration scan (Dockerfiles + Helm chart) via Trivy. Complements
  # security:osv (which covers dependency CVEs): this catches container/k8s
  # hardening regressions — missing non-root USER, readOnlyRootFilesystem,
  # dropped capabilities, etc. Gates on HIGH/CRITICAL.
  #
  # Justified, scoped suppressions live in .trivyignore.yaml (currently the
  # intentional readOnlyRootFilesystem omission on the bundled dev/demo
  # postgres + valkey sub-charts). Image-layer CVE scanning runs at release time
  # in the publish jobs (trivy image before push).
  stage: security
  # alpine + pinned binary download via the official install script. Avoids
  # depending on the trivy container image's tag scheme and matches the install
  # used by the trivy image scan in the publish jobs.
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/**/Dockerfile
        - packages/helm/**/*
        - .trivyignore.yaml
        - .gitlab-ci.yml
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  before_script:
    - apk add --no-cache curl
    # Install a pinned, checksum-verified Trivy release instead of piping the
    # mutable upstream install.sh through `sh` (#904 supply-chain hardening — the
    # OpenSSF Scorecard "Pinned-Dependencies" failure). Mirrors the cargo-deny /
    # wasm-pack pinned-tarball pattern. Bump version + hash together when upgrading.
    - |
      TRIVY_VERSION=0.71.0
      TRIVY_SHA256=30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
      TRIVY_TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_TARBALL}" -o /tmp/trivy.tar.gz
      echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
      tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml --skip-dirs '**/node_modules' packages/

security:semgrep:
  # SAST for the application source: JS/TS/React (web) + Python/Django
  # (api, scheduler). Complements bandit (Python-only) and the SCA scanners
  # (security:osv) / IaC scanner (security:trivy:config).
  #
  # Gates on ERROR + WARNING severity. The WARNING-level best-practice findings
  # were triaged in #1154 (fixed or inline-justified with `# nosemgrep`), so the
  # gate now fails on WARNING too. INFO-level findings stay un-gated (out of
  # scope for #1154) — hence the explicit severity list rather than the default.
  #
  # Rules are VENDORED under .semgrep/ (p/default, p/react, p/django), not pulled
  # live from the registry — so the scan runs fully offline. The live registry
  # fetch was the pipeline's largest tail-variance source (34s→113s swing, #1639)
  # and a reproducibility hole (a registry rule change could fail an unrelated
  # MR). Refresh with scripts/update-semgrep-rules.sh; keep the pack list there in
  # lockstep with the .semgrep/*.yml configs below. No Semgrep AppSec Platform
  # account or token is used — this is a self-contained, local-rules run.
  stage: security
  image:
    name: semgrep/semgrep:1.166.0@sha256:c180f0c93a17b420c0af5006214a29d3c747c5459c732b740191adf657dd0068
    entrypoint: [""]
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/web/src/**/*
        - packages/api/src/**/*
        - packages/scheduler/src/**/*
        - .semgrep/**/*
        - .gitlab-ci.yml
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    # --config against local files (not p/ pack names) → no network, no registry
    # variance. Scope, severity gate, and excludes are unchanged from the live run.
    - semgrep scan
        --config .semgrep/default.yml --config .semgrep/django.yml --config .semgrep/react.yml
        --severity ERROR --severity WARNING --error --metrics off
        --exclude 'node_modules' --exclude 'dist'
        --exclude '*.test.ts' --exclude '*.test.tsx' --exclude 'e2e' --exclude 'tests'
        packages/web/src packages/api/src packages/scheduler/src

renovate:
  # Self-hosted Renovate runner (the #1153 rollout, step 4). Opens grouped
  # dependency-update MRs so transitives never go stale enough to become a CVE
  # scramble (the root cause of #1152). Behaviour is configured in renovate.json
  # (no auto-merge — project policy; major bumps are opt-in via the dashboard).
  #
  # ONE-TIME SETUP (a maintainer must do this — the runner stays dormant until):
  #   1. Create a GitLab access token (project or group) with `api` +
  #      `write_repository` scope. Add it as a MASKED CI/CD variable RENOVATE_TOKEN.
  #   2. Create a Pipeline Schedule (Settings -> CI/CD -> Pipeline schedules):
  #      daily cron, with a variable RENOVATE = "true". renovate.json restricts
  #      actual PR creation to Monday mornings, so a daily run is cheap.
  #   3. RECOMMENDED isolation: point the schedule at a dedicated `renovate-bot`
  #      branch (created off main). Because every other job is gated on
  #      `branch == main`, only this job runs there — the schedule won't spin up
  #      a full main pipeline. (A schedule on main also works but runs everything.)
  stage: security
  image: renovate/renovate:43@sha256:498de63b02c02b49c34dfe0119b59da8e5232e701c813960bcbee80760b148dd
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"'
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "${CI_API_V4_URL}"
    RENOVATE_TOKEN: "${RENOVATE_TOKEN}"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "${CI_PROJECT_PATH}"
    LOG_LEVEL: "info"
  script:
    - renovate

license:check:py:
  # Verify no copyleft-licensed Python dependency has been introduced.
  # LGPL is permitted (library-linking exemption applies).
  #
  # Scope is packages/scheduler + packages/api. packages/mcp is audited by
  # license:check:mcp in its own venv (#2603) — see that job for why it is not a
  # third editable install here. If you add a Python package, it needs a job:
  # this one will not notice it.
  #
  # Split from a former single license:check job (kaizen): mixing Python +
  # Node in one container forced a per-run `apt-get install nodejs npm` onto
  # the python-slim ci-api image (network-bound, the dominant cost) and made
  # the two halves run serially. Splitting drops the apt install entirely,
  # runs the halves in parallel, and scopes each rule to its own manifests so
  # a web-only dep bump no longer pays the Python re-link and vice versa.
  # Mirrors the existing security:osv (Python+node+cargo) per-manifest scoping.
  #
  # Kaizen #640 N1: `changes:` is dep manifests only — license composition
  # only changes when manifests/lock files do; main + scheduled runs catch
  # transitive drift that a lock-file refresh might miss.
  stage: security
  image: $CI_REGISTRY_IMAGE/ci-api:py3.11
  needs:
    - job: ci:build-api-image
      optional: true
  cache:
    <<: *api-cache
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/scheduler/pyproject.toml
        - packages/api/pyproject.toml
        - .gitlab-ci.yml
  before_script:
    # Image already has scheduler[dev] + api[dev] dev-dep wheels resident;
    # these installs are fast editable re-links against the checked-out source.
    - pip install pip-licenses --quiet
    - pip install -e "packages/scheduler[dev]" --quiet
    - pip install -e packages/api --quiet
  script:
    - pip-licenses --order=license --format=plain-vertical
    - >-
      pip-licenses
      --fail-on="GNU General Public License v2 (GPLv2);
                 GNU General Public License v3 (GPLv3);
                 GNU Affero General Public License v3 (AGPLv3)"

license:check:web:
  # Verify no copyleft-licensed npm dependency has been introduced.
  # node:22-alpine already ships node, so there is no apt install to pay.
  # See license:check:py above for why this was split out.
  stage: security
  # needs:[] so this starts immediately instead of waiting for the whole test
  # stage — it runs its own `npm ci` and consumes no build artifact, so stage
  # gating only made it the last job to finish (its six sibling security jobs
  # already use needs:[]).
  needs: []
  # node:22 — react-router 8 requires Node >=22.22 (#2362).
  image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd
  cache:
    <<: *web-cache
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/web/package.json
        - packages/web/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - *retry-fn
    - cd packages/web
    # npm ci is deterministic against the lockfile and faster than npm install.
    # --omit=dev installs only the production dependency subset: a license audit
    # of `--production` deps never needs the ~600 dev-tool packages, so skipping
    # them shrinks both the install and the tree license-checker has to walk.
    # --prefer-offline resolves from the pulled web-npm cache.
    - retry npm ci --omit=dev --prefer-offline --no-audit --no-fund --quiet
  script:
    # --onlyAllow covers --failOn implicitly: any license not in the list fails.
    # @trueppm/web declares license "Apache-2.0" in package.json and is audited
    # like any other package. It must NOT be "private": true — license-checker
    # force-reports every private package as UNLICENSED (lib/index.js), which the
    # allow-list then rejects. Dropping `private` lets its real license show.
    - npx license-checker --production
        --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;WTFPL;BlueOak-1.0.0"

license:check:website:
  # #2603: packages/website had zero license-compliance coverage — license:check:web
  # hardcodes packages/web, so the docs site's production tree was never audited.
  #
  # Deliberately a separate job with a separate allow-list rather than a second
  # directory inside license:check:web, because the docs site needs two licenses
  # the application bundle should keep failing on:
  #
  #   LGPL-3.0-or-later — `sharp` (Astro's image pipeline) bundles libvips as
  #     @img/sharp-libvips-*. CLAUDE.md permits LGPL for a dynamically-linked
  #     library, and this is the site generator's build dependency, not shipped
  #     runtime code.
  #   MPL-2.0 — `lightningcss` reaches the tree as astro -> vite -> lightningcss,
  #     one non-optional package plus eleven per-platform binaries. MPL is
  #     file-level copyleft: it reaches modifications to the licensed files
  #     themselves, not the site that builds with them. Same dependency and same
  #     reasoning as license:check:mobile, arriving by a different route.
  #
  # Widening web's list instead would grant both allowances to the *application*
  # bundle, where a new copyleft dependency is a genuine problem worth failing
  # on. Scope each exception to the package that needs it.
  #
  # --excludePrivatePackages: license-checker force-reports any package marked
  # `private: true` as UNLICENSED (lib/index.js), and trueppm-website is private
  # by design — it is a site, not a publishable package. Excluding it audits the
  # dependency tree, which is what this gate is for. (license:check:web takes the
  # other route for @trueppm/web — see its note — because that package is not
  # private and its declared license should be checked like any other.)
  stage: security
  needs: []
  image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd
  cache:
    key:
      files:
        - packages/website/package-lock.json
      prefix: website-npm-cacache
    paths:
      - .cache/npm/
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/website/package.json
        - packages/website/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - *retry-fn
    - cd packages/website
    - retry npm ci --omit=dev --prefer-offline --no-audit --no-fund --quiet
  script:
    - npx license-checker --production --excludePrivatePackages
        --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;WTFPL;BlueOak-1.0.0;LGPL-3.0-or-later;MPL-2.0"

license:check:mobile:
  # #2603: packages/mobile had zero license-compliance coverage — the same
  # omission as its OSV gap (#2477), which is why both are worth stating twice:
  # a package is covered by a scan only if it is named in that scan's config.
  #
  # MPL-2.0 is allowed here for `lightningcss` (nativewind's CSS pipeline).
  # MPL is file-level copyleft: it reaches modifications to the licensed files
  # themselves and not the app that imports them, so it is compatible with an
  # Apache 2.0 distribution — CLAUDE.md's "with care" band. As with the website
  # job, the exception is scoped to the package that needs it rather than
  # widened into the web allow-list.
  #
  # `type-fest` resolves to the SPDX expression "(MIT OR CC0-1.0)"; license-checker
  # satisfies compound expressions against the allow-list, so both disjuncts being
  # present is enough and no per-package exclusion is needed. Verified locally.
  stage: security
  needs: []
  image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
  cache:
    <<: *mobile-cache
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/mobile/package.json
        - packages/mobile/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - *retry-fn
    - cd packages/mobile
    - retry npm ci --omit=dev --prefer-offline --no-audit --no-fund --quiet
  script:
    - npx license-checker --production --excludePrivatePackages
        --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;WTFPL;BlueOak-1.0.0;MPL-2.0"

license:check:mcp:
  # #2603: packages/mcp ships to PyPI as `trueppm-mcp` and had no license audit —
  # a published artifact whose dependency licenses nothing checked.
  #
  # Its own job rather than a third `pip install -e` inside license:check:py:
  # mcp is a standalone client (mcp[cli] + httpx, no Django, no ORM), and
  # resolving it into the API's pinned environment would let an unrelated
  # dependency conflict fail a licensing gate. A clean venv keeps the failure
  # modes honest — if this job goes red, it is about licenses.
  stage: security
  needs: []
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/mcp/pyproject.toml
        - packages/mcp/uv.lock
        - .gitlab-ci.yml
  before_script:
    - python -m venv /tmp/mcp-venv
    - /tmp/mcp-venv/bin/pip install --quiet --upgrade pip
    - /tmp/mcp-venv/bin/pip install --quiet pip-licenses
    - /tmp/mcp-venv/bin/pip install --quiet ./packages/mcp
  script:
    - /tmp/mcp-venv/bin/pip-licenses --order=license --format=plain-vertical
    - >-
      /tmp/mcp-venv/bin/pip-licenses
      --fail-on="GNU General Public License v2 (GPLv2);
                 GNU General Public License v3 (GPLv3);
                 GNU Affero General Public License v3 (AGPLv3)"

wasm:license-check:
  # Verify no copyleft-licensed Rust dependency has been introduced, and that no
  # crate carries an unignored RustSec advisory or has been yanked.
  # Uses cargo-deny to check crate licenses + advisories against deny.toml.
  extends: .wasm
  stage: security
  # git + the pinned cargo-deny 0.19.9 are baked into the ci-wasm image (0.19.x
  # is required to parse CVSS 4.0 entries in the live RustSec DB); the job just
  # runs the check. Re-add the optional ci:build-wasm-image need (extends
  # replaces the template's needs list); before_script falls back to .wasm's cd.
  needs:
    - wasm:test
    - job: ci:build-wasm-image
      optional: true
  <<: *rules-wasm
  script:
    - cargo deny check licenses advisories

# ---------------------------------------------------------------------------
# PUBLISH — tag-triggered release jobs.
#
# Trigger: push a git tag matching `scheduler-vX.Y.Z` (e.g. scheduler-v0.1.0).
# The tag must be pushed AFTER the main pipeline is green — there is no
# explicit needs: here because publish jobs run on tag events, not MR events,
# and the security stage will not have run on the tag itself.
#
# Status (#937): the PyPI project name is NOT pending reservation — it is LIVE.
# `trueppm-scheduler` already has two manually-uploaded alpha releases (0.1.0a1
# on 2026-05-15, 0.2.0a1 on 2026-05-31). The 0.3 promotion (#914) should publish
# via THIS tagged CI path, not a laptop, so the release is reproducible.
#
# Authentication: PyPI Trusted Publishing via GitLab OIDC (#938). The job
# presents a short-lived GitLab ID token that PyPI exchanges for a scoped,
# single-use upload token — there is NO long-lived secret on the publish path.
# The former static PYPI_TOKEN CI/CD variable is no longer read and may be
# deleted from Settings → CI/CD → Variables.
#
# PyPI-side configuration: a Trusted Publisher must be registered on the
# `trueppm-scheduler` PyPI project matching this pipeline's OIDC claims exactly —
# namespace `trueppm`, project `trueppm`, top-level pipeline file `.gitlab-ci.yml`,
# and a BLANK environment name (this job sets no `environment:`; a non-blank value
# would itself 422). If that publisher is missing, the mint-token step below fails
# HTTP 422 before any upload — this is what bit the first OIDC tag, 0.3.0a1 (#1387);
# 0.1/0.2 published via the now-removed static PYPI_TOKEN so never exercised it.
# PyPI project ownership: the maintainer account (Kelly Hair) that uploaded the
# 0.1/0.2 alphas. Full registration steps are in the release runbook
# (packages/website/src/content/docs/contributing/release.md).
#
# Provenance (#938): the job also emits PEP 740 digital attestations for the
# exact sdist + wheel it uploads, signed via Sigstore with a second GitLab OIDC
# token (aud: sigstore). PyPI verifies the attestation against the Trusted
# Publisher and renders a "built by this CI, unmodified" badge on the project.
#
# The job builds an sdist + wheel using `python -m build` (PEP 517 standard),
# generates + validates a CycloneDX SBOM (#936), signs PEP 740 attestations,
# then uploads with `twine`. hatchling is the build backend (pyproject.toml).
# ---------------------------------------------------------------------------

scheduler:publish:
  # Publishes trueppm-scheduler to PyPI. Closes issue #37.
  stage: publish
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  rules:
    # Only fire on tags matching the scheduler version format.
    # Never fire on branch pushes or MR events.
    - if: '$CI_COMMIT_TAG =~ /^scheduler-v\d+\.\d+\.\d+/'
  cache:
    <<: *scheduler-cache
    policy: pull
  # GitLab OIDC tokens for PyPI Trusted Publishing (#938). Two audiences:
  #   PYPI_ID_TOKEN (aud: pypi)         — exchanged at PyPI's mint-token endpoint
  #                                       for a short-lived, project-scoped token.
  #   SIGSTORE_ID_TOKEN (aud: sigstore) — ambient identity Sigstore uses to sign
  #                                       the PEP 740 attestations (read by
  #                                       sigstore-python's GitLab detector).
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    # Suppress the keyring warning that fires in non-interactive environments.
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  before_script:
    # cyclonedx-bom pinned to match the resident version in the ci-scheduler
    # image (.gitlab/ci-images/scheduler.Dockerfile); this job runs on the
    # python:3.11-slim base, so it installs the tooling here. twine>=6.1 uploads
    # the PEP 740 attestation sidecars passed to it (see the upload step below);
    # pypi-attestations signs them via Sigstore — pinned so its CLI cannot drift
    # silently like the other tools on this line. uv (pinned to 0.9.5, matching
    # the uv-lock-check jobs) materializes the locked SBOM input below.
    - pip install build "twine>=6.1" cyclonedx-bom==7.3.0 pypi-attestations==0.0.28 uv==0.9.5 --quiet
  script:
    # Verify the tag version matches the version declared in pyproject.toml.
    # Mismatches (e.g. forgot to bump the version) fail fast before uploading.
    - |
      PKG_VERSION=$(python -c "
      import tomllib, sys
      with open('packages/scheduler/pyproject.toml', 'rb') as f:
          d = tomllib.load(f)
      print(d['project']['version'])
      ")
      TAG_VERSION="${CI_COMMIT_TAG#scheduler-v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
        echo "Bump the version in packages/scheduler/pyproject.toml before tagging."
        exit 1
      fi
      echo "Version check passed: $PKG_VERSION"
      # Every published version must ship dated release notes. scripts/release.sh
      # rotates packages/scheduler/CHANGELOG.md [Unreleased] into a "## [<version>]"
      # section at tag time (scripts/rotate-scheduler-changelog.sh); this guards a
      # hand-cut tag that skipped that step from shipping a perpetual [Unreleased].
      if ! grep -qF "## [$PKG_VERSION]" packages/scheduler/CHANGELOG.md; then
        echo "ERROR: packages/scheduler/CHANGELOG.md has no '## [$PKG_VERSION]' release-notes section."
        echo "Run scripts/release.sh (which rotates [Unreleased] into a dated section) or add it by hand before tagging."
        exit 1
      fi
      echo "Release notes present for $PKG_VERSION"
    - cd packages/scheduler
    - python -m build
    # Generate + validate the CycloneDX SBOM BEFORE uploading (#936). Ordering
    # matters: never let twine succeed (the release goes live) and then fail the
    # job on a malformed SBOM. The runtime closure is materialized from the
    # committed uv.lock (`uv sync --frozen --no-editable`, hash-verified) — the
    # same locked, OSV-audited surface scheduler:sbom describes on MRs/main — so
    # the published SBOM is reproducible rather than a fresh PyPI resolve. The
    # `dev` extra is opt-in, so a default sync keeps build/dev tooling out.
    - UV_PYTHON_PREFERENCE=only-system uv sync --frozen --no-editable
    - cyclonedx-py environment .venv/bin/python --validate --output-format JSON --output-reproducible --sv 1.6 -o dist/sbom.cdx.json
    # Sign PEP 740 attestations for the SAME sdist + wheel uploaded below — the
    # exact artifacts the SBOM is generated from — NOT the SBOM itself, which is
    # not a PyPI distribution file (the explicit *.tar.gz / *.whl globs exclude
    # dist/sbom.cdx.json). Sigstore signs using the ambient SIGSTORE_ID_TOKEN.
    - python -m pypi_attestations sign dist/*.tar.gz dist/*.whl
    # Mint a short-lived, project-scoped PyPI upload token from the GitLab OIDC
    # token (Trusted Publishing) — no static PYPI_TOKEN. The minted token is
    # passed only via the twine environment below and is never echoed.
    - |
      PYPI_API_TOKEN=$(python -c '
      import json, os, sys, urllib.request, urllib.error
      req = urllib.request.Request("https://pypi.org/_/oidc/mint-token", data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(), headers={"Content-Type": "application/json"})
      try:
          resp = urllib.request.urlopen(req)
      except urllib.error.HTTPError as e:
          # PyPI states the exact reason (e.g. no Trusted Publisher matches the
          # pipeline OIDC claims) in the response body; surface it on stderr
          # instead of the bare "HTTP Error 422" traceback so the failure is
          # self-diagnosing (#1387). Only the token goes to stdout (captured by
          # the command substitution); diagnostics must not pollute it.
          sys.stderr.write("PyPI mint-token failed: HTTP %s %s\n" % (e.code, e.reason))
          sys.stderr.write(e.read().decode("utf-8", "replace") + "\n")
          sys.exit(1)
      print(json.load(resp)["token"])
      ')
    # Upload the wheel + sdist plus their `.publish.attestation` sidecars. In
    # twine >= 6.1 `--attestations` is an opt-in GATE (fail if none present), NOT
    # filesystem discovery — twine only attaches attestation files passed as
    # explicit arguments (it splits inputs by `*.*.attestation`). The sidecars
    # must therefore be in the upload arg list, or twine errors with
    # "has no associated attestations" before any upload (#1390). The SBOM is
    # never passed, so the explicit globs keep dist/sbom.cdx.json a CI artifact /
    # Release asset rather than a PyPI file.
    - TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" twine upload --attestations dist/*.tar.gz dist/*.whl dist/*.publish.attestation --non-interactive --verbose
  artifacts:
    # Keep the built wheel + sdist + SBOM as a CI artifact for traceability.
    # The SBOM ships here today; attaching dist/sbom.cdx.json to the GitLab
    # Release awaits a scheduler release-cli job. It is never a PyPI file.
    paths:
      - packages/scheduler/dist/
    expire_in: 30 days

# scheduler:publish:test (TestPyPI on every main merge) was removed earlier.
# The tag-triggered scheduler:publish above is LIVE, not dormant: the PyPI name
# is reserved and two alphas are published (#937). Push a `scheduler-vX.Y.Z`
# tag (after a green main pipeline) to release.

mcp:publish:
  # Publishes trueppm-mcp to PyPI (#2809). Modeled directly on scheduler:publish
  # above — same Trusted Publishing exchange, same PEP 740 attestations, same
  # locked-SBOM-before-upload ordering — with its own `mcp-vX.Y.Z` tag scheme so
  # the MCP server can be released independently of the scheduler library.
  #
  # Why this job exists: packages/mcp had NO publish path at all. Three docs
  # pages instructed `pip install trueppm-mcp`, packages/mcp/server.json declared a
  # `pypi` registry entry with a `uvx` runtime hint, and two CI comments (in
  # security:osv and license:check:mcp) asserted the package "ships to PyPI as
  # trueppm-mcp" — while nothing in the publish stage built it and the name
  # 404'd on pypi.org. Those comments are true as of this job.
  stage: publish
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  rules:
    # Only fire on tags matching the mcp version format (PEP 440, e.g.
    # mcp-v0.4.0b1). Never fire on branch pushes or MR events.
    - if: '$CI_COMMIT_TAG =~ /^mcp-v\d+\.\d+\.\d+/'
  # Binds the GitLab OIDC claims to a named environment so the PyPI Trusted
  # Publisher for `trueppm-mcp` can be registered with a NON-BLANK environment.
  # A publisher bound with a blank environment matches every pipeline in this
  # project that can mint a `pypi`-audience token, which is a wider trust
  # surface than one release job needs. The environment name here MUST match
  # the "Environment name" field configured on pypi.org, or the mint-token
  # exchange fails closed with PyPI's own explanation (surfaced on stderr by
  # the mint step below).
  environment:
    name: pypi-mcp
    url: https://pypi.org/project/trueppm-mcp/
  # GitLab OIDC tokens for PyPI Trusted Publishing. Two audiences:
  #   PYPI_ID_TOKEN (aud: pypi)         — exchanged at PyPI's mint-token endpoint
  #                                       for a short-lived, project-scoped token.
  #   SIGSTORE_ID_TOKEN (aud: sigstore) — ambient identity Sigstore uses to sign
  #                                       the PEP 740 attestations.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    # Suppress the keyring warning that fires in non-interactive environments.
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  before_script:
    # Same pinned tool set as scheduler:publish — this job runs on the vanilla
    # python:3.11-slim base, so everything installs here. twine >= 6.1 uploads
    # the PEP 740 attestation sidecars passed to it; pypi-attestations signs
    # them via Sigstore; uv (0.9.5, matching the uv-lock-check jobs)
    # materializes the locked SBOM input.
    - pip install build "twine>=6.1" cyclonedx-bom==7.3.0 pypi-attestations==0.0.28 uv==0.9.5 --quiet
  script:
    # Verify the tag version matches the version declared in pyproject.toml AND
    # the two version fields in server.json (the MCP registry manifest, which
    # carries the semver form at the top level and the PEP 440 PyPI version
    # under packages[0]). server.json is checked here because it is the file
    # that tells an MCP client which version to `uvx`: publishing a wheel while
    # the manifest advertises a different one is the drift this job exists to
    # make impossible. Mismatches fail fast, before anything is uploaded.
    - |
      PKG_VERSION=$(python -c "
      import tomllib
      with open('packages/mcp/pyproject.toml', 'rb') as f:
          d = tomllib.load(f)
      print(d['project']['version'])
      ")
      TAG_VERSION="${CI_COMMIT_TAG#mcp-v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
        echo "Bump the version in packages/mcp/pyproject.toml before tagging."
        exit 1
      fi
      echo "Version check passed: $PKG_VERSION"
      python - "$PKG_VERSION" <<'PY'
      import json, sys

      pkg_version = sys.argv[1]
      with open("packages/mcp/server.json", encoding="utf-8") as f:
          manifest = json.load(f)
      pypi_versions = [
          p.get("version")
          for p in manifest.get("packages", [])
          if p.get("registryType") == "pypi"
      ]
      if pypi_versions != [pkg_version]:
          sys.exit(
              "ERROR: packages/mcp/server.json pypi package version(s) "
              f"{pypi_versions} do not match pyproject.toml ({pkg_version}). "
              "Bump server.json before tagging."
          )
      # The registry manifest's own version is the semver form of the same
      # release (0.4.0b1 -> 0.4.0-beta.1); normalize before comparing so the
      # two schemes cannot drift apart unnoticed.
      normalized = (
          manifest["version"]
          .replace("-alpha.", "a")
          .replace("-beta.", "b")
          .replace("-rc.", "rc")
      )
      if normalized != pkg_version:
          sys.exit(
              f"ERROR: packages/mcp/server.json version ({manifest['version']}) "
              f"is not the semver form of {pkg_version}. Bump it before tagging."
          )
      print(f"server.json version check passed: {manifest['version']} / {pkg_version}")
      PY
    # The mcp package has no standalone CHANGELOG.md (unlike packages/scheduler,
    # whose wheel force-includes one), so there is no per-package release-notes
    # gate to mirror here — the root CHANGELOG.md is its release record.
    - cd packages/mcp
    - python -m build
    # Generate + validate the CycloneDX SBOM BEFORE uploading. Ordering matters:
    # never let twine succeed (the release goes live) and then fail the job on a
    # malformed SBOM. The runtime closure is materialized from the committed
    # uv.lock (`uv sync --frozen --no-editable`, hash-verified) — the same locked
    # surface security:osv audits — so the published SBOM is reproducible rather
    # than a fresh PyPI resolve. The `dev` extra is opt-in, so a default sync
    # keeps test/lint tooling out of the runtime SBOM.
    - UV_PYTHON_PREFERENCE=only-system uv sync --frozen --no-editable
    - cyclonedx-py environment .venv/bin/python --validate --output-format JSON --output-reproducible --sv 1.6 -o dist/sbom.cdx.json
    # Sign PEP 740 attestations for the SAME sdist + wheel uploaded below. The
    # explicit globs exclude dist/sbom.cdx.json, which is not a PyPI file.
    - python -m pypi_attestations sign dist/*.tar.gz dist/*.whl
    # Mint a short-lived, project-scoped PyPI upload token from the GitLab OIDC
    # token (Trusted Publishing) — no static PYPI_TOKEN. The minted token is
    # passed only via the twine environment below and is never echoed.
    - |
      PYPI_API_TOKEN=$(python -c '
      import json, os, sys, urllib.request, urllib.error
      req = urllib.request.Request("https://pypi.org/_/oidc/mint-token", data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(), headers={"Content-Type": "application/json"})
      try:
          resp = urllib.request.urlopen(req)
      except urllib.error.HTTPError as e:
          # PyPI states the exact reason (e.g. no Trusted Publisher matches the
          # pipeline OIDC claims, including a mismatched environment) in the
          # response body; surface it on stderr instead of the bare "HTTP Error
          # 422" traceback so the failure is self-diagnosing. Only the token
          # goes to stdout (captured by the command substitution).
          sys.stderr.write("PyPI mint-token failed: HTTP %s %s\n" % (e.code, e.reason))
          sys.stderr.write(e.read().decode("utf-8", "replace") + "\n")
          sys.exit(1)
      print(json.load(resp)["token"])
      ')
    # Upload the wheel + sdist plus their `.publish.attestation` sidecars. In
    # twine >= 6.1 `--attestations` is an opt-in GATE (fail if none present), NOT
    # filesystem discovery — the sidecars must appear in the argument list or
    # twine errors with "has no associated attestations" before any upload.
    - TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" twine upload --attestations dist/*.tar.gz dist/*.whl dist/*.publish.attestation --non-interactive --verbose
  artifacts:
    # Keep the built wheel + sdist + SBOM as a CI artifact for traceability.
    # The SBOM is never a PyPI file.
    paths:
      - packages/mcp/dist/
    expire_in: 30 days

# BEFORE THE FIRST `mcp-v*` TAG (one-time, human, cannot be automated):
# register a PyPI Trusted Publisher for the project name `trueppm-mcp` at
# https://pypi.org/manage/account/publishing/ with:
#   Publisher     : GitLab
#   Namespace     : trueppm
#   Project       : trueppm
#   Workflow file : .gitlab-ci.yml
#   Environment   : pypi-mcp        <- MUST be set, and MUST match the
#                                      `environment:` block above
# Leaving the environment blank would let any pipeline in this project that can
# mint a `pypi`-audience OIDC token upload to the package; the named
# environment narrows the binding to this release job. Until the publisher
# exists, the mint-token step fails closed with PyPI's own 422 explanation and
# nothing is uploaded.

# ---------------------------------------------------------------------------
# PUBLISH — Docker images and Helm chart.
#
# Trigger: push a git tag matching `v*` (e.g. v0.4.0-beta.1).
# Each job pushes the public artifact to GHCR under
# ghcr.io/$GHCR_USER/{api,web,charts}, in addition to the internal GitLab
# Container Registry mirror. Tags pushed: full semver + latest.
#
# GHCR is the public release target as of the 0.4 beta (#939): 0.3 was the last
# alpha (internal GitLab registry only), and the 0.4 beta is the first public
# GHCR release. GHCR push is therefore REQUIRED on a release tag — a missing
# GHCR credential fails the job loudly rather than silently skipping, so a tag
# can never appear to succeed without publishing the public images/chart.
#
# Supply-chain (#940): every published api/web image is Trivy-scanned (release
# fails on fixable HIGH/CRITICAL CVEs), gets a CycloneDX SBOM generated by Syft
# (retained as a non-expiring job artifact), and — once pushed to GHCR — is
# signed with Cosign keyless (Sigstore, via the GitLab SIGSTORE_ID_TOKEN OIDC
# audience, the same ambient identity scheduler:publish uses) with its SBOM
# attached as a CycloneDX attestation. Consumers verify with `cosign verify`
# and `cosign verify-attestation` against the GitLab CI issuer + tag-ref
# identity. The Helm OCI chart is signed the same way.
#
# Required CI/CD variables (Settings → CI/CD → Variables). These gate the first
# `v0.4.0-beta*` tag and MUST be configured by a maintainer before it is pushed:
#   GHCR_TOKEN — GitHub PAT (or org-scoped token) with write:packages scope.
#                Mark Masked + Protected.
#   GHCR_USER  — GitHub org/username (e.g. trueppm). Mark Protected.
# Cosign signing needs no key material or secret — it is keyless via the
# id_tokens: SIGSTORE_ID_TOKEN OIDC block below.
#
# Multi-arch (linux/arm64) is deferred to 0.5 — single-platform amd64 for 0.4.
# ---------------------------------------------------------------------------

# Fires on any semver tag — stable and pre-release alike.
.rules-release-tag: &rules-release-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# Shared base for Docker publish jobs.
# GitLab Container Registry credentials ($CI_REGISTRY_*) are injected
# automatically by the runner — no CI/CD variable setup needed. GHCR is the
# public release target and is REQUIRED on a release tag: $GHCR_USER and
# $GHCR_TOKEN must both be set, or the job fails loudly (see api:publish /
# web:publish) rather than silently skipping the public push.
.docker-publish-base:
  stage: publish
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  # Keyless Cosign signing (#940): Sigstore reads this ambient GitLab OIDC token
  # (aud: sigstore) to sign the pushed GHCR images without any key material —
  # the same audience scheduler:publish uses for PEP 740 attestations.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    # Trivy scans each built image before it is pushed (the docker save |
    # trivy image --input gate), Syft generates a CycloneDX SBOM per image, and
    # Cosign signs + attests the GHCR-published digest (see api:publish /
    # web:publish).
    - apk add --no-cache curl
    # Install pinned, checksum-verified Trivy + Syft releases instead of piping
    # the mutable upstream install.sh through `sh` (#904 supply-chain hardening —
    # the OpenSSF Scorecard "Pinned-Dependencies" failure). Mirrors the
    # cargo-deny / wasm-pack pinned-tarball pattern. Bump version + hash together
    # when upgrading.
    - |
      TRIVY_VERSION=0.71.0
      TRIVY_SHA256=30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
      TRIVY_TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_TARBALL}" -o /tmp/trivy.tar.gz
      echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
      tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
    - |
      SYFT_VERSION=1.18.1
      SYFT_SHA256=066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab
      SYFT_TARBALL="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
      curl -sSfL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${SYFT_TARBALL}" -o /tmp/syft.tar.gz
      echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
      tar xzf /tmp/syft.tar.gz -C /usr/local/bin syft
    # Cosign ships a bare linux-amd64 binary (no tarball) plus a checksums file;
    # pin the version + hash together and bump both when upgrading (matching the
    # Trivy/Syft pinned-download pattern, #904 supply-chain hardening).
    - |
      COSIGN_VERSION=2.4.3
      COSIGN_SHA256=caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign

api:publish:
  extends: .docker-publish-base
  <<: *rules-release-tag
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      GL_IMAGE="${CI_REGISTRY_IMAGE}/api"
      docker build -f packages/api/Dockerfile \
        -t "${GL_IMAGE}:${CI_COMMIT_TAG}" \
        -t "${GL_IMAGE}:latest" \
        .
      # Scan the built image before publishing — fail the release on fixable
      # HIGH/CRITICAL CVEs. --ignore-unfixed skips base-image CVEs with no
      # available patch (unactionable) while still gating on anything fixable.
      docker save "${GL_IMAGE}:${CI_COMMIT_TAG}" -o /tmp/api-image.tar
      trivy image --input /tmp/api-image.tar --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Generate a CycloneDX SBOM from the same image tarball (no daemon
      # dependency) so operators can audit the exact published image. Kept as a
      # non-expiring job artifact AND attached to the signed GHCR image as a
      # Cosign CycloneDX attestation below.
      mkdir -p sbom
      syft "docker-archive:/tmp/api-image.tar" -o "cyclonedx-json=sbom/api-${VERSION}.cdx.json"
      # Internal GitLab Container Registry mirror (always available).
      docker push "${GL_IMAGE}:${CI_COMMIT_TAG}"
      docker push "${GL_IMAGE}:latest"
      # Public GHCR release — REQUIRED on a release tag (#939). Fail loudly with
      # an actionable message if the maintainer-configured credentials are
      # missing, rather than silently shipping GitLab-registry-only.
      if [ -z "${GHCR_USER}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot publish the public 0.4 image."
        echo "Configure both under Settings → CI/CD → Variables (Masked + Protected) before tagging."
        exit 1
      fi
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      GH_IMAGE="ghcr.io/${GHCR_USER}/api"
      docker tag "${GL_IMAGE}:${CI_COMMIT_TAG}" "${GH_IMAGE}:${VERSION}"
      docker tag "${GL_IMAGE}:latest" "${GH_IMAGE}:latest"
      docker push "${GH_IMAGE}:${VERSION}"
      docker push "${GH_IMAGE}:latest"
      # Sign the immutable, by-digest reference (a tag can be re-pointed; a
      # digest cannot) and attach the SBOM as a CycloneDX attestation. Keyless —
      # the ambient SIGSTORE_ID_TOKEN is the signing identity, no key material.
      GH_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${GH_IMAGE}:${VERSION}")"
      cosign sign --yes "${GH_DIGEST}"
      cosign attest --yes --type cyclonedx --predicate "sbom/api-${VERSION}.cdx.json" "${GH_DIGEST}"
  artifacts:
    name: "api-sbom-${CI_COMMIT_TAG}"
    paths:
      - sbom/
    expire_in: never

web:publish:
  extends: .docker-publish-base
  <<: *rules-release-tag
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      GL_IMAGE="${CI_REGISTRY_IMAGE}/web"
      cd packages/web
      docker build \
        -t "${GL_IMAGE}:${CI_COMMIT_TAG}" \
        -t "${GL_IMAGE}:latest" \
        .
      # Scan the built image before publishing (see api:publish for rationale).
      docker save "${GL_IMAGE}:${CI_COMMIT_TAG}" -o /tmp/web-image.tar
      trivy image --input /tmp/web-image.tar --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # CycloneDX SBOM from the image tarball (see api:publish for rationale).
      mkdir -p sbom
      syft "docker-archive:/tmp/web-image.tar" -o "cyclonedx-json=sbom/web-${VERSION}.cdx.json"
      # Internal GitLab Container Registry mirror (always available).
      docker push "${GL_IMAGE}:${CI_COMMIT_TAG}"
      docker push "${GL_IMAGE}:latest"
      # Public GHCR release — REQUIRED on a release tag (see api:publish).
      if [ -z "${GHCR_USER}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot publish the public 0.4 image."
        echo "Configure both under Settings → CI/CD → Variables (Masked + Protected) before tagging."
        exit 1
      fi
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      GH_IMAGE="ghcr.io/${GHCR_USER}/web"
      docker tag "${GL_IMAGE}:${CI_COMMIT_TAG}" "${GH_IMAGE}:${VERSION}"
      docker tag "${GL_IMAGE}:latest" "${GH_IMAGE}:latest"
      docker push "${GH_IMAGE}:${VERSION}"
      docker push "${GH_IMAGE}:latest"
      # Keyless Cosign sign + CycloneDX SBOM attestation of the pushed digest.
      GH_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${GH_IMAGE}:${VERSION}")"
      cosign sign --yes "${GH_DIGEST}"
      cosign attest --yes --type cyclonedx --predicate "sbom/web-${VERSION}.cdx.json" "${GH_DIGEST}"
  artifacts:
    name: "web-sbom-${CI_COMMIT_TAG}"
    paths:
      - sbom/
    expire_in: never

registry:release-images:
  # Nightly proof that the latest v* release tag is still pullable (#2803).
  #
  # The project's container-registry cleanup policy ran with `name_regex: .*`
  # and `name_regex_keep: null` — matching every tag, protecting none — and its
  # daily sweep deleted the released api and web `v0.3.0-alpha.3` images. The
  # publish jobs had succeeded weeks earlier and their pipeline is still green;
  # nothing in CI reads the registry after a tag ships, so the only signal was a
  # 404 nobody was looking at.
  #
  # This is why the check is scheduled rather than triggered: an image vanishing
  # is not a diff event. There is no commit to review and no existing job that
  # would turn red, so the only way to find out is to go and look, every night.
  #
  # NOT allow_failure. A self-hoster who cannot pull the version we told them to
  # run has no install at all, so a missing release image is a release defect,
  # not an advisory. The policy is also a project *setting* living outside this
  # repo, which any future edit can silently regress — a yellow job here would
  # reproduce exactly the silence that let #2803 sit unnoticed.
  #
  # Runs on MRs that touch the check itself so the harness is validated before
  # merge; a green nightly proves nothing if the probe never worked.
  stage: publish
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # The check resolves the newest v* tag from the clone, and the default
    # shallow fetch of a single branch ref carries no tags at all — which the
    # script reports as exit 2 (invocation error), not a missing image.
    GIT_DEPTH: "0"
    # v0.3.0-alpha.3's api image cannot be restored: rebuilding it re-resolves
    # cryptography>=48.0.1,<49, which now carries two HIGH CVEs disclosed
    # after the tag was cut, and the tag's own pin ceiling makes the fix
    # unreachable from that ref. Decision (#2822): accept the permanent gap
    # for this one pre-0.4 tag rather than backport — v0.4.0-beta.1, cut
    # once the beta-readiness batch lands, is the release operators should be
    # pointed to. Remove this entry once v0.3.0-alpha.3 is no longer the
    # latest resolvable v* tag (it self-obsoletes then, but the line goes
    # stale rather than wrong).
    ACCEPTED_GAPS: "api:v0.3.0-alpha.3"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_NIGHTLY == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/check-release-images.sh
        - scripts/tests/check-release-images.test.sh
        - .gitlab-ci.yml
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - apk add --no-cache bash git
  script:
    - bash scripts/check-release-images.sh

helm:publish:
  # Helm chart → GHCR OCI registry. GitLab Container Registry does not support
  # Helm OCI push in this runner setup, so GHCR is the only target — and it is
  # the public 0.4 release target (#939), so the push is REQUIRED on a release
  # tag: missing credentials fail the job loudly rather than skipping.
  stage: publish
  image:
    name: alpine/helm:3.14.0@sha256:a90798c9c2b671e3546b10db1ae0b845f9abccc9f9ff79b34744a1ba146b67ed
    entrypoint: [""]
  <<: *rules-release-tag
  # Keyless Cosign signing of the OCI chart (#940) — same Sigstore OIDC
  # audience as the image publish jobs.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache curl
    # Pinned, checksum-verified Cosign (matches .docker-publish-base).
    - |
      COSIGN_VERSION=2.4.3
      COSIGN_SHA256=caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
      echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
  script:
    - |
      if [ -z "${GHCR_USER}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "ERROR: GHCR_USER/GHCR_TOKEN not set — cannot publish the public 0.4 Helm chart."
        echo "Configure both under Settings → CI/CD → Variables (Masked + Protected) before tagging."
        exit 1
      fi
      helm registry login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"
      helm dependency update packages/helm
      helm package packages/helm
      CHART_FILE=$(ls trueppm-*.tgz)
      CHART_NAME=$(helm show chart packages/helm | awk '/^name:/{print $2}')
      # Capture the by-digest reference from `helm push` output and Cosign-sign
      # it keyless (Sigstore via SIGSTORE_ID_TOKEN), so operators can
      # `cosign verify` the chart they pull.
      helm push "$CHART_FILE" "oci://ghcr.io/${GHCR_USER}/charts" 2>&1 | tee /tmp/helm-push.log
      CHART_DIGEST=$(awk '/Digest: /{print $2}' /tmp/helm-push.log)
      cosign sign --yes "ghcr.io/${GHCR_USER}/charts/${CHART_NAME}@${CHART_DIGEST}"

# ---------------------------------------------------------------------------
# PUBLISH — OSS package registries (PyPI wheel + npm).
#
# Trigger: push a git tag matching `v*` (the same release tag as the Docker
# image jobs above). These publish the two remaining OSS packages — trueppm-api
# (PyPI) and @trueppm/web (npm) — as versioned, installable artifacts so that
# trueppm-enterprise can pin exact OSS versions instead of path-dep references
# (Enterprise ADR E-0005, phase-2 switchover). Closes #479.
#
# Like helm:publish, each job exits 0 — not fail — when its registry token is
# absent. This keeps the release pipeline green before the tokens and the
# PyPI/npm project-name reservations land (the scheduler:publish job is dormant
# for the same reason); once the tokens are configured, a v* tag publishes
# automatically and the E-0005 remote agent detects both packages.
#
# Required CI/CD variables (Settings → CI/CD → Variables), Masked + Protected:
#   PYPI_TOKEN — PyPI API token with upload scope for the trueppm-api project.
#   NPM_TOKEN  — npm automation token with publish scope for the @trueppm scope.
# ---------------------------------------------------------------------------

api:publish:pypi:
  # trueppm-api → PyPI sdist + wheel. Mirrors scheduler:publish (PEP 517 build
  # via hatchling, twine upload). Distinct from api:publish, which ships the
  # Docker image to the container registry.
  stage: publish
  image: python:3.11-slim@sha256:ae52c5bef62a6bdd42cd1e8dffef86b9cd284bde9427da79839de7a4b983e7ca
  <<: *rules-release-tag
  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $PYPI_TOKEN
    # Suppress the keyring warning that fires in non-interactive environments.
    PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  script:
    - |
      if [ -z "${PYPI_TOKEN}" ]; then
        echo "INFO: PYPI_TOKEN not set — skipping PyPI publish of trueppm-api"
        exit 0
      fi
    - pip install build twine --quiet
    # Verify the tag version matches the version declared in pyproject.toml.
    # A mismatch (e.g. forgot to bump) fails fast before uploading.
    - |
      PKG_VERSION=$(python -c "
      import tomllib
      with open('packages/api/pyproject.toml', 'rb') as f:
          print(tomllib.load(f)['project']['version'])
      ")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: tag version ($TAG_VERSION) does not match packages/api/pyproject.toml version ($PKG_VERSION)"
        echo "Bump the version in packages/api/pyproject.toml before tagging."
        exit 1
      fi
      echo "Version check passed: $PKG_VERSION"
    - cd packages/api
    - python -m build
    - twine upload dist/* --non-interactive --verbose
  artifacts:
    # Keep the built wheel as a CI artifact for traceability (7-day expiry).
    paths:
      - packages/api/dist/
    expire_in: 7 days

web:publish:npm:
  # @trueppm/web → npm registry. Builds the production bundle and publishes
  # dist/ (package.json `files` restricts the tarball to the built output).
  # Distinct from web:publish, which ships the Docker image.
  stage: publish
  # node:22 — react-router 8 requires Node >=22.22 (#2362).
  image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd
  <<: *rules-release-tag
  cache:
    <<: *web-cache
    policy: pull
  script:
    - *retry-fn
    - |
      if [ -z "${NPM_TOKEN}" ]; then
        echo "INFO: NPM_TOKEN not set — skipping npm publish of @trueppm/web"
        exit 0
      fi
    - cd packages/web
    - retry npm ci --prefer-offline --no-audit --no-fund --quiet
    # Verify the tag version matches package.json before publishing.
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: tag version ($TAG_VERSION) does not match packages/web/package.json version ($PKG_VERSION)"
        echo "Bump the version in packages/web/package.json before tagging."
        exit 1
      fi
      echo "Version check passed: $PKG_VERSION"
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish
  artifacts:
    paths:
      - packages/web/dist/
    expire_in: 7 days

# ---------------------------------------------------------------------------
# RELEASE — GitLab Release entry.
#
# Trigger: any v* tag (stable and pre-release).
# needs: [] — runs independently of the publish stage so a missing GHCR
# token does not prevent the release entry from being created.
# Pre-release tags get a short [Unreleased] pointer; stable tags extract
# their section from the assembled CHANGELOG.md.
# ---------------------------------------------------------------------------

release:create:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
        BASE="${VERSION%%-*}"
        printf '**TruePPM %s** — pre-release.\n\nChanges are accumulating in `[Unreleased]` until **%s** ships stable.\nSee [CHANGELOG.md](https://gitlab.com/trueppm/trueppm/-/blob/%s/CHANGELOG.md) for the current list.\n' \
          "${CI_COMMIT_TAG}" "$BASE" "${CI_COMMIT_TAG}" > release_notes.md
      else
        awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
          | sed '/^[[:space:]]*$/d' > release_notes.md
      fi
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'TruePPM $CI_COMMIT_TAG'
    description: './release_notes.md'
