boundary:check:
  extends: .fast-job
  # Detect open OSS issues that describe enterprise functionality (labeled
  # `enterprise` or `portfolio`) and therefore violate the Two-Repo Rule
  # (CLAUDE.md). Two GitLab API calls; ~2s. Runs on main pushes (catches
  # the moment a violation lands) and on schedule (catches violations that
  # were created via the GitLab UI without an MR).
  #
  # An optional BOUNDARY_CHECK_TOKEN (project- or group-level access token)
  # can be set in CI/CD variables; otherwise CI_JOB_TOKEN is used.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - bash scripts/check-issue-boundary.sh

chore:release-stale-wip-labels:
  extends: .fast-job
  # Strip `status::wip` from closed issues (#2693). The label is a checked claim —
  # `wt new`/`wt claim` refuse an already-claimed issue and check-issue-collision.sh
  # (in `make pre-push`) warns on it — so a stale one makes the collision warning
  # fire on work that finished weeks ago. People then learn to ignore it, and it
  # stops catching the real duplicate it exists to catch (#1985 / !1352 / !1353).
  #
  # `wt remove`/`wt prune` already release the label, but only for work that went
  # through a worktree and was cleaned up. This catches everything else: a merged MR
  # whose worktree was never removed, a plain `git checkout -b`, or an issue closed
  # by hand in the UI.
  #
  # Schedule-only and `allow_failure` on purpose. This is a janitor, not a gate: a
  # stale label is untidy, not broken, and redding a shared nightly for it would be
  # the exact noise-desensitization the job exists to prevent. Set WIP_SWEEP_TOKEN
  # (api scope) in CI/CD variables to let it write; without one it reports only,
  # because CI_JOB_TOKEN cannot PUT issue labels.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  before_script:
    - apk add --no-cache curl bash python3
  script:
    - |
      if [ -n "${WIP_SWEEP_TOKEN:-}" ]; then
        bash scripts/release-stale-wip-labels.sh --apply
      else
        echo "WIP_SWEEP_TOKEN not set — reporting only (CI_JOB_TOKEN cannot write labels)."
        bash scripts/release-stale-wip-labels.sh
      fi

boundary:imports:
  extends: .fast-job
  # The source-tree half of the Two-Repo Rule (#2603). boundary:check above
  # guards the issue tracker; this guards the code — "the community edition
  # NEVER imports from trueppm-enterprise" was documented in CLAUDE.md,
  # CONTRIBUTING.md, five skills and ~30 ADRs and enforced by NO CI job. It held
  # on convention alone. An import in that direction is a licensing defect, not
  # a style one, so it belongs on a gate rather than in review.
  #
  # Unlike boundary:check (main + schedule, because it reads tracker state that
  # changes outside MRs), this runs on every MR: the violation it catches
  # arrives in a diff, and catching it after merge to a protected branch is too
  # late. A grep over packages/; ~1s, no install beyond bash.
  #
  # Prose that names the enterprise package stays legal — the gate matches only
  # import syntax and quoted module paths, and strips comment lines first. See
  # the script header for the patterns and scripts/tests/ for the cases proving
  # it fails on real imports.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    # grep MUST be GNU grep: both this job's script and the one below filter with
    # --include / --exclude-dir, and alpine's default BusyBox grep does not
    # implement them — it rejects the option, the script's `|| true` swallows the
    # error, and an empty result reads as "no violations". That is how this gate
    # passed a real `from trueppm_enterprise import ...` for as long as it has
    # existed (#3172). The script's --self-test now fails closed if that recurs,
    # but keep the package: the self-test is the alarm, this is the fix.
    - apk add --no-cache bash grep
  script:
    # Self-test FIRST: this gate's failure mode is a green pipeline over an
    # unenforced licensing boundary, so "it passed" is not evidence that it can
    # still fail. Replays a real import in each pattern family (#3172).
    - bash scripts/check-enterprise-imports.sh --self-test
    - bash scripts/check-enterprise-imports.sh
    # The documentation half (#2859): a doc that tells a contributor to verify
    # the boundary with the naive grep reports the invariant as broken on a
    # clean tree. Same job — both halves guard the same rule and both are ~1s.
    # Same reasoning as the import half above: prove the doc check can still
    # fail before trusting that it passed (#3195).
    - bash scripts/check-boundary-doc-command.sh --self-test
    - bash scripts/check-boundary-doc-command.sh

suppressions:check:
  extends: .fast-job
  # Fail when a suppression outlives the issue it was waiting on (#2603).
  #
  # The 0.4 audit found six axe exclusions citing #2204 — closed — one of them
  # reading "remove this last exclusion when #2204 lands". The a11y gate was
  # green partly by hiding failures nothing tracked. Nothing could have noticed:
  # a suppression's justification expires on the day an unrelated issue is
  # closed, which produces no diff for anyone to review.
  #
  # That is also why this runs on main + schedule and not only on MRs: the event
  # this catches is an issue closing, not a commit landing. The MR rule is still
  # here so a newly added marker is validated (real issue, currently open) at the
  # moment it is written.
  #
  # Opt-in marker, not a bare `#NNNN` scan — see the script header for why
  # matching bare references would make the gate mostly noise.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    # GNU grep — see the note on boundary:imports (#3172). BusyBox grep does not
    # implement --exclude-dir, so this gate reported "no SUPPRESSED-UNTIL markers"
    # on a tree carrying five of them in two tracked files.
    - apk add --no-cache curl jq bash grep
  script:
    # Self-test first — same reason as boundary:imports (#3172). Asserts the
    # discovery half still finds a marker it is given; a blind grep reds here.
    - bash scripts/check-suppression-issues.sh --self-test
    - bash scripts/check-suppression-issues.sh

lint:todo-grep:
  extends: .fast-job
  # Stale stub-marker gate (#350). STUB:/WIP: never ship; TODO(#NNN) must
  # point at an open issue. Bare TODOs warn only. Excludes packages/web/e2e
  # (Playwright follow-up TODOs are valid), docs/, and *.md.
  #
  # Auth (#3043): CI_JOB_TOKEN cannot read the Issues API at all (not in
  # GitLab's job-token-supported endpoint list), so the script sends no auth
  # header by default and relies on this project's issue tracker being
  # public. TODO_GREP_TOKEN (a project/group access token with `read_api`,
  # masked and protected) is required only for a private project or a
  # self-hosted fork whose issue tracker is not publicly readable; it is not
  # needed for trueppm/trueppm itself and is deliberately NOT declared in a
  # `variables:` block here. A self-reference (`TODO_GREP_TOKEN:
  # $TODO_GREP_TOKEN`) with nothing defining the variable does not expand to
  # empty — the job receives the literal string `$TODO_GREP_TOKEN`, which the
  # script then sends as a PRIVATE-TOKEN header, and GitLab answers 401 to
  # every lookup. That is the same "a bad auth header is worse than none"
  # failure this gate's fix was about, reintroduced by documentation.
  #
  # An issue-state lookup that fails (network error, private project with no
  # token) fails the job — TODO_GREP_ALLOW_UNRESOLVED=1 is the explicit,
  # opt-out escape hatch, not set here.
  #
  # Runs on every MR pipeline. ~5–10s incl. issue-state lookups.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash curl jq grep git
  script:
    - bash scripts/check-todo-grep.sh
    - bash scripts/check-todo-grep.sh --self-test

lint:sonar-exclusions:
  extends: .fast-job
  # Sonar exclusion-integrity gate (#2520). Every
  # `sonar.issue.ignore.multicriteria.*` criterion is a reviewed false positive;
  # nothing verified its glob still pointed at anything. #2517: the #1749 sweep
  # renamed useProjectChangelog.ts → .tsx, `activity/*.ts` stopped matching it,
  # four suppressed findings resurfaced, and the reliability rating fell A → D
  # with no job going red. This is the job that goes red.
  #
  # Pure path matching against `git ls-files` — no network, no SONAR_TOKEN, <1s.
  # Deliberately NOT tied to the nightly sonar:scan, which is scheduled-only and
  # allow_failure; this runs on every MR.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash git grep sed
  script:
    - bash scripts/check-sonar-exclusions.sh
    - bash scripts/check-sonar-exclusions.sh --self-test

ci:gate-selftest-parity:
  extends: .fast-job
  # Every CI gate proves it can still fail, in its own job, or records why it cannot
  # (#3194). The sibling of ci:prepush-parity, and the same defect shape: a list that
  # was never asserted to stay complete. boundary:imports passed a real Apache-2.0
  # violation for its entire existence (#3172) while carrying a test suite that ran on
  # a different image — so the suite proved something about python:3.11-slim, not about
  # the gate. Same job is the only way to say same image. ~1s, no network.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash grep
  script:
    # This gate polices "prove you can fail"; running its own self-test first is the
    # minimum it can ask of itself.
    - bash scripts/check-gate-selftest-parity.sh --self-test
    - bash scripts/check-gate-selftest-parity.sh

ci:prepush-parity:
  extends: .fast-job
  # Pre-push parity gate (#2941). `pre-push-checks` mirrored eight bespoke CI gates
  # and `lint:design-system-v2` — a job of exactly that shape — was not among them, so
  # the one gate policing hardcoded hex against the DS-v2 ratchet was the one a
  # developer could not run before pushing. A breach passed `make pre-push` cleanly and
  # failed the pipeline.
  #
  # The list was a historical accretion with nothing asserting it stayed complete, so
  # fixing the one missing entry would have left the next gate to fall behind the same
  # way. This job derives the CI set from this file rather than restating it.
  #
  # Runs in CI as well as in pre-push because the failure it catches is *adding a CI
  # job* — which the author of that job is the last person to run pre-push against.
  # Pure text matching over two files, no network, <1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash git grep sed
  script:
    # Self-test FIRST: the real tree is compliant, so the detection path never
    # runs — a disarmed version of this gate prints byte-identical output and
    # exit 0 until the day someone adds an unmirrored gate (#3195).
    - bash scripts/check-prepush-parity.sh --self-test
    - bash scripts/check-prepush-parity.sh

lint:design-system-v2:
  extends: .fast-job
  # Design System v2 conformance gate (ADR-0125). Blocks design drift: arbitrary
  # Tailwind color/shadow value classes (zero tolerance) and new raw hex literals
  # in component source (ratchet against a committed baseline). This is the
  # enforcement that makes "all future work inherits the v2 golden standard" real.
  # See docs/design/v2-golden-standard.md. ~2s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep
  script:
    # Self-test FIRST: the DS-v2 ratchet's matcher also sees quoted issue refs as
    # hex, so both the detection and its carve-out have to be proven live (#3195).
    - bash scripts/check-design-system-v2.sh --self-test
    - bash scripts/check-design-system-v2.sh

lint:dropdown-scroll:
  extends: .fast-job
  # Floating menu/listbox scroll-safety gate (web-rule 351, #3109). A role="menu"
  # / role="listbox" panel taller than the viewport with no overflow-y-auto +
  # height guard spills off-screen with nothing to scroll it into view — the
  # Schedule "Display" menu bug. Ratchet with reviewed exclusions for panels
  # that are genuinely safe by construction; each is a `// dropdown-scroll-ok:
  # <reason>` comment on the role= line itself, so no unrelated edit above it can
  # invalidate the exemption (#3117). See scripts/check-dropdown-scroll.sh.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    # Self-test first (#3194) — likewise implemented long ago and never run.
    - bash scripts/check-dropdown-scroll.sh --self-test
    - bash scripts/check-dropdown-scroll.sh

lint:focus-trap-focuskey:
  extends: .fast-job
  # Focus-trap focusKey gate (web-rule 362, #3352). `useFocusTrap`'s
  # FOCUSABLE_SELECTOR is `button:not([disabled])`, so a dialog that disables its
  # own controls while a request is in flight empties the trap: the browser blurs
  # the just-pressed control to <body>, the Tab handler stops intercepting, and
  # Tab walks into the page behind the scrim — an aria-modal surface the keyboard
  # can leave (WCAG 2.4.3 / 2.1.2).
  #
  # Rule 362 was written from #3129, stated in prose, and enforced by nothing;
  # #3298 reintroduced the class seventeen issues later and the #3352 sweep found
  # 26 live dialogs. This is the guard that did not exist. False positives — the
  # disabled control is outside the trap, the disable is validation-only — are
  # paid for by scripts/focus-trap-focuskey-waivers.txt, a ratcheted list that
  # can only shrink, not by `|| true`. ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    # Self-test FIRST (#3194/#3195): this gate's own failure mode is a green
    # pipeline on a tree full of unkeyed traps, so a green run has to be backed
    # by proof it still detects a planted one — in THIS job, on THIS image,
    # because BusyBox vs GNU is exactly what blinded boundary:imports.
    - bash scripts/check-focus-trap-focuskey.sh --self-test
    - bash scripts/check-focus-trap-focuskey.sh

lint:hover-reveal-focus:
  extends: .fast-job
  # Hover-only reveal keyboard-reachability gate (web-rule 417, #3619). A
  # control shown only via `hover:opacity-100`/`group-hover:opacity-100` with
  # no focus:/focus-within:/focus-visible:/group-focus-within: counterpart is
  # unreachable by keyboard — Tab lands on it and it never becomes visible.
  # Point-fixed three times (#1029, #1802, #3619) on three different
  # components before this gate replaced the fourth point fix. See
  # scripts/check-hover-reveal-focus.sh.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    # Self-test first (#3194) — a gate that cannot be shown to fail is
    # indistinguishable from one that works.
    - bash scripts/check-hover-reveal-focus.sh --self-test
    - bash scripts/check-hover-reveal-focus.sh

lint:e2e-catchall:
  extends: .fast-job
  # Playwright catch-all gate (#2366). A spec that mocks the API but omits
  # `setupCatchAll` lets any forgotten endpoint escape the browser-level mocks —
  # in CI it hits the preview server, and on a dev box with `make up` running it
  # reaches the real API and 401s, driving the client's token-refresh and
  # session-teardown path in a race with the page render. That machine-dependent
  # difference is how wave6-heatmap.spec.ts spent months triaged as an
  # "environmental flake". ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep
  script:
    # Self-test FIRST: a spec that mocks the API without the catch-all reads as
    # an environmental flake months later, so a green run here has to be backed
    # by proof the gate can still reject one (#3195).
    - bash scripts/check-e2e-catchall.sh --self-test
    - bash scripts/check-e2e-catchall.sh

lint:e2e-schema-guard:
  extends: .fast-job
  # The e2e mock layer must stay bound to docs/api/openapi.json (#3440).
  #
  # `web:e2e` used to be evidence about the fixtures, not about the API: 1,808
  # lines of hand-written mocks and every inline page.route payload were authored
  # independently of the schema, so a renamed serializer field left 295 specs
  # green. `fixtures/schema-guard.ts` closes that by validating every mocked
  # response against the schema, and it is wired in by ONE line inside
  # setupCatchAll. Delete that line and the binding is gone with no red anywhere.
  #
  # This job is the structural half — it cannot check a payload (only the suite
  # can, via e2e/schema-guard.spec.ts), it checks that nothing disarmed the
  # guard, that CI is not disabling it, and that the drift ledger has not grown.
  # ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    # Self-test FIRST, same reason as the catch-all gate above: this gate's own
    # failure mode is a green pipeline, so a green run has to be backed by proof
    # it can still reject a disarmed tree (#3194).
    - bash scripts/check-e2e-schema-guard.sh --self-test
    - bash scripts/check-e2e-schema-guard.sh

lint:adr-collisions:
  extends: .fast-job
  # ADR number-collision gate (#918). Fails if any two files under docs/adr/
  # share a four-digit prefix — the recurring failure mode where parallel
  # branches each grab "the next free number" off a stale main and silently
  # corrupt the design-decision audit trail (a `per ADR-NNNN` reference stops
  # resolving to a single file).
  #
  # In an MR pipeline the script also runs a cross-branch scan so the collision
  # is caught *before* merge, not on the post-merge main job: it compares the
  # ADR number(s) this MR adds against (a) the numbers already on the target
  # branch (git-only) and (b) the numbers other open MRs add (GitLab API,
  # merge_requests endpoint). Half (b) uses the built-in CI_JOB_TOKEN — this
  # is a *different* endpoint than the one behind check-todo-grep.sh's rule 2
  # (Issues, not Merge Requests), and #3043 established that CI_JOB_TOKEN
  # cannot authenticate against the Issues API at all — do not assume that
  # finding also applies here without checking GitLab's job-token-supported
  # endpoint list for whichever API the script in question actually calls.
  # (The optional ADR_GATE_TOKEN is only for instances that lock down the
  # job-token API scope.) GIT_DEPTH:0 gives the merge-base history the diff
  # needs. ~2s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash git curl jq
  script:
    # Self-test first (#3194): this --self-test was implemented and never invoked,
    # so nothing would have noticed the gate going blind. A gate's failure mode is a
    # green pipeline, which makes "it passed" no evidence that it can still fail.
    - bash scripts/check-adr-collisions.sh --self-test
    - bash scripts/check-adr-collisions.sh

lint:package-licenses:
  extends: .fast-job
  # Every separately-distributed package ships its own license text (#2632).
  #
  # Distinct from license:check:py / license:check:web / wasm:license-check: those
  # three audit *dependency* licenses (no copyleft third party entered the tree).
  # None of them asserts that a package we publish carries OUR OWN Apache 2.0 text,
  # which is why wasm:license-check stayed green while packages/wasm-scheduler
  # declared `license = "Apache-2.0"` and shipped no LICENSE file.
  #
  # Pure filesystem comparison, no network, no toolchain. ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash diffutils
  script:
    # Self-test FIRST: Apache-2.0 §4(a) requires the license to travel with each
    # separately distributed package; a blind gate here is a licensing defect,
    # not a lint failure (#3195).
    - bash scripts/check-package-licenses.sh --self-test
    - bash scripts/check-package-licenses.sh

docs:version-accuracy:
  extends: .fast-job
  # Version-status tense gate (#807). A past/present-tense version claim in the
  # website docs ("shipped in 0.X", "added in 0.X", "In 0.X the Y is …") may
  # only reference a version that has actually shipped. Referencing an Underway
  # or Planned version in past/present tense is a user-facing accuracy bug (the
  # 2026-05-28 "0.2 shipped" regression) — readers hunt for behavior that does
  # not exist yet.
  #
  # Single source of truth for shipped-vs-unshipped is the "## Shipped" section
  # of packages/website/src/content/docs/overview/roadmap.md. The roadmap page
  # itself and docs/adr/** are exempt (forward-tense is correct there). See the
  # CLAUDE.md "Version-status tense" rule. ~2s.
  #
  # Scope is the docs tree plus README.md (#3996). The CLAUDE.md rule has always
  # said "any file under packages/website/src/content/docs/ (and README.md)",
  # but the scan only ever walked the docs tree — in scope by policy, out of
  # scope by implementation. That gap shipped a README claiming arm64 was
  # deferred to 0.5 for two days after multi-arch landed in 0.4, while the four
  # docs pages making the same claim were corrected in the same window.
  #
  # Also self-tests scripts/remove-ships-in-callouts.sh (#2818), the other half
  # of the same discipline: this gate flags a banner that outlived its release,
  # and that script deletes them at the tag. Its only other invocation is
  # release.sh --apply, so without a self-test here a regression in it would
  # first be discovered mid-release, editing the docs tree by hand. The two are
  # composed — a banner phrasing must be one both recognize — so they belong in
  # one job. Needs python3 for the removal script's line-range surgery. ~5s.
  #
  # Also runs the declaration-coverage ratchet (#2846): a page under features/,
  # administration/ or getting-started/ either declares `documentedFor`, or its
  # contents are hash-recorded in packages/website/docs-declaration-baseline.txt.
  # Editing a non-declaring page breaks the hash and fails here, so the author
  # must either name the version the page documents or re-record it with
  # `bash scripts/check-version-status.sh --update-baseline`. This is the third
  # occurrence of the class (#807 → #2608 → #2846) and the first time anything
  # asks the question at all; the tense regex is structurally blind to a page
  # that describes an unreleased feature and names no version.
  #
  # And the sidebar badge pairing (#2908): a page under getting-started/ that
  # declares an unshipped `documentedFor` must carry a matching version badge on
  # its packages/website/astro.config.mjs sidebar entry, and — in the other
  # direction, over EVERY entry in the config — a version badge must be backed
  # by a matching unshipped declaration. Before this, a reader learned a page
  # was unreleased only after opening it; the nav that sent them there said
  # nothing but a comment. The reverse branch is the one that earns its keep: it
  # reds on the release that ships 0.X, forcing the badge off with the callout
  # instead of leaving the nav understating the product.
  #
  # Finally, self-tests scripts/check-early-promotion.sh (#2824) — the guard on
  # the roadmap edit that *triggers* the callout removal. Promoting 0.X into
  # "## Shipped" is what licenses release.sh to delete every "Ships in 0.X"
  # callout (131 blocks / 78 pages for 0.4), and nothing used to state when that
  # edit is correct. The guard refuses an ALPHA cut against an already-promoted
  # version whose callouts are still live. It runs only at release time, so this
  # self-test is the only pre-merge signal that it still works — keep it here.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed findutils python3 perl-utils
  script:
    - bash scripts/check-version-status.sh
    - bash scripts/check-version-status.sh --self-test
    - bash scripts/remove-ships-in-callouts.sh --self-test
    - bash scripts/check-early-promotion.sh --self-test

docs:known-issues-freshness:
  extends: .fast-job
  # Known-issues freshness gate (#3628). known-issues.md states its own
  # contract in the intro: "When an issue closes, its entry comes off this
  # page." Nothing enforced that — a 2026-09-08 sweep found ten of its 28
  # issue references pointing at closed issues (the third recorded instance
  # of the class: #2594, #3607, #3628), so this replaces the next
  # persona-panel sweep with a mechanical check.
  #
  # Every `/-/issues/NNNN` reference on the page must resolve to an OPEN
  # issue, unless its own physical line also carries the ack marker
  # (`<!-- known-issues-ack:closed -->`) — the escape hatch for a reference
  # cited on purpose (a decision that already shipped, or a closed issue
  # cited as evidence a fix landed). Adding the marker is a claim a human
  # made after checking `main`, not a way to silence the gate — CLAUDE.md:
  # "a closed issue is evidence the work merged, not that the entry's claim
  # is now false."
  #
  # Auth (same as lint:todo-grep, #3043): CI_JOB_TOKEN cannot authenticate
  # against the Issues API on any endpoint, so no auth header is sent unless
  # KNOWN_ISSUES_TOKEN (a project/group access token with read_api) is set —
  # not required for trueppm/trueppm itself, whose tracker is public.
  #
  # Fail-closed on purpose: an unresolvable lookup (network error, private
  # fork with no token) fails the job rather than silently passing.
  # KNOWN_ISSUES_ALLOW_UNRESOLVED=1 is the explicit opt-out, not set here — a
  # tracker-API timeout should retry the JOB, not red main and not go quiet.
  #
  # Runs on every MR pipeline and on main. ~5-15s incl. issue-state lookups
  # (one per unique reference; the page has ~25).
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/check-known-issues-freshness.sh --self-test
    - bash scripts/check-known-issues-freshness.sh

docs:config-links:
  # Every https://docs.trueppm.com link in the two files an operator actually
  # edits — packages/helm/values.yaml and .env.example — must resolve to a page
  # AND an anchor that exist (#3190).
  #
  # Those two files carried zero documentation links between them: their only
  # `https://` strings were example values, and the one pointer that existed was
  # `Full variable list: docs/administration/configuration.` — no scheme, no
  # host, and a trailing period that reads as part of the path. From inside a
  # values file on someone's disk a site-relative path resolves to nothing.
  #
  # With forty absolute links the failure mode moves: a link that 404s is worse
  # than no link, because it looks authoritative. Anchors drift whenever a
  # heading is reworded, which docs branches do routinely, so this has to be
  # checked rather than reviewed.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    # BusyBox grep rejects --include/--exclude-dir; this gate uses neither, but
    # `grep -oh` and `grep -qx` are both POSIX and safe here.
    - apk add --no-cache bash grep sed
  script:
    - bash scripts/check-config-doc-links.sh
    - bash scripts/check-config-doc-links.sh --self-test

docs:tree-split:
  extends: .fast-job
  # Docs tree-split gate (#2928). Two documentation trees exist and only one is
  # gated: packages/website/src/content/docs/ is the published product docs,
  # covered by six scripts; docs/ holds ADRs, specs, audits and design records
  # and is covered by none of them.
  #
  # For months docs/administration/ was a second copy of eight published pages.
  # All eight had diverged, the website copy was 2-5x more complete on every
  # one, and `scripts/backup.sh --help` pointed operators at the stale half --
  # the copy missing the warning that restoring onto a fresh cluster silently
  # orphans every stored SMTP credential and integration PAT. No gate failed,
  # and none could: every one path-matches the website tree, so the duplicate
  # was structurally invisible.
  #
  # Rule 1: no *.md basename in both trees (basename, not relative path --
  # mcp-connect.md sat under docs/administration/ and website features/, so a
  # path comparison saw nothing). Rule 2: a source pointer naming a
  # docs/<published-tree>/ page must resolve. Artifact subtrees, CHANGELOG.md
  # and ADRs are exempt as sources: they name planned and historical
  # deliverables on purpose. ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    # git is needed by the #3151 self-test cases, which `git init` a fixture to
    # prove a gitignored artifact is not scanned (and that the same file,
    # un-ignored, still fails). Without it those two cases print SELF-TEST
    # SKIPPED and the job stays green — a test nobody watches run, which is the
    # exact failure mode this script's self-test exists to prevent. The scan
    # itself does not need git: a clean CI clone has nothing ignored to skip.
    - apk add --no-cache bash grep sed findutils git
  script:
    - bash scripts/check-docs-tree-split.sh
    - bash scripts/check-docs-tree-split.sh --self-test

docs:ws-event-reachability:
  extends: .fast-job
  # WebSocket event reachability gate (#2846). The published WS event taxonomy
  # is read by integrators as a subscribable surface. Five program_* events were
  # listed there for months that no client can receive: they fan out on the
  # channel group `project_{program_id}`, and neither of the codebase's two
  # group_add() call sites can produce that group, so a subscriber gets a 4003
  # close and no debugging on their side fixes it.
  #
  # The gate classifies each event by the *type of the id* its
  # broadcast_board_event() call site fans out on — not by its name — and
  # requires an undeliverable one to carry a "not deliverable" marker on every
  # taxonomy bullet and table row. It inverts once routing.py serves
  # ws/v1/programs/ (#836, 0.8): the markers then become the reversed claim and
  # must come off, which is the check that turns red on the release that makes
  # the docs wrong. Also asserts every event named in the taxonomy table exists
  # in FROZEN_WS_EVENT_TYPES. ~2s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed findutils python3
  script:
    - bash scripts/check-ws-event-reachability.sh
    - bash scripts/check-ws-event-reachability.sh --self-test

lint:ws-handler-conformance:
  extends: .fast-job
  # WS event → frontend handler conformance gate (#3775, proposed in #2845).
  # Nothing checked whether a broadcast WS event has a frontend consumer, and
  # three independent audits each found a DIFFERENT slice of the same class:
  # #2847 (label_*, task_relation_created, sprint_reranked, project_restored),
  # #3245 (project_calendar_changed), and the 0.4 pre-release pass
  # (task_relation_updated/_deleted, the signal-privacy ceiling events, the
  # velocity-suggestion events). Each found what its grep happened to reach.
  #
  # Cross-references every event type reaching broadcast_board_event() against
  # the on(...) registration table in useProjectWebSocket.ts, both directions,
  # plus a shrink-only waiver ledger (packages/api/tests/apps/sync/
  # ws_handler_waivers.py) carrying a reason and an issue per entry. The emitter
  # half reuses the #1019/#1381 AST sweep from ws_event_scan.py — the same code
  # the freeze guard runs — so the two can never disagree about what is emitted.
  #
  # NOT change-gated, deliberately. api:test runs only on `changes:
  # packages/api/**`, and deleting a handler is a WEB-only diff — the one edit a
  # pytest-only gate could not see. ~1s, no toolchain (stdlib python3).
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash python3
  script:
    - bash scripts/check-ws-handler-conformance.sh
    - bash scripts/check-ws-handler-conformance.sh --self-test

docs:internal-links:
  extends: .fast-job
  # Internal documentation link gate (#2869). Nothing checked internal links, so
  # api/reference.md pointed at /features/csv-import/ long after the page became
  # /features/csv-import-export/ (#2846). Every internal link must reach a page
  # (or a redirect in astro.config.mjs), a heading anchor derived the way Astro
  # derives it (github-slugger), an asset, or — for GitLab blob/tree links — a
  # file in this repository.
  #
  # It reads the Markdown source, not dist/, and resolves each link against the
  # URL its source file publishes at. starlight-versions writes a snapshot and
  # rewrites that snapshot's links in the same build, so a rewritten link never
  # exists without its target and the gate cannot fire spuriously during a
  # release cut — the hazard that deferred this from #2846. Refuses to pass when
  # it matched no pages, links or anchors. ~1s, no build.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/check-docs-internal-links.py --self-test
    - python3 scripts/check-docs-internal-links.py

docs:api-routes:
  extends: .fast-job
  # API route documentation gate (#3753). The API reference is hand-written and
  # nothing compared it to docs/api/openapi.json, so api/idempotency.md named
  # PATCH /api/v1/notifications/{id}/ while the route is /api/v1/me/notifications/.
  # Forward: every METHOD /api/v1/… the published docs name must be an operation
  # in the schema, or a path declared removed in scripts/schema-removal-allowlist.txt
  # (how api/stability.md records removals). Reverse: schema operations the API
  # reference does not mention are a shrink-only ratchet in
  # scripts/docs-api-reference-unlisted.txt — a new undocumented operation fails,
  # and so does a line whose operation is now documented or gone. ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/check-docs-api-routes.py --self-test
    - python3 scripts/check-docs-api-routes.py

docs:adr-status:
  extends: .fast-job
  # ADR status-drift gate (#2685). An ADR cited by name from packages/*/src must
  # not say "Proposed" — citing it from shipped code is the author asserting the
  # decision is in effect, which is incompatible with "not decided yet".
  #
  # Why a gate and not another audit: #2539 was a one-off manual sweep in July
  # 2026, and within a month twelve ADRs had drifted back to Proposed while fully
  # implemented. This grep-level check found twenty-two. The ADR corpus is the
  # project's own record of what shipped; if it says Proposed for shipped work it
  # misrepresents the release.
  #
  # Also checks the four corpus statistics quoted by the published ADR index
  # (count, span, unused numbers, gap ranges) against the tree — they had drifted
  # by 13 ADRs and 64 unused numbers. Escape hatch for a genuinely
  # partially-implemented ADR is ADR_STATUS_ALLOWLIST in the script. ~2s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed findutils python3
  script:
    # Self-test FIRST: this gate polices ADR status AND the index statistics that
    # every ADR-adding branch perturbs, so a silent pass is costly (#3195).
    - bash scripts/check-adr-status.sh --self-test
    - bash scripts/check-adr-status.sh

security:demo-nginx-allowlist:
  extends: .fast-job
  # Public-demo nginx allowlist gate (#1763). The hosted read-only demo
  # (try.trueppm.com / docker-compose.demo.yml) bakes a fixed SECRET_KEY that is
  # safe ONLY because the demo has zero accounts and no authenticated write path —
  # access is exclusively the anonymous, tokenized, read-only share link. A
  # blanket `location /api/ { proxy_pass … }` on the demo's nginx template (the
  # production posture) would expose the full authenticated API to the public
  # internet, breaking that invariant. This gate fails the pipeline if
  # nginx/demo.conf.template ever regresses to proxying anything beyond the vetted
  # allowlist (share endpoints, liveness probe, static, loopback admin). ~1s.
  stage: lint
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache bash grep sed
  script:
    - bash scripts/check-demo-nginx-allowlist.sh
    - bash scripts/check-demo-nginx-allowlist.sh --self-test

ci:build-api-image:
  # Rebuild and push the custom ci-api image used by the .api / .api-no-db
  # job templates and by mcp:typecheck / mcp:test. Pre-bakes libpq-dev + gcc +
  # all dev-dep wheels (scheduler + api + mcp) so the downstream api:* jobs skip
  # ~3min of cold install on every run (kaizen #640 item 3) and the mcp:* jobs
  # skip their cold mcp[dev] install.
  #
  # Trigger:
  #   - MR pipelines where the Dockerfile or either pyproject.toml changes
  #   - main pipelines where the same files change
  #   - scheduled pipelines (weekly safety net for transitive drift)
  #
  # Jobs that use the image declare `needs: [{job: ci:build-api-image,
  # optional: true}]` so they wait for the build when it's in the pipeline,
  # and pull the existing registry tag when it isn't (the steady state).
  stage: lint
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE/ci-api:$CI_API_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/api/pyproject.toml
        - packages/scheduler/pyproject.toml
        - packages/mcp/pyproject.toml
        - .gitlab/ci-images/api.Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/api/pyproject.toml
        - packages/scheduler/pyproject.toml
        - packages/mcp/pyproject.toml
        - .gitlab/ci-images/api.Dockerfile
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # --cache-from lets a no-op rebuild reuse the previously published layers.
    - docker pull "$IMAGE" || true
    - docker build
        --cache-from "$IMAGE"
        --tag "$IMAGE"
        --file .gitlab/ci-images/api.Dockerfile
        .
    - docker push "$IMAGE"

ci:build-scheduler-image:
  # Rebuild and push the custom ci-scheduler image used by the .scheduler
