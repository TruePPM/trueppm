# Development stack — source bind-mounted, Vite HMR on :5173, API on :8000.
# Run: make up
# Admin password (written on first startup): make admin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trueppm
      POSTGRES_USER: trueppm
      POSTGRES_PASSWORD: trueppm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to LOOPBACK (#3189). `"5432:5432"` publishes on 0.0.0.0, so this
      # database — with the hardcoded password three lines up — was reachable
      # from the network on any machine running this stack. Docker's published
      # ports also bypass most host firewalls, because the DOCKER chain is
      # consulted before INPUT. The port is still here for psql/pgAdmin from the
      # same machine; delete the mapping entirely if you do not need that.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueppm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Valkey is the BSD-licensed Linux Foundation fork of Redis (March 2024
  # license change). Wire-compatible with Redis 7 — REDIS_URL stays as-is.
  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      args:
        # Local dev uses the precompiled psycopg wheel (no from-source C
        # compile) so `make up` rebuilds stay fast. The published/CI image omits
        # this arg and keeps the hardened `[c]` default. See #1955.
        PSYCOPG_EXTRA: binary
    image: trueppm-api:local
    command: >
      sh -c "
        until python manage.py migrate --noinput; do
          echo 'DB not ready yet (DNS or connection), retrying in 2s...';
          sleep 2;
        done &&
        python manage.py collectstatic --noinput &&
        python manage.py create_admin &&
        uvicorn trueppm_api.asgi:application --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgres://trueppm:trueppm@db:5432/trueppm
      REDIS_URL: redis://valkey:6379
      DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
      TRUEPPM_ALLOW_DEV_SETTINGS: "1"
      SECRET_KEY: dev-secret-key-change-in-prod
      TRUEPPM_ADMIN_PASSWORD_FILE: /tmp/trueppm_admin_password
      STATIC_ROOT: /app/staticfiles
      # Prepend the bind-mounted source so uvicorn --reload picks up changes
      # to Python files without requiring a container rebuild.
      PYTHONPATH: /app/src
      # Pin the OIDC redirect_uri origin (settings/base.py). Without this, the
      # SSO views fall back to request.build_absolute_uri() — but the web
      # container's Vite dev proxy forwards /api/* with changeOrigin: true
      # (vite.config.ts), which rewrites the Host header to "api:8000" before
      # Django sees it. That mints a redirect_uri the IdP dutifully redirects
      # the BROWSER to after login, and "api" only resolves inside the Docker
      # network — DNS_PROBE_FINISHED_NXDOMAIN on the host. Mirrors the
      # TRUEPPM_PUBLIC_API_BASE_URL pin already used in .gitlab-ci.yml.
      TRUEPPM_PUBLIC_API_BASE_URL: http://localhost:8000
      # Pin where the OIDC callback view (views.py::_spa_completion_url) sends
      # the browser once the token exchange is done — the SPA's dev server,
      # not the API. Without this it's empty, _spa_completion_url() builds a
      # bare relative "/auth/sso/complete?..." Location header, and the
      # browser resolves it against wherever it currently is (the API's own
      # origin, port 8000) instead of the SPA on 5173 — a 404 from Django's
      # own URLconf, which has no such route. Mirrors the
      # TRUEPPM_FRONTEND_BASE_URL pin already used in .gitlab-ci.yml.
      TRUEPPM_FRONTEND_BASE_URL: http://localhost:5173
    volumes:
      - ./packages/api/src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # /readyz (#3346), not /health/ — this healthcheck is what other services'
    # `depends_on: condition: service_healthy` key off, so it should answer the
    # same question Kubernetes' readiness probe does (dependencies reachable AND
    # migrations applied), not the shallow "process is up" liveness question.
    # Matches the Helm chart's api readiness path so the two first-five-minutes
    # experiences agree; see administration/probes.md.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readyz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: packages/web
      dockerfile: Dockerfile
      target: dev
    command: sh -c "rm -rf /app/node_modules/.vite && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./packages/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  celery:
    image: trueppm-api:local
    # --concurrency=2 keeps dev memory under ~150 MB (default=10 caused OOM kills)
    command: ["celery", "-A", "trueppm_api.celery", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trueppm:trueppm@db:5432/trueppm
      REDIS_URL: redis://valkey:6379
      DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
      TRUEPPM_ALLOW_DEV_SETTINGS: "1"
      SECRET_KEY: dev-secret-key-change-in-prod
      PYTHONPATH: /app/src
    volumes:
      - ./packages/api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # `restart: unless-stopped` only restarts on process EXIT, so a worker whose
    # event loop has wedged reports `Up` forever without this. Stats a heartbeat
    # file trueppm_api.core.worker_heartbeat touches every ~2s on the worker's
    # own timer (#3346) — NOT `celery inspect ping`, which forks a full Django
    # import into the container it measures and can fail a worker that is busy
    # doing its job (#3236). Matches the Helm chart's worker readiness probe;
    # see administration/probes.md.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/trueppm-celery-worker-heartbeat -newermt '-30 seconds' 2>/dev/null | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-beat:
    image: trueppm-api:local
    # Runs CELERY_BEAT_SCHEDULE periodic tasks (drain_schedule_queue every 30 s, etc.)
    # `--schedule=/tmp/...` writes the persistent schedule DB to a writable path;
    # the container's working directory is owned by root so the default
    # `celerybeat-schedule` write fails with PermissionError (#314 follow-up).
    command: ["celery", "-A", "trueppm_api.celery", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trueppm:trueppm@db:5432/trueppm
      REDIS_URL: redis://valkey:6379
      DJANGO_SETTINGS_MODULE: trueppm_api.settings.dev
      TRUEPPM_ALLOW_DEV_SETTINGS: "1"
      SECRET_KEY: dev-secret-key-change-in-prod
      PYTHONPATH: /app/src
    volumes:
      - ./packages/api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      celery:
        condition: service_started
    # The schedule shelve is written to `--schedule` on boot, before the first
    # tick — its existence is "beat has loaded its schedule" (#3346), and
    # checking it does not couple beat's health to whether a worker happens to
    # be reachable right now, unlike a fleet-wide `inspect ping` would.
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/celerybeat-schedule"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  valkey_data:
  web_node_modules:
