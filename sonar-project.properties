# SonarCloud project configuration.
#
# Project: https://sonarcloud.io/dashboard?id=trueppm_trueppm
#
# This file exists primarily to carry the in-repo issue-exclusion rules below.
# Each block documents *why* a Blocker finding is a false positive so the
# suppression is auditable rather than a silent mute. If a rule genuinely fires
# on new code, remove the matching criterion — do not widen a glob to hide it.
#
# GUARDED BY `scripts/check-sonar-exclusions.sh` (#2520), which runs in
# `make pre-push` and the `lint:sonar-exclusions` CI job. It fails when a
# criterion's `resourceKey` matches no tracked file, when the `multicriteria=`
# index and the `.ruleKey`/`.resourceKey` definitions disagree in either
# direction, and when a glob is pinned to `*.ts`/`*.js` inside a directory that
# also holds `.tsx`/`.jsx` — the shape that silently under-matches when a file
# grows JSX and gets renamed. That last one is #2517: `activity/*.ts` quietly
# stopped covering useProjectChangelog after the #1749 sweep renamed it, and the
# reliability rating fell A → D with nothing going red.
#
# Prefer an explicit comparator/annotation at the call site over a path glob
# whenever the code can carry the intent — a glob is one refactor from inert.
#
# NOTE: `sonar.issue.ignore.multicriteria` is honored by CI-based (sonar-scanner
# CLI) analysis. If this project is switched to SonarCloud *Automatic Analysis*,
# properties files are ignored and these same exclusions must be mirrored under
# Project Settings -> Analysis Scope -> "Ignore Issues on Multiple Criteria".

sonar.projectKey=trueppm_trueppm
sonar.organization=trueppm

# ---------------------------------------------------------------------------
# Test coverage import (issue #2090)
# ---------------------------------------------------------------------------
# SonarCloud does NOT run tests — it *imports* coverage reports from the paths
# below. Without these keys the Coverage metric reads 0.0% no matter how much is
# actually tested (GitLab's ~91% badge is a separate stdout-regex mechanism that
# never reaches the scanner). Generate the reports with `make coverage-diff`
# (or let `scripts/sonar-scan.sh` do it) before scanning.
#
# The scanner runs from the repo root, so path resolution differs per report:
#   - scheduler / mcp Cobertura XML carry an absolute <source> root that already
#     matches the checkout (/builds/.../packages/{scheduler,mcp}) — no rewrite.
#   - The API Cobertura XML emits an EMPTY <source> because packages/api sets
#     `relative_files = true` for the cross-runner shard combine (#1348). Its
#     filenames are `src/trueppm_api/...`, so with no source root the scanner
#     resolves them from the repo root and drops all 328 files (#2113). The
#     sonar:scan job / scripts/sonar-scan.sh inject the package root into a
#     generated coverage.sonar.xml — pointed at below.
#   - The web LCOV records `SF:src/...` paths relative to packages/web, which do
#     NOT resolve from the repo root. `scripts/sonar-scan.sh` rewrites them to
#     `SF:packages/web/src/...` into lcov.sonar.info — the same prefix the
#     Makefile `coverage-diff-web` target already applies for diff-cover.
#   - The web E2E LCOV (#2117, from the nightly web:e2e:coverage job) already
#     records repo-root-relative `SF:packages/web/src/...` paths — its merge
#     script writes them directly — so it needs no rewrite and is listed as-is.
#     SonarCloud UNIONS coverage across the two web reports, so a UI file
#     exercised only by Playwright E2E (a large share of the app) stops reading
#     as 0% covered, which is what dragged the reported total far below the true
#     API-94%/web-unit-78.5% figures.
sonar.python.coverage.reportPaths=packages/scheduler/coverage.xml,packages/api/coverage.sonar.xml,packages/mcp/coverage.xml
sonar.javascript.lcov.reportPaths=packages/web/coverage/lcov.sonar.info,packages/web/coverage/e2e/lcov.info

# ---------------------------------------------------------------------------
# Coverage-denominator exclusions (#2231) — NOT the same as sonar.exclusions.
# ---------------------------------------------------------------------------
# These paths stay in analysis (issues + duplication are still reported on them)
# but are removed from the COVERAGE denominator. Without this, SonarCloud — which
# has no `sonar.tests` declaration here — treats the pytest/vitest/Playwright test
# suites and generated code as PRODUCT code needing coverage. Test code is the
# measuring instrument, not the subject, so it sits at 0% and crushes the number:
# the #2228 investigation found `packages/api/tests` alone contributing 48,704
# uncovered lines at 0%, dragging the reported total from a healthy ~82% to ~58%.
# This mirrors what the underlying tools already do by default — `pytest --cov=<pkg>`
# never counts tests/, vitest excludes `*.test.*` — so this only realigns Sonar
# with them. Documented for adopters in the Testing & Quality docs page.
#   - **/tests/**, **/test_*.py, **/conftest.py : Python test suites (api, scheduler, mcp)
#   - **/*.test.ts(x), packages/web/src/test/**  : vitest unit tests + shared test utils
#   - **/*.test.mjs                              : node test files (scripts/*.test.mjs)
#   - packages/web/e2e/**                        : Playwright E2E specs (assert flows, not covered)
#   - **/migrations/**                           : Django migrations — auto-generated schema ops;
#                                                  data-migration LOGIC is unit-tested via its
#                                                  underlying function, never the migration module
#                                                  (see CLAUDE.md "Migration discipline" rule 3)
#   - packages/web/src/api/types.ts              : generated from the OpenAPI schema (openapi-typescript)
# NOT excluded on purpose: the canvas Gantt renderer (packages/web/src/features/schedule/engine/**)
# is real product logic — its pure helpers get unit tests, they are not hidden here.
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/conftest.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  packages/web/src/test/**,\
  packages/web/e2e/**,\
  **/migrations/**,\
  packages/web/src/api/types.ts

# ---------------------------------------------------------------------------
# Analysis scope exclusions — design/reference artifacts, not product code
# ---------------------------------------------------------------------------
# These trees are static design-handoff mockups and brand-reference documents,
# NOT shipped runtime code: they are never imported by the app, never tested,
# and carry no CI gate. SonarQube was raising their throwaway markup as product
# a11y/reliability findings (missing input id/label, non-native interactive
# elements, missing button type, missing table <th>, global parseInt). Exclude
# them from analysis entirely rather than muting each rule per-file — there is
# nothing here to keep green, and excluding also keeps them out of coverage /
# duplication metrics. If real product code ever moves under these paths, narrow
# the glob rather than deleting the exclusion.
#   - docs/design/handoff/**  : 2026-05 design-handoff HTML/JSX mockups
#                               (visual-specs.html, design-canvas.jsx,
#                               task-content-variations.jsx, …)
#   - packages/web/brand/**   : brand-guidelines.html + token/reference assets
sonar.exclusions=docs/design/handoff/**,packages/web/brand/**

sonar.issue.ignore.multicriteria=secret1,secret2,secret3,secret4,secret5,e2e1,drf1,drf2,drf3,drf4,ts1,ts2,jsxspace1,cphash1,cphash2,cphash3,cphash4,lit1,lit2,lit3,cli1,cli2,cli3,cli4,sh1,sh2,pipbin1,piplock1,npmscript1,k8sstore1,pycred1,pycred2,pysql1,pysql2,pyprng1,pytmp1,tspath1,ymlcred1,gherkin1,gherkin2,otlphttp1,ssohttp1,pycred3,shhttp1,shhttp2,shhttp3,shhttp4,emptymethod1,emptymethod2,starimport1,starimport2,void1,void2,void3,void4,nullinherit1,classfactory1,seedshorthand1,redos1,noqaprose1,force1,force2,force3,skipshot1,ciimgpin1,es2023a,es2023b,tsalias1,tsalias2,pyfield1,pyparam1,pyprobe1,regex1,tsparam1,tsparam2,boolparam1,boolparam2,boolparam3,livebinding1

# ---------------------------------------------------------------------------
# Secret detection (secrets:*) — dev / CI / demo database credentials
# ---------------------------------------------------------------------------
# Every "PostgreSQL password" / "GitLab token" Blocker points at a NON-production
# default, not a leaked credential:
#   - docker-compose*.yml : local dev stack (settings.dev) and the public demo
#     (no accounts, no auth write path — see the demo file header).
#   - .gitlab-ci.yml      : `trueppm:trueppm` on ephemeral CI Postgres service
#     containers that live and die inside a single job.
#   - .gitleaks.toml      : the secret-scanner's own allowlist of FAKE fixture
#     tokens (e.g. the `glpat-abc123-...` round-trip plaintext).
#   - scripts/backup.sh   : the credential appears inside a usage comment.
#   - settings/base.py    : `env.db("DATABASE_URL", default=...)` — the standard
#     django-environ dev fallback; production injects DATABASE_URL from a
#     Kubernetes Secret and never reaches the default.
sonar.issue.ignore.multicriteria.secret1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.secret1.resourceKey=**/docker-compose*.yml
sonar.issue.ignore.multicriteria.secret2.ruleKey=secrets:*
