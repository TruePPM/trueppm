# ---------------------------------------------------------------------------
# typescript:S6772 "Ambiguous spacing before/after next element" — JSX text runs
# ---------------------------------------------------------------------------
# The rule fires wherever JSX text abuts an element and a rendered space is not
# lexically obvious. It found 105 sites across 62 files here — 80% of all open
# RELIABILITY findings — and every one was already spacing-correct by other
# means. Classifying the full 105 rather than a sample (#2518):
#
#     36  parent is `flex`/`inline-flex` with `gap-*`
#     12  `sr-only` span whose string carries its own leading space
#      3  adjacent span carries an explicit `ml-*`
#     13  the adjacent text STARTS with punctuation
#     41  control+label pairs and `aria-hidden` glyph spans holding the space
#         inside the span — the same categories, past a 4-line context window
#
# The 13 punctuation-adjacent sites are why this is scoped out rather than swept.
# There the rule's suggested `{' '}` is not a no-op, it is a visible defect —
# a space before the period or closing paren that ends the sentence:
#
#     ConnectedAccountsPage.tsx:119   </a>    then  .
#     WorkspaceEmailPage.tsx:757      </span>  then  ).
#     CaptureBaselineConfirmDialog.tsx:82      then  ), which stays active…
#
# So a mechanical fix is net-negative: 62 files touched, zero defects removed,
# 13 introduced. Scoped to packages/web/src — a genuine spacing bug is a visual
# regression and is caught by review and the Playwright suite, not by this rule.
#
# Do NOT enable the local ESLint analog (`react/jsx-child-element-spacing`) as a
# substitute; it is the same rule and would import the same noise into web:lint
# and `make pre-push`.
sonar.issue.ignore.multicriteria.jsxspace1.ruleKey=typescript:S6772
sonar.issue.ignore.multicriteria.jsxspace1.resourceKey=packages/web/src/**/*.tsx

# ---------------------------------------------------------------------------
# typescript:S7758 "Prefer codePointAt() over charCodeAt()" — code-unit hashes
# ---------------------------------------------------------------------------
# All four hits are `for (i = 0; i < s.length; i++)` hash loops that fold in
# `s.charCodeAt(i)`. The rule's advice is correct in general and wrong here:
# these loops step by UTF-16 *code unit*, so swapping in `codePointAt` counts an
# astral character TWICE — once as the full code point at the lead-surrogate
# index, then again as the stray trail surrogate at the next. For "A🚀B":
#
#     charCodeAt  -> [65, 55357, 56960, 66]
#     codePointAt -> [65, 128640, 56960, 66]     <- 🚀 counted twice
#
# So the change is not a no-op, it silently rehashes anything non-BMP:
#   - schedulePrintData.ts `fnv1aHex` is the schedule PDF's integrity stamp,
#     whose whole contract is that identical content yields an identical
#     fingerprint (#1437). A task name containing an emoji would print a
#     different stamp for unchanged content — and FNV-1a is a specified
#     algorithm over code units, so this would also stop being FNV-1a.
#   - phaseColors.ts `phaseColor`, and the QueueLayout / BacklogBand initials
#     hashes, are stable colour assignments; rehashing reshuffles them.
#
# Iterating by code point would require a `for...of` rewrite, which changes the
# hash for every non-BMP input anyway. Nothing here wants Unicode-aware
# iteration — they want a cheap deterministic fold over code units, which is
# exactly what charCodeAt gives.
sonar.issue.ignore.multicriteria.cphash1.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.cphash1.resourceKey=packages/web/src/features/schedule/export/schedulePrintData.ts
sonar.issue.ignore.multicriteria.cphash2.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.cphash2.resourceKey=packages/web/src/features/board/phaseColors.ts
sonar.issue.ignore.multicriteria.cphash3.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.cphash3.resourceKey=packages/web/src/features/board/QueueLayout.tsx
sonar.issue.ignore.multicriteria.cphash4.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.cphash4.resourceKey=packages/web/src/features/board/BacklogBand.tsx

