# docker:S8431 — "use either the version tag or the digest, not both" — on the
# three CI base images. Complying would be a supply-chain REGRESSION here, in
# both available directions:
#
#   - drop the digest, keep the tag  → the pin becomes mutable, which is exactly
#     what #904 hardened against (OpenSSF Scorecard "Pinned-Dependencies").
#   - drop the tag, keep the digest  → Renovate can no longer resolve the image.
#     renovate.json sets "pinDigests": true on the docker datasource, and that
#     mechanism tracks the TAG to discover a new version and then rewrites the
#     digest. A bare `python@sha256:…` has no upstream reference to follow, so
#     the image would silently stop receiving base-image security updates.
#
# `image:tag@sha256:digest` is the form Docker and OpenSSF both recommend: the
# digest is what is enforced at pull time, the tag is what makes the pin legible
# and automatable. All three Dockerfiles carry a header saying "bump the tag +
# digest together" for this reason.
sonar.issue.ignore.multicriteria.ciimgpin1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.ciimgpin1.resourceKey=.gitlab/ci-images/*.Dockerfile

