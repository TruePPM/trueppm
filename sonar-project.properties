# copied the same statement into `apps/sync/sequence.py`, the glob did not follow,
# and a reviewed-safe pattern resurfaced as a new-code Security finding — the
# #2517 drift shape, which `check-sonar-exclusions.sh` cannot see because the old
# glob still matched. Both call sites now delegate to the one helper below, so
# there is one statement and nowhere for it to drift to. Keep it that way: a new
# UPDATE … RETURNING belongs in `core/db.py`, not in a third copy.
