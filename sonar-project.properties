# ---------------------------------------------------------------------------
# python:S6553 "Remove this null=True flag" — three-state inherit/override
# ---------------------------------------------------------------------------
# All 15 findings are scope-inheritance fields on projects/models.py, and every
# one already carries an explicit `# noqa: DJ001 — null = inherit` at the call
# site. The field is deliberately TRI-state, not binary:
#     NULL -> inherit from the parent scope
#     ""   -> explicitly set to empty
#     "x"  -> explicit override
# The effective value is resolved computed-on-read in sharing_settings,
# task_duration_settings, estimation_scale, and sprint_picker_settings.
# Dropping null=True collapses "inherit" and "empty" into one value and breaks
# scope inheritance across ADR-0135, ADR-0151, ADR-0510 and ADR-0758.
#
# Django's own DJ001 has the identical blind spot — which is why every site is
# already suppressed there. Sonar reports the same false positive from the
# other side. Scoped to models.py so S6553 stays active elsewhere.
