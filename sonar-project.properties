# ---------------------------------------------------------------------------
# typescript:S6861 "Exporting mutable 'let' binding, use 'const' instead" —
# the Schedule row model's ES live bindings (#3083)
# ---------------------------------------------------------------------------
# Three findings, one file, one design: `ROW_HEIGHT`, `BAR_TOP_OFFSET` and
# `CHART_HEADER_HEIGHT` in scheduleConstants.ts. The mutability IS the contract,
# not an oversight — see web rule 315 and the module's own docstring.
#
# A Schedule row is 28px on a fine pointer and 44px on a COARSE one (WCAG 2.5.5),
# so row height is a *runtime* value, and it has to reach three consumers that are
# not React and cannot take a hook: engine/GanttHitIndex, engine/GanttRenderer and
# engine/GanttEngineImpl. `export let` + a setter is precisely what makes an ES
# module export a LIVE BINDING, so importers read through to the variable instead
# of copying it at import time.
#
# The failure the design prevents is silent. Before #2997 `ROW_HEIGHT` was declared
# THREE times with the same literal; while the value is a literal the copies agree
# by luck, and the moment it varies the hit index lays out rows at one pitch while
# the canvas paints them at another — taps open the task above or below the one
# under the finger, and every screenshot still looks correct.
#
# Complying with the rule is a regression in both available directions:
#   - getter functions (`getRowHeight()`) break 146 references across 14 files
#     (66 ROW_HEIGHT, 21 BAR_TOP_OFFSET, 59 CHART_HEADER_HEIGHT) and add a per-row
#     function call inside the 60fps paint loop — the module docstring rejects this
#     explicitly, since keeping `rowIndex * ROW_HEIGHT` working unchanged is the
#     whole reason the binding is live.
#   - `export const metrics = { rowHeight }` has IDENTICAL mutability and merely
#     launders it past the rule's pattern match: S6861 stops firing while nothing
#     about the design changed. That is web rule 8's "tokenize it, don't launder
#     the number" arriving at a different gate.
#
# The in-repo guard is already tighter than S6861 and runs PRE-merge rather than
# in the scheduled scan: `scheduleConstants.test.ts` ("the row model is declared in
# exactly one module") source-scans all of packages/web/src and asserts the
# declaration set is EXACTLY these three `let` plus three `const`, in this file. A
# fourth `export let` of a row-model name anywhere in the web tree fails vitest.
#
# Scoped to the ONE file — not `features/schedule/**`, not the rule globally — so
# S6861 still fires on a genuinely accidental `export let` anywhere else. Note the
# re-exports in GanttHitIndex.ts / GanttRenderer.ts are `export { ROW_HEIGHT }`
# after an import, which preserves liveness and does NOT trip this rule; they need
# no criterion of their own, and adding one would be dead on arrival.
sonar.issue.ignore.multicriteria.livebinding1.ruleKey=typescript:S6861
sonar.issue.ignore.multicriteria.livebinding1.resourceKey=packages/web/src/features/schedule/scheduleConstants.ts
