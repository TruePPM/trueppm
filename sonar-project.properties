# ---------------------------------------------------------------------------
# python:S2077 "Formatting SQL queries is security-sensitive"
# ---------------------------------------------------------------------------
# `core/db.py` holds the API's ONE interpolated UPDATE — the `UPDATE <t> SET <c> =
# <c> + 1 … RETURNING <c>` that allocates `server_version` and `last_sync_version`.
# Django cannot express UPDATE … RETURNING (`update()` returns a row count,
# `db_returning` is INSERT-only) and splitting it into update-then-SELECT reopens
# #2491 as a race, so the raw SQL is deliberate. Its interpolated parts are
# *identifiers* read off the model `_meta` and quoted via
# `connection.ops.quote_name`; the pk is bound as a parameter and callers name a
# model field, never a column. It carries `# nosec B608` + `# nosemgrep`.
