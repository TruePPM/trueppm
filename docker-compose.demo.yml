# TruePPM PUBLIC READ-ONLY DEMO stack (issue #1487).
#
# One command, zero config, sample data auto-seeded:
#
#     docker compose -f docker-compose.demo.yml up
#
# What it does:
#   * brings up Postgres + Valkey + API + a hardened nginx;
#   * auto-seeds the bundled Atlas hybrid sample (load_sample_project,
#     WITHOUT persona logins — the demo is reachable ONLY through the product's
#     own tokenized, read-only share link, so there is no login and no write
#     path — near-zero abuse surface);
#   * mints/pins the public read-only SCHEDULE share link and logs its URL;
#   * serves everything `noindex` (X-Robots-Tag + robots.txt Disallow: /);
#   * applies conservative per-container resource caps.
#
# This is the hosted-demo counterpart of the production Helm/compose path — it is
# NOT a production deployment. Front it with TLS at your load balancer / ingress.
#
# ── The printed share URL ─────────────────────────────────────────────────────
# The share link is the ONLY way in — there are no accounts — so the URL logged
# by `demo-seed` has to be one you can actually open. It therefore defaults to
# `http://localhost`, which is where nginx below publishes the stack and which
# ALLOWED_HOSTS already accepts. Override TRUEPPM_DEMO_BASE_URL only when you are
# serving this stack on a public origin, so the printed URL names that host:
#
#     TRUEPPM_DEMO_BASE_URL=https://demo.example.com \
#       docker compose -f docker-compose.demo.yml up
#
# ── Making the demo URL stable ────────────────────────────────────────────────
# The raw share token is stored only as a hash, so a randomly-minted link cannot
# be reprinted after the first run. To get a stable, reprintable deep-link that
# survives restarts, pin a token before first `up`:
#
#     TRUEPPM_DEMO_SHARE_TOKEN=your-fixed-token \
#       docker compose -f docker-compose.demo.yml up
#
# The URL is then:  http://localhost/share/schedule/your-fixed-token
#
# ── Security note ─────────────────────────────────────────────────────────────
# The SECRET_KEY / INTEGRATION_ENCRYPTION_KEY below are BAKED DEMO VALUES, safe
# ONLY because this stack has zero login-capable accounts and no authenticated
# write path (nobody ever logs in — access is exclusively via the anonymous
# read-only share endpoint). Do NOT copy these into a real deployment; use
# docker-compose.prod.yml with generated secrets for anything that holds real
# data.
#
# That "zero accounts" claim is load-bearing, not decorative. A public
# SECRET_KEY means a public JWT_SIGNING_KEY (base.py derives one from the
# other), so any account that CAN log in has a token anyone can forge. Two
# things keep the claim true, and both must stay true together:
#
#   1. api-init does not run create_admin — no superuser is created.
#   2. demo-seed runs load_sample_project WITHOUT --with-personas, so its
#      accounts are created with unusable passwords.
#
# scripts/check-demo-readonly.sh enforces both. If you ever need a real account
# on this stack, the baked keys must go first.

# Shared environment for every API-image container (init, seed, api).
# Top-level `x-` extension field + YAML anchor keeps the demo config in one place.
x-api-env: &api-env
  DATABASE_URL: postgres://trueppm:${DB_PASSWORD:-trueppm-demo}@db:5432/trueppm
  REDIS_URL: redis://valkey:6379
  DJANGO_SETTINGS_MODULE: trueppm_api.settings.prod
  # Baked demo secrets — safe only because the demo has no accounts / no auth
  # write path (see header). Override with your own for any real deployment.
  SECRET_KEY: ${SECRET_KEY:-trueppm-public-demo-secret-key-read-only-no-accounts-0000}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-bCrnaS7Vi4J94X52yHZ5V1clG-7Sn-WUhO_pIIX8qBk=}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,try.trueppm.com}
  # Internal Docker network links only; TLS is terminated upstream.
  TRUEPPM_ALLOW_UNENCRYPTED_DB: "true"
  TRUEPPM_ALLOW_LOCAL_ATTACHMENT_STORAGE: "true"

# Log rotation for every service below. Docker's json-file driver has no cap by
# default, and a long-running demo host fills its disk exactly like a production
# one does (#3189).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_DB: trueppm
      POSTGRES_USER: trueppm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trueppm-demo}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueppm"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    <<: *logging
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs migrations + collectstatic once. It deliberately does NOT run
  # create_admin (#3187): this stack's entire security posture is that no
  # login-capable account exists, which is what makes the baked public
  # SECRET_KEY above harmless. A superuser plus a published signing key is a
  # forgeable superuser token, held back only by the /api/ allowlist in
  # nginx/demo.conf.template — one config line with no defense behind it.
  #
  # It used to run create_admin anyway, and because api-init completes before
  # demo-seed, load_sample_project's _resolve_owner took its superuser branch —
  # not the persona branch its own comment describes. Three comments in this
  # file and one in that command all asserted "no superuser"; the stack created
  # one. Removing it is what makes the shared assumption true.
  #
  # Share links need no admin account: demo-seed mints them with
  # create_demo_share_link.
  api-init:
    <<: *logging
    image: ghcr.io/trueppm/api:${APP_VERSION:-latest}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    environment:
      <<: *api-env
      STATIC_ROOT: /app/staticfiles
    volumes:
      - demo_static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Auto-seeds the read-only sample and mints/pins the public share link.
  # NOTE: load_sample_project runs WITHOUT --with-personas — no persona logins,
  # no TRUEPPM_DEMO_PASSWORD path (#1350). Read-only posture by construction.
  # With no superuser on this stack (see api-init) the command owns the program
  # with the sample's own persona account, which also carries an unusable
  # password — _resolve_owner's third branch, which is now the one that runs.
  demo-seed:
    <<: *logging
    image: ghcr.io/trueppm/api:${APP_VERSION:-latest}
    command: >
      sh -c "python manage.py load_sample_project &&
             python manage.py create_demo_share_link"
    environment:
      <<: *api-env
      # Defaults to the host this stack actually publishes on, so the zero-config
      # `up` prints an openable URL. A hosted deployment sets its own origin.
      TRUEPPM_DEMO_BASE_URL: ${TRUEPPM_DEMO_BASE_URL:-http://localhost}
      # Optional: pin a fixed token for a stable, reprintable share URL.
      TRUEPPM_DEMO_SHARE_TOKEN: ${TRUEPPM_DEMO_SHARE_TOKEN:-}
    depends_on:
      api-init:
        condition: service_completed_successfully

  api:
    <<: *logging
    image: ghcr.io/trueppm/api:${APP_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 512
    environment:
      <<: *api-env
      # Not in the *api-env anchor — api-init sets it separately, so this
      # container would otherwise resolve a different STATIC_ROOT (#2828).
      STATIC_ROOT: /app/staticfiles
    # WhiteNoise in THIS container serves /static/ (nginx proxies the location
    # here), so it needs the volume api-init collected into, at the same
    # STATIC_ROOT — otherwise it resolves BASE_DIR/staticfiles, which for the
    # pip-installed package is not /app/staticfiles, and every admin-CSS and
    # Swagger-UI asset 404s while api-init reports a clean collectstatic (#2828).
    volumes:
      - demo_static_files:/app/staticfiles
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Copies the pre-built frontend assets into the shared volume for nginx.
  web-build:
    <<: *logging
    image: ghcr.io/trueppm/web:${APP_VERSION:-latest}
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -r /usr/share/nginx/html/. /dist/"]
    volumes:
      - demo_frontend_dist:/dist

  nginx:
    <<: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # The entrypoint renders the template here and `read_only: true` makes the
      # image's own copy unwritable — same fault as the prod stack (#2828).
      - /etc/nginx/conf.d
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    # Explicit argv list, NOT a folded (`>`) scalar — see the identical note on
    # docker-compose.prod.yml's nginx service (#2828). A continuation line
    # indented deeper than the first keeps its newline, which handed the shell a
    # script whose last line began with `&&`.
    command:
      - /bin/sh
      - -c
      - >-
        envsubst '$${DOMAIN}' < /etc/nginx/templates/default.conf.template >
        /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/demo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - demo_frontend_dist:/usr/share/nginx/html:ro
      # NOTE: demo_static_files is deliberately NOT mounted here (#2828). It
      # would nest inside the read-only mount above, at a path the web image does
      # not contain, and runc cannot create that mountpoint — nginx never leaves
      # `Created`. demo.conf.template proxies /static/ to the api, where
      # WhiteNoise serves it, so this mount was never read.
    depends_on:
      web-build:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  demo_postgres_data:
  demo_frontend_dist:
  demo_static_files:
