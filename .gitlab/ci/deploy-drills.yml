helm:netpol:
  # Datastore NetworkPolicy ENFORCEMENT drill (#2560). See
  # scripts/helm-netpol-drill.sh for the full rationale and the probe list.
  #
  # helm:install above boots the chart on a kind cluster running the DEFAULT CNI
  # (kindnetd), which does not implement NetworkPolicy — by design, per the kindnet
  # project. So the policy objects are admitted and silently ignored there, and a
  # policy that selected the wrong pods or omitted a legitimate client passed every
  # gate we had. That is not a hypothetical: #2560 found the `backup` CronJob and
  # `demo-seed` Job missing from the ingress allow-list.
  #
  # This job therefore creates its OWN cluster with disableDefaultCNI + Calico and
  # asserts behavior: positive probes (api/worker/beat/backup/demo-seed reach the
  # datastores), negative probes (unlabeled and wrong-component pods are denied),
  # datastore egress default-deny, plus two controls that prove a DENIED result came
  # from the policy rather than from a broken CNI.
  #
  # It is a SEPARATE cluster rather than a flag on helm:install because swapping the
  # CNI there would slow the common deploy smoke test and couple two unrelated
  # failure modes. Same dind + kind-in-dind recipe otherwise.
  stage: test
  interruptible: false
  timeout: 30m
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs:
    - job: ci:build-deploy-images
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.3"
    CALICO_VERSION: "v3.32.1"
    RELEASE_IMAGE_TAG: "$CI_COMMIT_SHA"
    APISERVER_HOST: "docker"
  rules:
    # Schedule stays advisory, matching helm:install: a nightly blip on the shared
    # pipeline (Calico manifest fetch, image pull) is a signal, not a hard red.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    # BLOCKING on MR + main. Scoped to the whole chart rather than just
    # networkpolicy.yaml on purpose: the policy names its allowed clients by
    # `app.kubernetes.io/component`, so ADDING a template that opens a datastore
    # connection breaks isolation without touching the policy file itself — which
    # is precisely how #2560's backup/demo-seed gap went unnoticed.
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/helm/**/*
        - scripts/helm-netpol-drill.sh
        - .gitlab/ci/deploy-drills.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - packages/helm/**/*
        - scripts/helm-netpol-drill.sh
        - .gitlab/ci/deploy-drills.yml
  before_script:
    - apk add --no-cache bash curl
    - curl -sSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64" && chmod +x /usr/local/bin/kind
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
    - curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp linux-amd64/helm && mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 2; done
  script:
    - bash scripts/helm-netpol-drill.sh

backup:restore-drill:
  # Restore drill (#320): the standing evidence that scripts/backup.sh and
  # scripts/restore.sh actually work end to end. Seeds a database (required
  # ltree + pg_trgm + btree_gist extensions and two tables with known row counts), backs it up
  # into a single artifact, DROPs the database, restores from the artifact, and
  # asserts the row counts match and the extensions survived. A schema-only proof
  # — it deliberately does NOT boot Django, so it stays self-contained on the
  # Debian-based postgres:16 image (which carries bash + pg_dump/pg_restore/psql/
  # pg_isready), needing no prebaked registry image.
  #
  # Trigger: nightly schedule (catches rot between changes) + any change to the
  # scripts or the CronJob template (and this CI file, so the job tests itself).
  stage: test
  # `needs: []` for the same reason as ci:build-deploy-images (#3255): this drill
  # consumes no prior-stage artifact — it runs scripts/backup.sh and
  # scripts/restore.sh from the checkout against its own postgres + minio
  # services — so stage ordering was making it wait on lint and analyze for
  # nothing. Unlike the cluster drills it is not load-bimodal: no kind cluster,
  # no dind, no liveness probes.
  needs: []
  image:
    name: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    # The postgres image ENTRYPOINT starts a database; blank it so GitLab runs
    # the job script instead (same override helm:lint uses for alpine/helm).
    entrypoint: [""]
  services:
    # The service reads POSTGRES_DB/USER/PASSWORD from the global variables block.
    - name: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      alias: postgres
    # Object store for the off-cluster leg of the drill (#2611).
    - name: minio/minio:latest
      alias: minio
      command: ["server", "/data"]
      variables:
        MINIO_ROOT_USER: drillkey
        MINIO_ROOT_PASSWORD: "dr/ill+sec:ret12345"
  variables:
    PGPASSWORD: trueppm
    DATABASE_URL: "postgres://trueppm:trueppm@postgres:5432/drilldb"
    # Deliberately NOT named S3_ENDPOINT / S3_BUCKET: backup.sh reads those from
    # the environment, so job-level variables with those names would silently
    # switch the local leg of the drill into upload mode too.
    DRILL_S3_ENDPOINT: "http://minio:9000"
    DRILL_S3_BUCKET: trueppm-drill
    # For the chart leg (#3185) — helm renders the CronJob, yq extracts its
    # inline command. Pinned like every other tool version in this file.
    HELM_VERSION: "3.16.3"
    YQ_VERSION: "4.44.3"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - scripts/backup.sh
        - scripts/restore.sh
        - scripts/lib/s3.sh
        - packages/helm/templates/cronjob-backup.yaml
        - .gitlab/ci/deploy-drills.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/backup.sh
        - scripts/restore.sh
        - scripts/lib/s3.sh
        - packages/helm/templates/cronjob-backup.yaml
        - .gitlab/ci/deploy-drills.yml
  script:
    - echo "waiting for the postgres service..."
    - until pg_isready -h postgres -U trueppm >/dev/null 2>&1; do sleep 1; done
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    # Seed a representative schema: the three extensions the real schema depends on
    # (ltree powers wbs_path, pg_trgm powers trigram search, btree_gist backs the
    # (project, wbs_path) exclusion constraint) plus two tables with known row
    # counts to assert against after the round-trip.
    - |
      psql "$DATABASE_URL" <<'SQL'
      CREATE EXTENSION IF NOT EXISTS ltree;
      CREATE EXTENSION IF NOT EXISTS pg_trgm;
      CREATE EXTENSION IF NOT EXISTS btree_gist;
      CREATE TABLE projects_project (id serial PRIMARY KEY, name text);
      INSERT INTO projects_project (name) SELECT 'p' || g FROM generate_series(1, 42) g;
      CREATE TABLE projects_task (id serial PRIMARY KEY, wbs_path ltree, title text);
      INSERT INTO projects_task (wbs_path, title)
        SELECT ('1.' || g)::ltree, 't' || g FROM generate_series(1, 100) g;
      SQL
    - BEFORE_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - BEFORE_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - echo "seeded projects=$BEFORE_PROJECTS tasks=$BEFORE_TASKS"
    # 1. back up
    - ./scripts/backup.sh --output-dir "$CI_PROJECT_DIR/drill-backups"
    - ARTIFACT=$(ls -1 "$CI_PROJECT_DIR"/drill-backups/trueppm-backup-*.tar.gz | head -n1)
    - echo "artifact=$ARTIFACT"
    # 2. destroy the source (FORCE drops any lingering connection from pg_dump)
    - psql -h postgres -U trueppm -d trueppm_test -c "DROP DATABASE drilldb WITH (FORCE);"
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    # 3. restore (restore.sh verifies ltree + pg_trgm + btree_gist internally and exits non-zero if absent)
    - ./scripts/restore.sh --artifact "$ARTIFACT" --yes
    # 4. assert the round-trip preserved every row
    - AFTER_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - AFTER_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - echo "restored projects=$AFTER_PROJECTS tasks=$AFTER_TASKS"
    - |
      if [ "$AFTER_PROJECTS" != "$BEFORE_PROJECTS" ] || [ "$AFTER_TASKS" != "$BEFORE_TASKS" ]; then
        echo "RESTORE DRILL FAILED: row counts differ after restore" >&2
        echo "  projects: before=$BEFORE_PROJECTS after=$AFTER_PROJECTS" >&2
        echo "  tasks:    before=$BEFORE_TASKS after=$AFTER_TASKS" >&2
        exit 1
      fi
    - echo "restore drill GREEN — row counts match and required extensions present"
    # ---- 5. off-cluster round trip (#2611) ---------------------------------
    # The local drill above proves the artifact is correct; this proves it can
    # actually reach a bucket and come back. Before #2611 the chart injected a
    # full S3 env contract and the job answered it with an `echo`, so "backups
    # are off-cluster" was true in the runbook and false in the cluster. Only an
    # end-to-end upload/download against a real object store catches that class
    # of gap, so it runs here rather than being asserted in a stub.
    #
    # The MinIO credentials deliberately contain "/" "+" and ":" — a real 40-char
    # AWS secret key is base64 and routinely does. Credential handling that
    # round-trips through a URL corrupts exactly these characters, so a plain
    # alphanumeric secret would let that regression through.
    # One apt transaction for both remaining legs: awscli here, and curl +
    # ca-certificates for the chart leg's helm/yq downloads below. postgres:16
    # ships none of the three.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends awscli curl ca-certificates
    - export AWS_ACCESS_KEY_ID=drillkey AWS_SECRET_ACCESS_KEY='dr/ill+sec:ret12345' AWS_DEFAULT_REGION=us-east-1
    - echo "waiting for the minio service..."
    - |
      i=0
      until aws --endpoint-url "$DRILL_S3_ENDPOINT" s3 ls >/dev/null 2>&1; do
        i=$((i+1)); [ "$i" -ge 60 ] && { echo "minio not ready" >&2; exit 1; }; sleep 1
      done
    - aws --endpoint-url "$DRILL_S3_ENDPOINT" s3 mb "s3://$DRILL_S3_BUCKET"
    # Back up straight to the bucket, then verify the object really landed.
    - ./scripts/backup.sh --output-dir "$CI_PROJECT_DIR/s3-backups" --s3-bucket "$DRILL_S3_BUCKET" --s3-endpoint "$DRILL_S3_ENDPOINT" --s3-prefix drill/daily
    - |
      OBJECTS=$(aws --endpoint-url "$DRILL_S3_ENDPOINT" s3 ls --recursive "s3://$DRILL_S3_BUCKET" | grep -c 'drill/daily/trueppm-backup-.*\.tar\.gz' || true)
      if [ "$OBJECTS" -lt 1 ]; then
        echo "S3 DRILL FAILED: backup.sh reported success but the bucket is empty" >&2
        exit 1
      fi
      echo "bucket holds $OBJECTS artifact(s)"
    # Destroy the database AND every local artifact, so the only surviving copy
    # is the one in the bucket — otherwise --from-s3 could silently be restoring
    # from local disk and the drill would prove nothing.
    - rm -rf "$CI_PROJECT_DIR/s3-backups" "$CI_PROJECT_DIR/drill-backups"
    - psql -h postgres -U trueppm -d trueppm_test -c "DROP DATABASE drilldb WITH (FORCE);"
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    - ./scripts/restore.sh --from-s3 latest --s3-bucket "$DRILL_S3_BUCKET" --s3-endpoint "$DRILL_S3_ENDPOINT" --s3-prefix drill/daily --yes
    - S3_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - S3_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - |
      if [ "$S3_PROJECTS" != "$BEFORE_PROJECTS" ] || [ "$S3_TASKS" != "$BEFORE_TASKS" ]; then
        echo "S3 DRILL FAILED: row counts differ after restoring from the bucket" >&2
        echo "  projects: before=$BEFORE_PROJECTS after=$S3_PROJECTS" >&2
        echo "  tasks:    before=$BEFORE_TASKS after=$S3_TASKS" >&2
        exit 1
      fi
    - echo "S3 round-trip drill GREEN — artifact uploaded, local copies removed, restored from the bucket"
    # ---- 6. the CHART's backup command, round-tripped (#3185) --------------
    # Everything above exercises scripts/backup.sh. The chart does NOT run that
    # script — it runs an inlined command in the PostgreSQL client image — and
    # this job already *triggered* on changes to cronjob-backup.yaml while never
    # running a line of it. So the chart's backup path was the one path with no
    # standing evidence, which is how its `tar ... || true` and its two-field
    # MANIFEST diverged from the script's without anything noticing.
    #
    # Extract the rendered command and run it here, against the same database
    # and the same restore.sh. No cluster needed: the command is a POSIX shell
    # script whose only inputs are env vars, and this job's image is the same
    # postgres:16 family the CronJob uses.
    - curl -sSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp linux-amd64/helm && mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" && chmod +x /usr/local/bin/yq
    # Assert both landed, on their own lines. `set -e` exempts a command that
    # is not the last in an `&&` list, so a failed fetch above does not stop
    # the script — it surfaces further down as a `command not found` naming a
    # tool nobody asked about. These two put the error back at its cause.
    - helm version --short
    - yq --version
    - mkdir -p "$CI_PROJECT_DIR/chart-backups" "$CI_PROJECT_DIR/chart-media/sub"
    - echo "attachment-bytes" > "$CI_PROJECT_DIR/chart-media/sub/attachment.bin"
    # s3 stays OFF so the dump container is the sole container; with s3 on it is
    # an initContainer instead, and this leg is about the dump, not the upload
    # (leg 5 already proves the upload).
    - |
      helm template drill packages/helm \
        --set backup.enabled=true \
        --set backup.persistence.enabled=true \
        --set backup.mediaDir="$CI_PROJECT_DIR/chart-media" \
        --show-only templates/cronjob-backup.yaml \
        | yq eval-all 'select(.kind == "CronJob") | .spec.jobTemplate.spec.template.spec.containers[0].command[2]' - \
        > /tmp/chart-dump.sh
    # eval-all + select, not a bare path: --show-only still emits the PVC
    # document from the same file, and a bare path yields `null` for it — which
    # lands as the first line of the extracted script and aborts it under set -e
    # with a command-not-found that names nothing useful.
    - sh -n /tmp/chart-dump.sh
    - test -s /tmp/chart-dump.sh || { echo "could not extract the CronJob dump command" >&2; exit 1; }
    - echo "--- rendered CronJob dump command ---"; cat /tmp/chart-dump.sh
    - |
      OUTPUT_DIR="$CI_PROJECT_DIR/chart-backups" \
      KEEP_DAILY=7 \
      MEDIA_DIR="$CI_PROJECT_DIR/chart-media" \
      S3_BUCKET="" \
      DATABASE_URL="$DATABASE_URL" \
        sh -e /tmp/chart-dump.sh
    - CHART_ARTIFACT=$(ls -1 "$CI_PROJECT_DIR"/chart-backups/trueppm-backup-*.tar.gz | head -n1)
    - |
      test -n "$CHART_ARTIFACT" || { echo "CHART DRILL FAILED: the CronJob command wrote no artifact" >&2; exit 1; }
    - |
      echo "chart artifact=$CHART_ARTIFACT"
    # The MANIFEST must answer the questions a restorer actually asks. Before
    # #3185 it carried only created_utc and pg_dump_version, so an artifact
    # could not tell you whether media was inside it.
    - tar -xzOf "$CHART_ARTIFACT" ./MANIFEST > /tmp/chart-manifest.txt
    - echo "--- chart MANIFEST ---"; cat /tmp/chart-manifest.txt
    - |
      for field in created_utc run_context pg_dump_version db_included media_included redis_included s3_destination; do
        grep -q "^${field}:" /tmp/chart-manifest.txt \
          || { echo "CHART DRILL FAILED: MANIFEST is missing '${field}' — scripts/backup.sh writes it and the two producers must agree (#3185)" >&2; exit 1; }
      done
    # Block scalars, not plain ones: the strings below contain ": ", which YAML
    # reads as a mapping key in a plain scalar.
    - |
      grep -q "^media_included: yes" /tmp/chart-manifest.txt \
        || { echo "CHART DRILL FAILED: mediaDir was set and non-empty but the MANIFEST does not record media" >&2; exit 1; }
    - |
      tar -tzf "$CHART_ARTIFACT" | grep -q 'media.tar.gz' \
        || { echo "CHART DRILL FAILED: MANIFEST claims media but the artifact has no media.tar.gz" >&2; exit 1; }
    # And restore.sh must consume the chart's artifact, not only the script's.
    - psql -h postgres -U trueppm -d trueppm_test -c "DROP DATABASE drilldb WITH (FORCE);"
    - psql -h postgres -U trueppm -d trueppm_test -c "CREATE DATABASE drilldb;"
    - ./scripts/restore.sh --artifact "$CHART_ARTIFACT" --yes
    - CHART_PROJECTS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_project;")
    - CHART_TASKS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM projects_task;")
    - |
      if [ "$CHART_PROJECTS" != "$BEFORE_PROJECTS" ] || [ "$CHART_TASKS" != "$BEFORE_TASKS" ]; then
        echo "CHART DRILL FAILED: row counts differ after restoring the CronJob's artifact" >&2
        echo "  projects: before=$BEFORE_PROJECTS after=$CHART_PROJECTS" >&2
        echo "  tasks:    before=$BEFORE_TASKS after=$CHART_TASKS" >&2
        exit 1
      fi
    - echo "chart drill GREEN — the CronJob's own command produces a restorable artifact with a script-compatible MANIFEST"
