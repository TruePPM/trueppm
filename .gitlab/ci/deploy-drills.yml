      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KIND_VERSION: "0.24.0"
    KUBECTL_VERSION: "1.31.2"
    HELM_VERSION: "3.16.3"
    RELEASE_IMAGE_TAG: "$CI_COMMIT_SHA"
    APISERVER_HOST: "docker"
    DRILL_LEG: "demo"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
