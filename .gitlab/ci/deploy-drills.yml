  needs:
    - job: ci:build-deploy-images
      artifacts: false
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DRILL_MODE: "demo"
    RELEASE_IMAGE_TAG: "$CI_COMMIT_SHA"
    PROBE_HOST: "docker"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
